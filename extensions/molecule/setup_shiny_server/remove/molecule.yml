# Molecule scenario marker for the 'setup_shiny_server/remove' sub-scenario, run with
# `molecule test --scenario-name setup_shiny_server/remove`.
#
# It overrides the prepare step (see prepare.yml), which seeds the accounts, directories and
# applications that converge then retires. That state cannot be inherited by running the install
# sub-scenario first: Molecule gives every sub-scenario its own ephemeral directory and therefore
# its own SSH key, so the instances created by one are unreachable from the other. The
# sub-scenario is standalone by necessity.
provisioner:
  playbooks:
    prepare: '${MOLECULE_SCENARIO_DIRECTORY}/prepare.yml'
