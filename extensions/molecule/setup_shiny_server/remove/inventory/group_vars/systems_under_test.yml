# Mandatory variable of the apache_httpd role, which this playbook pulls in.
apache_httpd__conf_server_admin: 'root@localhost'

shiny_server__version: '1.5.23.1030'

# Set explicitly because prepare.yml seeds the accounts and needs the same path the role uses;
# a prepare playbook does not run the role and therefore does not see its defaults.
shiny_server__users_home_dir: '/var/lib/shiny-server/home'

# Tenant acme keeps app2 and retires app1: the account, the log directory and the tenant
# directory are shared with app2 and therefore have to survive. Tenant globex is retired
# completely, so its account, home directory, application directory, tenant directory and log
# directory all have to go.
shiny_server__locations__group_var:
  - path: '/acme/app1'
    app_dir: '/srv/shiny-server/tenants/acme/app1'
    log_dir: '/var/log/shiny-server/acme'
    run_as: 'shiny-acme'
    app_idle_timeout: 900
    state: 'absent'
  - path: '/acme/app2'
    app_dir: '/srv/shiny-server/tenants/acme/app2'
    log_dir: '/var/log/shiny-server/acme'
    run_as: 'shiny-acme'
    app_idle_timeout: 900
  - path: '/globex/app1'
    app_dir: '/srv/shiny-server/tenants/globex/app1'
    log_dir: '/var/log/shiny-server/globex'
    run_as: 'shiny-globex'
    app_idle_timeout: 900
    simple_scheduler: 20
    state: 'absent'

shiny_server__vhosts__group_var:
  - conf_server_name: 'shiny-acme.example.com'
    htpasswd:
      - username: 'firstname.lastname'
        password: 'linuxfabrik'
    locations:
      - shiny_location: '/acme/app1'
        path: '/app1'
        state: 'absent'
      - shiny_location: '/acme/app2'
        path: '/app2'
  - conf_server_name: 'shiny-globex.example.com'
    htpasswd:
      - username: 'globex.admin'
        password: 'linuxfabrik'
    locations:
      - shiny_location: '/globex/app1'
        path: '/app1'
    state: 'absent'

shiny_server__memory_max: '2G'
shiny_server__tasks_max: 200
