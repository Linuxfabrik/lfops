# yamllint disable rule:empty-values

# setup_shiny_server targets 'lfops_setup_shiny_server' (see
# playbooks/setup_shiny_server.yml: hosts).
#
# Debian and Ubuntu are deliberately absent: Posit builds its Debian package
# against Ubuntu 20.04 only, and the role supports the RHEL family (see
# COMPATIBILITY.md). VMs rather than containers, because the tenant workers are
# started through `su`, which needs a working PAM stack, and because the memory
# limit the role deploys is only meaningful in a real control group.
lfops_setup_shiny_server:
  children:
    systems_under_test:

systems_under_test:
  hosts:
    rocky8-vm:
    rocky9-vm:
    rocky10-vm:
