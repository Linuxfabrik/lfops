# The inventory host every libvirt and storage-pool operation of the VM backend runs on. Named
# here so the VM host_vars and the provisioning playbooks refer to it in one place.
__molecule__hypervisor: 'hypervisor'

# Prefix host-visible resource names (libvirt domains, podman containers, and the guest hostname
# the kvm_vm role derives from kvm_vm__name) so Molecule's throwaway instances are easy to spot
# in `virsh list` / `podman ps` and never clash with anything else on the host. inventory_hostname
# stays the short name that Ansible itself uses to identify the host.
__molecule__instance_name: 'lfops-molecule-{{ inventory_hostname }}'

# The libvirt storage pool the base images and per-VM boot disks are written to. Defaults to the
# dedicated 'lfops-molecule' pool that CONTRIBUTING.md has you create, not to the distribution's
# 'default' pool: the latter's directory is owned by a package, so every upgrade of it restores
# the packaged directory mode, and a chmod on a directory carrying an ACL rewrites the ACL mask.
# A setfacl grant that lets the pool be written unprivileged therefore decays to '#effective:--x'
# on its own. A pool in a directory no package owns keeps that grant, and the rootless VM
# creation it buys, working across upgrades. vm-create.yml asserts that the pool exists.
kvm_vm__pool: '{{ lookup("env", "LFOPS_TEST_POOL") | d("lfops-molecule", true) }}'
