# A freshly created xfs in an image file, mounted through a loop device, stands in for a new data
# volume: it carries no SELinux labels until the role relabels it. converge.yml creates the image.
mount__mounts__group_var:
  - path: '/srv/lfops-molecule'
    src: '/var/tmp/lfops-molecule.img'
    fstype: 'xfs'
    opts: 'loop'
    state: 'mounted'
  # owner, group and mode from the inventory reach the root of the mounted filesystem
  - path: '/srv/lfops-molecule-owned'
    src: '/var/tmp/lfops-molecule-owned.img'
    fstype: 'xfs'
    opts: 'loop'
    owner: 'nobody'
    group: 'daemon'
    mode: '0750'
    state: 'mounted'
