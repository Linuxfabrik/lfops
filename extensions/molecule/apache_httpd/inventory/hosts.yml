# yamllint disable rule:empty-values

# apache_httpd targets 'lfops_apache_httpd' (see playbooks/apache_httpd.yml: hosts). The role makes
# the same promises on every platform it supports, so all targets share one group and one set of
# group_vars; the platform differences (config path, service name, package names) are the role's
# job and are covered by the assertions running everywhere rather than by per-family variables.
# The full COMPATIBILITY.md matrix runs here, because HTTP/2 depends on the module the distribution
# ships (a separate mod_http2 package on RedHat, part of apache2-bin on Debian and Ubuntu).
lfops_apache_httpd:
  children:
    systems_under_test:

systems_under_test:
  hosts:
    debian12-vm:
    debian13-vm:
    rocky8-vm:
    rocky9-vm:
    rocky10-vm:
    ubuntu2204-vm:
    ubuntu2404-vm:
    ubuntu2604-vm:
