apache_httpd__conf_server_admin: 'webmaster@example.com'

# The same user in two htpasswd files. The username and the path together identify an entry, so
# both entries have to reach their own file instead of being merged into one. Each file protects
# the location of h2.example.com named after it (see the raw block below), and verify.yml logs in
# through Apache at both, so a file that lacks the user fails the login rather than a grep. The
# files sit outside the document roots and outside the platform-specific config directory, so one
# path works on every target.
apache_httpd__htpasswd__group_var:

  - username: 'molecule'
    password: 'linuxfabrik'
    path: '/var/www/htpasswd-a'

  - username: 'molecule'
    password: 'linuxfabrik'
    path: '/var/www/htpasswd-b'

# The role enables the deflate conf, but leaves mod_deflate and mod_filter off, and the deflate conf
# sits inside <IfModule> blocks for both. Without them nothing is compressed, so the compression
# check in verify.yml needs them loaded, the way a reverse proxy that compresses has them.
apache_httpd__mods__group_var:
  - filename: 'deflate'
    enabled: true
    state: 'present'
    template: 'deflate'
  - filename: 'filter'
    enabled: true
    state: 'present'
    template: 'filter'

# Two TLS vHosts on the same port, differing in one key. The first inherits the server-wide
# protocol preference (apache_httpd__mod_http2_protocols, 'h2 http/1.1'), the second overrides it
# per vHost. verify.yml derives what it expects from exactly this: an entry carrying conf_protocols
# has to serve HTTP/1.1, an entry without it has to serve HTTP/2. That pins both halves of the
# feature with one pair of requests, and it fails if either the server-wide default or the per-vHost
# override stops working.
#
# Each vHost gets its own certificate rather than a shared one. Browsers coalesce connections across
# vHosts that share a certificate, and Apache answers 421 Misdirected Request when such vHosts do
# not carry identical TLS settings - a complication this scenario has no reason to take on.
# prepare.yml issues one self-signed certificate per conf_server_name below.
#
# The document root is created by the role; verify.yml drops an index.html into it, because a
# request has to reach a real response for its HTTP version to mean anything.
#
# The first vHost also serves markdown.txt as text/markdown, which verify.yml uses to check that
# such responses are compressed. The app template's file extension allowlist forbids a real .md
# file, so the type is forced onto a .txt file instead.
apache_httpd__vhosts__group_var:

  - comment: |-
      Inherits the server-wide protocol preference, so it has to negotiate HTTP/2.
    template: 'app'
    virtualhost_port: 443
    conf_server_name: 'h2.example.com'
    raw: !unsafe |-
      <Files "markdown.txt">
          ForceType text/markdown
      </Files>
      # ssl_module
      SSLEngine on
      SSLCertificateFile    /etc/pki/tls/certs/h2.example.com.crt
      SSLCertificateKeyFile /etc/pki/tls/private/h2.example.com.key

      # auth_basic_module, authn_file_module, authz_user_module
      # One location per file in apache_httpd__htpasswd__group_var, named after the file.
      <Location "/htpasswd-a/">
          AuthType Basic
          AuthName "molecule"
          AuthBasicProvider file
          AuthUserFile "/var/www/htpasswd-a"
          Require valid-user
      </Location>
      <Location "/htpasswd-b/">
          AuthType Basic
          AuthName "molecule"
          AuthBasicProvider file
          AuthUserFile "/var/www/htpasswd-b"
          Require valid-user
      </Location>

  - comment: |-
      Overrides the server-wide protocol preference, so it has to stay on HTTP/1.1.
    template: 'app'
    virtualhost_port: 443
    conf_protocols: 'http/1.1'
    conf_server_name: 'h1.example.com'
    raw: !unsafe |-
      # ssl_module
      SSLEngine on
      SSLCertificateFile    /etc/pki/tls/certs/h1.example.com.crt
      SSLCertificateKeyFile /etc/pki/tls/private/h1.example.com.key
