# yamllint disable rule:empty-values

# php targets 'lfops_php' (see playbooks/php.yml: hosts). Both families run here, but they test
# different claims and therefore need different variables, so systems_under_test is split into a
# per-family child group with its own group_vars. The provisioning playbooks
# (extensions/molecule/playbooks/vm-*.yml) target systems_under_test, which still resolves to every
# host through the children.
#
# Debian: the version handling lives in the role (php__version, versioned packages,
# update-alternatives, purging the old stack), because sury moves the unversioned metapackages
# whenever it promotes a new default.
# RedHat: the version is pinned at repo level by the dnf module stream (see the repo_remi role), so
# the role does no version handling at all and php__version is inert.
lfops_php:
  children:
    systems_under_test:

systems_under_test:
  children:
    systems_under_test_debian:
    systems_under_test_redhat:

systems_under_test_debian:
  hosts:
    debian12-vm:
    debian13-vm:

systems_under_test_redhat:
  hosts:
    rocky8-vm:
    rocky9-vm:
    rocky10-vm:
