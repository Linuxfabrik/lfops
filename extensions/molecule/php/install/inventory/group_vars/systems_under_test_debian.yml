# 8.3 is deliberately neither the Debian default (8.2 on Debian 12, 8.4 on Debian 13) nor the sury
# default (8.4, as of 2026-07). Declaring a third version proves the role installs and holds what it
# was told to, instead of adopting whatever the configured repos happen to offer.
php__version: '8.3'

repo_sury__enabled_repos:
  - 'php'
