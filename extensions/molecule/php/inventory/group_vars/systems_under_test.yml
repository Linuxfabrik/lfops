# Applies to both families. A value that matches neither the PHP default (128M) nor any role
# default, so verify.yml can prove the deployed ini is actually read by the running interpreter
# rather than just present on disk.
php__ini_memory_limit__group_var: '256M'

# A second pool with values that differ from the role defaults and from the ini above, so
# verify.yml can prove each running pool uses its own configuration instead of the global one.
# 'www' stays at the defaults (pm dynamic, memory_limit from php__ini_memory_limit__group_var).
php__fpm_pools__group_var:
  - name: 'app1'
    pm: 'static'
    pm_max_children: 4
    php_admin_value_memory_limit: '192M'
    state: 'present'
