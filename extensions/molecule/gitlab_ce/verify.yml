# Checks that GitLab runs and that its bundled NGINX uses the settings of gitlab.rb: the
# listen port, the registry and the real IP of a request from a trusted proxy. Also checks that
# gitlab-dump.service writes a backup and fails when the dump fails.
- name: 'Verify GitLab CE'
  hosts: 'systems_under_test'
  gather_facts: false
  become: true
  tasks:

    - name: 'Gather the service facts'
      ansible.builtin.service_facts:  # yamllint disable-line rule:empty-values

    - name: 'Assert that gitlab-runsvdir.service is running'
      ansible.builtin.assert:
        that: 'ansible_facts["services"]["gitlab-runsvdir.service"]["state"] == "running"'

    # service_facts does not list timers; without a state, the module only reports the status.
    - name: 'systemctl show gitlab-dump.timer'
      ansible.builtin.systemd:
        name: 'gitlab-dump.timer'
      register: '__molecule__gitlab_dump_timer_result'

    - name: 'Assert that gitlab-dump.timer is active'
      ansible.builtin.assert:
        that: '__molecule__gitlab_dump_timer_result["status"]["ActiveState"] == "active"'

    # Puma needs a while after a restart; the sign-in page answers once Rails is up.
    - name: 'curl http://127.0.0.1:8090/users/sign_in'
      ansible.builtin.uri:
        url: 'http://127.0.0.1:8090/users/sign_in'
        status_code: 200
      register: '__molecule__gitlab_sign_in_result'
      until: '__molecule__gitlab_sign_in_result is not failed'
      retries: 30
      delay: 10

    # exits non-zero if one of the GitLab services is down
    - name: 'gitlab-ctl status'
      ansible.builtin.command:
        argv:
          - 'gitlab-ctl'
          - 'status'
      changed_when: false

    # The registry answers an unauthenticated request with 401, behind the registry NGINX.
    - name: 'curl http://127.0.0.1:5050/v2/'
      ansible.builtin.uri:
        url: 'http://127.0.0.1:5050/v2/'
        status_code: 401

    # The request comes from 127.0.0.1, a trusted address, so NGINX and Rails take the
    # client IP from X-Forwarded-For. The query string marks the request in the log.
    - name: 'curl --header "X-Forwarded-For: 198.51.100.7" http://127.0.0.1:8090/users/sign_in?molecule-real-ip'
      ansible.builtin.uri:
        url: 'http://127.0.0.1:8090/users/sign_in?molecule-real-ip'
        headers:
          X-Forwarded-For: '198.51.100.7'
        status_code: 200

    - name: 'grep for the real IP in /var/log/gitlab/gitlab-rails/production_json.log'
      ansible.builtin.command:
        argv:
          - 'grep'
          - '--quiet'
          - '--extended-regexp'
          - 'molecule-real-ip.*"meta.remote_ip":"198\.51\.100\.7"|"meta.remote_ip":"198\.51\.100\.7".*molecule-real-ip'
          - '/var/log/gitlab/gitlab-rails/production_json.log'
      register: '__molecule__gitlab_real_ip_result'
      until: '__molecule__gitlab_real_ip_result["rc"] == 0'
      retries: 5
      delay: 2
      changed_when: false

    # A dump of the running instance has to succeed and leave an archive in the backup path.
    - name: 'systemctl start gitlab-dump.service' # noqa command-instead-of-module (a oneshot run, not a state)
      ansible.builtin.command: 'systemctl start gitlab-dump.service'
      changed_when: false
      failed_when: false
      register: '__molecule__gitlab_dump_result'

    - name: 'journalctl --unit=gitlab-dump.service --lines=60'
      ansible.builtin.command: 'journalctl --unit=gitlab-dump.service --no-pager --lines=60'
      changed_when: false
      register: '__molecule__gitlab_dump_journal_result'

    - name: 'find /backup/gitlab -name *_gitlab_backup.tar'
      ansible.builtin.find:
        paths: '/backup/gitlab'
        patterns: '*_gitlab_backup.tar'
      register: '__molecule__gitlab_dump_find_result'

    - name: 'Assert that the dump succeeded and wrote an archive'
      ansible.builtin.assert:
        that:
          - '__molecule__gitlab_dump_result["rc"] == 0'
          - '__molecule__gitlab_dump_find_result["matched"] > 0'
        fail_msg: '{{ __molecule__gitlab_dump_journal_result["stdout_lines"] }}'

    # Without PostgreSQL the database dump fails, and the unit has to fail with it, so that
    # `systemctl --failed` and the monitoring notice a broken backup.
    - name: 'gitlab-ctl stop postgresql'
      ansible.builtin.command: 'gitlab-ctl stop postgresql'
      changed_when: false

    - name: 'systemctl start gitlab-dump.service # without PostgreSQL' # noqa command-instead-of-module (a oneshot run, not a state)
      ansible.builtin.command: 'systemctl start gitlab-dump.service'
      changed_when: false
      failed_when: false
      register: '__molecule__gitlab_dump_failed_result'

    - name: 'systemctl is-failed gitlab-dump.service' # noqa command-instead-of-module (read-only state query)
      ansible.builtin.command: 'systemctl is-failed gitlab-dump.service'
      changed_when: false
      failed_when: false
      register: '__molecule__gitlab_dump_is_failed_result'

    - name: 'gitlab-ctl start postgresql'
      ansible.builtin.command: 'gitlab-ctl start postgresql'
      changed_when: false

    - name: 'systemctl reset-failed gitlab-dump.service' # noqa command-instead-of-module (clears the state the test left behind)
      ansible.builtin.command: 'systemctl reset-failed gitlab-dump.service'
      changed_when: false
      failed_when: false

    - name: 'Assert that gitlab-dump.service failed without PostgreSQL'
      ansible.builtin.assert:
        that:
          - '__molecule__gitlab_dump_failed_result["rc"] != 0'
          - '__molecule__gitlab_dump_is_failed_result["stdout"] == "failed"'
        fail_msg: '{{ [__molecule__gitlab_dump_failed_result, __molecule__gitlab_dump_is_failed_result] | to_json }}'

    # the following verify run and the idempotence step need a GitLab that answers again
    - name: 'curl http://127.0.0.1:8090/users/sign_in (after the PostgreSQL restart)'
      ansible.builtin.uri:
        url: 'http://127.0.0.1:8090/users/sign_in'
        status_code: 200
      register: '__molecule__gitlab_sign_in_after_result'
      until: '__molecule__gitlab_sign_in_after_result is not failed'
      retries: 30
      delay: 10
