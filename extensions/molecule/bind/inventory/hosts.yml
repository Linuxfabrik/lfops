# yamllint disable rule:empty-values

# bind targets 'lfops_bind' (see playbooks/bind.yml: hosts).
#
# Debian and Ubuntu are deliberately absent: the role installs the Red Hat package names and
# paths only (see COMPATIBILITY.md).
#
# The three hosts serve each other's zones (see group_vars), so every BIND version the role
# supports runs both as primary and as secondary. Running a subset with LFOPS_TEST_TARGETS
# drops the zones of the hosts that are left out.
lfops_bind:
  children:
    systems_under_test:

systems_under_test:
  hosts:
    rocky8-vm:
    rocky9-vm:
    rocky10-vm:
