# yamllint disable rule:empty-values

# rstudio_server targets 'lfops_rstudio_server' (see playbooks/rstudio_server.yml:
# hosts).
#
# Debian and Ubuntu are deliberately absent: Posit builds its Debian package
# against Ubuntu 20.04 only, and the role supports the RHEL family (see
# COMPATIBILITY.md), where the package differs per generation. VMs rather than
# containers, because signing in exercises the host's PAM stack and because the
# resource limits the role deploys are only meaningful in a real control group.
lfops_rstudio_server:
  children:
    systems_under_test:

systems_under_test:
  hosts:
    rocky8-vm:
    rocky9-vm:
    rocky10-vm:
