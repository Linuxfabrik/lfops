# yamllint disable rule:empty-values

# fail2ban targets 'lfops_fail2ban' (see playbooks/fail2ban.yml: hosts).
#
# Debian and Ubuntu are deliberately absent: the role's jail templates read the Apache logs
# below /var/log/httpd and it ships no per-OS variables, so it supports the Red Hat family
# only (see COMPATIBILITY.md).
lfops_fail2ban:
  children:
    systems_under_test:

systems_under_test:
  hosts:
    rocky8-vm:
    rocky9-vm:
    rocky10-vm:
