# yamllint disable rule:empty-values

# fail2ban targets 'lfops_fail2ban' (see playbooks/fail2ban.yml: hosts).
#
# Debian and Ubuntu are deliberately absent: the role's jail templates read the Apache logs
# below /var/log/httpd and it ships no per-OS variables, so it supports the Red Hat family
# only (see COMPATIBILITY.md).
lfops_fail2ban:
  children:
    systems_under_test:

systems_under_test:
  hosts:
    # Stands in for an Apache behind a reverse proxy: with a proxy in
    # apache_httpd__mod_remoteip_internal_proxy, the role leaves the Apache jails out.
    rocky8-vm:
      apache_httpd__mod_remoteip_internal_proxy:
        - '192.0.2.1'
    # Stands in for a host that keeps the iptables banactions.
    rocky9-vm:
      fail2ban__jail_default_banaction: 'iptables-multiport'
    # Stands in for a host that removes an ignored address of its group.
    rocky10-vm:
      fail2ban__jail_default_ignoreip__host_var:
        - name: '203.0.113.0/24'
          state: 'absent'
