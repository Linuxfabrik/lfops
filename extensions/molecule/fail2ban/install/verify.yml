# verify.yml runs after converge and again after the idempotence step. It asserts the observable
# end state, not that individual tasks ran.
#
# Everything of substance is read back from the *running* fail2ban server with `fail2ban-client`,
# never from the files in /etc/fail2ban. A jail only appears there once the server has parsed
# jail.d, resolved the filter, and started the jail's actions, so a single `fail2ban-client status
# <jail>` proves the whole chain at once: group_vars, to the template, to the file the server
# reads, to the jail it actually runs. Grepping the deployed .conf would prove none of that.
- name: 'Verify fail2ban is running and uses the configured jails'
  hosts: 'systems_under_test'
  gather_facts: true
  become: true

  vars:

    # The bantime that install/inventory sets as fail2ban__jail_sshd_bantime, in the seconds the
    # server reports back.
    __molecule__fail2ban_sshd_bantime_seconds: 10800

    # The role enables its Apache jails on a host with /var/log/httpd unless
    # apache_httpd__mod_remoteip_internal_proxy lists a proxy, which install/inventory does for
    # rocky8-vm only.
    __molecule__fail2ban_apache_jails_expected: '{{ apache_httpd__mod_remoteip_internal_proxy | d([]) | length == 0 }}'

    # install/inventory runs rocky9-vm with iptables-multiport and the others with
    # nftables-multiport. A ban is an element of the jail's set in nftables, and a rule in the
    # jail's chain in iptables.
    __molecule__fail2ban_nftables: '{{ fail2ban__jail_default_banaction is match("nftables") }}'
    __molecule__fail2ban_overflows_ban_regex: '{{ __molecule__fail2ban_nftables | bool
      | ternary("elements = \{[^}]*\b198\.51\.100\.20\b", "-s 198\.51\.100\.20/32 .*-j REJECT") }}'
    # nftables.conf has no pre-rule, so the apache-dos template matches new connections in the
    # blocktype instead.
    __molecule__fail2ban_dos_new_regex: '{{ __molecule__fail2ban_nftables | bool
      | ternary("ct state new reject", "-m state --state NEW") }}'

  tasks:

    # Floor check. On its own this would still pass with a dead server, so it is the start of the
    # verification, not the goal.
    - name: 'Get the list of installed packages'
      ansible.builtin.package_facts:  # yamllint disable-line rule:empty-values

    - name: 'Assert the fail2ban package is installed'
      ansible.builtin.assert:
        that: '"fail2ban" in ansible_facts["packages"]'

    # The real floor: fail2ban refuses to start when a jail references a filter it cannot resolve
    # or a log file that matches nothing, so a running server already rules out a broken config.
    - name: 'Get the service facts'
      ansible.builtin.service_facts:  # yamllint disable-line rule:empty-values

    - name: 'Assert the fail2ban service is enabled and running'
      ansible.builtin.assert:
        that:
          - 'ansible_facts["services"]["fail2ban.service"]["state"] == "running"'
          - 'ansible_facts["services"]["fail2ban.service"]["status"] == "enabled"'
        fail_msg: 'fail2ban.service is {{ ansible_facts["services"]["fail2ban.service"] | d("absent") }}'

    # The jails the server actually runs: two from the role defaults, one defined from the
    # inventory through the raw template. A jail missing here never made it past the server.
    - name: 'fail2ban-client status {{ item }}'
      ansible.builtin.command: 'fail2ban-client status {{ item }}'
      register: '__molecule__fail2ban_jail_status_result'
      changed_when: false
      failed_when: false
      check_mode: false
      loop:
        - 'molecule-journal'
        - 'portscan'
        - 'sshd'

    - name: 'Assert the server runs the default and the inventory-defined jails'
      ansible.builtin.assert:
        that: 'item["rc"] == 0'
        fail_msg: 'the {{ item["item"] }} jail is not running: {{ item["stderr"] | d(item["stdout"]) }}'
      loop: '{{ __molecule__fail2ban_jail_status_result["results"] }}'
      loop_control:
        label: '{{ item["item"] }}'

    # The molecule-nolog jail of install/inventory reads a log file that does not exist. With
    # skip_if_nologs from z00-defaults.conf the server skips it and runs everything else, which the
    # running service above already shows; here the jail itself has to be absent.
    - name: 'fail2ban-client status molecule-nolog'
      ansible.builtin.command: 'fail2ban-client status molecule-nolog'
      register: '__molecule__fail2ban_nolog_status_result'
      changed_when: false
      failed_when: false
      check_mode: false

    - name: 'Assert the server skipped the jail without a log file'
      ansible.builtin.assert:
        that: '__molecule__fail2ban_nolog_status_result["rc"] != 0'
        fail_msg: 'the molecule-nolog jail runs: {{ __molecule__fail2ban_nolog_status_result["stdout"] }}'

    # The apache-* jails are the ones fail2ban ships in jail.conf; the role only sets their
    # logpath. The file list of the running jail shows the server reads the log of the virtual
    # host that prepare.yml created, which the *error_log / *access_log of jail.conf would miss.
    # apache-badbots and apache-botsearch come from install/inventory and run everywhere, the
    # others only where the role enables its Apache jails.
    - name: 'fail2ban-client status {{ item["jail"] }}'
      ansible.builtin.command: 'fail2ban-client status {{ item["jail"] }}'
      register: '__molecule__fail2ban_apache_status_result'
      changed_when: false
      failed_when: false
      check_mode: false
      loop:
        - jail: 'apache-auth'
          log: 'error'
        - jail: 'apache-badbots'
          log: 'access'
          inventory: true
        - jail: 'apache-botsearch'
          log: 'error'
          inventory: true
        - jail: 'apache-dos'
          log: 'access'
          inventory: true
        - jail: 'apache-fakegooglebot'
          log: 'access'
        - jail: 'apache-modsecurity'
          log: 'error'
        - jail: 'apache-nohome'
          log: 'error'
        - jail: 'apache-noscript'
          log: 'error'
        - jail: 'apache-overflows'
          log: 'error'
        - jail: 'php-url-fopen'
          log: 'access'
      loop_control:
        label: '{{ item["jail"] }}'

    - name: 'Assert the apache-* jails run and read the log of the virtual host'
      ansible.builtin.assert:
        that:
          - 'item["rc"] == 0'
          - 'item["stdout"] is search("/var/log/httpd/molecule\\.example\\.com-" ~ item["item"]["log"] ~ "\\.log")'
        fail_msg: 'the {{ item["item"]["jail"] }} jail: {{ item["stdout"] | d("") }}{{ item["stderr"] | d("") }}'
      loop: '{{ __molecule__fail2ban_apache_status_result["results"] }}'
      loop_control:
        label: '{{ item["item"]["jail"] }}'
      when:
        - 'item["item"]["inventory"] | d(false) or __molecule__fail2ban_apache_jails_expected | bool'

    - name: 'Assert the Apache jails are left out behind a reverse proxy'
      ansible.builtin.assert:
        that: 'item["rc"] != 0'
        fail_msg: 'the {{ item["item"]["jail"] }} jail runs, although apache_httpd__mod_remoteip_internal_proxy lists a proxy'
      loop: '{{ __molecule__fail2ban_apache_status_result["results"] }}'
      loop_control:
        label: '{{ item["item"]["jail"] }}'
      when:
        - 'not item["item"]["inventory"] | d(false)'
        - 'not __molecule__fail2ban_apache_jails_expected | bool'

    # The role sets no maxretry or bantime for these jails, so the server has to run with the
    # values of jail.conf: maxretry 2 for apache-overflows, bantime 48h for apache-badbots.
    # Anything else means a template still overrides what fail2ban ships.
    - name: 'fail2ban-client get {{ item["jail"] }} {{ item["option"] }}'
      ansible.builtin.command: 'fail2ban-client get {{ item["jail"] }} {{ item["option"] }}'
      register: '__molecule__fail2ban_apache_option_result'
      changed_when: false
      check_mode: false
      loop:
        - jail: 'apache-badbots'
          option: 'bantime'
          expected: 172800
        - jail: 'apache-overflows'
          option: 'maxretry'
          expected: 2
      loop_control:
        label: '{{ item["jail"] }} {{ item["option"] }}'
      when:
        - 'item["jail"] == "apache-badbots" or __molecule__fail2ban_apache_jails_expected | bool'

    - name: 'Assert the apache-* jails use the values of jail.conf'
      ansible.builtin.assert:
        that: 'item["stdout"] | int == item["item"]["expected"]'
        fail_msg: '{{ item["item"]["jail"] }} {{ item["item"]["option"] }} is {{ item["stdout"] }}, expected {{ item["item"]["expected"] }} from jail.conf'
      loop: '{{ __molecule__fail2ban_apache_option_result["results"] }}'
      loop_control:
        label: '{{ item["item"]["jail"] }} {{ item["item"]["option"] }}'
      when:
        - 'item["skipped"] is not defined'

    # A path traversal attempt that Apache rejects with `AH10244: invalid URI path`, written to the
    # log of the virtual host twice, the maxretry of jail.conf. apache-overflows only knows AH10244
    # in the fail2ban the Linuxfabrik repository serves; the EPEL build lets it through. So the ban
    # proves both that the jail reads the right file and that the host got that fail2ban.
    - name: 'Append two AH10244 lines from 198.51.100.20 to the error log of the virtual host'
      ansible.builtin.shell: |-
        now="$(date '+%a %b %d %H:%M:%S.%6N %Y')"
        for path in '/%2e%2e/.env' '/%2e%2e/%2e%2e/etc/passwd'; do
            printf '[%s] [core:error] [pid 1234:tid 1234] [client 198.51.100.20:51234] AH10244: invalid URI path (%s)\n' "$now" "$path"
        done >> /var/log/httpd/molecule.example.com-error.log
      changed_when: false
      check_mode: false
      when:
        - '__molecule__fail2ban_apache_jails_expected | bool'

    - name: 'fail2ban-client status apache-overflows'
      ansible.builtin.command: 'fail2ban-client status apache-overflows'
      register: '__molecule__fail2ban_overflows_status_result'
      changed_when: false
      check_mode: false
      until: '"198.51.100.20" in __molecule__fail2ban_overflows_status_result["stdout"]'
      retries: 10
      delay: 3
      failed_when: false
      when:
        - '__molecule__fail2ban_apache_jails_expected | bool'

    - name: 'Assert apache-overflows banned the source of the path traversal attempts'
      ansible.builtin.assert:
        that: '"198.51.100.20" in __molecule__fail2ban_overflows_status_result["stdout"]'
        fail_msg: 'apache-overflows did not ban 198.51.100.20: {{ __molecule__fail2ban_overflows_status_result["stdout"] }}'
      when:
        - '__molecule__fail2ban_apache_jails_expected | bool'

    # fail2ban lists an address as banned even when the banaction failed, for example because
    # iptables rejects the multiport match on a kernel without xt_multiport. Only the rule or the
    # set element in the firewall proves the ban blocks anything.
    - name: '{{ __molecule__fail2ban_overflows_firewall_cmd }}'
      ansible.builtin.command: '{{ __molecule__fail2ban_overflows_firewall_cmd }}'
      register: '__molecule__fail2ban_overflows_rules_result'
      changed_when: false
      failed_when: false
      check_mode: false
      vars:
        __molecule__fail2ban_overflows_firewall_cmd: '{{ __molecule__fail2ban_nftables | bool
          | ternary("nft list set inet f2b-table addr-set-apache-overflows", "iptables --list-rules f2b-apache-overflows") }}'
      when:
        - '__molecule__fail2ban_apache_jails_expected | bool'

    - name: 'Assert the ban of apache-overflows is in the firewall'
      ansible.builtin.assert:
        that: '__molecule__fail2ban_overflows_rules_result["stdout"] is search(__molecule__fail2ban_overflows_ban_regex)'
        fail_msg: 'no firewall rule for the ban of 198.51.100.20: {{ __molecule__fail2ban_overflows_rules_result["stdout"] }}{{ __molecule__fail2ban_overflows_rules_result["stderr"] }}'
      when:
        - '__molecule__fail2ban_apache_jails_expected | bool'

    # verify.yml runs twice, and the second run has to see the ban happen again.
    - name: 'fail2ban-client set apache-overflows unbanip 198.51.100.20'
      ansible.builtin.command: 'fail2ban-client set apache-overflows unbanip 198.51.100.20'
      changed_when: false
      check_mode: false
      when:
        - '__molecule__fail2ban_apache_jails_expected | bool'

    # A ban of apache-dos must only block new connections, otherwise every httpd worker reading
    # from the banned client waits until Timeout and the ban exhausts MaxRequestWorkers. The
    # actionstart the running server resolved is the rule its first ban inserts, which this
    # scenario never triggers for apache-dos.
    - name: 'fail2ban-client get apache-dos action {{ fail2ban__jail_default_banaction }} actionstart'
      ansible.builtin.command: 'fail2ban-client get apache-dos action {{ fail2ban__jail_default_banaction }} actionstart'
      register: '__molecule__fail2ban_dos_actionstart_result'
      changed_when: false
      check_mode: false

    - name: 'Assert the apache-dos jail only bans new connections'
      ansible.builtin.assert:
        that: '__molecule__fail2ban_dos_actionstart_result["stdout"] is search(__molecule__fail2ban_dos_new_regex)'
        fail_msg: 'apache-dos would also ban established connections: {{ __molecule__fail2ban_dos_actionstart_result["stdout"] }}'

    # A scanner comes back right after a ban expires, so each further ban doubles the bantime.
    - name: 'fail2ban-client get apache-dos {{ item["option"] }}'
      ansible.builtin.command: 'fail2ban-client get apache-dos {{ item["option"] }}'
      register: '__molecule__fail2ban_dos_option_result'
      changed_when: false
      check_mode: false
      loop:
        - option: 'bantime.increment'
          expected: 'True'
        - option: 'bantime.maxtime'
          expected: '86400'
      loop_control:
        label: '{{ item["option"] }}'

    - name: 'Assert the apache-dos jail increments the bantime of repeat offenders'
      ansible.builtin.assert:
        that: 'item["stdout"] == item["item"]["expected"]'
        fail_msg: 'apache-dos {{ item["item"]["option"] }} is {{ item["stdout"] }}, expected {{ item["item"]["expected"] }}'
      loop: '{{ __molecule__fail2ban_dos_option_result["results"] }}'
      loop_control:
        label: '{{ item["item"]["option"] }}'

    # A ban has to close the connections the client already holds. Otherwise a client that keeps
    # one HTTP/2 connection busy goes on after a ban of new connections, and with a ban of all its
    # packets every one of its connections holds an httpd worker until Timeout. The script holds a
    # connection from 203.0.113.30, an address on lo, to port 80, bans that address in apache-dos
    # (banip bypasses ignoreself) and prints how many of the server's connections to it are still
    # established. Without the ss-kill action, or with SELinux denying it, the count stays at 1.
    # It runs with the interpreter of Ansible, since RHEL 8 has no python3 command, and therefore
    # sticks to Python 3.6.
    - name: 'Ban 203.0.113.30 in apache-dos while it holds a connection to port 80'
      ansible.builtin.shell:
        cmd: |-
          set -o errexit -o nounset -o pipefail
          ip address add 203.0.113.30/32 dev lo
          trap 'ip address del 203.0.113.30/32 dev lo' EXIT
          {{ ansible_facts["python"]["executable"] }} -I - <<'EOF'
          import socket
          import subprocess
          import time

          def established():
              return subprocess.check_output(
                  ['ss', '--tcp', '--no-header', 'state', 'established',
                   'dst', '203.0.113.30', '( sport = :80 )'],
                  universal_newlines=True,
              ).count('\n')

          server = socket.socket()
          server.bind(('203.0.113.30', 80))
          server.listen()
          client = socket.socket()
          client.bind(('203.0.113.30', 0))
          client.connect(('203.0.113.30', 80))
          connection, _ = server.accept()
          print(f'before: {established()}')
          subprocess.check_output(
              ['fail2ban-client', 'set', 'apache-dos', 'banip', '203.0.113.30'])
          for _ in range(10):
              if established() == 0:
                  break
              time.sleep(1)
          print(f'after: {established()}')
          subprocess.check_output(
              ['fail2ban-client', 'set', 'apache-dos', 'unbanip', '203.0.113.30'])
          EOF
        executable: '/bin/bash'
      register: '__molecule__fail2ban_dos_kill_result'
      changed_when: false
      check_mode: false

    - name: 'Assert the ban of apache-dos closed the established connection'
      ansible.builtin.assert:
        that: '__molecule__fail2ban_dos_kill_result["stdout_lines"] == ["before: 1", "after: 0"]'
        fail_msg: 'the connection of the banned address stays open: {{ __molecule__fail2ban_dos_kill_result["stdout"] }}'

    # The wordpress-login filter ships with the role defaults, but its jail reads Apache logs this
    # host does not have. So the deployed filter is fed sample lines through fail2ban-regex, which
    # proves it parses and matches with the fail2ban version the role installed.
    - name: 'fail2ban-regex against a {{ item["label"] }}'
      ansible.builtin.command:
        argv:
          - 'fail2ban-regex'
          - '{{ item["line"] }}'
          - '/etc/fail2ban/filter.d/wordpress-login.conf'
      register: '__molecule__fail2ban_wordpress_regex_result'
      changed_when: false
      check_mode: false
      loop:
        - label: 'failed login in the combined format'
          line: '198.51.100.1 - - [15/Sep/2026:10:00:00 +0200] "POST /wp-login.php HTTP/1.1" 200 4321 "-" "Mozilla/5.0"'
          matched: 1
        - label: 'failed login to a WordPress in a sub-path'
          line: '198.51.100.4 - - [15/Sep/2026:10:00:03 +0200] "POST /blog/wp-login.php HTTP/1.1" 200 4321 "-" "Mozilla/5.0"'
          matched: 1
        - label: 'failed login in the linuxfabrikio format'
          line: '192.0.2.10 198.51.100.3 - - [15/Sep/2026:10:00:02 +0200] "POST /wp-login.php HTTP/1.1" 200 4321 "-" "curl/8" 700 5000'
          matched: 1
        - label: 'successful login'
          line: '198.51.100.2 - - [15/Sep/2026:10:00:01 +0200] "POST /wp-login.php HTTP/1.1" 302 0 "-" "Mozilla/5.0"'
          matched: 0
      loop_control:
        label: '{{ item["label"] }}'

    - name: 'Assert the wordpress-login filter matches only the failed logins'
      ansible.builtin.assert:
        that: 'item["stdout"] is search("Lines: 1 lines, 0 ignored, " ~ item["item"]["matched"] ~ " matched")'
        fail_msg: '{{ item["item"]["label"] }}: {{ item["stdout"] }}'
      loop: '{{ __molecule__fail2ban_wordpress_regex_result["results"] }}'
      loop_control:
        label: '{{ item["item"]["label"] }}'

    # The apache-dos filter counts every request per client, so it has to take the client from
    # each LogFormat of the apache_httpd role, and from nothing else. Asked for the address it
    # found, not for a match: matomo and vhost_common start with the vHost name, which a bare
    # ^<HOST> resolves through DNS, and linuxfabrikio carries the X-Forwarded-For addresses the
    # client controls. Formats that do not start with the client must not match at all.
    - name: 'fail2ban-regex --out ip apache-dos against {{ item["label"] }}'
      ansible.builtin.command:
        argv:
          - 'fail2ban-regex'
          - '--out'
          - 'ip'
          - '{{ item["line"] }}'
          - '/etc/fail2ban/filter.d/apache-dos.conf'
      register: '__molecule__fail2ban_dos_regex_result'
      changed_when: false
      check_mode: false
      loop:
        - label: 'the combined format'
          line: '198.51.100.50 - - [25/Nov/2026:10:00:00 +0100] "GET / HTTP/1.1" 200 3 "-" "curl/8"'
          ip: '198.51.100.50'
        - label: 'the combined format with an IPv6 client'
          line: '2001:db8::51 - - [25/Nov/2026:10:00:00 +0100] "GET / HTTP/1.1" 200 3 "-" "curl/8"'
          ip: '2001:db8::51'
        - label: 'the fail2ban format'
          line: '198.51.100.52 - - [25/Nov/2026:10:00:00 +0100] "GET / HTTP/1.1" 200 "curl/8"'
          ip: '198.51.100.52'
        - label: 'the matomo format'
          line: 'www.example.com 198.51.100.53 - - [25/Nov/2026:10:00:00 +0100] "GET / HTTP/1.1" 200 3 "-" "curl/8"'
          ip: '198.51.100.53'
        - label: 'the matomo format with an IPv6 client'
          line: 'www.example.com 2001:db8::54 - - [25/Nov/2026:10:00:00 +0100] "GET / HTTP/1.1" 200 3 "-" "curl/8"'
          ip: '2001:db8::54'
        - label: 'the vhost_common format'
          line: 'www.example.com 198.51.100.55 - - [25/Nov/2026:10:00:00 +0100] "GET / HTTP/1.1" 200 3'
          ip: '198.51.100.55'
        - label: 'the linuxfabrikio format with an X-Forwarded-For address'
          line: '198.51.100.56 203.0.113.56 - - [25/Nov/2026:10:00:00 +0100] "GET / HTTP/1.1" 200 3 "-" "curl/8" 346 3157'
          ip: '198.51.100.56'
        - label: 'the linuxfabrikio format behind two proxies'
          line: '198.51.100.57 203.0.113.57, 203.0.113.58 - - [25/Nov/2026:10:00:00 +0100] "GET / HTTP/1.1" 200 3 "-" "curl/8" 346 3157'
          ip: '198.51.100.57'
        - label: 'the linuxfabrikio format with a quoted X-Forwarded-For'
          line: '198.51.100.58 "203.0.113.57, 203.0.113.58" - - [25/Nov/2026:10:00:00 +0100] "GET / HTTP/1.1" 200 3 "-" "curl/8" 346 3157'
          ip: '198.51.100.58'
        - label: 'a line of the debug format'
          line: '  Client: 198.51.100.59 (198.51.100.59)'
          ip: ''
        - label: 'a line of the gelf format'
          line: '  "_remote_hostname": "198.51.100.59",'
          ip: ''
        - label: 'a CSV line'
          line: '"2026-11-25T10:00:00.123456+0100";"www.example.com";"198.51.100.59";"198.51.100.59";"-";"-";"GET / HTTP/1.1";"200";"3";"300";"400";'
          ip: ''
      loop_control:
        label: '{{ item["label"] }}'

    - name: 'Assert the apache-dos filter takes the client address and only from client-first LogFormats'
      ansible.builtin.assert:
        that: 'item["stdout_lines"] == ([item["item"]["ip"]] if item["item"]["ip"] | length > 0 else [])'
        fail_msg: '{{ item["item"]["label"] }}: expected {{ item["item"]["ip"] | d("no match", true) }}, got {{ item["stdout_lines"] }}'
      loop: '{{ __molecule__fail2ban_dos_regex_result["results"] }}'
      loop_control:
        label: '{{ item["item"]["label"] }}'

    # The filters of the Apache jails, fed the lines Apache 2.4 writes for the requests they are
    # meant for. Measured on Rocky 8, 9 and 10 (httpd 2.4.37, 2.4.62, 2.4.63, mod_security 2.9)
    # against real requests and rewritten with documentation addresses. A filter that no longer
    # matches the current wording of Apache fails here, independent of the jails this host runs.
    - name: 'fail2ban-regex {{ item["filter"] }} against {{ item["label"] }}'
      ansible.builtin.command:
        argv:
          - 'fail2ban-regex'
          - '{{ item["line"] }}'
          - '/etc/fail2ban/filter.d/{{ item["filter"] }}.conf'
      register: '__molecule__fail2ban_apache_regex_result'
      changed_when: false
      check_mode: false
      loop:
        - label: 'an unknown user (AH01618)'
          filter: 'apache-auth'
          line: '[Wed Nov 18 12:30:05.123456 2026] [auth_basic:error] [pid 1234:tid 1234] [client 198.51.100.30:51234] AH01618: user bob not found: /protected/'
          matched: 1
        - label: 'a wrong password (AH01617)'
          filter: 'apache-auth'
          line: '[Wed Nov 18 12:30:05.123456 2026] [auth_basic:error] [pid 1234:tid 1234] [client 198.51.100.30:51234] AH01617: user alice: authentication failure for "/protected/": Password Mismatch'
          matched: 1
        - label: 'a request denied by Require (AH01630)'
          filter: 'apache-auth'
          line: '[Wed Nov 18 12:30:05.123456 2026] [authz_core:error] [pid 1234:tid 1234] [client 198.51.100.30:51234] AH01630: client denied by server configuration: /var/www/html/denied'
          matched: 1
        - label: 'a request ModSecurity denied (Rocky 10)'
          filter: 'apache-modsecurity'
          line: '[Wed Nov 18 12:30:05.123456 2026] [security2:error] [pid 1234:tid 1234] [client 198.51.100.31:51234] ModSecurity: Access denied with code 403 (phase 2). Operator GE matched 5 at TX:blocking_inbound_anomaly_score. [file "/etc/httpd/modsecurity.d/activated_rules/REQUEST-949-BLOCKING-EVALUATION.conf"] [line "222"] [id "949110"] [msg "Inbound Anomaly Score Exceeded (Total Score: 5)"] [hostname "192.0.2.5"] [uri "/"] [unique_id "aW1vbGVjdWxl"]'
          matched: 1
        - label: 'a request ModSecurity denied (Rocky 8 and 9)'
          filter: 'apache-modsecurity'
          line: '[Wed Nov 18 12:30:05.123456 2026] [:error] [pid 1234:tid 1234] [client 198.51.100.31:51234] [client 198.51.100.31] ModSecurity: Access denied with code 403 (phase 2). Operator GE matched 5 at TX:anomaly_score. [file "/etc/httpd/modsecurity.d/activated_rules/REQUEST-949-BLOCKING-EVALUATION.conf"] [line "80"] [id "949110"] [msg "Inbound Anomaly Score Exceeded (Total Score: 5)"] [hostname "192.0.2.5"] [uri "/"] [unique_id "aW1vbGVjdWxl"]'
          matched: 1
        - label: 'a probe for a home directory'
          filter: 'apache-nohome'
          line: '[Wed Nov 18 12:30:05.123456 2026] [core:info] [pid 1234:tid 1234] [client 198.51.100.32:51234] AH00128: File does not exist: /var/www/html/~root/'
          matched: 1
        - label: 'a missing favicon'
          filter: 'apache-nohome'
          line: '[Wed Nov 18 12:30:05.123456 2026] [core:info] [pid 1234:tid 1234] [client 198.51.100.40:51234] AH00128: File does not exist: /var/www/html/favicon.ico'
          matched: 0
        - label: 'a missing PHP script (AH01071)'
          filter: 'apache-noscript'
          line: "[Wed Nov 18 12:30:05.123456 2026] [proxy_fcgi:error] [pid 1234:tid 1234] [client 198.51.100.33:51234] AH01071: Got error 'Primary script unknown'"
          matched: 1
        - label: 'a missing ASP script (AH00128)'
          filter: 'apache-noscript'
          line: '[Wed Nov 18 12:30:05.123456 2026] [core:info] [pid 1234:tid 1234] [client 198.51.100.33:51234] AH00128: File does not exist: /var/www/html/missing.asp'
          matched: 1
        - label: 'a missing CGI script (AH01264, Rocky 9)'
          filter: 'apache-noscript'
          line: '[Wed Nov 18 12:30:05.123456 2026] [cgid:error] [pid 1234:tid 1234] [client 198.51.100.33:51234] AH01264: stderr from /var/www/html/cgi-bin/missing.sh: script not found or unable to stat'
          matched: 1
        - label: 'a missing favicon'
          filter: 'apache-noscript'
          line: '[Wed Nov 18 12:30:05.123456 2026] [core:info] [pid 1234:tid 1234] [client 198.51.100.40:51234] AH00128: File does not exist: /var/www/html/favicon.ico'
          matched: 0
        - label: 'a path traversal attempt (AH00126, Rocky 8)'
          filter: 'apache-overflows'
          line: '[Wed Nov 18 12:30:05.123456 2026] [core:error] [pid 1234:tid 1234] [client 198.51.100.34:51234] AH00126: Invalid URI in request GET /../../../etc/passwd HTTP/1.1'
          matched: 1
        - label: 'a path traversal attempt (AH10244, Rocky 9 and 10)'
          filter: 'apache-overflows'
          line: '[Wed Nov 18 12:30:05.123456 2026] [core:error] [pid 1234:tid 1234] [client 198.51.100.34:51234] AH10244: invalid URI path (/%2e%2e/%2e%2e/etc/passwd)'
          matched: 1
        - label: 'a remote URL passed to a PHP script'
          filter: 'php-url-fopen'
          line: '198.51.100.35 - - [18/Nov/2026:12:30:05 +0100] "GET /index.php?file=http://www.example.com/x.txt HTTP/1.1" 404 196 "-" "curl/8"'
          matched: 1
        - label: 'an encoded redirect URL'
          filter: 'php-url-fopen'
          line: '198.51.100.40 - - [18/Nov/2026:12:30:05 +0100] "GET /?redirect_uri=https%3A%2F%2Fwww.example.com%2Fcb HTTP/1.1" 200 3 "-" "curl/8"'
          matched: 0
        - label: 'a client claiming to be Googlebot'
          filter: 'apache-fakegooglebot'
          line: '198.51.100.36 - - [18/Nov/2026:12:30:05 +0100] "GET / HTTP/1.1" 200 3 "-" "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"'
          matched: 1
      loop_control:
        label: '{{ item["filter"] }}: {{ item["label"] }}'

    - name: 'Assert the filters of the Apache jails match what Apache logs'
      ansible.builtin.assert:
        that: 'item["stdout"] is search("Lines: 1 lines, 0 ignored, " ~ item["item"]["matched"] ~ " matched")'
        fail_msg: '{{ item["item"]["filter"] }}, {{ item["item"]["label"] }}: {{ item["stdout"] }}'
      loop: '{{ __molecule__fail2ban_apache_regex_result["results"] }}'
      loop_control:
        label: '{{ item["item"]["filter"] }}: {{ item["item"]["label"] }}'

    # Same approach for the portscan filter, whose jail reads the kernel log of a firewall this
    # host does not run. The filter gets its ports and addresses from the jail, so the sample
    # lines are fed with allowed port 22, what the role default gives on a host with sshd on port
    # 22, unless a case sets its own. What is asserted is which packet counts as a scan: one that
    # opens a connection, on a port that is not allowed. Reply traffic of a TCP connection the firewall no
    # longer tracks and ICMP errors must not match, otherwise the jail bans the servers a local
    # proxy talks to.
    - name: 'fail2ban-regex against a {{ item["label"] }}'
      ansible.builtin.command:
        argv:
          - 'fail2ban-regex'
          - '{{ item["line"] }}'
          - '/etc/fail2ban/filter.d/portscan.conf[server-ips="192\.0\.2\.5", allowed-ports="{{ item["allowed_ports"] | d("22") }}"]'
      register: '__molecule__fail2ban_portscan_regex_result'
      changed_when: false
      check_mode: false
      loop:
        - label: 'TCP connection attempt to a port that is not allowed'
          line: 'Sep 15 10:00:00 host kernel: RULE 10 -- DENY IN=eth0 OUT= MAC=00 SRC=198.51.100.1 DST=192.0.2.5 LEN=60 TOS=0x00 PREC=0x00 TTL=64 ID=1 DF PROTO=TCP SPT=34436 DPT=23 WINDOW=64240 RES=0x00 SYN URGP=0'
          matched: 1
        - label: 'TCP connection attempt to the allowed port'
          line: 'Sep 15 10:00:01 host kernel: RULE 10 -- DENY IN=eth0 OUT= MAC=00 SRC=198.51.100.2 DST=192.0.2.5 LEN=60 TOS=0x00 PREC=0x00 TTL=64 ID=2 DF PROTO=TCP SPT=34436 DPT=22 WINDOW=64240 RES=0x00 SYN URGP=0'
          matched: 0
        - label: 'TCP connection attempt to a port that only starts like the allowed one'
          line: 'Sep 15 10:00:02 host kernel: RULE 10 -- DENY IN=eth0 OUT= MAC=00 SRC=198.51.100.3 DST=192.0.2.5 LEN=60 TOS=0x00 PREC=0x00 TTL=64 ID=3 DF PROTO=TCP SPT=34436 DPT=2222 WINDOW=64240 RES=0x00 SYN URGP=0'
          matched: 1
        - label: 'TCP connection attempt with ECN to a port that is not allowed'
          line: 'Sep 15 10:00:05 host kernel: RULE 10 -- DENY IN=eth0 OUT= MAC=00 SRC=198.51.100.6 DST=192.0.2.5 LEN=60 TOS=0x00 PREC=0x00 TTL=64 ID=6 DF PROTO=TCP SPT=34436 DPT=23 WINDOW=64240 RES=0x00 CWR ECE SYN URGP=0'
          matched: 1
        - label: 'late FIN of a half-closed connection to a web server'
          line: 'Sep 15 10:00:03 host kernel: RULE 34 -- DENY IN=eth0 OUT= MAC=00 SRC=198.51.100.4 DST=192.0.2.5 LEN=52 TOS=0x00 PREC=0x00 TTL=53 ID=4 DF PROTO=TCP SPT=443 DPT=51832 WINDOW=501 RES=0x00 ACK FIN URGP=0'
          matched: 0
        - label: 'late RST from a web server'
          line: 'Sep 15 10:00:06 host kernel: RULE 34 -- DENY IN=eth0 OUT= MAC=00 SRC=198.51.100.7 DST=192.0.2.5 LEN=40 TOS=0x00 PREC=0x00 TTL=53 ID=7 DF PROTO=TCP SPT=443 DPT=51832 WINDOW=0 RES=0x00 RST URGP=0'
          matched: 0
        - label: 'late SYN-ACK from a web server'
          line: 'Sep 15 10:00:07 host kernel: RULE 34 -- DENY IN=eth0 OUT= MAC=00 SRC=198.51.100.8 DST=192.0.2.5 LEN=60 TOS=0x00 PREC=0x00 TTL=53 ID=8 DF PROTO=TCP SPT=443 DPT=51832 WINDOW=65160 RES=0x00 ACK SYN URGP=0'
          matched: 0
        - label: 'SYN/FIN scan'
          line: 'Sep 15 10:00:08 host kernel: RULE 10 -- DENY IN=eth0 OUT= MAC=00 SRC=198.51.100.9 DST=192.0.2.5 LEN=40 TOS=0x00 PREC=0x00 TTL=64 ID=9 PROTO=TCP SPT=34436 DPT=23 WINDOW=1024 RES=0x00 SYN FIN URGP=0'
          matched: 0
        - label: 'UDP packet to a port that is not allowed'
          line: 'Sep 15 10:00:04 host kernel: RULE 10 -- DENY IN=eth0 OUT= MAC=00 SRC=198.51.100.5 DST=192.0.2.5 LEN=48 TOS=0x00 PREC=0x00 TTL=64 ID=5 PROTO=UDP SPT=34436 DPT=161 LEN=28'
          matched: 1
        # Known limitation: the log line holds no connection state, so a late UDP reply looks
        # like a UDP scan and is banned.
        - label: 'late UDP reply from a DNS server'
          line: 'Sep 15 10:00:09 host kernel: RULE 10 -- DENY IN=eth0 OUT= MAC=00 SRC=198.51.100.10 DST=192.0.2.5 LEN=48 TOS=0x00 PREC=0x00 TTL=64 ID=10 PROTO=UDP SPT=53 DPT=51000 LEN=28'
          matched: 1
        - label: 'ICMP error quoting a UDP packet this host sent'
          line: 'Sep 15 10:00:10 host kernel: RULE 10 -- DENY IN=eth0 OUT= MAC=00 SRC=198.51.100.11 DST=192.0.2.5 LEN=76 TOS=0x00 PREC=0xC0 TTL=64 ID=11 PROTO=ICMP TYPE=3 CODE=3 [SRC=192.0.2.5 DST=198.51.100.11 LEN=48 TOS=0x00 PREC=0x00 TTL=64 ID=5 PROTO=UDP SPT=51000 DPT=53 LEN=28 ]'
          matched: 0
        - label: 'ICMP error quoting a TCP SYN this host sent'
          line: 'Sep 15 10:00:11 host kernel: RULE 10 -- DENY IN=eth0 OUT= MAC=00 SRC=198.51.100.12 DST=192.0.2.5 LEN=88 TOS=0x00 PREC=0xC0 TTL=64 ID=12 PROTO=ICMP TYPE=3 CODE=3 [SRC=192.0.2.5 DST=198.51.100.12 LEN=60 TOS=0x00 PREC=0x00 TTL=64 ID=6 DF PROTO=TCP SPT=51000 DPT=443 WINDOW=64240 RES=0x00 SYN URGP=0 ]'
          matched: 0
        # What the jail passes for an empty fail2ban__jail_portscan_allowed_ports: no port is
        # allowed, so even port 22 counts.
        - label: 'TCP connection attempt to port 22 with no allowed port'
          line: 'Sep 15 10:00:12 host kernel: RULE 10 -- DENY IN=eth0 OUT= MAC=00 SRC=198.51.100.13 DST=192.0.2.5 LEN=60 TOS=0x00 PREC=0x00 TTL=64 ID=13 DF PROTO=TCP SPT=34436 DPT=22 WINDOW=64240 RES=0x00 SYN URGP=0'
          allowed_ports: '(?!)'
          matched: 1
      loop_control:
        label: '{{ item["label"] }}'

    - name: 'Assert the portscan filter matches only the connection attempts'
      ansible.builtin.assert:
        that: 'item["stdout"] is search("Lines: 1 lines, 0 ignored, " ~ item["item"]["matched"] ~ " matched")'
        fail_msg: '{{ item["item"]["label"] }}: {{ item["stdout"] }}'
      loop: '{{ __molecule__fail2ban_portscan_regex_result["results"] }}'
      loop_control:
        label: '{{ item["item"]["label"] }}'

    # Proves a value from the inventory reaches the running jail, rather than the server falling
    # back to the 10m that jail.conf ships.
    - name: 'fail2ban-client get sshd bantime'
      ansible.builtin.command: 'fail2ban-client get sshd bantime'
      register: '__molecule__fail2ban_sshd_bantime_result'
      changed_when: false
      check_mode: false

    - name: 'Assert the sshd jail uses the configured bantime'
      ansible.builtin.assert:
        that: '__molecule__fail2ban_sshd_bantime_result["stdout"] | int == __molecule__fail2ban_sshd_bantime_seconds'
        fail_msg: 'the sshd bantime is {{ __molecule__fail2ban_sshd_bantime_result["stdout"] }}s, expected {{ __molecule__fail2ban_sshd_bantime_seconds }}s ({{ fail2ban__jail_sshd_bantime }})'

    # The aggressive mode adds the regexes of the ddos and extra modes, for example scanners that
    # break off the key exchange. Neither appears in the failregex of the default normal mode.
    - name: 'fail2ban-client get sshd failregex'
      ansible.builtin.command: 'fail2ban-client get sshd failregex'
      register: '__molecule__fail2ban_sshd_failregex_result'
      changed_when: false
      check_mode: false

    - name: 'Assert the sshd jail runs the filter in aggressive mode'
      ansible.builtin.assert:
        that:
          - '"kex_exchange_identification" in __molecule__fail2ban_sshd_failregex_result["stdout"]'
          - '"authentication methods available" in __molecule__fail2ban_sshd_failregex_result["stdout"]'
        fail_msg: 'the sshd jail does not run in aggressive mode: {{ __molecule__fail2ban_sshd_failregex_result["stdout"] }}'

    # The port is what the banaction later puts into the firewall rule. The rule itself only
    # appears with the first ban (the actions have family-conditional sections, so fail2ban sets
    # actionstart_on_demand), so the port is read from the running action instead. Without the
    # port line in the jail, the action falls back to the `ssh` of jail.conf, which is port 22.
    # sshd__port is set in install/inventory, and fail2ban__jail_sshd_port derives from it.
    - name: 'fail2ban-client get sshd action {{ fail2ban__jail_default_banaction }} port'
      ansible.builtin.command: 'fail2ban-client get sshd action {{ fail2ban__jail_default_banaction }} port'
      register: '__molecule__fail2ban_sshd_port_result'
      changed_when: false
      check_mode: false

    - name: 'Assert the sshd jail bans on the configured port'
      ansible.builtin.assert:
        that: '__molecule__fail2ban_sshd_port_result["stdout"] | trim == sshd__port | string'
        fail_msg: 'the sshd jail bans on {{ __molecule__fail2ban_sshd_port_result["stdout"] }}, expected {{ sshd__port }}'

    # The allowed ports end up in the failregex of the running portscan jail, as the negative
    # lookahead `DPT=(?!(?:<ports>)\b)`, so a port sshd listens on is never counted as a scan.
    - name: 'fail2ban-client get portscan failregex'
      ansible.builtin.command: 'fail2ban-client get portscan failregex'
      register: '__molecule__fail2ban_portscan_failregex_result'
      changed_when: false
      check_mode: false

    - name: 'Assert the portscan jail exempts the sshd port'
      ansible.builtin.assert:
        that: '("DPT=(?!(?:" ~ sshd__port ~ ")\\b)") in __molecule__fail2ban_portscan_failregex_result["stdout"]'
        fail_msg: 'the portscan jail does not exempt port {{ sshd__port }}: {{ __molecule__fail2ban_portscan_failregex_result["stdout"] }}'

    # fail2ban reads jail.d alphabetically, so the role's z00-defaults.conf has to win over the
    # 00-firewalld.conf that the fail2ban-firewalld package ships, otherwise every jail would ban
    # through firewalld instead of the configured banaction. Nothing about that ordering is
    # visible in the role's own files, which is why it is asserted against the running server.
    - name: 'fail2ban-client get sshd actions'
      ansible.builtin.command: 'fail2ban-client get sshd actions'
      register: '__molecule__fail2ban_sshd_actions_result'
      changed_when: false
      check_mode: false

    - name: 'Assert the sshd jail bans through the configured banaction'
      ansible.builtin.assert:
        that: 'fail2ban__jail_default_banaction in __molecule__fail2ban_sshd_actions_result["stdout"]'
        fail_msg: 'the sshd jail uses {{ __molecule__fail2ban_sshd_actions_result["stdout"] }}, expected {{ fail2ban__jail_default_banaction }}'

    # The role publishes fail2ban__selinux__booleans__dependent_var, which the playbook feeds into
    # the selinux role. Without the boolean fail2ban cannot resolve users through NSS and the sshd
    # jail logs a denial instead of banning, so assert the end state on the host.
    - name: 'getsebool nis_enabled'
      ansible.builtin.command: 'getsebool nis_enabled'
      register: '__molecule__fail2ban_nis_enabled_result'
      changed_when: false
      check_mode: false
      when:
        - 'ansible_facts["selinux"]["status"] != "disabled"'

    - name: 'Assert the nis_enabled SELinux boolean is on'
      ansible.builtin.assert:
        that: '__molecule__fail2ban_nis_enabled_result["stdout"] is search("--> on")'
        fail_msg: 'nis_enabled is {{ __molecule__fail2ban_nis_enabled_result["stdout"] }}'
      when:
        - 'ansible_facts["selinux"]["status"] != "disabled"'
