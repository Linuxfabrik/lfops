# fail2ban skips a jail whose logpath matches no file, and the Apache jails are on by default for
# hosts in lfops_apache_httpd, so give them an access log to read. Apache itself is not needed.
- name: 'Create an Apache access log for the default jails'
  hosts: 'systems_under_test'
  become: true
  tasks:

    - name: 'Create /var/log/httpd'
      ansible.builtin.file:
        path: '/var/log/httpd'
        state: 'directory'
        mode: 0o700
        owner: 'root'
        group: 'root'

    - name: 'Create /var/log/httpd/molecule-access.log'
      ansible.builtin.copy:
        content: ''
        dest: '/var/log/httpd/molecule-access.log'
        force: false
        mode: 0o640
        owner: 'root'
        group: 'root'

- name: 'Converge fail2ban playbook'
  ansible.builtin.import_playbook: 'linuxfabrik.lfops.fail2ban'
