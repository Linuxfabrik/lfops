# Molecule scenario marker for the 'cron_permissions' scenario, run with
# `molecule test --scenario-name cron_permissions`.
#
# The prepare playbook is overridden to create the unprivileged users that verify.yml runs
# crontab as; see the scenario-local prepare.yml. It imports the shared vm-prepare.yml first, so
# the systems under test are still waited for and their facts still gathered.
provisioner:
  playbooks:
    prepare: '${MOLECULE_SCENARIO_DIRECTORY}/prepare.yml'
