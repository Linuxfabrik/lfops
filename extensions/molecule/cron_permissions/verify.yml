- name: 'Verify the cron_permissions playbook left a working, root-only cron'
  hosts: 'systems_under_test'
  gather_facts: false
  tasks:

    # The daemon reads /etc/cron.d as root, so a job there has to run although the directory is
    # 0700 now.
    - name: 'Deploy /etc/cron.d/molecule-probe'
      ansible.builtin.copy:
        content: "* * * * * root touch /run/molecule-cron-probe\n"
        dest: '/etc/cron.d/molecule-probe'
        owner: 'root'
        group: 'root'
        mode: 0o644
      changed_when: false

    - name: 'Wait for the cron job to run'
      ansible.builtin.wait_for:
        path: '/run/molecule-cron-probe'
        timeout: 150

    - name: 'rm -f /etc/cron.d/molecule-probe /run/molecule-cron-probe'
      ansible.builtin.file:
        path: '{{ item }}'
        state: 'absent'
      loop:
        - '/etc/cron.d/molecule-probe'
        - '/run/molecule-cron-probe'
      changed_when: false

    - name: 'runuser --user nobody -- ls /etc/cron.d'
      ansible.builtin.command: 'runuser --user nobody -- ls /etc/cron.d'
      changed_when: false
      failed_when: false
      register: '__molecule__cron_nobody_ls_result'

    - name: 'Assert that an unprivileged user can no longer list the system cron jobs'
      ansible.builtin.assert:
        that:
          - '__molecule__cron_nobody_ls_result["rc"] != 0'
          - '"Permission denied" in __molecule__cron_nobody_ls_result["stderr"]'
        fail_msg: '{{ __molecule__cron_nobody_ls_result | to_json }}'

    # Only root and the user listed in /etc/cron.allow may use crontab(1). The listed user also
    # proves that crontab can read /etc/cron.allow: on Debian and Ubuntu, an unreadable file
    # refuses every user but root.
    - name: 'runuser --user {{ item }} -- crontab -l'
      ansible.builtin.command: 'runuser --user {{ item }} -- crontab -l'
      changed_when: false
      failed_when: false
      register: '__molecule__cron_crontab_result'
      loop:
        - 'lfops-cron-allowed'
        - 'lfops-cron-denied'
        - 'root'

    - name: 'Assert that crontab answers root and the listed user with "no crontab", and refuses the other user'
      ansible.builtin.assert:
        that:
          - '("no crontab for " ~ item["item"]) in item["stderr"]
            if item["item"] in ["lfops-cron-allowed", "root"] else
            "not allowed to use this program" in item["stderr"]'
        fail_msg: '{{ item | to_json }}'
      loop: '{{ __molecule__cron_crontab_result["results"] }}'
      loop_control:
        label: '{{ item["item"] }}'

    - name: 'stat /etc/crontab /etc/cron.d'
      ansible.builtin.stat:
        path: '{{ item }}'
      loop:
        - '/etc/crontab'
        - '/etc/cron.d'
      register: '__molecule__cron_stat_result'

    - name: 'Assert that /etc/crontab is 0600 and /etc/cron.d is 0700'
      ansible.builtin.assert:
        that:
          - '__molecule__cron_stat_result["results"] | map(attribute="stat.mode") | list == ["0600", "0700"]'
        fail_msg: '{{ __molecule__cron_stat_result["results"] | map(attribute="stat.mode") | list }}'
