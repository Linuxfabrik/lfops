# yamllint disable rule:empty-values

# postgresql_server targets 'lfops_postgresql_server' (see playbooks/postgresql_server.yml: hosts).
#
# Only Red Hat-family hosts run: the role hardcodes the RHEL paths and has no Debian support (see
# COMPATIBILITY.md).
#
# The hosts cover both ways the role installs PostgreSQL. Rocky 8 and 9 install it from the
# PostgreSQL Yum Repository (`postgresql_server__version`), Rocky 10 installs the `postgresql-server`
# package of the distribution, which uses other service names, paths and client tools.
lfops_postgresql_server:
  children:
    systems_under_test:

systems_under_test:
  hosts:
    rocky8-vm:
      postgresql_server__version: '18'
    rocky9-vm:
      postgresql_server__version: '18'
    rocky10-vm:
      # repo_postgresql runs `dnf module disable postgresql`, which fails on RHEL 10 because it
      # has no module streams anymore.
      postgresql_server__skip_repo_postgresql: true
