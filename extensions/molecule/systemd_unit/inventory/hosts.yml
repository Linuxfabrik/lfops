# yamllint disable rule:empty-values

# Socket units and systemd-socket-proxyd are part of systemd itself, so the scenario runs on every
# distribution LFOps supports. It needs a real init system, hence the VMs.
lfops_systemd_unit:
  children:
    systems_under_test:

systems_under_test:
  hosts:
    debian12-vm:
    debian13-vm:
    rocky8-vm:
    rocky9-vm:
    rocky10-vm:
    ubuntu2204-vm:
    ubuntu2404-vm:
    ubuntu2604-vm:
