# Inputs for the system_update playbook (yum_utils + postfix + mailto_root +
# schedule_reboot + system_update).

# mailto_root is mandatory: a from and a list of recipients. A local address is
# enough; the test never sends real mail.
mailto_root__from: 'root@localhost'
mailto_root__to:
  - 'root@localhost'

# postfix needs a relayhost; an unreachable example host is fine.
postfix__relayhost: 'mail.example.com'

# Reboot window far from the test run, so neither the update nor the reboot
# timer fires mid-test.
schedule_reboot__reboot_time__group_var: '03:00'

# Make the two update hooks observable. Both lanes render them, so the markers are
# what verify.yml reads to tell whether a lane reached them. /var/tmp rather than
# /tmp or /run, because the markers have to survive the reboot in verify.yml.
system_update__post_update_code: |-
  touch /var/tmp/molecule-system_update-post-update-code
system_update__pre_update_code: |-
  touch /var/tmp/molecule-system_update-pre-update-code

# The fixture repository verify.yml builds for the security lane. Not `security`: from
# rocky-repos 8.10 on, Rocky 8 ships a disabled [security] section in
# /etc/yum.repos.d/Rocky-Security.repo, and dnf ignores a second section with the same id,
# so a fixture called `security` stays disabled once the regular lane has updated the host.
system_update__security_repos:
  - 'lfops-security-test'
