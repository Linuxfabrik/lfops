# yamllint disable rule:empty-values

# podman_containers targets 'lfops_podman_containers' (see playbooks/podman_containers.yml: hosts).
# prepare.yml also runs the login and repo_epel playbooks.
#
# Rocky 8 is deliberately absent: it boots with cgroup v1, on which rootless Quadlets fail with
# "mkdir /sys/fs/cgroup/pids/user.slice/...: permission denied" (see COMPATIBILITY.md, "(x)").
lfops_login:
  children:
    systems_under_test:

lfops_podman_containers:
  children:
    systems_under_test:

lfops_repo_epel:
  children:
    systems_under_test:

systems_under_test:
  hosts:
    rocky9-vm:
    rocky10-vm:
