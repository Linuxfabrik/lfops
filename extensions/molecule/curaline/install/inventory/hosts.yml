# yamllint disable rule:empty-values

# curaline targets 'lfops_curaline' (see playbooks/curaline.yml: hosts).
#
# All platforms of COMPATIBILITY.md are covered: the package of the client brings its own
# Java runtime, so the role is the same on all of them, and only the RHEL family has SELinux
# enforcing.
lfops_curaline:
  children:
    systems_under_test:

systems_under_test:
  hosts:
    debian12-vm:
    debian13-vm:
    rocky8-vm:
    rocky9-vm:
    rocky10-vm:
    ubuntu2204-vm:
    ubuntu2404-vm:
    ubuntu2604-vm:
