# the credentials are not valid: the client keeps running and reports the denied login in its
# health endpoint, which is all this scenario needs to see that it reads its configuration.
curaline__client_id: 'linuxfabrik'
curaline__client_secret: 'linuxfabrik'

# a non-default value, so verify.yml can see that the running client uses what was configured.
curaline__schedule_delay: 'PT15M'

curaline__connectors__group_var:
  - connector-id: 40000
    mode: 'test'
    content-type: 'application/forumdatenaustausch+xml;charset=UTF-8'
    source-folder: '/data/xml/outbox-test/XMLDatenforum'
    target-folder: '/data/xml/inbox-test/XMLDatenforum'
    source-archive-enabled: true
    source-archive-folder: '/data/xml/archive-test'
  # a connector that is set to absent must neither end up in the configuration nor get folders.
  - connector-id: 40000
    mode: 'production'
    source-folder: '/data/xml/outbox-absent/XMLDatenforum'
    target-folder: '/data/xml/inbox-absent/XMLDatenforum'
    state: 'absent'
