# What only the running system can confirm is that the client starts from the unpacked
# download under the configured account, that SELinux lets systemd execute it, and that it reads the
# configuration the role wrote: the client is asked for its health and its version, and it
# reports the values it parsed in its log. The configuration files themselves are not checked.
- name: 'Verify curaline'
  hosts: 'systems_under_test'
  gather_facts: false
  tasks:

    - name: 'Gather the service facts'
      ansible.builtin.service_facts:  # yamllint disable-line rule:empty-values

    - name: 'Assert that swisscom-schweiz-ag-cdr-client.service is running and enabled'
      ansible.builtin.assert:
        that:
          - 'ansible_facts["services"]["swisscom-schweiz-ag-cdr-client.service"]["state"] == "running"'
          - 'ansible_facts["services"]["swisscom-schweiz-ag-cdr-client.service"]["status"] == "enabled"'

    - name: 'Wait for the management port of the client'
      ansible.builtin.wait_for:
        host: '127.0.0.1'
        port: 8193
        timeout: 60

    # the overall status is UP even though the credentials of this scenario are rejected, so the
    # components are asserted: `config` is OK only if the client parsed the file without
    # complaint.
    - name: 'curl http://127.0.0.1:8193/actuator/health'
      ansible.builtin.uri:
        url: 'http://127.0.0.1:8193/actuator/health'
        return_content: true
      register: '__molecule__curaline_health_result'

    - name: 'Assert that the client accepted its configuration'
      ansible.builtin.assert:
        that:
          - '__molecule__curaline_health_result["json"]["components"]["config"]["status"] == "OK"'
          - '__molecule__curaline_health_result["json"]["components"]["fileSynchronization"]["status"] == "ENABLED"'

    - name: 'curl http://127.0.0.1:8193/actuator/info'
      ansible.builtin.uri:
        url: 'http://127.0.0.1:8193/actuator/info'
        return_content: true
      register: '__molecule__curaline_info_result'

    - name: 'Assert that the client is the installed version'
      ansible.builtin.assert:
        that: '__molecule__curaline_info_result["json"]["build"]["version"] == curaline__version'

    - name: 'systemctl show swisscom-schweiz-ag-cdr-client.service --property=MainPID --value' # noqa command-instead-of-module (read-only property query)
      ansible.builtin.command: 'systemctl show swisscom-schweiz-ag-cdr-client.service --property=MainPID --value'
      changed_when: false
      register: '__molecule__curaline_mainpid_result'

    - name: 'stat /proc/{{ __molecule__curaline_mainpid_result["stdout"] }}'
      ansible.builtin.stat:
        path: '/proc/{{ __molecule__curaline_mainpid_result["stdout"] }}'
      register: '__molecule__curaline_proc_result'

    # the hnet scenario imports this playbook and sets curaline__user, the install scenario relies on the role default.
    - name: 'Assert that the client runs as {{ curaline__user | d("curaline") }}'
      ansible.builtin.assert:
        that: '__molecule__curaline_proc_result["stat"]["pw_name"] == curaline__user | d("curaline")'

    # the client logs the schedule delay and the folders it watches after it has parsed them.
    - name: 'Wait for the client to log the polling of the source folder'
      ansible.builtin.command: "grep --no-messages 'Polling source directory' /var/log/swisscom-schweiz-ag/cdr-client/cdr-client-service.log"
      register: '__molecule__curaline_log_result'
      changed_when: false
      retries: 12
      delay: 5
      until: '__molecule__curaline_log_result["rc"] == 0'

    - name: 'Assert that the client uses the configured schedule delay and source folder'
      ansible.builtin.assert:
        that:
          - '"every ''15m'' for connector" in __molecule__curaline_log_result["stdout"]'
          - '"/data/xml/outbox-test/XMLDatenforum" in __molecule__curaline_log_result["stdout"]'

    - name: 'stat /data/xml/outbox-absent'
      ansible.builtin.stat:
        path: '/data/xml/outbox-absent'
      register: '__molecule__curaline_absent_result'

    - name: 'Assert that the absent connector got no folders'
      ansible.builtin.assert:
        that: 'not __molecule__curaline_absent_result["stat"]["exists"]'

    # without the bin_t file context systemd cannot execute the client from /usr/lib, and the
    # service would not run at all. a host that happens to run permissive would pass that
    # assertion without proving anything, so the mode is asserted too.
    - name: 'Verify the SELinux context of the client'
      when:
        - 'inventory_hostname is match("rocky")'
      block:

        - name: 'getenforce'
          ansible.builtin.command: 'getenforce'
          changed_when: false
          register: '__molecule__curaline_getenforce_result'

        - name: 'cat /proc/{{ __molecule__curaline_mainpid_result["stdout"] }}/attr/current'
          ansible.builtin.command: 'cat /proc/{{ __molecule__curaline_mainpid_result["stdout"] }}/attr/current'
          changed_when: false
          register: '__molecule__curaline_context_result'

        - name: 'Assert that SELinux is enforcing and the client runs in unconfined_service_t'
          ansible.builtin.assert:
            that:
              - '__molecule__curaline_getenforce_result["stdout"] == "Enforcing"'
              - '"unconfined_service_t" in __molecule__curaline_context_result["stdout"]'
