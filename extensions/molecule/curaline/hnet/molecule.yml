# Molecule scenario marker for the 'hnet' sub-scenario, run with `molecule test --scenario-name curaline/hnet`.
#
# The prepare playbook is overridden so the host looks like one with an H-Net SecureClient installation before converge runs: the regular `hnet` account with its home in /home/hnet and the /data/xml tree owned by it, labelled `user_home_t` on the RHEL family. The scenario-local prepare.yml imports the shared vm-prepare.yml first, so the systems under test are still waited for and their facts still gathered.
provisioner:
  playbooks:
    prepare: '${MOLECULE_SCENARIO_DIRECTORY}/prepare.yml'
