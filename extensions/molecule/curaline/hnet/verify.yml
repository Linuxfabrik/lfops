# The client has to work under the `hnet` account exactly as under its own one, so the checks of the install scenario run first.
- name: 'Verify curaline'
  ansible.builtin.import_playbook: '../install/verify.yml'


# What the takeover must not change is the account and the folders of the H-Net SecureClient, and the client must not write into /home/hnet, which the SecureClient lives in.
- name: 'Verify that the H-Net SecureClient installation is untouched'
  hosts: 'systems_under_test'
  gather_facts: false
  tasks:

    - name: 'getent passwd hnet'
      ansible.builtin.getent:
        database: 'passwd'
        key: 'hnet'

    # getent_passwd values: password, UID, GID, comment, home, shell
    - name: 'Assert that the hnet account keeps its comment, home and shell'
      ansible.builtin.assert:
        that:
          - 'ansible_facts["getent_passwd"]["hnet"][3] == "User for H-Net Secure Client"'
          - 'ansible_facts["getent_passwd"]["hnet"][4] == "/home/hnet"'
          - 'ansible_facts["getent_passwd"]["hnet"][5] == "/bin/bash"'

    - name: 'stat /data/xml/outbox-test/XMLDatenforum'
      ansible.builtin.stat:
        path: '/data/xml/outbox-test/XMLDatenforum'
      register: '__molecule__curaline_outbox_result'

    - name: 'Assert that the existing connector folder keeps its mode'
      ansible.builtin.assert:
        that:
          - '__molecule__curaline_outbox_result["stat"]["mode"] == "0770"'
          - '__molecule__curaline_outbox_result["stat"]["pw_name"] == "hnet"'

    # the client gets its $HOME from the unit, so its `.cache` lands below /var/lib/swisscom-schweiz-ag/cdr-client instead.
    - name: 'stat /home/hnet/.cache'
      ansible.builtin.stat:
        path: '/home/hnet/.cache'
      register: '__molecule__curaline_home_cache_result'

    - name: 'Assert that the client did not write into the home of hnet'
      ansible.builtin.assert:
        that: 'not __molecule__curaline_home_cache_result["stat"]["exists"]'

    - name: 'Verify the SELinux context of the data folders'
      when:
        - 'inventory_hostname is match("rocky")'
      block:

        - name: 'stat --format=%C /data/xml/inbox-test/XMLDatenforum'
          ansible.builtin.command: 'stat --format=%C /data/xml/inbox-test/XMLDatenforum'
          changed_when: false
          register: '__molecule__curaline_inbox_result'

        # the role created this folder, the file context of the SecureClient setup has to apply to it as well.
        - name: 'Assert that the folders the role created get the user_home_t type'
          ansible.builtin.assert:
            that: '":user_home_t:" in __molecule__curaline_inbox_result["stdout"]'
