# Wait for the systems under test and gather their facts, as every other scenario does.
- name: 'Prepare VMs for Ansible'
  ansible.builtin.import_playbook: '../../playbooks/vm-prepare.yml'


# Set the host up the way the Linuxfabrik installation guide of the H-Net SecureClient
# does, without the SecureClient itself: the role has to take over this account and these
# folders without changing them.
- name: 'Set up the account and the data folders of an H-Net SecureClient'
  hosts: 'systems_under_test'

  tasks:

    - name: 'useradd --comment "User for H-Net Secure Client" hnet'
      ansible.builtin.user:
        name: 'hnet'
        comment: 'User for H-Net Secure Client'
        shell: '/bin/bash'
        state: 'present'

    - name: 'mkdir -p /data/xml/{inbox,inbox-test,outbox,outbox-test,archive,archive-test} /var/hnet'
      ansible.builtin.file:
        path: '{{ item }}'
        state: 'directory'
        owner: 'hnet'
        group: 'hnet'
        mode: 0o755
      loop:
        - '/data/xml'
        - '/data/xml/archive'
        - '/data/xml/archive-test'
        - '/data/xml/inbox'
        - '/data/xml/inbox-test'
        - '/data/xml/outbox'
        - '/data/xml/outbox-test'
        - '/var/hnet'

    # an existing connector folder with a mode the role would not set, so verify.yml can
    # see that the role leaves it alone.
    - name: 'mkdir -m 0770 /data/xml/outbox-test/XMLDatenforum'
      ansible.builtin.file:
        path: '/data/xml/outbox-test/XMLDatenforum'
        state: 'directory'
        owner: 'hnet'
        group: 'hnet'
        mode: 0o770

    - name: 'Label /data/xml as user_home_t'
      when:
        - 'ansible_facts["os_family"] == "RedHat"'
      block:

        - name: 'dnf install policycoreutils-python-utils'
          ansible.builtin.package:
            name: 'policycoreutils-python-utils'
            state: 'present'
          retries: 3
          delay: 10

        - name: 'semanage fcontext --add --type user_home_t "/data/xml(/.*)?"'
          community.general.sefcontext:
            target: '/data/xml(/.*)?'
            setype: 'user_home_t'
            state: 'present'

        - name: 'restorecon -Fvr /data/xml'
          ansible.builtin.command: 'restorecon -Fvr /data/xml'
          register: '__molecule__curaline_restorecon_result'
          changed_when: '__molecule__curaline_restorecon_result["stdout"] | length > 0'
