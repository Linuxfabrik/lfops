# Molecule scenario marker for the 'network' scenario, run with
# `molecule test --scenario-name network`.
#
# The prepare playbook is overridden to leave DNS servers in the connection profile that is active
# on the interface under test, the way providers and installers do; see the scenario-local
# prepare.yml. It imports the shared vm-prepare.yml first, so the systems under test are still
# waited for and their facts still gathered.
provisioner:
  playbooks:
    prepare: '${MOLECULE_SCENARIO_DIRECTORY}/prepare.yml'
