# The generic cloud image comes up with a connection profile of cloud-init active on the NIC.
# prepare.yml stores DNS servers in it, as providers do, and the network role has to clear them:
# nmstate carries them over into the profile it writes (https://github.com/nmstate/nmstate/issues/3251)
# and aborts with "ipv6.dns: this property is not allowed" because IPv6 is disabled here. This host
# declares dns-resolver, so the stored IPv4 server that it does not list has to go as well; rocky9-vm
# covers the same state without dns-resolver. DHCP, so the VM stays reachable for Molecule; the NIC
# is the one that carries the default route, and the DNS server is the one libvirt hands out, which
# is the gateway.
# The name belongs to fedora.linux_system_roles.network, hence the noqa.
network_state: # noqa var-naming[pattern]
  interfaces:
    - name: '{{ ansible_facts["default_ipv4"]["interface"] }}'
      profile-name: '{{ ansible_facts["default_ipv4"]["interface"] }}'
      type: 'ethernet'
      state: 'up'
      ipv4:
        enabled: true
        dhcp: true
      ipv6:
        enabled: false
  dns-resolver:
    config:
      server:
        - '{{ ansible_facts["default_ipv4"]["gateway"] }}'
