# The generic cloud images come up with a connection profile of cloud-init or the installer active
# on the NIC (enp1s0 on Rocky 10, eth0 on Rocky 9, which boots with net.ifnames=0). prepare.yml
# stores DNS servers in it, as providers do, and the network role has to clear them: nmstate
# carries them over into the profile it writes and aborts with "ipv6.dns: this property is not
# allowed" because IPv6 is disabled here. DHCP, so the VM stays reachable for Molecule; the NIC is
# the one that carries the default route, and the DNS server is the one libvirt hands out, which
# is the gateway.
# The name belongs to fedora.linux_system_roles.network, hence the noqa.
network_state: # noqa var-naming[pattern]
  interfaces:
    - name: '{{ ansible_facts["default_ipv4"]["interface"] }}'
      profile-name: '{{ ansible_facts["default_ipv4"]["interface"] }}'
      type: 'ethernet'
      state: 'up'
      ipv4:
        enabled: true
        dhcp: true
      ipv6:
        enabled: false
  dns-resolver:
    config:
      server:
        - '{{ ansible_facts["default_ipv4"]["gateway"] }}'
