- name: 'Verify the upgraded MongoDB'
  hosts: 'systems_under_test'
  gather_facts: false
  become: true
  tasks:

    - name: 'Gather the service facts'
      ansible.builtin.service_facts:  # yamllint disable-line rule:empty-values

    - name: 'Assert that mongod.service is running'
      ansible.builtin.assert:
        that: 'ansible_facts["services"]["mongod.service"]["state"] == "running"'

    - name: 'mongosh --eval (version, FCV and the document from before the upgrade)'
      ansible.builtin.command:
        argv:
          - 'mongosh'
          - '--quiet'
          - '--username=mongodb-admin'
          - '--password=linuxfabrik'
          - '--authenticationDatabase=admin'
          - '--eval=print(JSON.stringify({
              version: db.version(),
              fcv: db.adminCommand({getParameter: 1, featureCompatibilityVersion: 1}).featureCompatibilityVersion.version,
              documents: db.getSiblingDB("molecule").test.countDocuments({source: "before-upgrade"}),
              state: rs.status().myState,
              commit_interval_ms: db.adminCommand({getCmdLineOpts: 1}).parsed.storage.journal.commitIntervalMs,
            }))'
      register: '__molecule__mongodb_state_result'
      changed_when: false

    - name: 'Assert that mongod runs 8.0 with FCV 8.0 as primary with its configuration and kept its data'
      ansible.builtin.assert:
        that:
          - '__molecule__mongodb_state["version"].startswith("8.0.")'
          - '__molecule__mongodb_state["fcv"] == "8.0"'
          - '__molecule__mongodb_state["documents"] == 1'
          - '__molecule__mongodb_state["state"] == 1' # PRIMARY
          - '__molecule__mongodb_state["commit_interval_ms"] == 200'
        fail_msg: '{{ __molecule__mongodb_state | to_json }}'
      vars:
        __molecule__mongodb_state: '{{ __molecule__mongodb_state_result["stdout"] | from_json }}'

    # mongod checks the kernel once at startup and logs what it would like differently, with the
    # ids 9068900 (transparent hugepages and their defrag), 8640302 (khugepaged/max_ptes_none) and
    # 8386700 (vm.swappiness). Verified with 8.0.38 on Rocky 9.
    - name: 'mongosh --eval db.adminCommand({getLog: "startupWarnings"})'
      ansible.builtin.command:
        argv:
          - 'mongosh'
          - '--quiet'
          - '--username=mongodb-admin'
          - '--password=linuxfabrik'
          - '--authenticationDatabase=admin'
          - '--eval=print(JSON.stringify(db.adminCommand({getLog: "startupWarnings"}).log.map(l => JSON.parse(l))))'
      register: '__molecule__mongodb_startup_warnings_result'
      changed_when: false

    - name: 'Assert that mongod has no startup warnings about the kernel settings'
      ansible.builtin.assert:
        that: '__molecule__mongodb_kernel_warnings | length == 0'
        fail_msg: '{{ __molecule__mongodb_kernel_warnings | to_json }}'
      vars:
        __molecule__mongodb_kernel_warnings: '{{
            __molecule__mongodb_startup_warnings_result["stdout"] | from_json
            | selectattr("id", "in", [9068900, 8640302, 8386700])
            | list
          }}'
