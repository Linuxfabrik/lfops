mongodb__admin_user:
  username: 'mongodb-admin'
  password: 'linuxfabrik'

mongodb__conf_security_authorization: true

# Locks the instance as the dump user, so this checks the privileges the role grants it.
mongodb__dump_method_file_based: true

# The special characters check that the login escapes the password correctly for both
# mongodump and mongosh. verify.yml searches /etc for the marker `MoleculeDumpPw`.
mongodb__dump_user:
  username: 'mongodb-dump'
  password: 'MoleculeDumpPw"fab\rik #''x:@/%'

# A regular user, so that the idempotence step also covers the user loop.
mongodb__users__group_var:
  - username: 'molecule-app'
    password: 'linuxfabrik'
    database: 'molecule'
    roles: 'readWrite'

# The newest series; host_vars/ keeps 8.0 on one host per OS family.
repo_mongodb__version: '9.0'
