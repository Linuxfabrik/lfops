# verify.yml runs after converge and again after the idempotence step. It asserts what only the
# running site can confirm, mostly through the same Apache httpd -> PHP-FPM -> WordPress path a
# visitor takes: that WordPress uses the configured address, plugins and theme, that a login works
# and hands out a Secure cookie, and that the hardening of the vHost, of the proxy handling and of
# wp-config.php holds against real requests.
- name: 'Verify WordPress serves the site with the configured settings'
  hosts: 'systems_under_test'
  gather_facts: true
  become: true

  vars:
    __molecule__wordpress_dir: '/var/www/html/{{ __molecule__wordpress_host }}'
    __molecule__wordpress_host: '{{ wordpress__url | urlsplit("hostname") }}'
    # the URLs of the instances converge.yml deploys; the names of their systemd units and their
    # installation directories are derived from them the way the role does
    __molecule__wordpress_instances:
      - '{{ wordpress__url }}'
      - 'https://wordpress.example.com/blog'
      - 'https://second.example.com/instance1'
      - 'https://second.example.com/instance2'

  tasks:

    # WordPress itself, asked through WP-CLI as the web server user

    - name: 'wp option get home'
      ansible.builtin.command: '/usr/local/bin/wp option get home --path={{ __molecule__wordpress_dir }}'
      args:
        chdir: '{{ __molecule__wordpress_dir }}'
      become_user: 'apache'
      register: '__molecule__wordpress_home_result'
      changed_when: false

    - name: 'Assert WordPress uses wordpress__url as its address'
      ansible.builtin.assert:
        that: '__molecule__wordpress_home_result["stdout"] == wordpress__url'
        fail_msg: 'home is "{{ __molecule__wordpress_home_result["stdout"] }}", expected "{{ wordpress__url }}"'

    - name: 'wp plugin list --status=active --field=name'
      ansible.builtin.command: '/usr/local/bin/wp plugin list --status=active --field=name --path={{ __molecule__wordpress_dir }}'
      args:
        chdir: '{{ __molecule__wordpress_dir }}'
      become_user: 'apache'
      register: '__molecule__wordpress_plugins_result'
      changed_when: false

    - name: 'wp theme list --status=active --field=name'
      ansible.builtin.command: '/usr/local/bin/wp theme list --status=active --field=name --path={{ __molecule__wordpress_dir }}'
      args:
        chdir: '{{ __molecule__wordpress_dir }}'
      become_user: 'apache'
      register: '__molecule__wordpress_theme_result'
      changed_when: false

    - name: 'Assert the configured plugins and theme are active'
      ansible.builtin.assert:
        that:
          - '"disable-wp-rest-api" in __molecule__wordpress_plugins_result["stdout_lines"]'
          - '"disable-json-api" not in __molecule__wordpress_plugins_result["stdout_lines"]'
          - '"hello-dolly" in __molecule__wordpress_plugins_result["stdout_lines"]'
          - '"akismet" not in __molecule__wordpress_plugins_result["stdout_lines"]'
          - '__molecule__wordpress_theme_result["stdout_lines"] == [wordpress__theme]'
        fail_msg: 'active plugins: {{ __molecule__wordpress_plugins_result["stdout_lines"] }}, active theme: {{ __molecule__wordpress_theme_result["stdout_lines"] }}'

    # --url sets HTTPS for WP-CLI, which application passwords require before any filter applies
    - name: 'wp eval wp_is_application_passwords_available()'
      ansible.builtin.command:
        argv:
          - '/usr/local/bin/wp'
          - 'eval'
          - 'echo wp_is_application_passwords_available() ? "available" : "unavailable";'
          - '--url={{ wordpress__url }}'
          - '--path={{ __molecule__wordpress_dir }}'
        chdir: '{{ __molecule__wordpress_dir }}'
      become_user: 'apache'
      register: '__molecule__wordpress_app_passwords_result'
      changed_when: false

    - name: 'Assert application passwords are switched off'
      ansible.builtin.assert:
        that: '__molecule__wordpress_app_passwords_result["stdout"] == "unavailable"'
        fail_msg: 'application passwords are {{ __molecule__wordpress_app_passwords_result["stdout"] }}'

    # The web server may write wp-content, but not the core or the must-use plugins. Asked with
    # test -w as apache, which is what PHP-FPM runs as. Checked for every instance, since the file
    # policy of the instance at the root of wordpress.example.com also walks the one in /blog.
    - name: 'runuser --user=apache -- test -w <path>'
      ansible.builtin.command:
        argv:
          - 'runuser'
          - '--user=apache'
          - '--'
          - 'test'
          - '-w'
          - '/var/www/html/{{ item[0] | urlsplit("hostname") }}{{ item[0] | urlsplit("path") }}/{{ item[1] }}'
      register: '__molecule__wordpress_writable_result'
      changed_when: false
      failed_when: false
      loop: '{{ __molecule__wordpress_instances | product(__molecule__wordpress_writable_paths) | list }}'
      loop_control:
        label: '{{ item[0] }}/{{ item[1] }}'
      vars:
        __molecule__wordpress_writable_paths:
          - 'index.php'
          - 'wp-config.php'
          - 'wp-content/mu-plugins'
          - 'wp-content/plugins'
          - 'wp-includes/version.php'

    - name: 'Assert apache can write wp-content/plugins only'
      ansible.builtin.assert:
        that: '(item["rc"] == 0) == (item["item"][1] == "wp-content/plugins")'
        fail_msg: '{{ item["item"][0] }}/{{ item["item"][1] }} is {{ (item["rc"] == 0) | ternary("", "not ") }}writable for apache'
      loop: '{{ __molecule__wordpress_writable_result["results"] }}'
      loop_control:
        label: '{{ item["item"][0] }}/{{ item["item"][1] }}'

    # WordPress only installs plugins from the web interface without asking for FTP credentials
    # if it writes files directly, which FS_METHOD forces while its own files belong to root
    - name: 'wp eval get_filesystem_method()'
      ansible.builtin.command:
        argv:
          - '/usr/local/bin/wp'
          - 'eval'
          - 'require_once ABSPATH . "wp-admin/includes/file.php"; echo get_filesystem_method();'
          - '--path={{ __molecule__wordpress_dir }}'
        chdir: '{{ __molecule__wordpress_dir }}'
      become_user: 'apache'
      register: '__molecule__wordpress_fs_method_result'
      changed_when: false

    - name: 'Assert WordPress writes plugins and themes directly'
      ansible.builtin.assert:
        that: '__molecule__wordpress_fs_method_result["stdout"] == "direct"'
        fail_msg: 'get_filesystem_method() returns {{ __molecule__wordpress_fs_method_result["stdout"] }}'

    # second.example.com/instance2 is installed with an older 7.0 release. Its minor update has
    # to be served by PHP-FPM right away, although OPcache would keep the cached version.php for
    # opcache.revalidate_freq (60) seconds without the reload in the update script. A probe that
    # includes version.php is requested once before the update, so that the old version.php is in
    # the cache. On the second verify run, the instance is already updated and the versions before
    # and after are equal.
    - name: 'Run a minor update of second.example.com/instance2 and check what PHP-FPM serves'
      vars:
        __molecule__wordpress_minor_dir: '/var/www/html/second.example.com/instance2'
      block:

        - name: 'Deploy {{ __molecule__wordpress_minor_dir }}/molecule-version.php'
          ansible.builtin.copy:
            content: "<?php include __DIR__ . '/wp-includes/version.php'; echo $wp_version;\n"
            dest: '{{ __molecule__wordpress_minor_dir }}/molecule-version.php'
            owner: 'root'
            group: 'root'
            mode: 0o644

        - name: 'wp core version --path={{ __molecule__wordpress_minor_dir }} # before the update'
          ansible.builtin.command: '/usr/local/bin/wp core version --path={{ __molecule__wordpress_minor_dir }} --allow-root'
          register: '__molecule__wordpress_minor_before_result'
          changed_when: false

        - name: 'GET /instance2/molecule-version.php before the update'
          ansible.builtin.uri:
            url: 'http://127.0.0.1/instance2/molecule-version.php'
            headers:
              Host: 'second.example.com'
            return_content: true
          register: '__molecule__wordpress_minor_served_before_result'

        - name: 'systemctl start wordpress-core-minor-update-second.example.com-instance2.service'
          ansible.builtin.command: 'systemctl start wordpress-core-minor-update-second.example.com-instance2.service'
          changed_when: false

        - name: 'wp core version --path={{ __molecule__wordpress_minor_dir }} # after the update'
          ansible.builtin.command: '/usr/local/bin/wp core version --path={{ __molecule__wordpress_minor_dir }} --allow-root'
          register: '__molecule__wordpress_minor_after_result'
          changed_when: false

        - name: 'GET /instance2/molecule-version.php after the update'
          ansible.builtin.uri:
            url: 'http://127.0.0.1/instance2/molecule-version.php'
            headers:
              Host: 'second.example.com'
            return_content: true
          register: '__molecule__wordpress_minor_served_after_result'

        - name: 'Assert the minor update happened and PHP-FPM serves the new version at once'
          ansible.builtin.assert:
            that:
              - '__molecule__wordpress_minor_after_result["stdout"] is version("7.0.3", ">")'
              - '__molecule__wordpress_minor_after_result["stdout"] is version("7.1", "<")'
              - '__molecule__wordpress_minor_served_before_result["content"] == __molecule__wordpress_minor_before_result["stdout"]'
              - '__molecule__wordpress_minor_served_after_result["content"] == __molecule__wordpress_minor_after_result["stdout"]'
            fail_msg: 'files: {{ __molecule__wordpress_minor_before_result["stdout"] }} -> {{ __molecule__wordpress_minor_after_result["stdout"] }}, served by PHP-FPM: {{ __molecule__wordpress_minor_served_before_result["content"] }} -> {{ __molecule__wordpress_minor_served_after_result["content"] }}'

      always:

        - name: 'rm -f {{ __molecule__wordpress_minor_dir }}/molecule-version.php'
          ansible.builtin.file:
            path: '{{ __molecule__wordpress_minor_dir }}/molecule-version.php'
            state: 'absent'

    # The other installations are at the latest release, so the service has nothing to install,
    # but it runs the check as apache and exits cleanly.
    - name: 'systemctl start wordpress-core-minor-update-<instance>.service'
      ansible.builtin.command: 'systemctl start wordpress-core-minor-update-{{ item | urlsplit("hostname") }}{{ item | urlsplit("path") | replace("/", "-") }}.service'
      changed_when: false
      loop: '{{ __molecule__wordpress_instances }}'

    # The cron service requests wp-cron.php through the vHost; an instance in a sub-path needs the
    # request under its path, which the access log of the host name shows.
    - name: 'systemctl start wordpress-cron-<instance>.service'
      ansible.builtin.command: 'systemctl start wordpress-cron-{{ item | urlsplit("hostname") }}{{ item | urlsplit("path") | replace("/", "-") }}.service'
      changed_when: false
      loop: '{{ __molecule__wordpress_instances }}'

    - name: 'grep "GET <path>/wp-cron.php HTTP/1.1" 200 /var/log/httpd/<host>-access.log'
      ansible.builtin.command:
        argv:
          - 'grep'
          - '--count'
          - '--fixed-strings'
          - '"GET {{ item | urlsplit("path") }}/wp-cron.php HTTP/1.1" 200 '
          - '/var/log/httpd/{{ item | urlsplit("hostname") }}-access.log'
      changed_when: false
      loop: '{{ __molecule__wordpress_instances }}'

    # converge.yml deploys further instances on the same host, as pseudo hosts in the inventory
    # would. Each instance needs its own timers, and none may replace another's.
    - name: 'systemctl is-enabled <timer>'
      ansible.builtin.command: 'systemctl is-enabled {{ item }}'
      register: '__molecule__wordpress_timers_result'
      changed_when: false
      failed_when: false
      loop: '{{ __molecule__wordpress_instance_names | map("regex_replace", "^", "wordpress-cron-") | map("regex_replace", "$", ".timer") | list
        + __molecule__wordpress_instance_names | map("regex_replace", "^", "wordpress-core-minor-update-") | map("regex_replace", "$", ".timer") | list
        + ["wordpress-cron.timer"] }}'
      vars:
        __molecule__wordpress_instance_names: '{{ __molecule__wordpress_instances | map("urlsplit", "hostname") | zip(__molecule__wordpress_instances | map("urlsplit", "path") | map("replace", "/", "-")) | map("join") | list }}'

    - name: 'Assert every instance has its timers enabled, and the timer without an instance name is gone'
      ansible.builtin.assert:
        # systemd before 250 prints nothing for a unit that does not exist
        that: '(item["item"] == "wordpress-cron.timer") | ternary(item["rc"] != 0, item["stdout"] == "enabled")'
        fail_msg: '{{ item["item"] }} is {{ item["stdout"] }}'
      loop: '{{ __molecule__wordpress_timers_result["results"] }}'
      loop_control:
        label: '{{ item["item"] }}'

    # WordPress redirects a request for another address to its own, so a 200 with the links of
    # the instance shows that its own installation answered
    - name: 'GET <path>/ of each instance'
      ansible.builtin.uri:
        url: 'http://127.0.0.1{{ item | urlsplit("path") }}/'
        headers:
          Host: '{{ item | urlsplit("hostname") }}'
          X-Forwarded-Proto: 'https'
        follow_redirects: 'none'
        status_code: 200
        return_content: true
      register: '__molecule__wordpress_instances_http_result'
      loop: '{{ __molecule__wordpress_instances }}'

    - name: 'wp option get home of each instance'
      ansible.builtin.command: '/usr/local/bin/wp option get home --path=/var/www/html/{{ item | urlsplit("hostname") }}{{ item | urlsplit("path") }}'
      args:
        chdir: '/var/www/html/{{ item | urlsplit("hostname") }}{{ item | urlsplit("path") }}'
      become_user: 'apache'
      register: '__molecule__wordpress_instances_home_result'
      changed_when: false
      loop: '{{ __molecule__wordpress_instances }}'

    - name: 'Assert each instance is served from its own installation and uses its own address'
      ansible.builtin.assert:
        that:
          - 'item["stdout"] == item["item"]'
          - '(item["item"] ~ "/") in (__molecule__wordpress_instances_http_result["results"] | selectattr("item", "eq", item["item"]) | first)["content"]'
        fail_msg: '{{ item["item"] }}: home is {{ item["stdout"] }}'
      loop: '{{ __molecule__wordpress_instances_home_result["results"] }}'
      loop_control:
        label: '{{ item["item"] }}'

    # one vHost per host name, shared by the instances under it
    - name: 'stat /etc/httpd/sites-available/<vHost file>'
      ansible.builtin.stat:
        path: '/etc/httpd/sites-available/{{ item }}'
      register: '__molecule__wordpress_vhost_files_result'
      loop: '{{ __molecule__wordpress_instances | map("urlsplit", "hostname") | unique | map("regex_replace", "$", ".80.conf") | list + ["wordpress.conf"] }}'

    - name: 'Assert each host name has its own vHost file'
      ansible.builtin.assert:
        that: 'item["stat"]["exists"] == (item["item"] != "wordpress.conf")'
        fail_msg: '{{ item["item"] }} {{ item["stat"]["exists"] | ternary("exists", "is missing") }}'
      loop: '{{ __molecule__wordpress_vhost_files_result["results"] }}'
      loop_control:
        label: '{{ item["item"] }}'

    # The site over HTTP, requested like the reverse proxy in front of it would pass it on

    # Disable WP REST API answers anonymous REST requests with rest_login_required
    - name: 'GET /?rest_route=/wp/v2/users without a login'
      ansible.builtin.uri:
        url: 'http://127.0.0.1/?rest_route=/wp/v2/users'
        headers:
          Host: '{{ __molecule__wordpress_host }}'
          X-Forwarded-Proto: 'https'
        status_code: 401
        return_content: true
      register: '__molecule__wordpress_rest_anonymous_result'

    - name: 'Assert the REST API refuses anonymous visitors'
      ansible.builtin.assert:
        that: '"rest_login_required" in __molecule__wordpress_rest_anonymous_result["content"]'
        fail_msg: 'the REST API answered: {{ __molecule__wordpress_rest_anonymous_result["content"] }}'

    - name: 'GET / (X-Forwarded-Proto: https)'
      ansible.builtin.uri:
        url: 'http://127.0.0.1/'
        headers:
          Host: '{{ __molecule__wordpress_host }}'
          X-Forwarded-Proto: 'https'
      register: '__molecule__wordpress_front_page_result'

    - name: 'Assert the vHost adds its security headers'
      ansible.builtin.assert:
        that:
          - '__molecule__wordpress_front_page_result["referrer_policy"] | d("") == "strict-origin-when-cross-origin"'
          - '__molecule__wordpress_front_page_result["x_content_type_options"] | d("") == "nosniff"'
        fail_msg: 'Referrer-Policy: {{ __molecule__wordpress_front_page_result["referrer_policy"] | d("missing") }}, X-Content-Type-Options: {{ __molecule__wordpress_front_page_result["x_content_type_options"] | d("missing") }}'

    - name: 'GET /wp-login.php over plain HTTP'
      ansible.builtin.uri:
        url: 'http://127.0.0.1/wp-login.php'
        headers:
          Host: '{{ __molecule__wordpress_host }}'
        follow_redirects: 'none'
        status_code: 302
      register: '__molecule__wordpress_login_http_result'

    - name: 'Assert the login is redirected to HTTPS'
      ansible.builtin.assert:
        that: '__molecule__wordpress_login_http_result["location"] is match("https://")'
        fail_msg: 'the login redirects to {{ __molecule__wordpress_login_http_result["location"] }}'

    # WordPress hands out its login cookie only when the test cookie comes back with the form. It
    # marks the front-end cookie Secure only if home is an https URL, which is the point here.
    - name: 'POST /wp-login.php with {{ item["label"] }}'
      ansible.builtin.command:
        argv:
          - 'curl'
          - '--silent'
          - '--output'
          - '/dev/null'
          - '--dump-header'
          - '-'
          - '--header'
          - 'Host: {{ __molecule__wordpress_host }}'
          - '--header'
          - 'X-Forwarded-Proto: https'
          - '--cookie'
          - 'wordpress_test_cookie=WP%20Cookie%20check'
          - '--data-urlencode'
          - 'log={{ wordpress__admin_user["username"] }}'
          - '--data-urlencode'
          - 'pwd={{ item["password"] }}'
          - '--data-urlencode'
          - 'testcookie=1'
          - 'http://127.0.0.1/wp-login.php'
      register: '__molecule__wordpress_login_result'
      changed_when: false
      loop:
        - label: 'the admin credentials'
          password: '{{ wordpress__admin_user["password"] }}'
        - label: 'a wrong password'
          password: 'molecule-wrong-password'
      loop_control:
        label: '{{ item["label"] }}'

    # A failed login answers 200 with the form again, which is what the fail2ban wordpress-login
    # filter counts.
    - name: 'Assert the login succeeds with a Secure cookie and fails with the form again'
      ansible.builtin.assert:
        that:
          - '__molecule__wordpress_login_result["results"][0]["stdout"] is search("(?im)^HTTP/[^ ]+ 302")'
          - '__molecule__wordpress_login_result["results"][0]["stdout"] is search("(?im)^set-cookie: wordpress_logged_in_.*; secure")'
          - '__molecule__wordpress_login_result["results"][1]["stdout"] is search("(?im)^HTTP/[^ ]+ 200")'
          - '__molecule__wordpress_login_result["results"][1]["stdout"] is not search("(?im)^set-cookie: wordpress_logged_in_")'
        fail_msg: 'successful login: {{ __molecule__wordpress_login_result["results"][0]["stdout"] }} failed login: {{ __molecule__wordpress_login_result["results"][1]["stdout"] }}'

    - name: 'GET /wp-includes/images/w-logo-blue.png with the referer {{ item["referer"] }}'
      ansible.builtin.uri:
        url: 'http://127.0.0.1/wp-includes/images/w-logo-blue.png'
        headers:
          Host: '{{ __molecule__wordpress_host }}'
          Referer: '{{ item["referer"] }}'
        status_code: '{{ item["status"] }}'
      loop:
        - referer: '{{ wordpress__url }}/'
          status: 200
        - referer: 'https://hotlinker.example.net/'
          status: 403

    - name: 'GET <path>/wp-includes/version.php of each instance'
      ansible.builtin.uri:
        url: 'http://127.0.0.1{{ item | urlsplit("path") }}/wp-includes/version.php'
        headers:
          Host: '{{ item | urlsplit("hostname") }}'
        status_code: 403
      loop: '{{ __molecule__wordpress_instances }}'

    # PHP files of our own: one where uploads land, one that loads WordPress and prints what the
    # wp-config.php proxy handling made of the request. Both are removed again, so the idempotence
    # step sees the installation as the role left it. The upload probe runs at the root of a host
    # name and in a sub-path of one without a root instance, whose document root differs from the
    # installation directory.
    - name: 'Probe the upload directory and the proxy handling'
      vars:
        __molecule__wordpress_upload_dirs: '{{ __molecule__wordpress_upload_probe_instances | map("urlsplit", "hostname") | map("regex_replace", "^", "/var/www/html/") | zip(__molecule__wordpress_upload_probe_instances | map("urlsplit", "path")) | map("join") | list }}'
        __molecule__wordpress_upload_probe_instances:
          - '{{ wordpress__url }}'
          - 'https://second.example.com/instance1'
      block:

        - name: 'stat <installation>/wp-content/uploads'
          ansible.builtin.stat:
            path: '{{ item }}/wp-content/uploads'
          register: '__molecule__wordpress_uploads_stat_result'
          loop: '{{ __molecule__wordpress_upload_dirs }}'

        - name: 'mkdir -p <installation>/wp-content/uploads/molecule'
          ansible.builtin.file:
            path: '{{ item }}/wp-content/uploads/molecule'
            state: 'directory'
            owner: 'apache'
            group: 'apache'
            mode: 0o755
          loop: '{{ __molecule__wordpress_upload_dirs }}'

        - name: 'Deploy the PHP probes'
          ansible.builtin.copy:
            content: '{{ item["content"] }}'
            dest: '{{ item["dest"] }}'
            owner: 'apache'
            group: 'apache'
            mode: 0o644
          loop:
            - dest: '{{ __molecule__wordpress_upload_dirs[0] }}/wp-content/uploads/molecule/molecule.php'
              content: "<?php echo 'molecule-upload-executed';\n"
            - dest: '{{ __molecule__wordpress_upload_dirs[1] }}/wp-content/uploads/molecule/molecule.php'
              content: "<?php echo 'molecule-upload-executed';\n"
            - dest: '{{ __molecule__wordpress_dir }}/molecule-request.php'
              content: "<?php require __DIR__ . '/wp-load.php'; echo $_SERVER['REMOTE_ADDR'] . ' ' . $_SERVER['HTTP_HOST'];\n"
          loop_control:
            label: '{{ item["dest"] }}'

        - name: 'GET <path>/wp-content/uploads/molecule/molecule.php'
          ansible.builtin.uri:
            url: 'http://127.0.0.1{{ item | urlsplit("path") }}/wp-content/uploads/molecule/molecule.php'
            headers:
              Host: '{{ item | urlsplit("hostname") }}'
            status_code: 403
            return_content: true
          register: '__molecule__wordpress_upload_php_result'
          loop: '{{ __molecule__wordpress_upload_probe_instances }}'

        - name: 'Assert the PHP file below uploads did not run'
          ansible.builtin.assert:
            that: '"molecule-upload-executed" not in item["content"]'
            fail_msg: '{{ item["item"] }}: {{ item["content"] }}'
          loop: '{{ __molecule__wordpress_upload_php_result["results"] }}'
          loop_control:
            label: '{{ item["item"] }}'

        # 127.0.0.1 is in wordpress__trusted_proxies, so the right-most address of X-Forwarded-For
        # that is not a trusted proxy itself becomes the client, and X-Forwarded-Host is ignored.
        - name: 'GET /molecule-request.php from the trusted proxy address'
          ansible.builtin.uri:
            url: 'http://127.0.0.1/molecule-request.php'
            headers:
              Host: '{{ __molecule__wordpress_host }}'
              X-Forwarded-For: '203.0.113.9, 198.51.100.7'
              X-Forwarded-Host: 'forged.example.net'
            return_content: true
          register: '__molecule__wordpress_request_trusted_result'

        # The VM's own address is not trusted, so X-Forwarded-For has to be ignored.
        - name: 'GET /molecule-request.php from an untrusted address'
          ansible.builtin.uri:
            url: 'http://{{ ansible_facts["default_ipv4"]["address"] }}/molecule-request.php'
            headers:
              Host: '{{ __molecule__wordpress_host }}'
              X-Forwarded-For: '203.0.113.9'
            return_content: true
          register: '__molecule__wordpress_request_untrusted_result'

        - name: 'Assert X-Forwarded-For is honoured only from the trusted proxy'
          ansible.builtin.assert:
            that:
              - '__molecule__wordpress_request_trusted_result["content"] == "198.51.100.7 " ~ __molecule__wordpress_host'
              - '__molecule__wordpress_request_untrusted_result["content"] == ansible_facts["default_ipv4"]["address"] ~ " " ~ __molecule__wordpress_host'
            fail_msg: 'from the proxy: "{{ __molecule__wordpress_request_trusted_result["content"] }}", from elsewhere: "{{ __molecule__wordpress_request_untrusted_result["content"] }}"'

      always:

        - name: 'Remove the PHP probes'
          ansible.builtin.file:
            path: '{{ item }}'
            state: 'absent'
          loop: '{{ [__molecule__wordpress_dir ~ "/molecule-request.php"]
            + __molecule__wordpress_upload_dirs | map("regex_replace", "$", "/wp-content/uploads/molecule") | list }}'

        - name: 'Remove the upload directory the probe created'
          ansible.builtin.file:
            path: '{{ item["item"] }}/wp-content/uploads'
            state: 'absent'
          loop: '{{ __molecule__wordpress_uploads_stat_result["results"] | d([]) }}'
          loop_control:
            label: '{{ item["item"] }}'
          when:
            - 'not item["stat"]["exists"] | d(true)'

    # wp-config.php holds the database password. The site working at all shows that PHP-FPM can
    # read it, this shows that other local users cannot.
    - name: 'Read wp-config.php as nobody'
      ansible.builtin.command: 'runuser --user=nobody -- cat {{ __molecule__wordpress_dir }}/wp-config.php'
      register: '__molecule__wordpress_config_nobody_result'
      changed_when: false
      failed_when: false

    - name: 'Assert other local users cannot read wp-config.php'
      ansible.builtin.assert:
        that:
          - '__molecule__wordpress_config_nobody_result["rc"] != 0'
          - '"Permission denied" in __molecule__wordpress_config_nobody_result["stderr"]'
        fail_msg: 'nobody read wp-config.php: rc={{ __molecule__wordpress_config_nobody_result["rc"] }}, {{ __molecule__wordpress_config_nobody_result["stderr"] }}'
