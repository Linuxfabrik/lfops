# Running a plugin instead of stat-ing it proves the deployed payload executes and its bundled
# runtime resolves, which a stat cannot tell you. Asking the package database for the installed
# version proves the other half: the version the scenario pinned in group_vars is what landed on
# the host. The package has to come from the Linuxfabrik repository, while nothing of the former
# repository at repo.linuxfabrik.ch/monitoring-plugins/ may be left.
- name: 'Verify the monitoring plugins are installed and usable'
  hosts: 'systems_under_test'
  gather_facts: true
  tasks:
    - name: '/usr/lib64/nagios/plugins/about-me'
      ansible.builtin.command: '/usr/lib64/nagios/plugins/about-me'
      changed_when: false
      register: '__molecule__about_me_result'

    - name: 'Assert that the about-me plugin runs'
      ansible.builtin.assert:
        that: '__molecule__about_me_result["rc"] == 0'
        fail_msg: '{{ __molecule__about_me_result["stdout"] }}'

    - name: 'Gather the package facts'
      ansible.builtin.package_facts:  # yamllint disable-line rule:empty-values

    # Prefix match: the deb version carries a packaging suffix (5.0.0-1), the rpm version does not.
    - name: 'Assert that the configured monitoring plugins version is installed'
      ansible.builtin.assert:
        that:
          - '"linuxfabrik-monitoring-plugins" in ansible_facts["packages"]'
          - 'ansible_facts["packages"]["linuxfabrik-monitoring-plugins"][0]["version"].startswith(monitoring_plugins__version)'

    - name: 'dnf repoquery --installed --queryformat %{from_repo} linuxfabrik-monitoring-plugins'
      ansible.builtin.command: >-
        dnf repoquery --installed --quiet --queryformat '%{from_repo}'
        linuxfabrik-monitoring-plugins
      register: '__molecule__from_repo_result'
      changed_when: false
      when:
        - 'ansible_facts["os_family"] == "RedHat"'

    - name: 'Assert that the package was installed from the Linuxfabrik repository'
      ansible.builtin.assert:
        that:
          - '__molecule__from_repo_result["stdout"] | trim in ["linuxfabrik", "linuxfabrik-testing"]'
        fail_msg: 'installed from: {{ __molecule__from_repo_result["stdout"] }}'
      when:
        - 'ansible_facts["os_family"] == "RedHat"'

    # madison lists every repository that offers a version; the installed one has to be among the
    # versions the Linuxfabrik repository offers.
    - name: 'apt-cache madison linuxfabrik-monitoring-plugins'
      ansible.builtin.command: 'apt-cache madison linuxfabrik-monitoring-plugins'
      register: '__molecule__madison_result'
      changed_when: false
      when:
        - 'ansible_facts["os_family"] == "Debian"'

    - name: 'Assert that the package was installed from the Linuxfabrik repository'
      ansible.builtin.assert:
        that:
          - >-
            __molecule__madison_result["stdout_lines"]
            | select("search", "[|] " ~ (ansible_facts["packages"]["linuxfabrik-monitoring-plugins"][0]["version"] | regex_escape) ~ " [|]")
            | select("search", "repo[.]linuxfabrik[.]ch/(debian|ubuntu)/linuxfabrik ")
            | list | length > 0
        fail_msg: '{{ __molecule__madison_result["stdout"] }}'
      when:
        - 'ansible_facts["os_family"] == "Debian"'

    - name: 'Find the files of the former repository'
      ansible.builtin.find:
        paths:
          - '/etc/apt/keyrings'
          - '/etc/apt/sources.list.d'
          - '/etc/yum.repos.d'
        patterns:
          - 'linuxfabrik-monitoring-plugins*'
          - 'linuxfabrik.asc'
      register: '__molecule__former_repo_files'

    - name: 'Assert that nothing of the former repository is left'
      ansible.builtin.assert:
        that:
          - '__molecule__former_repo_files["files"] | length == 0'
        fail_msg: '{{ __molecule__former_repo_files["files"] | map(attribute="path") | join(", ") }}'

    # converge.yml left a stale icon owned by uid 1000. The role has to replace its content and
    # hand it and all other icons to root, while the idempotence step proves that a second run
    # leaves the icons alone, which rewrote all of them before.
    - name: 'find /usr/share/icingaweb2/public/img/icons -name *.svg'
      ansible.builtin.find:
        paths: '/usr/share/icingaweb2/public/img/icons'
        patterns: '*.svg'
      register: '__molecule__icons_result'

    - name: 'cat /usr/share/icingaweb2/public/img/icons/cpu-usage.svg'
      ansible.builtin.command: 'cat /usr/share/icingaweb2/public/img/icons/cpu-usage.svg'
      changed_when: false
      register: '__molecule__cpu_usage_icon_result'

    - name: 'Assert that the icons are deployed, owned by root and readable for the web server'
      ansible.builtin.assert:
        that:
          - '__molecule__icons_result["matched"] > 100'
          - '__molecule__icons_result["files"] | map(attribute="uid") | unique == [0]'
          - '__molecule__icons_result["files"] | map(attribute="gid") | unique == [0]'
          - '__molecule__icons_result["files"] | map(attribute="mode") | unique == ["0644"]'
          - '"<svg" in __molecule__cpu_usage_icon_result["stdout"]'
        fail_msg: >-
          {{ __molecule__icons_result["files"]
            | rejectattr("uid", "eq", 0) | map(attribute="path") | list }}

    # The lock pins exactly the installed version, and each package once.
    - name: 'dnf versionlock list'
      ansible.builtin.command: 'dnf versionlock list'
      changed_when: false
      register: '__molecule__versionlock_list_result'
      when:
        - 'ansible_facts["pkg_mgr"] == "dnf"'

    - name: 'Assert that the versionlock pins the installed packages once each'
      ansible.builtin.assert:
        that:
          - >-
            __molecule__versionlock_list_result["stdout_lines"]
            | select("match", "linuxfabrik-monitoring-plugins-0:")
            | list
            == ["linuxfabrik-monitoring-plugins-0:" ~ ansible_facts["packages"]["linuxfabrik-monitoring-plugins"][0]["version"] ~ "-" ~ ansible_facts["packages"]["linuxfabrik-monitoring-plugins"][0]["release"] ~ ".*"]
          - >-
            __molecule__versionlock_list_result["stdout_lines"]
            | select("match", "linuxfabrik-monitoring-plugins-selinux-0:")
            | list | length == 1
        fail_msg: '{{ __molecule__versionlock_list_result["stdout_lines"] }}'
      when:
        - 'ansible_facts["pkg_mgr"] == "dnf"'

    # Molecule runs this verify after the converge and again after the idempotence step. The first
    # run records the checksum and inode of versionlock.list, the second one compares them: lifting
    # and setting the lock again on every run rewrote the file, which AIDE reported.
    - name: 'stat /etc/dnf/plugins/versionlock.list'
      ansible.builtin.stat:
        path: '/etc/dnf/plugins/versionlock.list'
      register: '__molecule__versionlock_file_result'
      when:
        - 'ansible_facts["pkg_mgr"] == "dnf"'

    - name: 'Record the checksum and inode of versionlock.list from the first verify'
      ansible.builtin.copy:
        content: '{{ __molecule__versionlock_file_result["stat"]["checksum"] }} {{ __molecule__versionlock_file_result["stat"]["inode"] }}'
        dest: '/var/tmp/molecule-versionlock.list.stat'
        force: false
        mode: 0o644
      register: '__molecule__versionlock_record_result'
      when:
        - 'ansible_facts["pkg_mgr"] == "dnf"'

    - name: 'cat /var/tmp/molecule-versionlock.list.stat'
      ansible.builtin.command: 'cat /var/tmp/molecule-versionlock.list.stat'
      changed_when: false
      register: '__molecule__versionlock_recorded_result'
      when:
        - 'ansible_facts["pkg_mgr"] == "dnf"'

    - name: 'Assert that the run after the first verify left versionlock.list alone'
      ansible.builtin.assert:
        that:
          - '__molecule__versionlock_recorded_result["stdout"] == __molecule__versionlock_file_result["stat"]["checksum"] ~ " " ~ __molecule__versionlock_file_result["stat"]["inode"]'
        fail_msg: 'recorded: {{ __molecule__versionlock_recorded_result["stdout"] }}'
      when:
        - 'ansible_facts["pkg_mgr"] == "dnf"'
