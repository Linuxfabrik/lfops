# yamllint disable rule:empty-values

# apache_tomcat targets 'lfops_apache_tomcat' (see playbooks/apache_tomcat.yml: hosts).
#
# RHEL 8 and 9 install Tomcat 9.0 from AppStream, RHEL 10 installs Tomcat 10.1, so this host list
# covers every configuration template set the role ships. Debian and Ubuntu are not supported by
# the role (see COMPATIBILITY.md).
lfops_apache_tomcat:
  children:
    systems_under_test:

systems_under_test:
  hosts:
    rocky8-vm:
    rocky9-vm:
    rocky10-vm:
