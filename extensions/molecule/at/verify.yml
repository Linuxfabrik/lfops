- name: 'Verify the at role runs atd'
  hosts: 'systems_under_test'
  gather_facts: false
  tasks:

    - name: 'systemctl is-active / is-enabled atd.service' # noqa command-instead-of-module (read-only state query)
      ansible.builtin.command: 'systemctl {{ item }} atd.service'
      loop:
        - 'is-active'
        - 'is-enabled'
      register: '__molecule__atd_state_result'
      changed_when: false
      failed_when: false

    - name: 'Assert that atd.service is running and enabled'
      ansible.builtin.assert:
        that: 'item["stdout"] in ["active", "enabled"]'
      loop: '{{ __molecule__atd_state_result["results"] }}'
      loop_control:
        label: '{{ item["item"] }}'

    # at(1) checks /etc/at.allow before every action, atq included, so atq tells who may use at
    # without queueing a job. root is always allowed, the users come from prepare.yml.
    - name: 'runuser --user {{ item }} -- atq'
      ansible.builtin.command: 'runuser --user {{ item }} -- atq'
      loop:
        - 'lfops-at-allowed'
        - 'lfops-at-denied'
        - 'root'
      register: '__molecule__atq_result'
      changed_when: false
      failed_when: false

    - name: 'Assert that only root and the listed user may use at'
      ansible.builtin.assert:
        that: >-
          (item["rc"] == 0) == (item["item"] in ["lfops-at-allowed", "root"])
        fail_msg: '{{ item["item"] }}: rc {{ item["rc"] }}, {{ item["stderr"] }}'
      loop: '{{ __molecule__atq_result["results"] }}'
      loop_control:
        label: '{{ item["item"] }}'
