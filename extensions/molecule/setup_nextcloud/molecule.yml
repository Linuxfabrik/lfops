# Molecule scenario marker for the 'setup_nextcloud' scenario, run with
# `molecule test --scenario-name setup_nextcloud`.
#
# It overrides the prepare step (see prepare.yml), which leaves a copy of nextcloud-update with
# the Icinga2 API login of an earlier version of the role behind, so that verify.yml can check
# that it is gone.
provisioner:
  playbooks:
    prepare: '${MOLECULE_SCENARIO_DIRECTORY}/prepare.yml'
