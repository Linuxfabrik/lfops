- name: 'Verify vm.overcommit_memory is set'
  hosts: 'systems_under_test'
  gather_facts: false
  tasks:
    - name: 'Read sysctl vm.overcommit_memory from procfs'
      ansible.builtin.slurp:
        src: '/proc/sys/vm/overcommit_memory'
      register: '__molecule__sysctl_vm_overcommit_memory_result'

    - name: 'Assert that vm.overcommit_memory is set to 1'
      ansible.builtin.assert:
        that: '__molecule__sysctl_vm_overcommit_memory_result["content"] | ansible.builtin.b64decode | int == 1'


- name: 'Verify transparent_hugepages is set'
  hosts: 'systems_under_test'
  gather_facts: false
  tasks:
    - name: 'Read /sys/kernel/mm/transparent_hugepage/enabled'
      ansible.builtin.slurp:
        src: '/sys/kernel/mm/transparent_hugepage/enabled'
      register: '__molecule__transparent_hugepage_enabled_result'

    - name: 'Assert that transparent hugepages are set to madvise'
      ansible.builtin.assert:
        that: '"[madvise]" in (__molecule__transparent_hugepage_enabled_result["content"] | ansible.builtin.b64decode)'


# The sunrpc sysctls only exist while the sunrpc module is loaded. Nothing else loads it on a host
# without NFS, so check after a reboot that the module comes back on its own and TuneD applies the
# value again.
- name: 'Verify sunrpc.tcp_slot_table_entries survives a reboot'
  hosts: 'systems_under_test'
  gather_facts: false
  tasks:
    - name: 'systemctl reboot'
      ansible.builtin.reboot:  # yamllint disable-line rule:empty-values
      become: true

    - name: 'Read sysctl sunrpc.tcp_slot_table_entries from procfs'
      ansible.builtin.slurp:
        src: '/proc/sys/sunrpc/tcp_slot_table_entries'
      register: '__molecule__sysctl_sunrpc_tcp_slot_table_entries_result'

    - name: 'Assert that sunrpc.tcp_slot_table_entries is set to 128'
      ansible.builtin.assert:
        that: '__molecule__sysctl_sunrpc_tcp_slot_table_entries_result["content"] | ansible.builtin.b64decode | int == 128'

    - name: 'tuned-adm verify --ignore-missing'
      ansible.builtin.command: 'tuned-adm verify --ignore-missing'
      become: true
      changed_when: false

    # after the reboot, so the values prove that TuneD applies the baseline at boot
    - name: 'Load the hardening baseline of the kernel_settings role'
      ansible.builtin.include_vars:
        file: '{{ playbook_dir }}/../../../../roles/kernel_settings/vars/main.yml'

    - name: 'sysctl --values <the keys of the hardening baseline>'
      ansible.builtin.command: 'sysctl --values {{ __kernel_settings__sysctl__hardening | map(attribute="name") | join(" ") }}'
      changed_when: false
      register: '__molecule__sysctl_values_result'

    - name: 'Assert that the kernel uses the hardening baseline, with the value the inventory overrides'
      ansible.builtin.assert:
        that:
          - '__molecule__sysctl_values_result["stdout_lines"] == __molecule__expected'
        fail_msg: '{{ __kernel_settings__sysctl__hardening | map(attribute="name") | zip(__molecule__sysctl_values_result["stdout_lines"]) | map("join", "=") | list }}'
      vars:
        # the baseline as name -> value, with the value the inventory overrides
        __molecule__baseline: '{{
            dict(__kernel_settings__sysctl__hardening | map(attribute="name")
              | zip(__kernel_settings__sysctl__hardening | map(attribute="value")))
            | combine({"kernel.kptr_restrict": 1})
          }}'
        __molecule__expected: '{{
            __kernel_settings__sysctl__hardening | map(attribute="name")
            | map("extract", __molecule__baseline) | map("string") | list
          }}'
