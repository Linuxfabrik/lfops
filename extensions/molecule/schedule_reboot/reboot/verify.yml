# Destructive verify: actually reboot the host through the CLI and confirm it
# came back (boot_id changed) with an empty spool (tmpfs cleared on reboot), that
# the notification do-reboot sent on the way down is a well-formed message, and
# that its downtime request and chat message reached their stand-ins. A second
# reboot with an unreadable Rocket.Chat credential proves that do-reboot still
# reboots without it.
- name: 'Verify schedule_reboot performs a real reboot'
  hosts: 'systems_under_test'
  gather_facts: false
  tasks:

    # A stand-in for the Icinga2 API on the host itself, listening where the inventory
    # points (icinga2_agent__icinga2_master_cn: 'localhost'), and for the Rocket.Chat
    # webhook (plain HTTP on port 3000, since that curl call verifies certificates).
    # do-reboot POSTs to both on the way down, and the stand-in writes each request to
    # disk before answering, so it can be read back after the reboot. It has to answer:
    # do-reboot only limits curl's connect time, so a silent endpoint would stall the
    # reboot.
    - name: 'mkdir -p /var/tmp/molecule-icinga2-api'
      ansible.builtin.file:
        path: '/var/tmp/molecule-icinga2-api'
        state: 'directory'
        owner: 'root'
        group: 'root'
        mode: 0o700

    # a record left over from an earlier run must not satisfy the assert below
    - name: 'rm -f /var/tmp/molecule-icinga2-api/requests.log'
      ansible.builtin.file:
        path: '/var/tmp/molecule-icinga2-api/requests.log'
        state: 'absent'

    - name: 'openssl req -x509 -newkey rsa:2048 -nodes -subj /CN=localhost'
      ansible.builtin.command: >
        openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost
        -keyout /var/tmp/molecule-icinga2-api/key.pem
        -out /var/tmp/molecule-icinga2-api/cert.pem
      args:
        creates: '/var/tmp/molecule-icinga2-api/cert.pem'

    - name: 'Deploy /var/tmp/molecule-icinga2-api/server.py'
      ansible.builtin.copy:
        content: |
          import http.server
          import os
          import ssl
          import threading

          BASE = '/var/tmp/molecule-icinga2-api'


          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  body = self.rfile.read(int(self.headers.get('Content-Length', 0)))
                  auth = self.headers.get('Authorization', '').encode()
                  with open(BASE + '/requests.log', 'ab') as f:
                      f.write(self.path.encode() + b'\n' + auth + b'\n' + body + b'\n')
                      f.flush()
                      os.fsync(f.fileno())
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'{"results": []}')


          chat = http.server.HTTPServer(('127.0.0.1', 3000), Handler)
          threading.Thread(target=chat.serve_forever, daemon=True).start()

          context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          context.load_cert_chain(BASE + '/cert.pem', BASE + '/key.pem')
          server = http.server.HTTPServer(('127.0.0.1', 5665), Handler)
          server.socket = context.wrap_socket(server.socket, server_side=True)
          server.serve_forever()
        dest: '/var/tmp/molecule-icinga2-api/server.py'
        owner: 'root'
        group: 'root'
        mode: 0o600

    # the interpreter Ansible itself uses on the host; RHEL 8 has no python3 by default
    - name: 'systemd-run --unit=molecule-icinga2-api python3 /var/tmp/molecule-icinga2-api/server.py'
      ansible.builtin.command: >
        systemd-run --unit=molecule-icinga2-api
        {{ ansible_facts["discovered_interpreter_python"] | d("/usr/bin/python3") }}
        /var/tmp/molecule-icinga2-api/server.py
      changed_when: false

    - name: 'Wait for the stand-ins on 127.0.0.1:5665 and 127.0.0.1:3000'
      ansible.builtin.wait_for:
        host: '127.0.0.1'
        port: '{{ item }}'
        timeout: 30
      loop:
        - 5665
        - 3000

    # The secrets live in systemd credentials, not in the script, so a --diff or a copy
    # of the script reveals neither.
    - name: 'slurp /usr/local/libexec/do-reboot'
      ansible.builtin.slurp:
        src: '/usr/local/libexec/do-reboot'
      register: '__molecule__do_reboot_script_result'

    - name: 'Assert that do-reboot contains neither the Icinga2 login nor the webhook URL'
      ansible.builtin.assert:
        that:
          - '(__molecule__expected_credentials | ansible.builtin.b64encode) not in __molecule__do_reboot_script'
          - 'schedule_reboot__rocketchat_url not in __molecule__do_reboot_script'
      vars:
        __molecule__expected_credentials: '{{ icinga2_master__downtime_api_user["username"] }}:{{ icinga2_master__downtime_api_user["password"] }}'
        __molecule__do_reboot_script: '{{ __molecule__do_reboot_script_result["content"] | ansible.builtin.b64decode }}'

    # encrypted with systemd 251 and newer, plain text in /etc/credstore before
    - name: 'stat the credentials in /etc/credstore.encrypted and /etc/credstore'
      ansible.builtin.stat:
        path: '{{ item }}'
      loop:
        - '/etc/credstore.encrypted/schedule-reboot-icinga2-login.curlrc'
        - '/etc/credstore.encrypted/schedule-reboot-rocketchat-webhook.curlrc'
        - '/etc/credstore/schedule-reboot-icinga2-login.curlrc'
        - '/etc/credstore/schedule-reboot-rocketchat-webhook.curlrc'
      register: '__molecule__credential_stat_result'

    - name: 'Assert that both credentials are in one of the stores'
      ansible.builtin.assert:
        that:
          - '__molecule__credentials | select("search", "/schedule-reboot-icinga2-login.curlrc$") | list | length == 1'
          - '__molecule__credentials | select("search", "/schedule-reboot-rocketchat-webhook.curlrc$") | list | length == 1'
        fail_msg: '{{ __molecule__credentials }}'
      vars:
        __molecule__credentials: '{{ __molecule__credential_stat_result["results"] | selectattr("stat.exists") | map(attribute="item") | list }}'

    - name: 'slurp /proc/sys/kernel/random/boot_id (before)'
      ansible.builtin.slurp:
        src: '/proc/sys/kernel/random/boot_id'
      register: '__molecule__boot_id_before_result'

    # Fire and forget: schedule-reboot --now starts schedule-reboot.service,
    # which reboots the host and drops this SSH connection. async + poll: 0 lets
    # Ansible move on instead of waiting on the dying connection.
    - name: 'schedule-reboot --now ci-reboot molecule-reboot-test'
      ansible.builtin.command: 'schedule-reboot --now ci-reboot molecule-reboot-test'
      async: 1
      poll: 0 # fire and forget: the reboot drops the connection, do not wait on it
      changed_when: false

    - name: 'Wait for the host to come back after the reboot'
      ansible.builtin.wait_for_connection:
        delay: 15
        sleep: 5
        timeout: 300

    - name: 'slurp /proc/sys/kernel/random/boot_id (after)'
      ansible.builtin.slurp:
        src: '/proc/sys/kernel/random/boot_id'
      register: '__molecule__boot_id_after_result'

    - name: 'Assert the boot_id changed, proving a real reboot happened'
      ansible.builtin.assert:
        that: '__molecule__boot_id_after_result["content"] != __molecule__boot_id_before_result["content"]'

    - name: 'find /run/schedule-reboot'
      ansible.builtin.find:
        paths: '/run/schedule-reboot'
      register: '__molecule__spool_after_result'

    - name: 'Assert the spool is empty (tmpfs cleared by the reboot)'
      ansible.builtin.assert:
        that: '__molecule__spool_after_result["matched"] == 0'

    # do-reboot mails the administrators before it goes down. postfix counts localhost
    # among its own destinations, so root@localhost is delivered into the root mailbox
    # instead of leaving via the (unreachable) relayhost. The grace period is 0 in this
    # scenario, so the message usually only leaves the queue after the reboot - hence
    # the retries.
    - name: 'stat /var/mail/root'
      ansible.builtin.stat:
        path: '/var/mail/root'
      register: '__molecule__root_mailbox_stat_result'
      until: '__molecule__root_mailbox_stat_result["stat"]["exists"]'
      retries: 12
      delay: 5

    - name: 'slurp /var/mail/root'
      ansible.builtin.slurp:
        src: '/var/mail/root'
      register: '__molecule__root_mailbox_result'

    # The bracketed prefix from group_vars must arrive as a quoted display name. Without
    # the quoting a strict parser drops the whole address, not just the name.
    - name: 'Assert the reboot notification carries a quoted From display name'
      ansible.builtin.assert:
        that: '__molecule__expected_from in (__molecule__root_mailbox_result["content"] | ansible.builtin.b64decode)'
      vars:
        __molecule__expected_from: "From: \"[molecule] "

    # The stand-in is gone with the reboot, its record is not. A request that arrived
    # proves the whole chain: the API URL derived from icinga2_agent__icinga2_master_cn
    # and the credentials from icinga2_master__downtime_api_user, both without their
    # roles in the play, the credential do-reboot decrypted, and curl reaching the
    # endpoint from schedule-reboot.service. A missing file means that nothing arrived.
    - name: 'slurp /var/tmp/molecule-icinga2-api/requests.log'
      ansible.builtin.slurp:
        src: '/var/tmp/molecule-icinga2-api/requests.log'
      register: '__molecule__icinga2_api_requests_result'

    - name: 'Assert that do-reboot requested the downtime and sent the chat message'
      ansible.builtin.assert:
        that:
          - '"/v1/actions/schedule-downtime" in __molecule__icinga2_api_requests'
          - '("Basic " ~ (__molecule__expected_credentials | ansible.builtin.b64encode)) in __molecule__icinga2_api_requests'
          - '"/hooks/molecule/linuxfabrik" in __molecule__icinga2_api_requests'
        fail_msg: '{{ __molecule__icinga2_api_requests }}'
      vars:
        __molecule__expected_credentials: '{{ icinga2_master__downtime_api_user["username"] }}:{{ icinga2_master__downtime_api_user["password"] }}'
        __molecule__icinga2_api_requests: '{{ (__molecule__icinga2_api_requests_result["content"] | ansible.builtin.b64decode).splitlines() }}'

    # Second reboot: a credential do-reboot cannot read (with a TPM2 chip, after a Secure
    # Boot change) must cost the chat message, not the reboot. Garbage in the encrypted
    # store fails `systemd-creds decrypt`, a missing file in the plain store fails `cat`.
    - name: 'systemd-run --unit=molecule-icinga2-api python3 /var/tmp/molecule-icinga2-api/server.py (again)'
      ansible.builtin.command: >
        systemd-run --unit=molecule-icinga2-api
        {{ ansible_facts["discovered_interpreter_python"] | d("/usr/bin/python3") }}
        /var/tmp/molecule-icinga2-api/server.py
      changed_when: false

    - name: 'Wait for the stand-ins on 127.0.0.1:5665 and 127.0.0.1:3000 (again)'
      ansible.builtin.wait_for:
        host: '127.0.0.1'
        port: '{{ item }}'
        timeout: 30
      loop:
        - 5665
        - 3000

    - name: 'Break the credential schedule-reboot-rocketchat-webhook.curlrc'
      ansible.builtin.copy:
        content: 'molecule'
        dest: '/etc/credstore.encrypted/schedule-reboot-rocketchat-webhook.curlrc'
        mode: 0o600
      when: '"/etc/credstore.encrypted/schedule-reboot-rocketchat-webhook.curlrc" in __molecule__credentials'
      vars:
        __molecule__credentials: '{{ __molecule__credential_stat_result["results"] | selectattr("stat.exists") | map(attribute="item") | list }}'

    - name: 'rm -f /etc/credstore/schedule-reboot-rocketchat-webhook.curlrc'
      ansible.builtin.file:
        path: '/etc/credstore/schedule-reboot-rocketchat-webhook.curlrc'
        state: 'absent'

    - name: 'slurp /proc/sys/kernel/random/boot_id (before the second reboot)'
      ansible.builtin.slurp:
        src: '/proc/sys/kernel/random/boot_id'
      register: '__molecule__boot_id_before_second_result'

    - name: 'schedule-reboot --now ci-reboot molecule-reboot-test (unreadable webhook)'
      ansible.builtin.command: 'schedule-reboot --now ci-reboot molecule-reboot-test'
      async: 1
      poll: 0 # fire and forget: the reboot drops the connection, do not wait on it
      changed_when: false

    - name: 'Wait for the host to come back after the second reboot'
      ansible.builtin.wait_for_connection:
        delay: 15
        sleep: 5
        timeout: 300

    - name: 'slurp /proc/sys/kernel/random/boot_id (after the second reboot)'
      ansible.builtin.slurp:
        src: '/proc/sys/kernel/random/boot_id'
      register: '__molecule__boot_id_after_second_result'

    - name: 'Assert the boot_id changed, proving do-reboot rebooted without the webhook'
      ansible.builtin.assert:
        that: '__molecule__boot_id_after_second_result["content"] != __molecule__boot_id_before_second_result["content"]'

    - name: 'slurp /var/tmp/molecule-icinga2-api/requests.log (after the second reboot)'
      ansible.builtin.slurp:
        src: '/var/tmp/molecule-icinga2-api/requests.log'
      register: '__molecule__icinga2_api_requests_second_result'

    - name: 'Assert that the second reboot requested the downtime but sent no chat message'
      ansible.builtin.assert:
        that:
          - '__molecule__icinga2_api_requests | select("eq", "/v1/actions/schedule-downtime") | list | length == 2'
          - '__molecule__icinga2_api_requests | select("eq", "/hooks/molecule/linuxfabrik") | list | length == 1'
        fail_msg: '{{ __molecule__icinga2_api_requests }}'
      vars:
        __molecule__icinga2_api_requests: '{{ (__molecule__icinga2_api_requests_second_result["content"] | ansible.builtin.b64decode).splitlines() }}'
