# Wait for the systems under test and gather their facts, exactly as every other scenario does.
- name: 'Prepare VMs for Ansible'
  ansible.builtin.import_playbook: '../../playbooks/vm-prepare.yml'


# Hosts that run acme_sh already have the Linuxfabrik repository, but not yet the acme.sh
# package, which the `check` step relies on: under `--check` the package is not installed.
- name: 'Deploy the Linuxfabrik repository'
  hosts: 'systems_under_test'
  become: true
  roles:
    - role: 'linuxfabrik.lfops.repo_linuxfabrik'


# Stands in for a host on which an earlier run handed the ACME challenge directory to the web
# server user. The numeric owner of the controller user stands in for it, so the check does not
# depend on a web server being installed.
- name: 'Create the ACME challenge directory not owned by root'
  hosts: 'systems_under_test'
  become: true
  gather_facts: false
  tasks:

    - name: 'install -o 1000 -g 1000 -d /var/www/html/letsencrypt/.well-known/acme-challenge'
      ansible.builtin.shell: |
        install --directory --mode=0755 /var/www/html/letsencrypt/.well-known
        install --directory --owner=1000 --group=1000 --mode=0755 /var/www/html/letsencrypt/.well-known/acme-challenge
        echo 'it works' > /var/www/html/letsencrypt/.well-known/acme-challenge/index.html
        chown 1000:1000 /var/www/html/letsencrypt/.well-known/acme-challenge/index.html
      args:
        creates: '/var/www/html/letsencrypt/.well-known/acme-challenge'
