# yamllint disable rule:empty-values

# acme_sh targets 'lfops_acme_sh' (see playbooks/acme_sh.yml: hosts). The acme.sh package is built
# for every platform of the matrix, and the playbook deploys the Linuxfabrik repository on all of
# them, so all targets run.
lfops_acme_sh:
  children:
    systems_under_test:

systems_under_test:
  hosts:
    debian12-vm:
    debian13-vm:
    rocky8-vm:
    rocky9-vm:
    rocky10-vm:
    ubuntu2204-vm:
    ubuntu2404-vm:
    ubuntu2604-vm:
