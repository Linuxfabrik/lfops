# Molecule scenario marker for the 'install' sub-scenario, run with
# `molecule test --scenario-name acme_sh/install`.
#
# Covers a run of the acme_sh playbook against a host without acme.sh. The 'migrate' sub-scenario
# covers a host on which an earlier version of the role installed acme.sh to /opt/acme.sh.
#
# prepare.yml deploys the Linuxfabrik repository, as on hosts that run acme_sh, so that the
# `check` step finds the package.
provisioner:
  playbooks:
    prepare: '${MOLECULE_SCENARIO_DIRECTORY}/prepare.yml'

# `check` runs converge.yml with `--check` before the real converge, against the host prepare.yml
# built, so a dry run has to get through as well.
scenario:
  test_sequence:
    - 'dependency' # must stay in the list so requirements.yml is installed (see config.yml)
    - 'create'
    - 'prepare'
    - 'check'
    - 'converge'
    - 'verify'
    - 'idempotence'
    - 'verify'
    - 'destroy'
