# Molecule scenario marker for the 'migrate' sub-scenario, run with
# `molecule test --scenario-name acme_sh/migrate`.
#
# Covers a run of the acme_sh playbook against a host on which an earlier version of the role
# installed acme.sh to /opt/acme.sh with the online installer. The 'install' sub-scenario covers a
# host without acme.sh.
#
# prepare.yml builds the former installation and its leftovers.
provisioner:
  playbooks:
    prepare: '${MOLECULE_SCENARIO_DIRECTORY}/prepare.yml'

# `check` runs converge.yml with `--check` before the real converge, against the host prepare.yml
# built, so a dry run has to get through as well.
scenario:
  test_sequence:
    - 'dependency' # must stay in the list so requirements.yml is installed (see config.yml)
    - 'create'
    - 'prepare'
    - 'check'
    - 'converge'
    - 'verify'
    - 'idempotence'
    - 'verify'
    - 'destroy'
