# Wait for the systems under test and gather their facts, exactly as every other scenario does.
- name: 'Prepare VMs for Ansible'
  ansible.builtin.import_playbook: '../../playbooks/vm-prepare.yml'


# Hosts that run acme_sh already have the Linuxfabrik repository, but not yet the acme.sh
# package, which the `check` step relies on: under `--check` the package is not installed.
- name: 'Deploy the Linuxfabrik repository'
  hosts: 'systems_under_test'
  become: true
  roles:
    - role: 'linuxfabrik.lfops.repo_linuxfabrik'


# Reproduces what earlier versions of the role left on a host, with the very command they ran:
# the code in /opt/acme.sh, the state in /etc/acme.sh and the alias lines in the rc files of
# root.
- name: 'Install acme.sh the way earlier versions of the role did'
  hosts: 'systems_under_test'
  become: true
  tasks:

    - name: 'Install curl, openssl and tar'
      ansible.builtin.package:
        name:
          - 'curl'
          - 'openssl'
          - 'tar'
        state: 'present'
      retries: 3 # ride out a brief outage of the package repository
      delay: 10

    - name: 'curl https://raw.githubusercontent.com/acmesh-official/acme.sh/master/acme.sh | sh -s -- --install-online ...'
      ansible.builtin.shell: |-
        set -o pipefail
        curl https://raw.githubusercontent.com/acmesh-official/acme.sh/master/acme.sh | sh -s -- --install-online \
          --home /opt/acme.sh \
          --config-home /etc/acme.sh \
          --cert-home  /etc/acme.sh/certs \
          --accountemail  "{{ acme_sh__account_email }}" \
          --accountkey  /etc/acme.sh/account.key \
          --accountconf /etc/acme.sh/account.conf \
          --no-cron
      args:
        executable: '/bin/bash'
        creates: '/etc/acme.sh/account.conf'


# Leftovers seen on hosts of the former installation: the alias line in another profile of root,
# which `_detect_profile()` of acme.sh picks for a different login shell, and a copy of the
# program in /root/.acme.sh from an `acme.sh --install` without `--home`.
- name: 'Leave the leftovers of earlier acme.sh installations'
  hosts: 'systems_under_test'
  become: true
  tasks:

    - name: 'Add the line of the former installer to /root/.bash_profile'
      ansible.builtin.lineinfile:
        path: '/root/.bash_profile'
        line: '. "/opt/acme.sh/acme.sh.env"'
        create: true
        mode: 0o644

    - name: 'mkdir -p /root/.acme.sh/deploy /root/.acme.sh/dnsapi /root/.acme.sh/notify'
      ansible.builtin.file:
        path: '/root/.acme.sh/{{ item }}'
        state: 'directory'
        mode: 0o755
      loop:
        - 'deploy'
        - 'dnsapi'
        - 'notify'

    - name: 'cp /opt/acme.sh/acme.sh /root/.acme.sh/acme.sh'
      ansible.builtin.copy:
        src: '/opt/acme.sh/acme.sh'
        dest: '/root/.acme.sh/acme.sh'
        remote_src: true
        mode: 0o755
