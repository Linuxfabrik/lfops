# The default fwbuilder needs an /etc/fwb.sh this scenario cannot supply, and the role aborts
# without it. nftables exists on every distribution under test and starts with the ruleset the
# distribution ships.
firewall__firewall: 'nftables'

mailto_root__from: 'root@localhost'
mailto_root__to:
  - 'root@localhost'

# The latest release, see playbooks/monitoring-plugins-latest.yml, which converge.yml imports.
monitoring_plugins__version: '{{ lookup("ansible.builtin.file",
    lookup("ansible.builtin.env", "MOLECULE_EPHEMERAL_DIRECTORY") ~ "/monitoring-plugins-version") }}'

postfix__recipient_canonicals__host_var:
  - pattern: '/^.+@example.com$/'
    address: 'team@example.com'
    state: 'present'
postfix__relayhost: 'mail.example.com'
postfix__sender_canonicals__host_var:
  - pattern: '/^.+@example.com$/'
    address: 'noreply@example.com'
    state: 'present'

setup_basic__skip_duplicity: true
setup_basic__skip_repo_icinga: true
setup_basic__skip_icinga2_agent: true
