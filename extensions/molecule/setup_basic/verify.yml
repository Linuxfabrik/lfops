- name: 'Verify setup_basic configured the bundled roles'
  hosts: 'systems_under_test'
  gather_facts: false
  tasks:
    # prepare.yml left cloud-init's "dns = none" behind on every host that runs NetworkManager. Once
    # the cloud_init role removed it, NetworkManager has to be managing /etc/resolv.conf again
    # without a restart in between. The DNS mode tells, the header of /etc/resolv.conf does not:
    # NetworkManager leaves the file it wrote before untouched in mode "none".
    - name: 'Gather the service facts to see whether NetworkManager runs'
      ansible.builtin.service_facts: # yamllint disable-line rule:empty-values

    - name: 'busctl get-property ... DnsManager Mode'
      ansible.builtin.command: >-
        busctl get-property org.freedesktop.NetworkManager
        /org/freedesktop/NetworkManager/DnsManager org.freedesktop.NetworkManager.DnsManager Mode
      changed_when: false
      register: '__molecule__nm_dns_mode_result'
      when:
        - 'ansible_facts["services"]["NetworkManager.service"]["state"] | d("") == "running"'

    - name: 'Assert that NetworkManager manages /etc/resolv.conf again'
      ansible.builtin.assert:
        that:
          - '__molecule__nm_dns_mode_result["stdout"] != "s \"none\""'
        fail_msg: '{{ __molecule__nm_dns_mode_result["stdout"] }}'
      when:
        - 'ansible_facts["services"]["NetworkManager.service"]["state"] | d("") == "running"'

    # Running a plugin instead of stat-ing it proves the deployed payload executes and its bundled
    # runtime resolves, which a stat cannot tell you.
    - name: '/usr/lib64/nagios/plugins/about-me'
      ansible.builtin.command: '/usr/lib64/nagios/plugins/about-me'
      changed_when: false
      register: '__molecule__about_me_result'

    - name: 'Assert that the about-me monitoring plugin runs'
      ansible.builtin.assert:
        that: '__molecule__about_me_result["rc"] == 0'
        fail_msg: '{{ __molecule__about_me_result["stdout"] }}'

    - name: 'glances --version'
      ansible.builtin.command: 'glances --version'
      changed_when: false
      register: '__molecule__glances_version_result'

    - name: 'Assert that glances is installed and runnable (venv on RHEL 10, distro package elsewhere)'
      ansible.builtin.assert:
        that:
          - '__molecule__glances_version_result["rc"] == 0'

    # A real audit, restricted to a single test to keep it short, proves lynis finds its profile
    # and include files and writes the report the lynis monitoring plugin reads.
    - name: 'lynis audit system --quick --tests KRNL-5820'
      ansible.builtin.command: 'lynis audit system --quick --no-colors --tests KRNL-5820'
      args:
        chdir: '/'
      changed_when: false
      register: '__molecule__lynis_audit_result'

    - name: 'grep ^tests_executed= /var/log/lynis-report.dat'
      ansible.builtin.command: 'grep ^tests_executed= /var/log/lynis-report.dat'
      changed_when: false
      register: '__molecule__lynis_report_result'

    - name: 'Assert that the lynis audit ran the requested test'
      ansible.builtin.assert:
        that:
          - '"KRNL-5820" in __molecule__lynis_report_result["stdout"]'
        fail_msg: '{{ __molecule__lynis_audit_result["stdout_lines"][-20:] }}'

    # aide runs last in setup_basic and creates its database after the handlers of every other
    # role have run. A check straight after the play has to be clean: a file another role or one
    # of its handlers wrote after the database was created would make it fail.
    - name: 'systemctl start --wait aidecheck.service' # noqa command-instead-of-module (wait for the check to finish and read its Result)
      ansible.builtin.command: 'systemctl start --wait aidecheck.service'
      changed_when: false
      failed_when: false

    - name: 'systemctl show --property=Result aidecheck.service' # noqa command-instead-of-module (no module reads the Result of a finished unit)
      ansible.builtin.command: 'systemctl show --property=Result --value aidecheck.service'
      changed_when: false
      register: '__molecule__aide_check_result'

    - name: 'cat /var/log/aide/aide.log'
      ansible.builtin.command: 'cat /var/log/aide/aide.log'
      changed_when: false
      register: '__molecule__aide_log_result'

    - name: 'Assert that the AIDE check on the freshly set up host runs clean'
      ansible.builtin.assert:
        that:
          - '__molecule__aide_check_result["stdout"] == "success"'
        fail_msg: '{{ __molecule__aide_log_result["stdout"] }}'

    # nftables.service is Type=oneshot with RemainAfterExit=yes on every distribution under test,
    # so "active" means `nft -f` loaded the distribution's ruleset. The ruleset itself is empty on
    # the Red Hat family, so listing it would prove nothing more.
    - name: 'systemctl is-active nftables.service' # noqa command-instead-of-module (read-only state query)
      ansible.builtin.command: 'systemctl is-active nftables.service'
      changed_when: false
      failed_when: false
      register: '__molecule__nftables_active_result'

    - name: 'Assert that nftables.service is active'
      ansible.builtin.assert:
        that: '__molecule__nftables_active_result["stdout"] == "active"'
        fail_msg: '{{ __molecule__nftables_active_result["stdout"] }}'

    # A running Postfix is the floor for every check below it: it proves the deployed main.cf is at
    # least valid enough to start with. Queried via systemctl instead of service_facts because the
    # unit differs per family (Type=forking on RHEL, Type=oneshot with RemainAfterExit on Debian,
    # where the daemon runs as postfix@-.service), which service_facts reports as running vs exited.
    - name: 'systemctl is-active postfix.service' # noqa command-instead-of-module (read-only state query)
      ansible.builtin.command: 'systemctl is-active postfix.service'
      changed_when: false
      failed_when: false
      register: '__molecule__postfix_active_result'

    - name: 'Assert that postfix.service is active'
      ansible.builtin.assert:
        that: '__molecule__postfix_active_result["stdout"] == "active"'
        fail_msg: '{{ __molecule__postfix_active_result["stdout"] }}'

    # Ask the running Postfix for its effective relayhost and compare it against what the scenario
    # set. This covers the whole chain, group_vars -> main.cf -> the daemon reading it, which is
    # exactly what grepping the config file would not.
    - name: 'postconf -h relayhost'
      ansible.builtin.command: 'postconf -h relayhost'
      changed_when: false
      register: '__molecule__postfix_relayhost_result'

    - name: 'Assert that Postfix uses the configured relayhost'
      ansible.builtin.assert:
        that: '__molecule__postfix_relayhost_result["stdout"] | trim == postfix__relayhost'
        fail_msg: '{{ __molecule__postfix_relayhost_result["stdout"] }}'

    # Lynis MAIL-8818 flags a banner that holds $mail_name (Postfix), the OS or the Linux flavour.
    # Ask the running daemon, since the unset default would look fine in main.cf.
    - name: 'postconf -h smtpd_banner'
      ansible.builtin.command: 'postconf -h smtpd_banner'
      changed_when: false
      register: '__molecule__postfix_banner_result'

    - name: 'Assert that the SMTP banner discloses neither the MTA nor the OS'
      ansible.builtin.assert:
        that:
          - '__molecule__postfix_banner_result["stdout"] == "$myhostname ESMTP LFOps"'
          - '"mail_name" not in __molecule__postfix_banner_result["stdout"]'
          - '"linux" not in __molecule__postfix_banner_result["stdout"] | lower'
        fail_msg: '{{ __molecule__postfix_banner_result["stdout"] }}'

    - name: 'postconf -h sender_canonical_maps recipient_canonical_maps'
      ansible.builtin.command: 'postconf -h sender_canonical_maps recipient_canonical_maps'
      changed_when: false
      register: '__molecule__postfix_canonical_maps_result'

    - name: 'Assert that postfix loaded the sender and recipient canonical maps'
      ansible.builtin.assert:
        that:
          - '"regexp:/etc/postfix/canonical" in __molecule__postfix_canonical_maps_result["stdout_lines"]'
          - '"regexp:/etc/postfix/recipient_canonical" in __molecule__postfix_canonical_maps_result["stdout_lines"]'

    - name: 'postmap -q against the sender and recipient canonical tables'
      ansible.builtin.command: 'postmap -q "user@example.com" regexp:{{ item }}'
      changed_when: false
      register: '__molecule__postfix_postmap_query_result'
      loop:
        - '/etc/postfix/canonical'
        - '/etc/postfix/recipient_canonical'

    - name: 'Assert that the canonical rules rewrite addresses as configured'
      ansible.builtin.assert:
        that: 'item["stdout"] == __molecule__expected'
      vars:
        __molecule__expected: '{{ (item["item"] == "/etc/postfix/canonical") | ternary("noreply@example.com", "team@example.com") }}'
      loop: '{{ __molecule__postfix_postmap_query_result["results"] }}'
      loop_control:
        label: '{{ item["item"] }}'

    - name: 'Gather the distribution facts the checks below depend on'
      ansible.builtin.setup:
        gather_subset:
          - '!all'


    - block:

      # compatibility_level decides which defaults Postfix applies without saying so, the TLS
      # fingerprint digest among them. RHEL 10 ships 3.8, RHEL 8 and 9 ship 2, and the role
      # deploys the level of the distribution. Ask the running configuration for the level and
      # for the digest it implies, since the digest is the part an administrator would notice.
      - name: 'postconf -x -h compatibility_level smtp_tls_fingerprint_digest'
        ansible.builtin.command: 'postconf -x -h compatibility_level smtp_tls_fingerprint_digest'
        changed_when: false
        register: '__molecule__postfix_compat_result'

      - name: 'Assert that Postfix runs at the compatibility level of the distribution'
        ansible.builtin.assert:
          that:
            - '__molecule__postfix_compat_result["stdout_lines"] == __molecule__expected'
          fail_msg: '{{ __molecule__postfix_compat_result["stdout_lines"] }}'
        vars:
          __molecule__expected: '{{ (ansible_facts["distribution_major_version"] | int >= 10) | ternary(["3.8", "sha256"], ["2", "md5"]) }}'

      when:
        - 'ansible_facts["os_family"] == "RedHat"'


    - block:

      # Resolving a package from the Linuxfabrik repository proves that dnf reads it and accepts
      # its key, without a terminal.
      - name: 'dnf repoquery --repo=linuxfabrik exoscale-cli'
        ansible.builtin.command:
          cmd: 'dnf --quiet repoquery --repo=linuxfabrik exoscale-cli'
          stdin: ''
        register: '__molecule__repo_linuxfabrik_result'
        changed_when: false

      - name: 'Assert that the Linuxfabrik repository offers exoscale-cli'
        ansible.builtin.assert:
          that: '__molecule__repo_linuxfabrik_result["stdout"] is search("^exoscale-cli-", multiline=true)'
          fail_msg: '{{ __molecule__repo_linuxfabrik_result["stdout"] }}'

      when:
        - 'ansible_facts["os_family"] == "RedHat"'


    - block:

      # Resolving a package from the Linuxfabrik repository proves that apt reads it and accepts
      # its key.
      - name: 'apt-cache policy acme.sh'
        ansible.builtin.command: 'apt-cache policy acme.sh'
        register: '__molecule__repo_linuxfabrik_result'
        changed_when: false

      - name: 'Assert that the Linuxfabrik repository offers acme.sh'
        ansible.builtin.assert:
          that: '__molecule__repo_linuxfabrik_result["stdout"] is search("repo.linuxfabrik.ch/" ~ ansible_facts["distribution"] | lower ~ "/linuxfabrik " ~ ansible_facts["distribution_release"] ~ "-release/main")'
          fail_msg: '{{ __molecule__repo_linuxfabrik_result["stdout"] }}'

      when:
        - 'ansible_facts["os_family"] == "Debian"'

    # The inventory skips duplicity. Its venv must not be built anyway: python_venv used to get the
    # duplicity venv regardless of setup_basic__skip_duplicity, and its pip install can fail.
    - name: 'stat /opt/python-venv/duplicity'
      ansible.builtin.stat:
        path: '/opt/python-venv/duplicity'
      register: '__molecule__duplicity_venv_stat_result'

    - name: 'Assert that the duplicity venv is absent while duplicity is skipped'
      ansible.builtin.assert:
        that: 'not __molecule__duplicity_venv_stat_result["stat"]["exists"]'

    # setup_basic puts psi=1 on the kernel command line of the Red Hat family, whose kernels keep
    # no pressure stall information without it, and the bootloader role only requests the reboot
    # that makes it effective. The first verify run therefore finds the request waiting in the
    # schedule_reboot spool and reboots; the second one (after idempotence) finds the option on
    # the running kernel already.
    - name: 'Verify that the kernel command line of the Red Hat family carries psi=1'
      when:
        - 'ansible_facts["os_family"] == "RedHat"'
      block:

      - name: 'grubby --info=ALL'
        ansible.builtin.command: 'grubby --info=ALL'
        register: '__molecule__grubby_info_result'
        changed_when: false

      - name: 'Assert that every boot entry has psi=1 on its command line'
        ansible.builtin.assert:
          that: '__molecule__grubby_info_result["stdout_lines"]
              | select("match", "^args=")
              | reject("search", "psi=1")
              | list | length == 0'

      - name: 'slurp /proc/cmdline'
        ansible.builtin.slurp:
          src: '/proc/cmdline'
        register: '__molecule__proc_cmdline_result'

      - name: 'stat /run/schedule-reboot/bootloader'
        ansible.builtin.stat:
          path: '/run/schedule-reboot/bootloader'
        register: '__molecule__reboot_request_stat_result'
        when: '"psi=1" not in (__molecule__proc_cmdline_result["content"] | ansible.builtin.b64decode)'

      - name: 'Assert that the bootloader role requested a reboot at the maintenance window'
        ansible.builtin.assert:
          that: '__molecule__reboot_request_stat_result["stat"]["exists"] | bool'
        when: '"psi=1" not in (__molecule__proc_cmdline_result["content"] | ansible.builtin.b64decode)'

      - name: 'systemctl reboot'
        ansible.builtin.reboot:  # yamllint disable-line rule:empty-values
        when: '"psi=1" not in (__molecule__proc_cmdline_result["content"] | ansible.builtin.b64decode)'

    # The point of psi=1: the plugin has to find pressure stall information on every platform,
    # with the option on the Red Hat family and by default on Debian and Ubuntu.
    # --severity-no-psi crit turns its "nothing to measure" OK into a failure.
    - name: '/usr/lib64/nagios/plugins/psi-cpu --severity-no-psi crit'
      ansible.builtin.command: '/usr/lib64/nagios/plugins/psi-cpu --severity-no-psi crit'
      changed_when: false
      failed_when: false
      register: '__molecule__psi_cpu_result'

    - name: 'Assert that the psi-cpu monitoring plugin finds pressure stall information'
      ansible.builtin.assert:
        that: '__molecule__psi_cpu_result["rc"] == 0'
        fail_msg: '{{ __molecule__psi_cpu_result["stdout"] }}'
