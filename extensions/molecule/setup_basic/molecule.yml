# Molecule scenario marker for the 'setup_basic' scenario, run with
# `molecule test --scenario-name setup_basic`.
#
# The prepare playbook is overridden to leave behind the NetworkManager config cloud-init writes on
# some provider images, which the cloud_init role cleans up; see the scenario-local prepare.yml. It
# imports the shared vm-prepare.yml first, so the systems under test are still waited for and their
# facts still gathered.
provisioner:
  playbooks:
    prepare: '${MOLECULE_SCENARIO_DIRECTORY}/prepare.yml'
