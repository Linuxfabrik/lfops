# verify.yml passes it to `duba exec`, a stub of duplicity checks that it arrives.
duplicity__archive_dir: '/var/cache/duba-molecule'

# verify.yml runs real backups to a local directory and restores from them. The large default
# sources are left out to keep the backups fast; the test data is in /srv/duba-molecule.
duplicity__backup_dest: 'file:///var/backups/duba-molecule'
duplicity__backup_sources__group_var:
  - path: '/etc'
    state: 'absent'
  - path: '/home'
    state: 'absent'
  - path: '/opt'
    state: 'absent'
  - path: '/root'
    state: 'absent'
  - path: '/srv'
    state: 'absent'
  - path: '/srv/duba-molecule/divided'
    divide: true
    state: 'present'
  - path: '/srv/duba-molecule/plain'
    divide: false
    state: 'present'

# Nothing listens on the Swift URL, the scenario never starts a backup. The password is unique,
# so that verify.yml can search for it.
duplicity__swift_login:
  username: 'linuxfabrik'
  password: 'molecule-duba-password-marker'
