- name: 'Verify the duplicity role set up the backup'
  hosts: 'systems_under_test'
  gather_facts: false
  become: true
  tasks:

    # The wrapper runs duplicity from the venv python_venv built, so a venv that lacks the Swift
    # client would only fail at the first nightly backup. Import it with the venv's interpreter.
    - name: '/opt/python-venv/duplicity/bin/python3 -c "import swiftclient"'
      ansible.builtin.command: '/opt/python-venv/duplicity/bin/python3 -c "import swiftclient"'
      changed_when: false

    - name: 'duplicity --version'
      ansible.builtin.command: '/opt/python-venv/duplicity/bin/duplicity --version'
      changed_when: false

    # duba maps argparse's SystemExit to its own exit code 221, so judge the output, not the rc.
    - name: 'duba --help'
      ansible.builtin.command: '/usr/local/bin/duba --help'
      changed_when: false
      failed_when: false
      register: '__molecule__duba_help_result'

    - name: 'Assert that duba starts'
      ansible.builtin.assert:
        that: '"usage: duba" in __molecule__duba_help_result["stdout"]'
        fail_msg: '{{ __molecule__duba_help_result | to_json }}'

    # Ask gpg whether the master key is imported and trusted ultimately ("u" in field 2 of the
    # colon listing), since the role encrypts every backup to it.
    - name: 'gpg --list-keys --with-colons {{ duplicity__gpg_encrypt_master_key }}'
      ansible.builtin.command: 'gpg --list-keys --with-colons {{ duplicity__gpg_encrypt_master_key }}'
      changed_when: false
      register: '__molecule__gpg_master_key_result'

    - name: 'Assert that the master key is imported and ultimately trusted'
      ansible.builtin.assert:
        that:
          - '__molecule__gpg_master_key_result["stdout_lines"] | select("match", "^pub:u:") | list | length == 1'
        fail_msg: '{{ __molecule__gpg_master_key_result["stdout_lines"] }}'

    # service_facts lists no timers, so ask systemd.
    - name: 'systemctl is-active / is-enabled duba.timer' # noqa command-instead-of-module (read-only state query)
      ansible.builtin.command: 'systemctl {{ item }} duba.timer'
      loop:
        - 'is-active'
        - 'is-enabled'
      register: '__molecule__duba_timer_state_result'
      changed_when: false
      failed_when: false

    - name: 'Assert that duba.timer is active and enabled'
      ansible.builtin.assert:
        that: 'item["stdout"] in ["active", "enabled"]'
      loop: '{{ __molecule__duba_timer_state_result["results"] }}'
      loop_control:
        label: '{{ item["item"] }}'

    - name: 'systemctl --version' # noqa command-instead-of-module (read-only state query)
      ansible.builtin.command: 'systemctl --version'
      changed_when: false
      register: '__molecule__systemctl_version_result'

    # With systemd 251 and newer the password is encrypted, so it must not show up in plain text
    # anywhere below /etc (duba.json and its backup copies included). Older systemd keeps it in
    # /etc/credstore.
    - name: 'grep --recursive --files-with-matches --fixed-strings <password> /etc'
      ansible.builtin.command: 'grep --recursive --files-with-matches --fixed-strings {{ duplicity__swift_login["password"] }} /etc'
      changed_when: false
      failed_when: false
      register: '__molecule__password_grep_result'

    - name: 'Assert that the password is only in the credential store'
      ansible.builtin.assert:
        that: '__molecule__password_grep_result["stdout_lines"] == (__molecule__systemd_version | int >= 251) | ternary([], ["/etc/credstore/duba-login.json"])'
        fail_msg: '{{ __molecule__password_grep_result["stdout_lines"] }}'
      vars:
        __molecule__systemd_version: '{{ __molecule__systemctl_version_result["stdout_lines"][0].split()[1] }}'

    - name: 'grep LoadCredentialEncrypted= /etc/systemd/system/duba.service'
      ansible.builtin.command: 'grep --count --line-regexp LoadCredentialEncrypted=duba-login.json /etc/systemd/system/duba.service'
      changed_when: false
      failed_when: false
      register: '__molecule__duba_service_grep_result'

    - name: 'Assert that duba.service loads the encrypted credential (systemd 251 and newer only)'
      ansible.builtin.assert:
        that: '__molecule__duba_service_grep_result["stdout"] == (__molecule__systemd_version | int >= 251) | ternary("1", "0")'
        fail_msg: '{{ __molecule__duba_service_grep_result | to_json }}'
      vars:
        __molecule__systemd_version: '{{ __molecule__systemctl_version_result["stdout_lines"][0].split()[1] }}'

    # A stub of duplicity, found first in PATH, prints its arguments and environment, so that
    # verify can see what `duba exec` hands over without contacting a backend. duba asks for the
    # version first.
    - name: 'mkdir /tmp/molecule-duba-stub'
      ansible.builtin.file:
        path: '/tmp/molecule-duba-stub'
        state: 'directory'
        mode: 0o755

    - name: 'Deploy /tmp/molecule-duba-stub/duplicity'
      ansible.builtin.copy:
        dest: '/tmp/molecule-duba-stub/duplicity'
        content: |
          #!/bin/sh
          if [ "$1" = '--version' ]; then
              echo 'duplicity 3.0.0'
              exit 0
          fi
          echo "args: $*"
          env
        mode: 0o755

    # started by hand: no $CREDENTIALS_DIRECTORY, duba decrypts the credential itself
    - name: 'PATH=/tmp/molecule-duba-stub:$PATH duba exec -- collection-status <url>'
      ansible.builtin.command: '/usr/local/bin/duba exec -- collection-status swift://molecule/etc'
      environment:
        PATH: '/tmp/molecule-duba-stub:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
      changed_when: false
      register: '__molecule__duba_exec_result'

    - name: 'Assert that duba exec passes the archive dir, the arguments and the password'
      ansible.builtin.assert:
        that:
          - '"args: --archive-dir /var/cache/duba-molecule collection-status swift://molecule/etc" in __molecule__duba_exec_result["stdout_lines"]'
          - '"SWIFT_PASSWORD=" ~ duplicity__swift_login["password"] in __molecule__duba_exec_result["stdout_lines"]'
          - '"SWIFT_USERNAME=linuxfabrik" in __molecule__duba_exec_result["stdout_lines"]'
          - '__molecule__duba_exec_result["stdout_lines"] | select("match", "^CREDENTIALS_DIRECTORY=") | list | length == 0'
        fail_msg: '{{ __molecule__duba_exec_result["stdout_lines"] }}'

    # started by a unit: duba reads the credential systemd decrypted to $CREDENTIALS_DIRECTORY
    - name: 'systemd-run --pipe --wait --property=LoadCredentialEncrypted=duba-login.json duba exec -- collection-status <url>'
      ansible.builtin.command: >-
        systemd-run --pipe --wait --quiet
        --property=LoadCredentialEncrypted=duba-login.json
        --setenv=PATH=/tmp/molecule-duba-stub:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        /usr/local/bin/duba exec -- collection-status swift://molecule/etc
      changed_when: false
      register: '__molecule__duba_exec_unit_result'
      when: '__molecule__systemctl_version_result["stdout_lines"][0].split()[1] | int >= 251'

    - name: 'Assert that duba exec reads the credential from $CREDENTIALS_DIRECTORY in a unit'
      ansible.builtin.assert:
        that:
          - '"SWIFT_PASSWORD=" ~ duplicity__swift_login["password"] in __molecule__duba_exec_unit_result["stdout_lines"]'
          - '__molecule__duba_exec_unit_result["stdout_lines"] | select("match", "^CREDENTIALS_DIRECTORY=") | list | length == 1'
        fail_msg: '{{ __molecule__duba_exec_unit_result["stdout_lines"] }}'
      when: '__molecule__systemctl_version_result["stdout_lines"][0].split()[1] | int >= 251'

    # A real backup and restore to the file:// backend. The first backup holds v1 of plain/file.txt,
    # the second one v2, so a restore as of a time between them has to bring back v1. Everything
    # is reset first, so that the play also passes the second verify run.
    - name: 'rm -rf /var/tmp/molecule-restore-*'
      ansible.builtin.file:
        path: '{{ item }}'
        state: 'absent'
      loop:
        - '/var/tmp/molecule-restore-divided'
        - '/var/tmp/molecule-restore-latest'
        - '/var/tmp/molecule-restore-old'

    - name: 'mkdir /srv/duba-molecule/plain /srv/duba-molecule/divided/alice/files'
      ansible.builtin.file:
        path: '{{ item }}'
        state: 'directory'
        mode: 0o755
      loop:
        - '/srv/duba-molecule/divided/alice/files'
        - '/srv/duba-molecule/plain'

    - name: 'Create the test data, plain/file.txt in v1'
      ansible.builtin.copy:
        dest: '{{ item["dest"] }}'
        content: '{{ item["content"] }}'
        mode: 0o644
      loop:
        - dest: '/srv/duba-molecule/divided/alice/files/x.txt'
          content: 'alice v1'
        - dest: '/srv/duba-molecule/plain/file.txt'
          content: 'plain v1'
      loop_control:
        label: '{{ item["dest"] }}'

    - name: 'systemctl start duba.service # first backup' # noqa command-instead-of-module (a oneshot run, not a state)
      ansible.builtin.command: 'systemctl start duba.service'
      changed_when: false
      failed_when: false
      register: '__molecule__duba_service_result'

    - name: 'journalctl --unit=duba.service --lines=60'
      ansible.builtin.command: 'journalctl --unit=duba.service --no-pager --lines=60'
      changed_when: false
      register: '__molecule__duba_journal_result'
      when: '__molecule__duba_service_result["rc"] != 0'

    - name: 'Assert that the first backup succeeded'
      ansible.builtin.assert:
        that: '__molecule__duba_service_result["rc"] == 0'
        fail_msg: '{{ __molecule__duba_journal_result["stdout_lines"] | d([]) }}'

    # duplicity stores the backup time in seconds, so make sure that the next one is later
    - name: 'sleep 2'
      ansible.builtin.pause:
        seconds: 2

    - name: 'date +%s'
      ansible.builtin.command: 'date +%s'
      changed_when: false
      register: '__molecule__between_backups_result'

    - name: 'sleep 2'
      ansible.builtin.pause:
        seconds: 2

    - name: 'Change plain/file.txt to v2'
      ansible.builtin.copy:
        dest: '/srv/duba-molecule/plain/file.txt'
        content: 'plain v2'
        mode: 0o644

    - name: 'systemctl start duba.service # second backup' # noqa command-instead-of-module (a oneshot run, not a state)
      ansible.builtin.command: 'systemctl start duba.service'
      changed_when: false
      failed_when: false
      register: '__molecule__duba_service_result'

    - name: 'journalctl --unit=duba.service --lines=60'
      ansible.builtin.command: 'journalctl --unit=duba.service --no-pager --lines=60'
      changed_when: false
      register: '__molecule__duba_journal_result'
      when: '__molecule__duba_service_result["rc"] != 0'

    - name: 'Assert that the second backup succeeded'
      ansible.builtin.assert:
        that: '__molecule__duba_service_result["rc"] == 0'
        fail_msg: '{{ __molecule__duba_journal_result["stdout_lines"] | d([]) }}'

    - name: 'duba restore --target=/var/tmp/molecule-restore-latest /srv/duba-molecule/plain/file.txt'
      ansible.builtin.command: '/usr/local/bin/duba restore --target=/var/tmp/molecule-restore-latest /srv/duba-molecule/plain/file.txt'
      changed_when: false

    - name: 'duba restore --time=<between the backups> --target=/var/tmp/molecule-restore-old /srv/duba-molecule/plain/file.txt'
      ansible.builtin.command: '/usr/local/bin/duba restore --time={{ __molecule__between_backups_result["stdout"] }} --target=/var/tmp/molecule-restore-old /srv/duba-molecule/plain/file.txt'
      changed_when: false

    - name: 'duba restore --target=/var/tmp/molecule-restore-divided /srv/duba-molecule/divided/alice/files/x.txt'
      ansible.builtin.command: '/usr/local/bin/duba restore --target=/var/tmp/molecule-restore-divided /srv/duba-molecule/divided/alice/files/x.txt'
      changed_when: false

    - name: 'cat the restored files'
      ansible.builtin.slurp:
        src: '{{ item }}'
      loop:
        - '/var/tmp/molecule-restore-divided/srv/duba-molecule/divided/alice/files/x.txt'
        - '/var/tmp/molecule-restore-latest/srv/duba-molecule/plain/file.txt'
        - '/var/tmp/molecule-restore-old/srv/duba-molecule/plain/file.txt'
      register: '__molecule__restored_files_result'

    - name: 'Assert that the restores brought back the right versions'
      ansible.builtin.assert:
        that: '__molecule__restored_files_result["results"] | map(attribute="content") | map("b64decode") | list == ["alice v1", "plain v2", "plain v1"]'
        fail_msg: '{{ __molecule__restored_files_result["results"] | map(attribute="content") | map("b64decode") | list }}'

    - name: 'duba restore --dry-run /srv/duba-molecule/divided/alice/files/x.txt'
      ansible.builtin.command: '/usr/local/bin/duba restore --dry-run /srv/duba-molecule/divided/alice/files/x.txt'
      changed_when: false
      register: '__molecule__duba_restore_dry_run_result'

    - name: 'Assert that a path in a divided source maps to the backup of its first-level entry'
      ansible.builtin.assert:
        that:
          - '"Backup URL:      file:///var/backups/duba-molecule/srv/duba-molecule/divided/alice" in __molecule__duba_restore_dry_run_result["stdout_lines"]'
          - '"Path to restore: files/x.txt" in __molecule__duba_restore_dry_run_result["stdout_lines"]'
        fail_msg: '{{ __molecule__duba_restore_dry_run_result["stdout_lines"] }}'

    # Without --target, duba restores into a new directory with a random name, and the directories
    # it creates there are for root only. The restored file keeps its own mode.
    - name: 'duba restore /srv/duba-molecule/plain/file.txt'
      ansible.builtin.command: '/usr/local/bin/duba restore /srv/duba-molecule/plain/file.txt'
      changed_when: false
      register: '__molecule__duba_restore_default_result'

    - name: 'stat the default restore target'
      ansible.builtin.stat:
        path: '{{ item }}'
      loop:
        - '{{ __molecule__default_target }}'
        - '{{ __molecule__default_target }}/srv/duba-molecule/plain'
        - '{{ __molecule__default_target }}/srv/duba-molecule/plain/file.txt'
      vars:
        __molecule__default_target: '{{ __molecule__duba_restore_default_result["stderr"] | regex_search("/var/tmp/duba-restore-[^/]+") }}'
      register: '__molecule__default_target_stat_result'

    - name: 'Assert that the default restore target is for root only'
      ansible.builtin.assert:
        that:
          - '__molecule__default_target_stat_result["results"] | map(attribute="stat.mode") | list == ["0700", "0700", "0644"]'
          - '__molecule__default_target_stat_result["results"] | map(attribute="stat.pw_name") | unique | list == ["root"]'
        fail_msg: '{{ __molecule__default_target_stat_result["results"] | map(attribute="stat") | map("dict2items") | map("selectattr", "key", "in", ["path", "mode", "pw_name"]) | map("items2dict") | list | to_json }}'

    - name: 'rm -rf <the default restore target>'
      ansible.builtin.file:
        path: '{{ __molecule__default_target_stat_result["results"][0]["stat"]["path"] }}'
        state: 'absent'

    # duplicity aborts a restore with exit code 35 if the temp dir is too small, duba warns
    # beforehand. 100 MB is below what any duplicity version requires.
    - name: 'mkdir /mnt/duba-molecule-tmp'
      ansible.builtin.file:
        path: '/mnt/duba-molecule-tmp'
        state: 'directory'
        mode: 0o700

    - name: 'mount -t tmpfs -o size=100M tmpfs /mnt/duba-molecule-tmp'
      ansible.builtin.command: 'mount -t tmpfs -o size=100M tmpfs /mnt/duba-molecule-tmp'
      changed_when: false

    - name: 'TMPDIR=/mnt/duba-molecule-tmp duba restore --target=/var/tmp/molecule-restore-small-tmp /srv/duba-molecule/plain/file.txt'
      ansible.builtin.command: '/usr/local/bin/duba restore --target=/var/tmp/molecule-restore-small-tmp /srv/duba-molecule/plain/file.txt'
      environment:
        TMPDIR: '/mnt/duba-molecule-tmp'
      changed_when: false
      failed_when: false
      register: '__molecule__duba_restore_small_tmp_result'

    - name: 'umount /mnt/duba-molecule-tmp'
      ansible.builtin.command: 'umount /mnt/duba-molecule-tmp'
      changed_when: false

    - name: 'rm -rf /var/tmp/molecule-restore-small-tmp'
      ansible.builtin.file:
        path: '/var/tmp/molecule-restore-small-tmp'
        state: 'absent'

    - name: 'Assert that duba warned about the small temp dir, and duplicity aborted with 35'
      ansible.builtin.assert:
        that:
          - '__molecule__duba_restore_small_tmp_result["rc"] == 35'
          - '"/mnt/duba-molecule-tmp has" in __molecule__duba_restore_small_tmp_result["stderr"]'
          - '"will abort with exit code 35" in __molecule__duba_restore_small_tmp_result["stderr"]'
        fail_msg: '{{ __molecule__duba_restore_small_tmp_result | to_json }}'

    # a divided source is one backup per entry, duba refuses to restore it as a whole (212)
    - name: 'duba restore /srv/duba-molecule/divided'
      ansible.builtin.command: '/usr/local/bin/duba restore /srv/duba-molecule/divided'
      changed_when: false
      register: '__molecule__duba_restore_divided_result'
      failed_when: '__molecule__duba_restore_divided_result["rc"] != 212'

    # One failed source has to fail the whole run, also if the other sources finish after it.
    # A regular file in place of the backup directory of the divided entry "broken" breaks its
    # backup, the other sources still back up fine.
    - name: 'mkdir /srv/duba-molecule/divided/broken'
      ansible.builtin.file:
        path: '/srv/duba-molecule/divided/broken'
        state: 'directory'
        mode: 0o755

    - name: 'touch /var/backups/duba-molecule/srv/duba-molecule/divided/broken'
      ansible.builtin.copy:
        dest: '/var/backups/duba-molecule/srv/duba-molecule/divided/broken'
        content: ''
        mode: 0o644

    - name: 'systemctl start duba.service # with a broken source' # noqa command-instead-of-module (a oneshot run, not a state)
      ansible.builtin.command: 'systemctl start duba.service'
      changed_when: false
      failed_when: false
      register: '__molecule__duba_service_result'

    - name: 'journalctl --unit=duba.service --lines=200'
      ansible.builtin.command: 'journalctl --unit=duba.service --no-pager --lines=200'
      changed_when: false
      register: '__molecule__duba_journal_result'

    - name: 'Assert that the broken source failed the run, and duba names it'
      ansible.builtin.assert:
        that:
          - '__molecule__duba_service_result["rc"] != 0'
          - '__molecule__duba_journal_result["stdout_lines"] | select("search", "ERROR: duba - Exit code [0-9]+: .* file:///var/backups/duba-molecule/srv/duba-molecule/divided/broken$") | list | length > 0'
        fail_msg: '{{ __molecule__duba_journal_result["stdout_lines"] }}'

    - name: 'rm -rf /srv/duba-molecule/divided/broken /var/backups/duba-molecule/srv/duba-molecule/divided/broken'
      ansible.builtin.file:
        path: '{{ item }}'
        state: 'absent'
      loop:
        - '/srv/duba-molecule/divided/broken'
        - '/var/backups/duba-molecule/srv/duba-molecule/divided/broken'
