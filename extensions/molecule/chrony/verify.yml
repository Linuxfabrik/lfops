- name: 'Verify the chrony role configured chronyd'
  hosts: 'systems_under_test'
  gather_facts: false
  tasks:

    # Ask chronyd for its sources instead of reading the file: on Debian and Ubuntu chronyd only
    # reads /etc/chrony/chrony.conf, so a file deployed to the wrong path would pass a file check
    # and leave the configured source unused.
    - name: 'chronyc -n -c sources'
      ansible.builtin.command: 'chronyc -n -c sources'
      changed_when: false
      register: '__molecule__chronyc_sources_result'

    # Only that source: the role configures no distribution pools and no DHCP sources, and a
    # distribution default next to it (Ubuntu 26.04 ships its NTS pools with `prefer` in
    # /etc/chrony/sources.d) would take over and chronyd would never use it. The source from the
    # inventory also replaces the role's default ntp.metas.ch instead of being added to it.
    - name: 'Assert that chronyd uses only the source configured in the inventory'
      ansible.builtin.assert:
        that: '__molecule__chronyc_sources_result["stdout_lines"] | map("split", ",") | map(attribute=2) | list == ["192.0.2.1"]'
        fail_msg: '{{ __molecule__chronyc_sources_result["stdout_lines"] }}'

    # RHEL 10 no longer ships /etc/chrony.keys. A chrony.conf that still pointed at it would
    # make chronyd log "Could not open keyfile" every time it starts, and the role restarts it.
    # Requiring chronyd's own start line as well keeps the check from passing on a journal it
    # cannot read.
    - name: 'Verify that chronyd started without a missing key file'
      when:
        - 'ansible_facts["os_family"] == "RedHat"'
      block:

        - name: 'Gather the service facts'
          ansible.builtin.service_facts:  # yamllint disable-line rule:empty-values

        - name: 'Assert that chronyd.service is running'
          ansible.builtin.assert:
            that:
              - 'ansible_facts["services"]["chronyd.service"]["state"] == "running"'

        - name: 'journalctl --unit chronyd.service --boot'
          ansible.builtin.command: 'journalctl --unit chronyd.service --boot --no-pager --output cat'
          changed_when: false
          register: '__molecule__chronyd_journal_result'

        - name: 'Assert that chronyd started without reporting a missing key file'
          ansible.builtin.assert:
            that:
              - '"chronyd version" in __molecule__chronyd_journal_result["stdout"]'
              - '"Could not open keyfile" not in __molecule__chronyd_journal_result["stdout"]'
            fail_msg: '{{ __molecule__chronyd_journal_result["stdout_lines"] | select("search", "chronyd version|keyfile") | list }}'

    # A client that sends 30 requests in a row, each right after the answer to the previous one,
    # exceeds a burst of 4 by far. chronyd has to answer the first of them, which proves that
    # chrony__allow took effect, and drop most of the rest, which proves chrony__ratelimit did.
    # The Python Ansible runs with, since RHEL 8 has no `python3` without the python3 package.
    - name: 'Send 30 NTP requests to 127.0.0.1 in a row'
      ansible.builtin.command:
        argv:
          - '{{ ansible_python_interpreter | d(ansible_facts["discovered_interpreter_python"]) }}'
          - '-c'
          - |
            import socket
            answered = 0
            with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as sock:
                sock.settimeout(0.2)
                sock.connect(('127.0.0.1', 123))
                for _ in range(30):
                    sock.send(b'\x23' + bytes(47))
                    try:
                        sock.recv(1024)
                        answered += 1
                    except socket.timeout:
                        pass
            print(answered)
      changed_when: false
      register: '__molecule__ntp_burst_result'

    - name: 'chronyc serverstats'
      ansible.builtin.command: 'chronyc serverstats'
      changed_when: false
      register: '__molecule__chronyc_serverstats_result'

    - name: 'Assert that chronyd answered the first requests and dropped most of the others'
      ansible.builtin.assert:
        that:
          - '__molecule__ntp_burst_result["stdout"] | int >= 4'
          - '__molecule__ntp_burst_result["stdout"] | int < 30'
          - '__molecule__chronyc_serverstats_result["stdout"] | regex_search("NTP packets dropped +: +([1-9][0-9]*)") is not none'
        fail_msg: 'answered: {{ __molecule__ntp_burst_result["stdout"] }}, {{ __molecule__chronyc_serverstats_result["stdout_lines"] }}'
