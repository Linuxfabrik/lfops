# Molecule scenario marker for the 'reboot_now' sub-scenario, run with
# `molecule test --scenario-name bootloader/reboot_now`.
#
# Destructive: the converge run reboots the systems under test, because that is the behaviour
# under test. The 'install' sub-scenario covers the default path, where the role only files a
# reboot request and the host stays up.
#
# The prepare playbook is overridden to work around a property of the Rocky 8 cloud image that an
# installed host does not have; see the scenario-local prepare.yml. It imports the shared
# vm-prepare.yml first, so the systems under test are still waited for and their facts still
# gathered.
provisioner:
  playbooks:
    prepare: '${MOLECULE_SCENARIO_DIRECTORY}/prepare.yml'
