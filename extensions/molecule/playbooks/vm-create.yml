# Shared, controller-side setup. Runs once on localhost, so there is no run_once juggling: the
# keypair and pool info become normal facts on localhost that the later plays read via
# hostvars["localhost"]. The storage pool lives on the hypervisor, so that one task is delegated
# there; the result is registered on localhost either way.
- name: 'Prepare the controller for VM creation'
  hosts: 'localhost'
  gather_facts: false
  vars:
    __molecule__ephemeral_dir: '{{ lookup("env", "MOLECULE_EPHEMERAL_DIRECTORY") }}'
  tasks:

    - name: 'Generate the ephemeral SSH keypair'
      community.crypto.openssh_keypair:
        path: '{{ __molecule__ephemeral_dir }}/molecule_key'
        type: 'ed25519'
        comment: 'molecule'
      register: '__molecule__keypair_result'

    - name: 'Get the libvirt storage pool info'
      community.libvirt.virt_pool:
        command: 'info'
        uri: '{{ kvm_vm__connect_url | d("qemu:///system") }}'
      register: '__molecule__pool_result'
      delegate_to: '{{ __molecule__hypervisor }}'

    # Without this the missing pool surfaces further down as a dict lookup on an absent key
    # ("has no attribute"), naming neither the pool nor what to do about it.
    - name: 'Assert that the configured storage pool exists'
      ansible.builtin.assert:
        that:
          - 'kvm_vm__pool in __molecule__pool_result["pools"]'
        quiet: true
        fail_msg: >-
          The libvirt storage pool "{{ kvm_vm__pool }}" does not exist on
          {{ __molecule__hypervisor }}. Available: {{ __molecule__pool_result["pools"] | list | join(", ") }}.
          See "Preparing the controller" in CONTRIBUTING.md for how to create it, or set
          LFOPS_TEST_POOL to a pool you can write.

    - name: 'Ensure the ephemeral inventory directory exists'
      ansible.builtin.file:
        path: '{{ __molecule__ephemeral_dir }}/inventory'
        state: 'directory'
        mode: 0o755


# One VM per host in systems_under_test. The kvm_vm role delegates to kvm_vm__host, so this play
# never connects to the (not yet existing) target. It deliberately does not escalate: the libvirt
# calls go through the invoking user's 'libvirt' group membership, and the pool writes below (the
# image download, and the role's qemu-img / virt-customize) are plain filesystem I/O into the
# directory of the pool named by kvm_vm__pool, which that user has to be able to write. See
# LFOPS_TEST_POOL in CONTRIBUTING.md for why that should not be the distribution's 'default' pool.
- name: 'Create VM instances using the kvm_vm role'
  hosts: 'systems_under_test'
  gather_facts: false
  vars:
    kvm_vm__name: '{{ __molecule__instance_name }}'
    # Throwaway test VMs: set a known root password for console login during debugging. SSH still
    # uses the ephemeral keypair below.
    kvm_vm__root_password: 'linuxfabrik'
    kvm_vm__ssh_authorized_keys:
      - '{{ hostvars["localhost"]["__molecule__keypair_result"]["public_key"] }}'
    kvm_vm__state: 'running'
    # Directory of the pool named by kvm_vm__pool, where both the cached base images and the
    # per-VM disks live.
    __molecule__pool_path: >-
      {{ hostvars["localhost"]["__molecule__pool_result"]["pools"][kvm_vm__pool
      | d("default")]["path"] }}
  pre_tasks:

    # Refresh the cached base image only while the pool holds no boot disk at all. Detecting a
    # rebuilt upstream image needs no work of ours: with no checksum set, get_url's "file already
    # exists" early exit never fires, so the request goes out as a conditional GET carrying
    # If-Modified-Since and comes back 200 whenever upstream is newer. What must not happen is
    # that refresh landing under an existing boot disk. A qcow2 overlay records the *path* of its
    # backing file and reads its unallocated clusters straight from it, so replacing the base
    # image hands every overlay pointing at that path a different image the next time it is
    # opened. get_url finishes with a rename, so a guest that is running right now keeps reading
    # the old inode through its open descriptor and survives; the damage surfaces on its next
    # boot, or on the next qemu-img / virt-customize touching that disk.
    # The guard is pool-wide on purpose, not "does *this* VM's boot disk exist": with
    # LFOPS_TEST_ID (see "Running scenarios in parallel" in CONTRIBUTING.md) concurrent runs share
    # the pool under different instance names, so a per-VM guard would happily replace the image
    # another run's VM is sitting on. Blocking on any boot disk is coarser than needed - it also
    # defers a Rocky 10 refresh while only a Rocky 9 VM exists - but the refresh is an
    # optimisation, and the next run that starts with a drained pool picks it up.
    - name: 'List the boot disks currently in the storage pool'
      ansible.builtin.find:
        paths: '{{ __molecule__pool_path }}'
        patterns: '*-boot.qcow2'
      register: '__molecule__boot_disks_result'
      delegate_to: '{{ __molecule__hypervisor }}'

    # mode 0664, not 0644: the pool directory carries a default ACL granting the invoking
    # user rw (see "Preparing the controller" in CONTRIBUTING.md), and a file's ACL mask is
    # taken from the group bits of its creation mode. At 0644 the mask comes out r--, leaving
    # that ACL entry ineffective from birth, and the next refresh then fails with
    # "Destination ... is not writable" once libvirt has chowned the image to qemu, which it
    # does to every backing file a VM boots off. At 0664 the mask stays rw-, the chown
    # preserves the ACL, and the replacement goes through. Raise timeout well above the 10s
    # default too: the images are several hundred MB and one play downloads all of them at
    # once (forks), so individual connections stall past 10s under the shared bandwidth and
    # hit "read operation timed out".
    # Verified against ansible-core 2.16.18.
    - name: 'Download the cloud image into the storage pool'
      ansible.builtin.get_url:
        url: '{{ molecule__vm_image_url }}'
        dest: '{{ __molecule__pool_path }}/{{ kvm_vm__base_image }}'
        mode: 0o664
        timeout: 120
        # Stage the download inside the pool, not in remote_tmp. A file picks the ACL up from
        # the directory it is created in, and get_url finishes with a plain rename, which
        # carries none: a temp file staged elsewhere on the same filesystem lands here with no
        # ACL at all, and the grant above is silently lost on every refresh.
        tmp_dest: '{{ __molecule__pool_path }}'
      delegate_to: '{{ __molecule__hypervisor }}'
      when:
        - 'molecule__vm_image_url is defined'
        - '__molecule__boot_disks_result["files"] | length == 0'

  roles:
    - role: 'linuxfabrik.lfops.kvm_vm'


# Discover each VM's address via its libvirt DHCP lease and write it into Molecule's ephemeral
# inventory directory. Molecule includes that directory automatically, so converge and verify
# reach the VMs over SSH. See the inventory-model note in config.yml for why this is hand-written
# instead of using Molecule's instance_config.
- name: 'Discover VM addresses and write the dynamic inventory'
  hosts: 'systems_under_test'
  gather_facts: false
  vars:
    __molecule__ephemeral_dir: '{{ lookup("env", "MOLECULE_EPHEMERAL_DIRECTORY") }}'
  tasks:

    # Use --source arp: libvirt reads the host's neighbour cache (ip neigh on the bridge), so it
    # only ever reports addresses currently live on the network. We rejected the two alternatives:
    #   --source lease reads libvirt's DHCP lease table, which keeps every still-unexpired lease.
    #     The VMs reuse a stable MAC across destroy/create cycles but regenerate their machine-id
    #     (hence DHCP client-id) on each rebuilt boot disk, so dnsmasq hands out a fresh IP every
    #     time and the old leases linger. domifaddr then returns several IPs for one MAC and there
    #     is no way to tell the live one from the stale ones without sorting by lease expiry.
    #   --source agent needs qemu-guest-agent running inside the guest, which only the Rocky cloud
    #     image ships preinstalled - the VMs install no extra packages (kvm_vm__packages is []), so
    #     on Debian/Ubuntu the agent never connects.
    # --source arp sidesteps both: the neighbour cache holds only what is reachable now, so stale
    # leases never appear, and it needs nothing inside the guest. The entry is populated once the
    # VM emits traffic (its DHCP exchange does this within seconds), so the retry loop below covers
    # the short boot window where it is not yet there.
    - name: 'Wait for the VM to report a non-loopback IPv4 address via the host ARP table'
      ansible.builtin.command:
        cmd: 'virsh --connect {{ kvm_vm__connect_url | d("qemu:///system") }} domifaddr {{ __molecule__instance_name }} --source arp'
      register: '__molecule__vm_ipaddr_result'
      until: >-
        __molecule__vm_ipaddr_result['stdout_lines']
        | select('ansible.builtin.search', 'ipv4')
        | reject('ansible.builtin.search', '^\s*lo\s')
        | list | length > 0
      retries: 15
      delay: 2
      changed_when: false
      delegate_to: '{{ __molecule__hypervisor }}'

    - name: 'Parse the VM IPv4 address'
      ansible.builtin.set_fact:
        __molecule__vm_ipaddr: >-
          {{
            __molecule__vm_ipaddr_result['stdout_lines']
            | select('ansible.builtin.search', 'ipv4')
            | reject('ansible.builtin.search', '^\s*lo\s')
            | first
            | ansible.builtin.regex_search('([0-9]{1,3}\.){3}[0-9]{1,3}')
          }}

    - name: 'Write the dynamic VM inventory'
      ansible.builtin.copy:
        content: |
          molecule:
            hosts:
          {% for host in ansible_play_hosts %}
              {{ host }}:
                ansible_host: '{{ hostvars[host]["__molecule__vm_ipaddr"] }}'
                ansible_ssh_private_key_file: '{{ __molecule__ephemeral_dir }}/molecule_key'
                ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
          {% endfor %}
        dest: '{{ __molecule__ephemeral_dir }}/inventory/molecule_vm.yml'
        mode: 0o644
      delegate_to: 'localhost'
      run_once: true # single write that loops over ansible_play_hosts to emit every host at once
