# Does not escalate, for the same reason as vm-create.yml: the libvirt calls go through the
# 'libvirt' group and the disk removal happens in the user-writable pool directory.
- name: 'Destroy VM instances using the kvm_vm role'
  hosts: 'systems_under_test'
  gather_facts: false
  roles:
    - role: 'linuxfabrik.lfops.kvm_vm'
  vars:
    kvm_vm__name: '{{ __molecule__instance_name }}'
    kvm_vm__state: 'absent'


- name: 'Clean up Molecule artifacts on the controller'
  hosts: 'localhost'
  gather_facts: false
  vars:
    __molecule__ephemeral_dir: '{{ lookup("env", "MOLECULE_EPHEMERAL_DIRECTORY") }}'
    __molecule__test_targets: '{{ lookup("env", "LFOPS_TEST_TARGETS") }}'
  tasks:

    # Only after an unfiltered destroy. Both artifacts are shared by every VM of the scenario,
    # while LFOPS_TEST_TARGETS scopes the play above to a subset: localhost is always part of the
    # limit (see config.yml), so this play runs either way. Removing them after a partial destroy
    # strands every VM that survived. Their cloud-init injected the public half of this keypair
    # and vm-create.yml only generates a new one when it is absent, so the next run would come up
    # with a key none of them accept and fail in prepare with "Connection closed by <ip> port 22".
    # There is no way back from that: nothing re-injects a key into a running VM, and create
    # skips instances that already exist, so they have to be destroyed and rebuilt by hand.
    # Keeping the files is harmless by comparison, the next unfiltered destroy removes them.
    - name: 'Remove the ephemeral SSH keypair and dynamic inventory'
      ansible.builtin.file:
        path: '{{ __molecule__ephemeral_dir }}/{{ item }}'
        state: 'absent'
      loop:
        - 'molecule_key'
        - 'molecule_key.pub'
        - 'inventory/molecule_vm.yml'
      when:
        - '__molecule__test_targets | length == 0'
