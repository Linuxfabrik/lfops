# MongoDB with authentication and a single-member replica set, as Rocket.Chat needs it. The
# member keeps the default name `localhost:27017`, which the container cannot use, so Rocket.Chat
# only starts if it does not discover the members by their names.
mongodb__admin_user:
  username: 'mongodb-admin'
  password: 'linuxfabrik'
mongodb__conf_net_bind_ip:
  - 'localhost'
  # the container reaches the host as host.containers.internal, MongoDB sees the host's address
  - '{{ ansible_facts["default_ipv4"]["address"] }}'
mongodb__conf_security_authorization: true
# a replica set with authentication needs a keyfile; any base64 string of 6 or more characters
mongodb__keyfile_content: 'linuxfabrik'

repo_mongodb__version: '8.0'

rocketchat__mongodb_login:
  username: 'rocketchat'
  password: 'linuxfabrik'
rocketchat__root_url: 'http://localhost:3000'
