# The dump user enables the daily mariadb-dump, which needs mydumper from the mydumper repository.
mariadb_server__admin_user:
  username: 'mariadb-admin'
  password: 'linuxfabrik'

# A schema for the dump to find in verify.yml.
mariadb_server__databases__group_var:
  - name: 'molecule'
    state: 'present'

# The special characters check that the login escapes the password correctly for both the
# mariadb client and mydumper. verify.yml searches /etc for the marker `MoleculeDumpPw`.
mariadb_server__dump_user:
  username: 'mariadb-dump'
  password: 'MoleculeDumpPw"fab\rik #''x'

repo_mariadb__version: '11.8'
