# Additional Galera node. Identical to the shared inventory's rocky10-vm (which is node 1 of
# the cluster); only the inventory hostname differs, which is what gives it its own libvirt
# domain and guest hostname via __molecule__instance_name. A Galera cluster needs several nodes
# of the same OS, and the shared inventory carries one VM per OS, so the extra ones live here.

ansible_user: 'root'

kvm_vm__autostart: false
kvm_vm__base_image: 'Rocky-10-GenericCloud-Base.latest.x86_64.qcow2'
kvm_vm__boot_disk_size: '20G'
kvm_vm__host: '{{ __molecule__hypervisor }}'
kvm_vm__memory: 4096
kvm_vm__network_connections:
  - name: 'enp1s0'
    network_name: 'default'
    dhcp4: true
kvm_vm__osinfo: 'rocky10'
kvm_vm__packages: []
kvm_vm__vcpus: 2

molecule__vm_image_url: 'https://dl.rockylinux.org/pub/rocky/10/images/x86_64/Rocky-10-GenericCloud-Base.latest.x86_64.qcow2'
