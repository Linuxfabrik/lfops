# yamllint disable rule:empty-values

# Scenario inventory, layered on top of the shared one (extensions/molecule/inventory) through the
# two --inventory flags in config.yml. Node 1 of every cluster comes from there; nodes 2 and 3 are
# defined in this scenario's own host_vars.

# The playbook under test targets 'lfops_mariadb_server' (see playbooks/mariadb_server.yml: hosts).
lfops_mariadb_server:
  children:
    systems_under_test:

# Galera is Red Hat only here: the role gates all SELinux work on os_family == 'RedHat', and
# SELinux is the whole point of this scenario.
#
# One cluster per OS, three nodes each. Never run more than one OS at a time: the nodes of a
# cluster find each other through mariadb_server__cnf_wsrep_cluster_addresses, which is built from
# the hosts of the running play, so a run covering two OSes would wire six nodes into one cluster.
# Nine VMs at 4 GB would not fit on a normal workstation either. Always pass LFOPS_TEST_TARGETS:
#
#   LFOPS_TEST_TARGETS='rocky9-vm,rocky9-vm-2,rocky9-vm-3' molecule test --scenario-name mariadb_server/galera
#
# Node order matters. The first host of the play bootstraps the cluster (see converge.yml), and
# with the playbook's serial: 1 the play order follows the inventory order below.
systems_under_test:
  hosts:
    rocky8-vm:
    rocky8-vm-2:
    rocky8-vm-3:
    rocky9-vm:
    rocky9-vm-2:
    rocky9-vm-3:
    rocky10-vm:
    rocky10-vm-2:
    rocky10-vm-3:
