# yamllint disable rule:empty-values

# apache_solr targets 'lfops_apache_solr' (see playbooks/apache_solr.yml: hosts).
#
# The hosts cover every Java package the role picks for Solr 9: OpenJDK 17 on RHEL 8 and 9,
# Debian 12 and Ubuntu, OpenJDK 21 on RHEL 10 and Debian 13, which ship no Java 17.
lfops_apache_solr:
  children:
    systems_under_test:

systems_under_test:
  hosts:
    debian12-vm:
    debian13-vm:
    rocky8-vm:
    rocky9-vm:
    rocky10-vm:
    ubuntu2204-vm:
    ubuntu2404-vm:
    ubuntu2604-vm:
