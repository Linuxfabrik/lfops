# OpenSearch releases this role ships a configuration template for. Only the major
# version selects the template, so the entries are majors. The installed version is
# matched against this list so an unsupported one aborts with a clear message instead
# of a missing-file error. Extend it whenever a template for a new major is added.
__opensearch__supported_versions:
  - '1.x'
  - '2.x'
