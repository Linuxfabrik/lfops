argument_specs:
  main:
    options:

      at__allow_users__dependent_var:
        type: 'list'
        elements: 'dict'
        required: false
        default: []
        description: 'Users besides root that may use at. Dependent-role injection.'

      at__allow_users__group_var:
        type: 'list'
        elements: 'dict'
        required: false
        default: []
        description: 'Users besides root that may use at. Group-level override.'

      at__allow_users__host_var:
        type: 'list'
        elements: 'dict'
        required: false
        default: []
        description: 'Users besides root that may use at. Host-level override.'

      at__service_enabled:
        type: 'bool'
        required: false
        default: true
        description: 'Whether atd.service is enabled at boot.'

      at__service_state:
        type: 'str'
        required: false
        choices:
          - 'reloaded'
          - 'restarted'
          - 'started'
          - 'stopped'
        description: >-
          State of atd.service. Defaults to started or stopped depending
          on at__service_enabled.
