- block:

  - name: 'install telegraf'
    ansible.builtin.package:
      name: 'telegraf'
      state: 'present'
    retries: 3 # ride out a brief outage of the package repository
    delay: 10

  tags:
    - 'telegraf'


- block:

  # the configuration holds credentials; telegraf runs as the user `telegraf`
  - name: 'Deploy /etc/telegraf/telegraf.conf'
    ansible.builtin.template:
      backup: true
      src: 'etc/telegraf/telegraf.conf.j2'
      dest: '/etc/telegraf/telegraf.conf'
      owner: 'root'
      group: 'telegraf'
      mode: 0o640
    notify: 'telegraf: systemctl restart telegraf.service'

  - name: 'Remove rpmnew / rpmsave (and Debian equivalents)'
    ansible.builtin.include_role:
      name: 'shared'
      tasks_from: 'remove-rpmnew-rpmsave.yml'
    vars:
      shared__remove_rpmnew_rpmsave_config_file: '/etc/telegraf/telegraf.conf'

  - name: 'Deploy /etc/telegraf/telegraf.d configs'
    ansible.builtin.template:
      backup: true
      src: 'etc/telegraf/telegraf.d/{{ item["template"] }}.conf.j2'
      dest: '/etc/telegraf/telegraf.d/{{ item["filename"] }}.conf'
      owner: 'root'
      group: 'telegraf'
      mode: 0o640
    when:
      - 'item["state"] | d("present") != "absent"'
    loop: '{{ telegraf__conf__combined_var }}'
    notify: 'telegraf: systemctl restart telegraf.service'

  - name: 'Remove /etc/telegraf/telegraf.d configs'
    ansible.builtin.file:
      dest: '/etc/telegraf/telegraf.d/{{ item["filename"] }}.conf'
      state: 'absent'
    when:
      - 'item["state"] | d("present") == "absent"'
    loop: '{{ telegraf__conf__combined_var }}'
    notify: 'telegraf: systemctl restart telegraf.service'

  # `backup: true` keeps the mode of the replaced file, so backups of the formerly
  # world-readable files would still expose the credentials
  - name: 'find /etc/telegraf -name *~'
    ansible.builtin.find:
      paths: '/etc/telegraf'
      patterns: '*~'
      recurse: true
    register: '__telegraf__backups_result'

  - name: 'chmod 0640 /etc/telegraf/**/*~'
    ansible.builtin.file:
      path: '{{ item["path"] }}'
      owner: 'root'
      group: 'telegraf'
      mode: 0o640
    loop: '{{ __telegraf__backups_result["files"] }}'
    loop_control:
      label: '{{ item["path"] }}'

  tags:
    - 'telegraf'
    - 'telegraf:configure'


- block:

  - name: 'systemctl {{ telegraf__service_enabled | bool | ternary("enable", "disable") }} telegraf.service'
    ansible.builtin.service:
      name: 'telegraf.service'
      enabled: '{{ telegraf__service_enabled | bool }}'

  - name: 'systemctl {{ telegraf__service_state | regex_replace("p?ed$", "") }} telegraf.service'
    ansible.builtin.service:
      name: 'telegraf.service'
      state: '{{ telegraf__service_state }}'
    register: '__telegraf__service_state_result'

  tags:
    - 'telegraf'
    - 'telegraf:state'
