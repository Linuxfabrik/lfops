- block:

  - name: 'install dnf-command(versionlock)'
    ansible.builtin.package:
      name: 'dnf-command(versionlock)'
      state: 'present'
    retries: 3 # ride out a brief outage of the package repository
    delay: 10

  # the module manages single entries instead of rewriting the whole locklist, so
  # locks set outside of this role (for example by monitoring_plugins) survive.
  - name: 'dnf versionlock {{ item["state"] | d("present") }} {{ item["name"] }}'
    community.general.dnf_versionlock:
      name: '{{ item["name"] }}'
      raw: '{{ item["raw"] | d(false) | bool }}'
      state: '{{ item["state"] | d("present") }}'
    loop: '{{ dnf_versionlock__versionlocks__combined_var }}'
    loop_control:
      label: '{{ item["name"] }}'

  tags:
    - 'dnf_versionlock'
