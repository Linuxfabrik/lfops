- name: 'Set platform/version specific variables'
  ansible.builtin.import_role:
    name: 'shared'
    tasks_from: 'platform-variables.yml'
  tags:
    - 'always'


- block:

  - name: 'Combined Mounts'
    ansible.builtin.debug:
      var: 'mount__mounts__combined_var'

  - name: 'Install {{ __mount__nfs_client_package }}'
    ansible.builtin.package:
      name: '{{ __mount__nfs_client_package }}'
      state: 'present'
    retries: 3 # ride out a brief outage of the package repository
    delay: 10
    when:
      - '((mount__mounts__combined_var | selectattr("state", "defined") | selectattr("state", "ne", "absent") | list)
          + (mount__mounts__combined_var | selectattr("state", "undefined") | list))
          | selectattr("fstype", "equalto", "nfs") | list | length > 0'

  - name: 'Install {{ __mount__cifs_client_package }}'
    ansible.builtin.package:
      name: '{{ __mount__cifs_client_package }}'
      state: 'present'
    retries: 3 # ride out a brief outage of the package repository
    delay: 10
    when:
      - '((mount__mounts__combined_var | selectattr("state", "defined") | selectattr("state", "ne", "absent") | list)
          + (mount__mounts__combined_var | selectattr("state", "undefined") | list))
          | selectattr("fstype", "equalto", "cifs") | list | length > 0'

  # An octal number without quotes arrives as a decimal one (0o750 as 488), which the file module
  # would apply as it is.
  - name: 'Assert that the mode of a mount is a quoted octal number'
    ansible.builtin.assert:
      that:
        - 'item["mode"] is string'
        - 'item["mode"] is regex("^[0-7]{3,4}$")'
      quiet: true
      fail_msg: 'The mode of the mount {{ item["path"] }} has to be a string such as "0750", got {{ item["mode"] }}.'
    loop: '{{ mount__mounts__combined_var | selectattr("mode", "defined") }}'
    loop_control:
      label: '{{ item["path"] }}'

  - name: 'stat mount-point'
    ansible.builtin.stat:
      path: '{{ item["path"] }}'
    loop: '{{ mount__mounts__combined_var }}'
    loop_control:
      label: '{{ item["path"] }}'
    register: '__mount__stat_result'

  # Only a missing mount point is created. From the second run on, the path is the root of the
  # mounted filesystem, whose owner and mode belong to the share (e.g. 0777 on an NFS export,
  # where root may not even be allowed to change them).
  - name: 'mkdir -p mount-point'
    ansible.builtin.file:
      path: '{{ item["item"]["path"] }}'
      state: 'directory'
      owner: 'root'
      group: 'root'
      mode: 0o755
    loop: '{{ __mount__stat_result["results"] }}'
    loop_control:
      label: '{{ item["item"]["path"] }}'
    when:
      - 'not item["stat"]["exists"]'
      - 'item["item"]["state"] | d("mounted") != "absent"'

  - name: 'Mount volumes'
    ansible.posix.mount:
      path: '{{ item["path"] }}'
      src: '{{ item["src"] }}'
      opts: '{{ item["opts"] | d(omit) }}'
      state: '{{ item["state"] | d("mounted") }}'
      fstype: '{{ item["fstype"] }}'
    loop: '{{ mount__mounts__combined_var }}'

  # After mounting, so that it reaches the root of the mounted filesystem right away, and only
  # what the inventory asks for.
  - name: 'chown / chmod mount-point'
    ansible.builtin.file:
      path: '{{ item["path"] }}'
      state: 'directory'
      owner: '{{ item["owner"] | d(omit) }}'
      group: '{{ item["group"] | d(omit) }}'
      mode: '{{ item["mode"] | d(omit) }}'
    loop: '{{ mount__mounts__combined_var }}'
    loop_control:
      label: '{{ item["path"] }}'
    when:
      - 'item["owner"] is defined or item["group"] is defined or item["mode"] is defined'
      - 'item["state"] | d("mounted") != "absent"'

  # A freshly created filesystem carries no SELinux labels, so everything on it is unlabeled_t
  # and confined services such as httpd are denied access ("does not contain SELinux labels"
  # when mounting). Relabel a mounted filesystem whose mount point is still unlabeled, which
  # happens once per new volume. NFS and CIFS get their context from the mount options and
  # are never unlabeled_t, so they are left alone.
  - name: 'stat --format=%C mount-point'
    ansible.builtin.command: 'stat --format=%C {{ item["path"] }}'
    loop: '{{ mount__mounts__combined_var | selectattr("state", "undefined") | list
        + mount__mounts__combined_var | selectattr("state", "defined") | selectattr("state", "in", ["mounted", "remounted", "ephemeral"]) | list }}'
    loop_control:
      label: '{{ item["path"] }}'
    register: '__mount__context_result'
    changed_when: false # read-only
    # under --check the mount point of a new mount does not exist yet; without output the
    # relabelling below is skipped, and a real run fails at "Mount volumes" before it gets here
    failed_when: false
    check_mode: false # read-only, also run in check mode
    when:
      - 'ansible_facts["selinux"]["status"] != "disabled"'

  - name: 'restorecon -R mount-point'
    ansible.builtin.command: 'restorecon -R {{ item["item"]["path"] }}'
    loop: '{{ __mount__context_result["results"] }}'
    loop_control:
      label: '{{ item["item"]["path"] }}'
    when:
      - 'item["stdout"] is defined'
      - 'item["stdout"] is search(":unlabeled_t:")'
    changed_when: true # only runs when the mount point was unlabeled

  tags:
    - 'mount'
