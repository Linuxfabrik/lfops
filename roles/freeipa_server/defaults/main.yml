      freeipa_server__healthcheck_excludes__role_var +
      freeipa_server__healthcheck_excludes__dependent_var +
      freeipa_server__healthcheck_excludes__group_var +
      freeipa_server__healthcheck_excludes__host_var
    ) | linuxfabrik.lfops.combine_lod(unique_key=["type", "value"])
  }}'

