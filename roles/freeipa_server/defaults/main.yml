freeipa_server__healthcheck_on_calendar: '*-*-* 06:{{ 59 | random(seed=inventory_hostname ~ "ipa-healthcheck") }}'  # upstream default: '*-*-* 04:00:00'
freeipa_server__healthcheck_timeout: 30  # upstream default: 10
freeipa_server__healthcheck_timer_enabled: true  # upstream default: false
freeipa_server__healthcheck_timer_state: 'started'
