- block:

  - name: 'check that the hostname has two-levels'
    ansible.builtin.assert:
      that: 'ansible_facts["nodename"].split(".") | length >= 3'
      fail_msg: '"{{ ansible_facts["nodename"] }} has less than two levels. This is required for FreeIPA to work.'

  - name: 'check that the DNS reverse lookup config is working'
    ansible.builtin.assert:
      # ansible determines the domain by using socket.gethostbyaddr() which is a DNS reverse lookup (see module_utils/facts/system/platform.py)
      that: 'ansible_facts["domain"] is defined and ansible_facts["domain"] | length > 0'
      fail_msg: 'DNS reverse lookup for "{{ ansible_facts["fqdn"] }}" failed. This is required for FreeIPA to work.'

  - name: 'Running freeipa.ansible_freeipa.ipaserver with following vars'
    ansible.builtin.debug:
      msg:
        ipaadmin_password: '{{ freeipa_server__ipa_admin_password }}'
        ipaclient_mkhomedir: true
        ipaclient_no_ntp: true
        ipadm_password: '{{ freeipa_server__directory_manager_password }}'
        ipaserver_domain: '{{ freeipa_server__domain }}'
        ipaserver_realm: '{{ freeipa_server__realm }}'
        ipaserver_setup_firewalld: false

  - name: 'Use freeipa.ansible_freeipa.ipaserver role to install and configure FreeIPA as a server'
    ansible.builtin.include_role:
      name: 'freeipa.ansible_freeipa.ipaserver'
    vars:
      ipaadmin_password: '{{ freeipa_server__ipa_admin_password }}'
      ipaclient_mkhomedir: true
      ipaclient_no_ntp: true
      ipadm_password: '{{ freeipa_server__directory_manager_password }}'
      ipaserver_domain: '{{ freeipa_server__domain }}'
      ipaserver_realm: '{{ freeipa_server__realm }}'
      ipaserver_setup_firewalld: false

  tags:
    - 'freeipa_server'


- block:

  - name: 'ensures /etc/systemd/system/pki-tomcatd@.service.d dir exists'
    ansible.builtin.file:
      path: '/etc/systemd/system/pki-tomcatd@.service.d'
      state: 'directory'
      owner: 'root'
      group: 'root'
      mode: 0o755

  - name: 'deploy /etc/systemd/system/pki-tomcatd@.service.d/override.conf'
    ansible.builtin.template:
      backup: true
      src: 'etc/systemd/system/pki-tomcatd@.service.d/override.conf.j2'
      dest: '/etc/systemd/system/pki-tomcatd@.service.d/override.conf'
      owner: 'root'
      group: 'root'
      mode: 0o644
    notify: 'freeipa_server: systemctl daemon-reload'

  # The installer writes its own drop-in to
  # /etc/systemd/system/pki-tomcatd@pki-tomcat.service.d/ipa.conf. We do not touch it: systemd
  # sorts drop-ins by file name across all *.d directories, so "override.conf" is applied after
  # "ipa.conf" and wins, even though "ipa.conf" sits in the more specific instance directory.
  #
  # FreeIPA keeps its own copy of the timeout in /etc/ipa/default.conf and uses it whenever it
  # waits for pki-tomcatd to come up (ipactl, Dogtag install and upgrade, ipa-cacert-manage).
  # If that value stays at the built-in default of 90 seconds, FreeIPA gives up on a slow
  # starting Dogtag long before systemd would, so both have to carry the same value. The file
  # cannot be deployed beforehand, because ipa-server-install rewrites it from scratch.
  - name: 'set startup_timeout in /etc/ipa/default.conf'
    community.general.ini_file:
      backup: true
      create: false # ipa-server-install has to have written the file already
      path: '/etc/ipa/default.conf'
      section: 'global'
      option: 'startup_timeout'
      value: '{{ freeipa_server__systemd_timeoutstartsec }}'
      owner: 'root'
      group: 'root'
      mode: 0o644

  tags:
    - 'freeipa_server'
    - 'freeipa_server:configure'
    - 'freeipa_server:systemd_override'


# ipa-healthcheck.service writes the report to /var/log/ipa/healthcheck/healthcheck.log, which
# the monitoring plugin reads. The package has to come after the server installation: it requires
# ipa-server, and on RHEL 8 it is in the idm:DL1 module stream that the installation enables.
- block:

  - name: 'Install ipa-healthcheck'
    ansible.builtin.package:
      name: 'ipa-healthcheck'
      state: 'present'
    retries: 3
    delay: 10

  tags:
    - 'freeipa_server'
    - 'freeipa_server:healthcheck'


- block:

  - name: 'Assert that every exclude of ipa-healthcheck is of type source, check or key'
    ansible.builtin.assert:
      that:
        - 'item["type"] in ["check", "key", "source"]'
        - 'item["value"] | d("") | string | length > 0'
      fail_msg: >-
        freeipa_server__healthcheck_excludes: "{{ item["type"] | d("") }}" is not one of source,
        check or key, or the value is empty. ipa-healthcheck ignores such an entry without a word.
      quiet: true
    loop: '{{ freeipa_server__healthcheck_excludes__combined_var }}'
    loop_control:
      label: '{{ item["type"] | d("") }} = {{ item["value"] | d("") }}'

  - name: 'Deploy /etc/ipahealthcheck/ipahealthcheck.conf'
    ansible.builtin.template:
      backup: true
      src: 'etc/ipahealthcheck/ipahealthcheck.conf.j2'
      dest: '/etc/ipahealthcheck/ipahealthcheck.conf'
      owner: 'root'
      group: 'root'
      mode: 0o644

  - name: 'Remove rpmnew / rpmsave (and Debian equivalents)'
    ansible.builtin.include_role:
      name: 'shared'
      tasks_from: 'remove-rpmnew-rpmsave.yml'
    vars:
      shared__remove_rpmnew_rpmsave_config_file: '/etc/ipahealthcheck/ipahealthcheck.conf'

  - name: 'mkdir -p /etc/systemd/system/ipa-healthcheck.timer.d'
    ansible.builtin.file:
      path: '/etc/systemd/system/ipa-healthcheck.timer.d'
      state: 'directory'
      owner: 'root'
      group: 'root'
      mode: 0o755

  - name: 'Deploy /etc/systemd/system/ipa-healthcheck.timer.d/z00-linuxfabrik.conf'
    ansible.builtin.template:
      backup: true
      src: 'etc/systemd/system/ipa-healthcheck.timer.d/z00-linuxfabrik.conf.j2'
      dest: '/etc/systemd/system/ipa-healthcheck.timer.d/z00-linuxfabrik.conf'
      owner: 'root'
      group: 'root'
      mode: 0o644
    register: '__freeipa_server__healthcheck_timer_result'

  - name: 'Reload systemd for the changed timers'
    ansible.builtin.include_role:
      name: 'shared'
      tasks_from: 'reload-changed-timers.yml'
    vars:
      shared__reload_changed_timers: '{{
          (__freeipa_server__healthcheck_timer_result is changed) | ternary(["ipa-healthcheck.timer"], [])
        }}'

  - name: 'systemctl daemon-reload' # noqa no-handler (the state tasks below need the new drop-in)
    ansible.builtin.systemd:
      daemon_reload: true
    when:
      - '__freeipa_server__healthcheck_timer_result is changed'

  tags:
    - 'freeipa_server'
    - 'freeipa_server:configure'
    - 'freeipa_server:healthcheck'


# ipa-healthcheck.service is not managed: the timer triggers it. Enabling it would run the
# healthcheck at every boot, since the package installs it with WantedBy=multi-user.target. The
# package leaves the timer disabled through the preset. Verified with ipa-healthcheck 0.19 on
# Rocky 9 and 10.
- block:

  - name: 'systemctl {{ freeipa_server__healthcheck_timer_enabled | bool | ternary("enable", "disable") }} ipa-healthcheck.timer'
    ansible.builtin.service:
      name: 'ipa-healthcheck.timer'
      enabled: '{{ freeipa_server__healthcheck_timer_enabled | bool }}'

  - name: 'systemctl {{ freeipa_server__healthcheck_timer_state | regex_replace("p?ed$", "") }} ipa-healthcheck.timer'
    ansible.builtin.service:
      name: 'ipa-healthcheck.timer'
      state: '{{ freeipa_server__healthcheck_timer_state }}'

  tags:
    - 'freeipa_server'
    - 'freeipa_server:healthcheck'
    - 'freeipa_server:state'


# Without a report, the monitoring plugin warns until the timer runs for the first time, which can
# take up to a day after the installation. So the role runs the healthcheck once, as the timer
# would, as long as there is no report. ipa-healthcheck exits 1 as soon as a check reports a
# problem, which systemctl passes on as a failed unit.
- block:

  - name: 'systemctl start --wait ipa-healthcheck.service'
    ansible.builtin.command:
      cmd: 'systemctl start --wait ipa-healthcheck.service'
      creates: '/var/log/ipa/healthcheck/healthcheck.log'
    register: '__freeipa_server__healthcheck_first_run_result'
    failed_when: '__freeipa_server__healthcheck_first_run_result["rc"] not in [0, 1]'
    when:
      - 'freeipa_server__healthcheck_timer_enabled | bool'

  tags:
    - 'freeipa_server'
    - 'freeipa_server:healthcheck'


# group management
- block:

  - name: 'Limit freeipa_server__groups__combined_var if freeipa_server__limit_groups is set'
    ansible.builtin.set_fact:
      freeipa_server__groups__combined_var: '{{ freeipa_server__groups__combined_var | selectattr("name", "in", freeipa_server__limit_groups) | list }}'
    when:
      - 'freeipa_server__limit_groups is defined and freeipa_server__limit_groups | length > 0'

  - name: 'Combined Groups:'
    ansible.builtin.debug:
      var: 'freeipa_server__groups__combined_var'

  - name: 'Remove FreeIPA groups'
    # freeipa.ansible_freeipa.ipagroup: # TODO: switch back once https://github.com/freeipa/ansible-freeipa/pull/1415 is merged and released
    linuxfabrik.lfops.ipagroup:
      ipaadmin_password: '{{ freeipa_server__ipa_admin_password }}'
      ipaadmin_principal: '{{ freeipa_server__ipa_admin_principal }}'
      name: '{{ item["name"] }}'
      state: 'absent'
    loop: '{{ freeipa_server__groups__combined_var | selectattr("state", "defined") | selectattr("state", "eq", "absent") | list }}'
    loop_control:
      label: '{{ item["name"] }}'

  - name: 'Create or update FreeIPA groups'
    # freeipa.ansible_freeipa.ipagroup: # TODO: switch back once https://github.com/freeipa/ansible-freeipa/pull/1415 is merged and released
    linuxfabrik.lfops.ipagroup:
      ipaadmin_password: '{{ freeipa_server__ipa_admin_password }}'
      ipaadmin_principal: '{{ freeipa_server__ipa_admin_principal }}'
      name: '{{ item["name"] }}'
      description: '{{ item["description"] | d(omit) }}'
      gidnumber: '{{ item["gidnumber"] | d(omit) }}'
      nonposix: '{{ item["nonposix"] | d(omit) }}'
      external: '{{ item["external"] | d(omit) }}'
      state: 'present'
    loop: '{{ (freeipa_server__groups__combined_var | selectattr("state", "defined") | selectattr("state", "ne", "absent") | list)
            + (freeipa_server__groups__combined_var | selectattr("state", "undefined") | list) }}'
    loop_control:
      label: '{{ item["name"] }}'

  tags:
    - 'freeipa_server'
    - 'freeipa_server:configure'
    - 'freeipa_server:group'


