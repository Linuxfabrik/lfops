  - name: 'Combined HBAC Rules:'
    ansible.builtin.debug:
      var: 'freeipa_server__hbacrules__combined_var'

  - name: 'Remove FreeIPA HBAC rules'
    # freeipa.ansible_freeipa.ipahbacrule: # TODO: switch back once https://github.com/freeipa/ansible-freeipa/pull/1415 is merged and released
    linuxfabrik.lfops.ipahbacrule:
      ipaadmin_password: '{{ freeipa_server__ipa_admin_password }}'
      ipaadmin_principal: '{{ freeipa_server__ipa_admin_principal }}'
      name: '{{ item["name"] }}'
      state: 'absent'
    loop: '{{ freeipa_server__hbacrules__combined_var | selectattr("state", "defined") | selectattr("state", "eq", "absent") | list }}'
    loop_control:
      label: '{{ item["name"] }}'

  - name: 'Create or update FreeIPA HBAC rules'
    # freeipa.ansible_freeipa.ipahbacrule: # TODO: switch back once https://github.com/freeipa/ansible-freeipa/pull/1415 is merged and released
    linuxfabrik.lfops.ipahbacrule:
      ipaadmin_password: '{{ freeipa_server__ipa_admin_password }}'
      ipaadmin_principal: '{{ freeipa_server__ipa_admin_principal }}'
      name: '{{ item["name"] }}'
      description: '{{ item["description"] | d(omit) }}'
      usercategory: '{{ item["usercategory"] | d(omit) }}'
      hostcategory: '{{ item["hostcategory"] | d(omit) }}'
      servicecategory: '{{ item["servicecategory"] | d(omit) }}'
      state: 'present'
    loop: '{{ (freeipa_server__hbacrules__combined_var | selectattr("state", "defined") | selectattr("state", "ne", "absent") | list)
            + (freeipa_server__hbacrules__combined_var | selectattr("state", "undefined") | list) }}'
    loop_control:
      label: '{{ item["name"] }}'

  - name: 'Manage FreeIPA HBAC rule members'
    # freeipa.ansible_freeipa.ipahbacrule: # TODO: switch back once https://github.com/freeipa/ansible-freeipa/pull/1415 is merged and released
    linuxfabrik.lfops.ipahbacrule:
      ipaadmin_password: '{{ freeipa_server__ipa_admin_password }}'
      ipaadmin_principal: '{{ freeipa_server__ipa_admin_principal }}'
      name: '{{ item["name"] }}'
      user: '{{ item["users"] | d(omit) }}'
      group: '{{ item["groups"] | d(omit) }}'
      host: '{{ item["hosts"] | d(omit) }}'
      hostgroup: '{{ item["hostgroups"] | d(omit) }}'
      hbacsvc: '{{ item["hbacsvcs"] | d(omit) }}'
      hbacsvcgroup: '{{ item["hbacsvcgroups"] | d(omit) }}'
      action: 'member'
    loop: '{{ (freeipa_server__hbacrules__combined_var | selectattr("state", "defined") | selectattr("state", "ne", "absent") | list)
            + (freeipa_server__hbacrules__combined_var | selectattr("state", "undefined") | list) }}'
    loop_control:
      label: '{{ item["name"] }}'
    when: 'item["users"] is defined or item["groups"] is defined or item["hosts"] is defined or item["hostgroups"] is defined or item["hbacsvcs"] is defined or item["hbacsvcgroups"] is defined'

  - name: 'Enable or disable FreeIPA HBAC rules'
    # freeipa.ansible_freeipa.ipahbacrule: # TODO: switch back once https://github.com/freeipa/ansible-freeipa/pull/1415 is merged and released
    linuxfabrik.lfops.ipahbacrule:
