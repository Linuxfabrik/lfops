# user management
- block:

  - name: 'Limit freeipa_server__users__combined_var if freeipa_server__limit_users is set'
    ansible.builtin.set_fact:
      freeipa_server__users__combined_var: '{{ freeipa_server__users__combined_var | selectattr("name", "in", freeipa_server__limit_users) | list }}'
    when:
      - 'freeipa_server__limit_users is defined and freeipa_server__limit_users | length > 0'

  - name: 'Combined Users:'
    ansible.builtin.debug:
      var: 'freeipa_server__users__combined_var'

  - name: 'Remove FreeIPA users'
    # freeipa.ansible_freeipa.ipauser: # TODO: switch back once https://github.com/freeipa/ansible-freeipa/pull/1415 is merged and released
    linuxfabrik.lfops.ipauser:
      ipaadmin_password: '{{ freeipa_server__ipa_admin_password }}'
      ipaadmin_principal: '{{ freeipa_server__ipa_admin_principal }}'
      name: '{{ item["name"] }}'
      state: 'absent'
    loop: '{{ freeipa_server__users__combined_var | selectattr("state", "defined") | selectattr("state", "eq", "absent") | list }}'
    loop_control:
      label: '{{ item["name"] }}'

  - name: 'Create or update FreeIPA users'
    # freeipa.ansible_freeipa.ipauser: # TODO: switch back once https://github.com/freeipa/ansible-freeipa/pull/1415 is merged and released
    linuxfabrik.lfops.ipauser:
      ipaadmin_password: '{{ freeipa_server__ipa_admin_password }}'
      ipaadmin_principal: '{{ freeipa_server__ipa_admin_principal }}'
      name: '{{ item["name"] }}'
      first: '{{ item["first"] }}'
      last: '{{ item["last"] }}'
      password: '{{ item["password"] | d(omit) }}'
      email: '{{ item["email"] | d(omit) }}'
      shell: '{{ item["shell"] | d(omit) }}'
      sshpubkey: '{{ item["sshpubkey"] | d(omit) }}'
      update_password: '{{ item["update_password"] | d("on_create") }}'
      state: 'present'
    loop: '{{ (freeipa_server__users__combined_var | selectattr("state", "defined") | selectattr("state", "ne", "absent") | list)
            + (freeipa_server__users__combined_var | selectattr("state", "undefined") | list) }}'
    loop_control:
      label: '{{ item["name"] }}'
    # no_log: true

  - name: 'Manage FreeIPA user group memberships'
    # freeipa.ansible_freeipa.ipagroup: # TODO: switch back once https://github.com/freeipa/ansible-freeipa/pull/1415 is merged and released
    linuxfabrik.lfops.ipagroup:
      ipaadmin_password: '{{ freeipa_server__ipa_admin_password }}'
      ipaadmin_principal: '{{ freeipa_server__ipa_admin_principal }}'
      name: '{{ item[1] }}'
      user:
        - '{{ item[0]["name"] }}'
      action: 'member'
    loop: '{{ ((freeipa_server__users__combined_var | selectattr("state", "defined") | selectattr("state", "ne", "absent") | list)
            + (freeipa_server__users__combined_var | selectattr("state", "undefined") | list))
            | subelements("groups", skip_missing=true) }}'
    loop_control:
      label: '{{ item[0]["name"] }} -> {{ item[1] }}'

  tags:
    - 'freeipa_server'
    - 'freeipa_server:configure'
    - 'freeipa_server:users'


# HBAC rule management
- block:

  - name: 'Limit freeipa_server__hbacrules__combined_var if freeipa_server__limit_hbacrules is set'
    ansible.builtin.set_fact:
