# sudo rule management
- block:

  - name: 'Limit freeipa_server__sudorules__combined_var if freeipa_server__limit_sudorules is set'
    ansible.builtin.set_fact:
      freeipa_server__sudorules__combined_var: '{{ freeipa_server__sudorules__combined_var | selectattr("name", "in", freeipa_server__limit_sudorules) | list }}'
    when:
      - 'freeipa_server__limit_sudorules is defined and freeipa_server__limit_sudorules | length > 0'

  - name: 'Combined Sudo Rules:'
    ansible.builtin.debug:
      var: 'freeipa_server__sudorules__combined_var'

  - name: 'Remove FreeIPA sudo rules'
    # freeipa.ansible_freeipa.ipasudorule: # TODO: switch back once https://github.com/freeipa/ansible-freeipa/pull/1415 is merged and released
    linuxfabrik.lfops.ipasudorule:
      ipaadmin_password: '{{ freeipa_server__ipa_admin_password }}'
      ipaadmin_principal: '{{ freeipa_server__ipa_admin_principal }}'
      name: '{{ item["name"] }}'
      state: 'absent'
    loop: '{{ freeipa_server__sudorules__combined_var | selectattr("state", "defined") | selectattr("state", "eq", "absent") | list }}'
    loop_control:
      label: '{{ item["name"] }}'

  - name: 'Create or update FreeIPA sudo rules'
    # freeipa.ansible_freeipa.ipasudorule: # TODO: switch back once https://github.com/freeipa/ansible-freeipa/pull/1415 is merged and released
    linuxfabrik.lfops.ipasudorule:
      ipaadmin_password: '{{ freeipa_server__ipa_admin_password }}'
      ipaadmin_principal: '{{ freeipa_server__ipa_admin_principal }}'
      name: '{{ item["name"] }}'
      description: '{{ item["description"] | d(omit) }}'
      usercategory: '{{ item["usercategory"] | d(omit) }}'
      hostcategory: '{{ item["hostcategory"] | d(omit) }}'
      cmdcategory: '{{ item["cmdcategory"] | d(omit) }}'
      runasusercategory: '{{ item["runasusercategory"] | d(omit) }}'
      runasgroupcategory: '{{ item["runasgroupcategory"] | d(omit) }}'
      order: '{{ item["order"] | d(omit) }}'
      state: 'present'
    loop: '{{ (freeipa_server__sudorules__combined_var | selectattr("state", "defined") | selectattr("state", "ne", "absent") | list)
            + (freeipa_server__sudorules__combined_var | selectattr("state", "undefined") | list) }}'
    loop_control:
      label: '{{ item["name"] }}'

  - name: 'Manage FreeIPA sudo rule members'
    # freeipa.ansible_freeipa.ipasudorule: # TODO: switch back once https://github.com/freeipa/ansible-freeipa/pull/1415 is merged and released
    linuxfabrik.lfops.ipasudorule:
      ipaadmin_password: '{{ freeipa_server__ipa_admin_password }}'
      ipaadmin_principal: '{{ freeipa_server__ipa_admin_principal }}'
      name: '{{ item["name"] }}'
      user: '{{ item["users"] | d(omit) }}'
      group: '{{ item["groups"] | d(omit) }}'
      host: '{{ item["hosts"] | d(omit) }}'
      hostgroup: '{{ item["hostgroups"] | d(omit) }}'
      allow_sudocmd: '{{ item["allow_sudocmds"] | d(omit) }}'
      allow_sudocmdgroup: '{{ item["allow_sudocmdgroups"] | d(omit) }}'
      runasuser: '{{ item["runasusers"] | d(omit) }}'
      runasgroup: '{{ item["runasgroups"] | d(omit) }}'
      sudooption: '{{ item["options"] | d(omit) }}'
      action: 'member'
    loop: '{{ (freeipa_server__sudorules__combined_var | selectattr("state", "defined") | selectattr("state", "ne", "absent") | list)
            + (freeipa_server__sudorules__combined_var | selectattr("state", "undefined") | list) }}'
    loop_control:
      label: '{{ item["name"] }}'
    when: 'item["users"] is defined or item["groups"] is defined or item["hosts"] is defined or item["hostgroups"] is defined or item["allow_sudocmds"] is defined or item["allow_sudocmdgroups"] is defined or item["runasusers"] is defined or item["runasgroups"] is defined or item["options"] is defined'

  - name: 'Enable or disable FreeIPA sudo rules'
    # freeipa.ansible_freeipa.ipasudorule: # TODO: switch back once https://github.com/freeipa/ansible-freeipa/pull/1415 is merged and released
    linuxfabrik.lfops.ipasudorule:
      ipaadmin_password: '{{ freeipa_server__ipa_admin_password }}'
      ipaadmin_principal: '{{ freeipa_server__ipa_admin_principal }}'
      name: '{{ item["name"] }}'
      state: '{{ item["state"] | d("enabled") }}'
    loop: '{{ (freeipa_server__sudorules__combined_var | selectattr("state", "defined") | selectattr("state", "ne", "absent") | list)
            + (freeipa_server__sudorules__combined_var | selectattr("state", "undefined") | list) }}'
    loop_control:
      label: '{{ item["name"] }}'

  tags:
    - 'freeipa_server'
    - 'freeipa_server:configure'
    - 'freeipa_server:sudorule'
