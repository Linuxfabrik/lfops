- block:

  - name: 'Install tomcat-webapps ("ROOT" webapp)'
    ansible.builtin.package:
      name:
        - 'tomcat-webapps'      # installs java and tomcat, too
        - 'tomcat-docs-webapp'  # otherwise some links will be broken on the ROOT startpage
      state: 'present'
    when:
      - 'not apache_tomcat__skip_root_webapp | bool'

  - name: 'Install tomcat-admin-webapps'
    ansible.builtin.package:
      name:
        - 'tomcat-admin-webapps'  # installs java and tomcat, too
      state: 'present'
    when:
      - 'not apache_tomcat__skip_admin_webapps | bool'

  - name: 'Install tomcat'
    ansible.builtin.package:
      name:
        - 'tomcat'  # installs java, too
      state: 'present'
    when:
      - 'apache_tomcat__skip_admin_webapps | bool'

  tags:
    - 'apache_tomcat'


- block:

  - name: 'Get the list of installed packages'
    ansible.builtin.package_facts:  # yamllint disable-line rule:empty-values
    check_mode: false # run task even if `--check` is specified

  # the guard keeps this working under another role's tag on a host without tomcat, where the
  # install block above is skipped; the fact stays undefined there.
  - name: 'Get tomcat version'
    ansible.builtin.set_fact:
      __apache_tomcat__installed_version: '{{ ansible_facts["packages"]["tomcat"][0]["version"] | regex_search("\d+\.\d+") }}'
    when:
      - '"tomcat" in ansible_facts["packages"]'

  - name: 'Assert that this role supports the installed version'
    ansible.builtin.assert:
      that:
        - '__apache_tomcat__installed_version in __apache_tomcat__supported_versions'
      quiet: true
      fail_msg: 'Tomcat {{ __apache_tomcat__installed_version }} is not supported by this role. Supported versions: {{ __apache_tomcat__supported_versions | join(", ") }}.'
    when:
      - '__apache_tomcat__installed_version is defined'

  tags:
    - 'always'


- block:

  # tomcat server itself

  - name: 'Deploy /etc/tomcat/server.xml'
    ansible.builtin.template:
      backup: true
      src: 'etc/tomcat/{{ __apache_tomcat__installed_version }}-server.xml.j2'
      dest: '/etc/tomcat/server.xml'
      owner: 'root'
      group: 'tomcat'
      mode: 0o644
    notify: 'apache_tomcat: restart tomcat.service'

  - name: 'Deploy /etc/sysconfig/tomcat'
    ansible.builtin.template:
      backup: true
      src: 'etc/sysconfig/{{ __apache_tomcat__installed_version }}-tomcat.j2'
      dest: '/etc/sysconfig/tomcat'
      owner: 'root'
      group: 'root'
      mode: 0o644

  - name: 'Deploy /etc/tomcat/context.xml'
    ansible.builtin.template:
      backup: true
      src: 'etc/tomcat/{{ __apache_tomcat__installed_version }}-context.xml.j2'
      dest: '/etc/tomcat/context.xml'
      owner: 'root'
      group: 'tomcat'
      mode: 0o644
    notify: 'apache_tomcat: restart tomcat.service'

  - name: 'Deploy /etc/tomcat/logging.properties'
    ansible.builtin.template:
      backup: true
      src: 'etc/tomcat/{{ __apache_tomcat__installed_version }}-logging.properties.j2'
      dest: '/etc/tomcat/logging.properties'
      owner: 'root'
      group: 'tomcat'
      mode: 0o644
    notify: 'apache_tomcat: restart tomcat.service'

  - name: 'Deploy /etc/logrotate.d/tomcat'
    ansible.builtin.template:
      backup: true
      src: 'etc/logrotate.d/tomcat.j2'
      dest: '/etc/logrotate.d/tomcat'
      owner: 'root'
      group: 'root'
      mode: 0o644

  tags:
    - 'apache_tomcat'
    - 'apache_tomcat:configure'


- block:

  # tomcat webapps

  - name: 'Deploy /var/lib/tomcat/webapps/docs/META-INF/context.xml'
    ansible.builtin.template:
      backup: true
      src: 'var/lib/tomcat/webapps/docs/META-INF/context.xml.j2'
      dest: '/var/lib/tomcat/webapps/docs/META-INF/context.xml'
      owner: 'root'
      group: 'root'
      mode: 0o664
    notify: 'apache_tomcat: restart tomcat.service'
    when:
      - 'not apache_tomcat__skip_root_webapp | bool'

  - name: 'Deploy /var/lib/tomcat/webapps/host-manager/META-INF/context.xml'
    ansible.builtin.template:
      backup: true
      src: 'var/lib/tomcat/webapps/host-manager/META-INF/context.xml.j2'
      dest: '/var/lib/tomcat/webapps/host-manager/META-INF/context.xml'
      owner: 'root'
      group: 'tomcat'
      mode: 0o664
    notify: 'apache_tomcat: restart tomcat.service'
    when:
      - 'not apache_tomcat__skip_admin_webapps | bool'

  - name: 'Deploy /var/lib/tomcat/webapps/manager/META-INF/context.xml'
    ansible.builtin.template:
      backup: true
      src: 'var/lib/tomcat/webapps/manager/META-INF/context.xml.j2'
      dest: '/var/lib/tomcat/webapps/manager/META-INF/context.xml'
      owner: 'root'
      group: 'tomcat'
      mode: 0o664
    notify: 'apache_tomcat: restart tomcat.service'
    when:
      - 'not apache_tomcat__skip_admin_webapps | bool'

  - name: 'Deploy /var/lib/tomcat/webapps/manager/WEB-INF/web.xml'
    ansible.builtin.template:
      backup: true
      src: 'var/lib/tomcat/webapps/manager/WEB-INF/{{ __apache_tomcat__installed_version }}-web.xml.j2'
      dest: '/var/lib/tomcat/webapps/manager/WEB-INF/web.xml'
      owner: 'root'
      group: 'tomcat'
      mode: 0o664
    notify: 'apache_tomcat: restart tomcat.service'
    when:
      - 'not apache_tomcat__skip_admin_webapps | bool'

  tags:
    - 'apache_tomcat'
    - 'apache_tomcat:webapps'


- block:

  - name: 'Combined Users'
    ansible.builtin.debug:
      var: 'apache_tomcat__users__combined_var'

  - name: 'Deploy /etc/tomcat/tomcat-users.xml'
    ansible.builtin.template:
      backup: true
      src: 'etc/tomcat/{{ __apache_tomcat__installed_version }}-tomcat-users.xml.j2'
      dest: '/etc/tomcat/tomcat-users.xml'
      owner: 'root'
      group: 'tomcat'
      mode: 0o640
    notify: 'apache_tomcat: restart tomcat.service'

  tags:
    - 'apache_tomcat'
    - 'apache_tomcat:users'


- block:

  - name: 'systemctl {{ apache_tomcat__service_enabled | bool | ternary("enable", "disable") }} tomcat.service'
    ansible.builtin.service:
      name: 'tomcat.service'
      enabled: '{{ apache_tomcat__service_enabled | bool }}'

  - name: 'systemctl {{ apache_tomcat__service_state | regex_replace("p?ed$", "") }} tomcat.service'
    ansible.builtin.service:
      name: 'tomcat.service'
      state: '{{ apache_tomcat__service_state }}'
    register: '__apache_tomcat__service_state_result'

  tags:
    - 'apache_tomcat'
    - 'apache_tomcat:state'


- block:

  - name: 'Flush handlers so that Tomcat can be used by other roles later'
    ansible.builtin.meta: 'flush_handlers'

  tags:
    - 'apache_tomcat'
    - 'apache_tomcat:configure'
    - 'apache_tomcat:state'
    - 'apache_tomcat:users'
    - 'apache_tomcat:webapps'
