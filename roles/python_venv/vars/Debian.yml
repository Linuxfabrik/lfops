# python3-packaging is a requirement of `ansible.builtin.pip` on the managed node (the module
# needs packaging or setuptools' pkg_resources) and is absent from a minimal installation, for
# example the Debian 13 genericcloud image.
__python_venv__required_packages:
  - 'python3-dev'
  - 'python3-packaging'
  - 'python3-venv'
