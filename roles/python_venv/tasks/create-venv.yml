- name: 'Install dnf package requirements'
  ansible.builtin.package:
    name: '{{ venv["package_requirements"] | d([]) }}'
    state: 'present'
  retries: 3 # ride out a brief outage of the package repository
  delay: 10

# A venv is bound to the minor release of the interpreter that built it, its packages live in
# lib/pythonX.Y. The `creates:` of the venv task below would keep a venv built with an earlier
# `python_executable` forever, e.g. a Python 3.6 venv on RHEL 8 whose packages pip can no longer
# resolve. Compare the minor release of `python_executable` with the one recorded in pyvenv.cfg
# and rebuild the venv if they differ. The venv module writes "version = X.Y.Z" there
# (Lib/venv/__init__.py), verified with Python 3.6, 3.11, 3.12 and 3.13 on Rocky 8, Rocky 10 and
# Debian 13. A patch release update keeps the minor release and therefore the venv.
- name: '{{ venv["python_executable"] | d("python3") }} --version'
  ansible.builtin.command: '{{ venv["python_executable"] | d("python3") }} --version'
  register: '__python_venv__python_version_result'
  changed_when: false # read-only command, never changes anything
  check_mode: false # also run in check mode
  ignore_errors: '{{ ansible_check_mode | bool }}' # the interpreter may not be installed yet in check mode

- name: 'stat /opt/python-venv/{{ venv["name"] }}/pyvenv.cfg'
  ansible.builtin.stat:
    path: '/opt/python-venv/{{ venv["name"] }}/pyvenv.cfg'
  register: '__python_venv__pyvenv_cfg_stat_result'

- name: 'cat /opt/python-venv/{{ venv["name"] }}/pyvenv.cfg'
  ansible.builtin.slurp:
    src: '/opt/python-venv/{{ venv["name"] }}/pyvenv.cfg'
  register: '__python_venv__pyvenv_cfg_result'
  when:
    - '__python_venv__pyvenv_cfg_stat_result["stat"]["exists"]'

- name: 'rm -rf /opt/python-venv/{{ venv["name"] }} (built with another Python minor release)'
  ansible.builtin.file:
    path: '/opt/python-venv/{{ venv["name"] }}'
    state: 'absent'
  vars:
    # "Python 3.11.13" -> "3.11"
    __python_venv__python_minor_version: '{{
        __python_venv__python_version_result["stdout"] | d("")
        | regex_search("\d+\.\d+") | d("", true)
      }}'
    # "version = 3.6.8" -> "3.6"
    __python_venv__venv_minor_version: '{{
        __python_venv__pyvenv_cfg_result["content"] | d("") | b64decode
        | regex_search("(?<=^version = )\d+\.\d+", multiline=true) | d("", true)
      }}'
  when:
    - '__python_venv__python_version_result is not failed'
    - '__python_venv__python_minor_version | length > 0'
    - '__python_venv__venv_minor_version | length > 0'
    - '__python_venv__python_minor_version != __python_venv__venv_minor_version'

- name: '{{ venv["python_executable"] | d("python3") }} -m venv {% if venv["system_site_packages"] | d("true") %} --system-site-packages {% endif %}{{ venv["name"] }}'
  ansible.builtin.command:
    cmd: '{{ venv["python_executable"] | d("python3") }} -m venv {% if venv["system_site_packages"] | d("true") %} --system-site-packages {% endif %}{{ venv["name"] }}'
    chdir: '/opt/python-venv'
    creates: '/opt/python-venv/{{ venv["name"] }}/bin/activate'
  ignore_errors: "{{ ansible_check_mode }}" # ignore errors if `--check` is specified

- name: 'Make sure the venv is root-owned and not writeable by others to prevent privilege escalation'
  ansible.builtin.file:
    path: '/opt/python-venv/{{ venv["name"] }}'
    owner: 'root'
    group: 'root'
    mode: 0o755 # executable for all users and groups, as they might need to execute the installed python packages

- name: 'pip install -U pip wheel setuptools' # noqa package-latest latest pip is required for installing some modules
  ansible.builtin.pip:
    name:
      - 'pip'
      - 'wheel'
      - 'setuptools'
    state: 'latest'
    virtualenv: '/opt/python-venv/{{ venv["name"] }}'
    extra_args: '{{ ("--cert " ~ python_venv__pip_cert) if python_venv__pip_cert is defined and python_venv__pip_cert | length }}'
  retries: 3 # ride out a brief outage of the package repository
  delay: 10

# A constraints file pins transitive dependencies (e.g. to force a modern version that drops a
# deprecated, compiler-requiring sub-dependency) without having to list them as direct packages.
- name: 'Deploy /opt/python-venv/{{ venv["name"] }}/constraints.txt'
  ansible.builtin.template:
    backup: true
    src: 'opt/python-venv/constraints.txt.j2'
    dest: '/opt/python-venv/{{ venv["name"] }}/constraints.txt'
    owner: 'root'
    group: 'root'
    mode: 0o644
  when:
    - 'venv["pip_constraints"] | d([]) | length > 0'

- name: 'Install packages using pip'
  ansible.builtin.pip:
    name: '{{ venv["packages"] }}'
    state: 'present'
    virtualenv: '/opt/python-venv/{{ venv["name"] }}'
    extra_args: '{{
        (("--cert " ~ python_venv__pip_cert) if (python_venv__pip_cert is defined and python_venv__pip_cert | length > 0) else "")
        ~ ((" --constraint /opt/python-venv/" ~ venv["name"] ~ "/constraints.txt") if (venv["pip_constraints"] | d([]) | length > 0) else "")
      }}'
  retries: 3 # ride out a brief outage of the package repository
  delay: 10

- name: 'Link choosen binaries to /usr/local/bin'
  ansible.builtin.file:
    src: '/opt/python-venv/{{ venv["name"] }}/bin/{{ item }}'
    path: '/usr/local/bin/{{ item }}'
    state: 'link'
  loop: '{{ venv["exposed_binaries"] | d([]) }}'

