- block:

  - name: 'Install cronie fping ImageMagick mtr net-snmp net-snmp-utils nmap rrdtool unzip'
    ansible.builtin.package:
      name:
        - 'cronie'
        - 'fping'
        - 'ImageMagick'
        - 'mtr'
        - 'net-snmp'
        - 'net-snmp-utils'
        - 'nmap'
        - 'rrdtool'
        - 'unzip'
      state: 'present'

  - name: 'Get latest release version'
    ansible.builtin.uri:
      url: 'https://api.github.com/repos/librenms/librenms/releases/latest'
    register: 'librenms__github_release'
    check_mode: false # run task even if `--check` is specified
    run_once: true

  - ansible.builtin.import_tasks: 'user.yml'

  - name: 'mkdir -p /opt/librenms'
    ansible.builtin.file:
      path: '/opt/librenms'
      state: 'directory'
      owner: 'librenms'
      group: 'librenms'
      mode: 0o771

  # Cloned as librenms, the way LibreNMS updates itself. Cloning as root and handing the tree
  # over afterwards leaves git refusing to touch it on every later run ("detected dubious
  # ownership"), which is git's safe.directory protection and cannot be worked around by a chown.
  - name: 'git clone https://github.com/librenms/librenms.git /opt/librenms'
    ansible.builtin.git:
      repo: 'https://github.com/librenms/librenms.git'
      dest: '/opt/librenms'
      force: false
      version: '{{ librenms__github_release["json"]["tag_name"] }}'
    become: true
    become_user: 'librenms'

  # this is magnitudes faster than using the file module. --changes reports every file it
  # touched, which keeps the task honest about whether it changed anything (installations that
  # predate the clone above still carry root-owned files).
  - name: 'chown -R --changes librenms:librenms /opt/librenms'
    ansible.builtin.command: 'chown -R --changes librenms:librenms /opt/librenms'
    register: '__librenms__chown_result'
    changed_when: '__librenms__chown_result["stdout"] | length > 0'

  # The upstream docs make rrd, logs, bootstrap/cache and storage group-writable, for setups
  # where the web server runs under its own account. Here PHP-FPM, cron and the scheduler all
  # run as librenms, which owns those trees, so the group bits buy nothing and cannot be kept
  # anyway: the application creates files below them with umask 022 as it runs.

  - name: 'ln -s /opt/librenms/lnms /usr/local/bin/lnms'
    ansible.builtin.file:
      src: '/opt/librenms/lnms'
      dest: '/usr/local/bin/lnms'
      state: 'link'

  - name: 'cp /opt/librenms/misc/lnms-completion.bash /etc/bash_completion.d/'
    ansible.builtin.copy:
      src: '/opt/librenms/misc/lnms-completion.bash'
      dest: '/etc/bash_completion.d/'
      owner: 'root'
      group: 'root'
      mode: 0o644
      remote_src: true

  - name: 'sudo -u librenms -i ./scripts/composer_wrapper.php install --no-dev'
    ansible.builtin.command: './scripts/composer_wrapper.php install --no-dev'
    args:
      chdir: '/opt/librenms'
    become: true
    become_user: 'librenms'
    register: '__librenms__composer_result'
    # composer says so whenever the lock file is already satisfied
    changed_when: '"Nothing to install, update or remove" not in __librenms__composer_result["stdout"]'

  # No --force: it would also rewrite the SELinux user of every file the application created
  # since the last run (unconfined_u back to system_u), which relabels on every run without
  # changing what the targeted policy enforces, namely the type.
  - name: 'restorecon -Rv /opt/librenms'
    ansible.builtin.command: 'restorecon -Rv /opt/librenms'
    register: 'librenms__restorecon_data_result'
    changed_when: 'librenms__restorecon_data_result["stdout"] | length > 0'

  # The SELinux policy modules this role needs (http_fping, rrdcached_librenms) are declared in
  # librenms__selinux__modules__dependent_var and deployed by the selinux role, like its booleans
  # and file contexts.

  tags:
    - 'librenms'


- block:

  # The socket unit of the rrdtool package binds /tmp/rrdcached.sock, which httpd
  # and php-fpm cannot reach because both run with PrivateTmp=true. Socket
  # activation also makes rrdcached ignore the listen address of the drop-in.
  - name: 'systemctl disable --now rrdcached.socket'
    ansible.builtin.service:
      name: 'rrdcached.socket'
      enabled: false
      state: 'stopped'

  - name: 'mkdir -p /etc/systemd/system/rrdcached.service.d'
    ansible.builtin.file:
      path: '/etc/systemd/system/rrdcached.service.d'
      state: 'directory'
      owner: 'root'
      group: 'root'
      mode: 0o755

  # named after the role, not z00-linuxfabrik.conf: rrdcached.service belongs to the rrdtool
  # package, and a role that manages RRDCached in its own right would collide with that name
  - name: 'Deploy /etc/systemd/system/rrdcached.service.d/z00-librenms.conf'
    ansible.builtin.template:
      backup: true
      src: 'etc/systemd/system/rrdcached.service.d/z00-librenms.conf.j2'
      dest: '/etc/systemd/system/rrdcached.service.d/z00-librenms.conf'
      owner: 'root'
      group: 'root'
      mode: 0o644
    register: '__librenms__rrdcached_dropin_result'
    notify: 'librenms: restart rrdcached'

  - name: 'systemctl daemon-reload' # noqa no-handler would require flush_handlers here anyway
    ansible.builtin.systemd:
      daemon_reload: true
    when: '__librenms__rrdcached_dropin_result is changed'

  # split enabled and state into separate tasks so that the register on the state task
  # only reflects actual state changes (started/stopped), not enabled/disabled changes.
  # this allows the handler to correctly skip a restart when the service was just started,
  # without false-positives from enabled-only changes.
  - name: 'systemctl {{ librenms__rrdcached_service_enabled | bool | ternary("enable", "disable") }} rrdcached.service'
    ansible.builtin.service:
      name: 'rrdcached.service'
      enabled: '{{ librenms__rrdcached_service_enabled | bool }}'

  - name: 'systemctl {{ librenms__rrdcached_service_state | regex_replace("p?ed$", "") }} rrdcached.service'
    ansible.builtin.service:
      name: 'rrdcached.service'
      state: '{{ librenms__rrdcached_service_state }}'
    register: '__librenms__rrdcached_service_state_result'

  # block
  when:
    - 'librenms__rrdcached_enabled | bool'
  tags:
    - 'librenms'
    - 'librenms:rrdcached'


- block:

  - name: 'cp /opt/librenms/misc/librenms.logrotate /etc/logrotate.d/librenms'
    ansible.builtin.copy:
      src: '/opt/librenms/misc/librenms.logrotate'
      dest: '/etc/logrotate.d/librenms'
      owner: 'root'
      group: 'root'
      mode: 0o644
      remote_src: true

  - name: 'cp /opt/librenms/dist/librenms.cron /etc/cron.d/librenms'
    ansible.builtin.copy:
      src: '/opt/librenms/dist/librenms.cron'
      dest: '/etc/cron.d/librenms'
      owner: 'root'
      group: 'root'
      mode: 0o644
      remote_src: true

  - name: 'cp /opt/librenms/dist/librenms-scheduler.service /etc/systemd/system/'
    ansible.builtin.copy:
      src: '/opt/librenms/dist/librenms-scheduler.service'
      dest: '/etc/systemd/system/librenms-scheduler.service'
      owner: 'root'
      group: 'root'
      mode: 0o644
      remote_src: true

  - name: 'cp /opt/librenms/dist/librenms-scheduler.timer /etc/systemd/system/'
    ansible.builtin.copy:
      src: '/opt/librenms/dist/librenms-scheduler.timer'
      dest: '/etc/systemd/system/librenms-scheduler.timer'
      owner: 'root'
      group: 'root'
      mode: 0o644
      remote_src: true

  - name: 'systemctl enable --now librenms-scheduler.timer'
    ansible.builtin.service:
      name: 'librenms-scheduler.timer'
      enabled: true
      state: 'started'

  # LibreNMS assumes rrdtool 1.4 unless told otherwise, and then creates and
  # tunes RRD files itself instead of letting rrdcached do it.
  - name: 'rrdtool --version'
    ansible.builtin.command: 'rrdtool --version'
    register: '__librenms__rrdtool_version_result'
    changed_when: false # just gathering information
    check_mode: false # run task even if `--check` is specified
    when: 'librenms__rrdcached_enabled | bool'

  - name: 'Set the installed rrdtool version'
    ansible.builtin.set_fact:
      # "RRDtool 1.7.2  Copyright by Tobias Oetiker ..."
      # variable is used in config.php.j2
      __librenms__rrdtool_version: '{{ __librenms__rrdtool_version_result["stdout_lines"][0] | regex_search("[0-9]+\.[0-9]+\.[0-9]+") }}'
    when: 'librenms__rrdcached_enabled | bool'

  - name: 'Deploy /opt/librenms/config.php'
    ansible.builtin.template:
      backup: true
      src: 'opt/librenms/config.php.j2'
      dest: '/opt/librenms/config.php'
      owner: 'librenms'
      group: 'librenms'
      mode: 0o644

  - name: 'Set DB connection settings in /opt/librenms/.env'
    ansible.builtin.lineinfile:
      path: '/opt/librenms/.env'
      regexp: '^#?{{ item["key"] }}'
      line: '{{ item["key"] }}={{ item["value"] | quote }}'
      mode: 0o600 # file contains secrets
      state: 'present'
    loop:
      - key: 'DB_HOST'
        value: '{{ librenms__database_host }}'
      - key: 'DB_DATABASE'
        value: '{{ librenms__database_name }}'
      - key: 'DB_USERNAME'
        value: '{{ librenms__database_login["username"] }}'
      - key: 'DB_PASSWORD'
        value: '{{ librenms__database_login["password"] }}'

  - name: 'Set app settings in /opt/librenms/.env'
    ansible.builtin.lineinfile:
      path: '/opt/librenms/.env'
      regexp: '^#?{{ item["key"] }}'
      line: '{{ item["key"] }}={{ item["value"] | quote }}'
      mode: 0o600 # file contains secrets
      state: 'present'
    loop:
      - key: 'APP_TRUSTED_PROXIES'
        value: '{{ librenms__config_app_trusted_proxies | join(",") }}'
      - key: 'APP_URL'
        value: '{{ librenms__config_app_url }}'
    when: 'item["value"] | length > 0'

  tags:
    - 'librenms'
    - 'librenms:configure'
