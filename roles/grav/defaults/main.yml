grav__install_dir: '/var/www/html/{{ grav__url }}'
grav__on_calendar_selfupgrade: '22:{{ 59 | random(seed=inventory_hostname) }}'
grav__on_calendar_update: '23:{{ 59 | random(seed=inventory_hostname) }}'
grav__timer_selfupgrade_enabled: true
grav__timer_update_enabled: true

# -----------------------------------------------------------------------------

grav__apache_httpd__mods__dependent_var:
  - filename: 'proxy_fcgi'
    enabled: true
    state: 'present'
grav__apache_httpd__vhosts__dependent_var:
  - conf_server_name: '{{ grav__url }}'
    by_role: 'grav'
    comment: 'vHost for Grav (a simple file-based flat-file CMS platform)'
    enabled: true
    state: 'present'
    template: 'app'
    allowed_file_extensions:
      - 'css'
      - 'gif'
      - 'html?'
      - 'ico'
      - 'jpe?g'
      - 'js'
      - 'map'
      - 'pdf'
      - 'php'
      - 'png'
      - 'svg'
      - 'ttf'
      - 'txt'
      - 'webp'
      - 'woff2?'
      - 'xml'
      - 'xsl'
    allowed_http_methods:
      - 'GET'
      - 'OPTIONS'
    virtualhost_port: 80
    conf_allow_override: 'All'
    conf_directory_index: 'index.php index.html index.htm'
    conf_document_root: '{{ grav__install_dir }}'
    conf_options: 'FollowSymLinks'
grav__apps__apps__dependent_var:
  - name: 'git'
    state: 'present'
  - name: 'unzip'
    state: 'present'
grav__php__modules__dependent_var:
  - name: 'php-gd'
    state: 'present'
# Grav touches cache/compiled/{blueprints,config,languages}/filelist-*.php after validating them,
# on nearly every request (ConfigServiceProvider::loadCachedFileList(), since Grav 2.0.7, commit
# b8942d177). OPcache recompiles a touched file and keeps the old copy as wasted memory, so the
# cache runs full and is thrown away every few days. Measured on Grav 2.2.23 / PHP 8.3 with the
# OPcache settings of the php role: about 28 KB wasted per minute, a restart every 2.4 days.
# see id grav-opcache-filelist-touch in tools/maintenance.yml
grav__php__opcache_blacklist__dependent_var:
  - path: '{{ grav__install_dir }}/cache/compiled/*/filelist-'
    state: 'present'
# The code is read-only for the web server, only the directories Grav writes to at runtime are
# writable. The rules of the runtime directories come after the one of the installation
# directory and take precedence, also on a host where an earlier version of the role added that
# one as httpd_sys_rw_content_t (verified with the setup_grav scenario on Rocky 9 and 10).
grav__selinux__fcontexts__dependent_var: '{{
    [
      {
        "setype": "httpd_sys_content_t",
        "target": (grav__install_dir | ansible.builtin.regex_escape) ~ "(/.*)?",
        "state": "present",
      }
    ] +
    [(grav__install_dir | ansible.builtin.regex_escape) ~ "/"]
      | product(__grav__runtime_dirs | map("ansible.builtin.regex_escape"))
      | map("join")
      | product(["(/.*)?"])
      | map("join")
      | map("community.general.dict_kv", "target")
      | map("combine", {"setype": "httpd_sys_rw_content_t", "state": "present"})
      | list
  }}'
