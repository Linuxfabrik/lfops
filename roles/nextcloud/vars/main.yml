# OS-specific values consumed by a *different* role that runs *earlier* in the same play (the `__dependent_var` pattern). vars/<os>.yml would load too late for an earlier consumer, but vars/main.yml is auto-loaded at play parse and is visible to every role in the play. The public variables in defaults/main.yml select from these dicts with the linuxfabrik.lfops.platform_select filter; to extend platform support, add a Debian / Suse key here.

# PHP modules installed by the linuxfabrik.lfops.php role via nextcloud__php__modules__dependent_var.
__nextcloud__php__modules__dependent_var:
  RedHat:
    - name: 'php-bcmath'
      state: 'present'
    - name: 'php-gd'
      state: 'present'
    - name: 'php-gmp'
      state: 'present'
    - name: 'php-imagick'
      state: 'present'
    # IMAP was removed from PHP core in 8.4 and ships as the PECL package php-pecl-imap there; on
    # <= 8.3 it is still the core php-imap. Pick the name from the PHP version the php role detected.
    - name: '{{ "php-pecl-imap" if php__installed_version is version("8.4", ">=") else "php-imap" }}'
      state: 'present'
    - name: 'php-intl'
      state: 'present'
    - name: 'php-json'
      state: 'present'
    - name: 'php-ldap'
      state: 'present'
    - name: 'php-mbstring'
      state: 'present'
    - name: 'php-memcached'
      state: 'present'
    - name: 'php-mysqlnd'
      state: 'present'
    - name: 'php-opcache'
      state: 'present'
    - name: 'php-pecl-apcu'
      state: 'present'
    - name: 'php-process' # posix module for oc
      state: 'present'
    - name: 'php-redis'
      state: 'present'
    - name: 'php-smbclient'
      state: 'present'
    - name: 'php-zip'
      state: 'present'
  # Debian/Ubuntu name every extension per PHP version. The unversioned php-<module> metapackages
  # resolve to whatever the configured repo declares as its default, which under Sury moves on
  # Sury's schedule - so they would drag a second PHP runtime onto the host, exactly as the
  # php-imap metapackage already did. Always build the name from the version the php role manages.
  # Package names verified against Sury. Differences from the RedHat list:
  #   * php-mysqlnd  -> mysql, php-pecl-apcu -> apcu (different upstream package names)
  #   * php-opcache  dropped: php<version>-opcache is pulled in by the php base package already
  #   * php-process  dropped: the posix extension is built into the Debian php-cli/-common packages
  #   * php-json     dropped: JSON is compiled into PHP 8 core (php-json is only a transitional dummy)
  # imap is core on <= 8.3 and PECL on >= 8.4, but Sury names the versioned package uniformly, so
  # no version branch is needed here.
  Debian:
    - name: 'php{{ php__installed_version }}-apcu'
      state: 'present'
    - name: 'php{{ php__installed_version }}-bcmath'
      state: 'present'
    - name: 'php{{ php__installed_version }}-gd'
      state: 'present'
    - name: 'php{{ php__installed_version }}-gmp'
      state: 'present'
    - name: 'php{{ php__installed_version }}-imagick'
      state: 'present'
    - name: 'php{{ php__installed_version }}-imap'
      state: 'present'
    - name: 'php{{ php__installed_version }}-intl'
      state: 'present'
    - name: 'php{{ php__installed_version }}-ldap'
      state: 'present'
    - name: 'php{{ php__installed_version }}-mbstring'
      state: 'present'
    - name: 'php{{ php__installed_version }}-memcached'
      state: 'present'
    - name: 'php{{ php__installed_version }}-mysql'
      state: 'present'
    - name: 'php{{ php__installed_version }}-redis'
      state: 'present'
    - name: 'php{{ php__installed_version }}-smbclient'
      state: 'present'
    - name: 'php{{ php__installed_version }}-zip'
      state: 'present'
__nextcloud__php_fpm_service_name: '{{ php__fpm_service_name }}'
