# OS-specific values consumed by a *different* role that runs *earlier* in the same play (the
# `__dependent_var` pattern). vars/<os>.yml would load too late for an earlier consumer, but
# vars/main.yml is auto-loaded at play parse and is visible to every role in the play. The OS
# selection happens here, so consumers reference the public variable directly. Internal
# (`__`-prefixed) dict first, public variable second, both non-overridable from inventory.
# See "OS-specific Dependent Variables" in CONTRIBUTING.md.

# PHP modules installed by the linuxfabrik.lfops.php role via nextcloud__php__modules__dependent_var.
__nextcloud__php__modules__dependent_var:
  RedHat:
    - name: 'php-bcmath'
      state: 'present'
    - name: 'php-gd'
      state: 'present'
    - name: 'php-gmp'
      state: 'present'
    - name: 'php-imagick'
      state: 'present'
    # IMAP was removed from PHP core in 8.4 and ships as the PECL package php-pecl-imap there; on
    # <= 8.3 it is still the core php-imap. Pick the name from the PHP version the php role detected.
    - name: '{{ "php-pecl-imap" if __php__installed_version is version("8.4", ">=") else "php-imap" }}'
      state: 'present'
    - name: 'php-intl'
      state: 'present'
    - name: 'php-json'
      state: 'present'
    - name: 'php-ldap'
      state: 'present'
    - name: 'php-mbstring'
      state: 'present'
    - name: 'php-memcached'
      state: 'present'
    - name: 'php-mysqlnd'
      state: 'present'
    - name: 'php-opcache'
      state: 'present'
    - name: 'php-process' # posix module for oc
      state: 'present'
    - name: 'php-redis'
      state: 'present'
    - name: 'php-smbclient'
      state: 'present'
    - name: 'php-zip'
      state: 'present'
  # Debian/Ubuntu name every extension per PHP version. The unversioned php-<module> metapackages
  # resolve to whatever the configured repo declares as its default, which under Sury moves on
  # Sury's schedule - so they would drag a second PHP runtime onto the host, exactly as the
  # php-imap metapackage already did. Always build the name from the version the php role manages.
  # Differences from the RedHat list:
  #   * php-mysqlnd  -> mysql (different upstream package name)
  #   * php-opcache  dropped: php<version>-opcache is pulled in by the php base package already
  #   * php-process  dropped: the posix extension is built into the Debian php-cli/-common packages
  #   * php-json     dropped: JSON is compiled into PHP 8 core (php-json is only a transitional dummy)
  # imap is core on <= 8.3 and PECL on >= 8.4, but Sury names the versioned package uniformly, so
  # no version branch is needed here.
  Debian:
    - name: 'php{{ __php__installed_version }}-bcmath'
      state: 'present'
    - name: 'php{{ __php__installed_version }}-gd'
      state: 'present'
    - name: 'php{{ __php__installed_version }}-gmp'
      state: 'present'
    - name: 'php{{ __php__installed_version }}-imagick'
      state: 'present'
    - name: 'php{{ __php__installed_version }}-imap'
      state: 'present'
    - name: 'php{{ __php__installed_version }}-intl'
      state: 'present'
    - name: 'php{{ __php__installed_version }}-ldap'
      state: 'present'
    - name: 'php{{ __php__installed_version }}-mbstring'
      state: 'present'
    - name: 'php{{ __php__installed_version }}-memcached'
      state: 'present'
    - name: 'php{{ __php__installed_version }}-mysql'
      state: 'present'
    - name: 'php{{ __php__installed_version }}-redis'
      state: 'present'
    - name: 'php{{ __php__installed_version }}-smbclient'
      state: 'present'
    - name: 'php{{ __php__installed_version }}-zip'
      state: 'present'
__nextcloud__php_fpm_service_name: '{{ __php__fpm_service_name }}'

# `__php__installed_version` is discovered by the php role at runtime, but its argument_specs
# validation templates this variable at role entry, before that discovery. An undefined value
# anywhere in the dict collapses the whole dict, so platform_select would abort the run.
# Publishing an empty list until the version is known is safe: the value is re-templated on
# every use, so the php role gets the real list when it consumes it.
nextcloud__php__modules__dependent_var: '{{
    (__nextcloud__php__modules__dependent_var
      | linuxfabrik.lfops.platform_select(ansible_facts))
    if __php__installed_version is defined else []
  }}'

# What each Nextcloud major version needs, taken from the Nextcloud server source at the release
# tag (v30.0.0 to v35.0.0): `php_min` and `php_max` (exclusive) from lib/versioncheck.php, outside
# of which Nextcloud refuses to run, and `mariadb_min` from MIN_MARIADB in
# apps/settings/lib/SetupChecks/SupportedDatabase.php. Nextcloud sets no minimum for the Redis or
# Valkey server, only for the phpredis extension (4.0.0), which every supported platform exceeds.
__nextcloud__requirements:
  '30':
    mariadb_min: '10.6'
    php_max: '8.4'
    php_min: '8.1'
  '31':
    mariadb_min: '10.6'
    php_max: '8.5'
    php_min: '8.1'
  '32':
    mariadb_min: '10.6'
    php_max: '8.5'
    php_min: '8.1'
  '33':
    mariadb_min: '10.6'
    php_max: '8.6'
    php_min: '8.2'
  '34':
    mariadb_min: '10.6'
    php_max: '8.6'
    php_min: '8.2'
  '35':
    mariadb_min: '10.11'
    php_max: '8.6'
    php_min: '8.3'
