- block:

  - name: 'Set platform/version specific variables'
    ansible.builtin.import_role:
      name: 'shared'
      tasks_from: 'platform-variables.yml'

  tags:
    - 'always'


- block:

  - name: 'Install required packages'
    ansible.builtin.package:
      name: '{{ __nextcloud__required_packages }}'
      state: 'present'
    retries: 3 # ride out a brief outage of the package repository
    delay: 10

  - name: 'stat /var/www/html/nextcloud/config'
    ansible.builtin.stat:
      path: '/var/www/html/nextcloud/config'
    register: '__nextcloud__config_dir_stat_result'


  - block:

    # force: a rerun after a failed installation must not check a new signature against an old
    # `latest` archive
    - name: 'curl --output /tmp/ansible.nextcloud-{{ nextcloud__version }}.tar.bz2 https://download.nextcloud.com/server/releases/{{ nextcloud__version }}.tar.bz2'
      ansible.builtin.get_url:
        url: 'https://download.nextcloud.com/server/releases/{{ nextcloud__version }}.tar.bz2'
        dest: '/tmp/ansible.nextcloud-{{ nextcloud__version }}.tar.bz2'
        force: true
        mode: 0o644
      retries: 3 # ride out a brief outage of the download source
      delay: 10
      delegate_to: 'localhost'
      become: false
      vars:
        ansible_become: false # noqa var-naming[pattern]
      changed_when: false # not an actual config change on the target
      check_mode: false # the signature is verified in check mode as well

    - name: 'curl --output /tmp/ansible.nextcloud-{{ nextcloud__version }}.tar.bz2.asc https://download.nextcloud.com/server/releases/{{ nextcloud__version }}.tar.bz2.asc'
      ansible.builtin.get_url:
        url: 'https://download.nextcloud.com/server/releases/{{ nextcloud__version }}.tar.bz2.asc'
        dest: '/tmp/ansible.nextcloud-{{ nextcloud__version }}.tar.bz2.asc'
        force: true
        mode: 0o644
      retries: 3 # ride out a brief outage of the download source
      delay: 10
      delegate_to: 'localhost'
      become: false
      vars:
        ansible_become: false # noqa var-naming[pattern]
      changed_when: false # not an actual config change on the target
      check_mode: false # the signature is verified in check mode as well

    - name: 'curl --output /tmp/ansible.nextcloud.asc https://nextcloud.com/nextcloud.asc'
      ansible.builtin.get_url:
        url: 'https://nextcloud.com/nextcloud.asc'
        dest: '/tmp/ansible.nextcloud.asc'
        force: true
        mode: 0o644
      retries: 3 # ride out a brief outage of the download source
      delay: 10
      delegate_to: 'localhost'
      become: false
      vars:
        ansible_become: false # noqa var-naming[pattern]
      changed_when: false # not an actual config change on the target
      check_mode: false # the signature is verified in check mode as well

    - name: 'Copy the release archive, its signature and the key to the target'
      ansible.builtin.copy:
        src: '{{ item["src"] }}'
        dest: '{{ item["dest"] }}'
        mode: 0o644
      loop:
        - src: '/tmp/ansible.nextcloud-{{ nextcloud__version }}.tar.bz2'
          dest: '/tmp/nextcloud-{{ nextcloud__version }}.tar.bz2'
        - src: '/tmp/ansible.nextcloud-{{ nextcloud__version }}.tar.bz2.asc'
          dest: '/tmp/nextcloud-{{ nextcloud__version }}.tar.bz2.asc'
        - src: '/tmp/ansible.nextcloud.asc'
          dest: '/tmp/nextcloud.asc'


    # tempfile does not support check mode, so nothing is there to verify under --check.
    - block:

      - name: 'mktemp --directory'
        ansible.builtin.tempfile:
          state: 'directory'
          prefix: 'nextcloud-gnupg.'
        register: '__nextcloud__gnupg_home_result'


      - block:

        - name: 'gpg --batch --homedir {{ __nextcloud__gnupg_home_result["path"] }} --import /tmp/nextcloud.asc'
          ansible.builtin.command: 'gpg --batch --homedir {{ __nextcloud__gnupg_home_result["path"] }} --import /tmp/nextcloud.asc'
          changed_when: false # only touches the temporary keyring

        # gpg exits non-zero on a bad signature. Verified against gnupg 2.2 on Rocky 8 and gnupg 2.4
        # on Rocky 10, with the archive of Nextcloud 35.
        - name: 'gpg --batch --homedir {{ __nextcloud__gnupg_home_result["path"] }} --status-fd 1 --verify /tmp/nextcloud-{{ nextcloud__version }}.tar.bz2.asc /tmp/nextcloud-{{ nextcloud__version }}.tar.bz2'
          ansible.builtin.command: >-
            gpg --batch
              --homedir {{ __nextcloud__gnupg_home_result["path"] }}
              --status-fd 1
              --verify /tmp/nextcloud-{{ nextcloud__version }}.tar.bz2.asc /tmp/nextcloud-{{ nextcloud__version }}.tar.bz2
          register: '__nextcloud__gpg_verify_result'
          changed_when: false # read-only command, never changes anything

        # the last field of VALIDSIG is the fingerprint of the primary key
        - name: 'Assert that Nextcloud signed the archive'
          ansible.builtin.assert:
            that:
              - '__nextcloud__gpg_verify_result["stdout"] is search("^\\[GNUPG:\\] VALIDSIG .* " ~ __nextcloud__gpg_key_fingerprint ~ "$", multiline=True)'
            quiet: true
            fail_msg: 'The signature of nextcloud-{{ nextcloud__version }}.tar.bz2 is not from the key {{ __nextcloud__gpg_key_fingerprint }}.'

        always:

        - name: 'rm -rf {{ __nextcloud__gnupg_home_result["path"] }}'
          ansible.builtin.file:
            path: '{{ __nextcloud__gnupg_home_result["path"] }}'
            state: 'absent'

      when:
        - 'not ansible_check_mode'


    - name: 'bunzip /tmp/nextcloud-{{ nextcloud__version }}.tar.bz2 /var/www/html/'
      ansible.builtin.unarchive:
        src: '/tmp/nextcloud-{{ nextcloud__version }}.tar.bz2'
        dest: '/var/www/html/'
        remote_src: true
        creates: '/var/www/html/nextcloud/config'

    when:
      - 'not __nextcloud__config_dir_stat_result["stat"]["exists"]'


  # Checked against the unpacked code rather than nextcloud__version, which may just say
  # 'latest', and on every run, so a PHP or MariaDB that falls below what the installed
  # Nextcloud needs stops the run before the role touches the instance.
  - name: 'stat /var/www/html/nextcloud/version.php'
    ansible.builtin.stat:
      path: '/var/www/html/nextcloud/version.php'
    register: '__nextcloud__version_php_result'

  - block:

    - name: 'Get the Nextcloud major version and the PHP version'
      ansible.builtin.command:
        argv:
          - 'php'
          - '--run'
          - 'require "/var/www/html/nextcloud/version.php"; echo $OC_Version[0], " ", PHP_VERSION;'
      register: '__nextcloud__versions_result'
      changed_when: false
      check_mode: false

    - name: 'Get the MariaDB version'
      ansible.mariadb.mariadb_info:
        login_user: '{{ nextcloud__mariadb_login["username"] }}'
        login_password: '{{ nextcloud__mariadb_login["password"] }}'
        login_host: '{{ nextcloud__database_host }}'
        login_unix_socket: '{{ (nextcloud__database_host == "localhost") | ternary(__nextcloud__mysql_login_unix_socket, omit) }}' # https://github.com/PyMySQL/PyMySQL/issues/509#issuecomment-244072354
        filter: 'version'
      register: '__nextcloud__mariadb_info_result'
      check_mode: false

    - name: 'Assert that PHP and MariaDB meet the requirements of the installed Nextcloud'
      ansible.builtin.assert:
        that:
          - '__nextcloud__major_version in __nextcloud__requirements'
          - '__nextcloud__php_version is version(__nextcloud__requirements[__nextcloud__major_version]["php_min"], ">=")'
          - '__nextcloud__php_version is version(__nextcloud__requirements[__nextcloud__major_version]["php_max"], "<")'
          - '__nextcloud__mariadb_version is version(__nextcloud__requirements[__nextcloud__major_version]["mariadb_min"], ">=")'
        quiet: true
        fail_msg: >-
          {% if __nextcloud__major_version not in __nextcloud__requirements -%}
          Nextcloud {{ __nextcloud__major_version }} is not supported by this role.
          Supported versions: {{ __nextcloud__requirements | list | join(", ") }}.
          {%- else -%}
          Nextcloud {{ __nextcloud__major_version }} needs
          PHP {{ __nextcloud__requirements[__nextcloud__major_version]["php_min"] }} or newer, but older than {{ __nextcloud__requirements[__nextcloud__major_version]["php_max"] }},
          and MariaDB {{ __nextcloud__requirements[__nextcloud__major_version]["mariadb_min"] }} or newer.
          Found PHP {{ __nextcloud__php_version }} and MariaDB {{ __nextcloud__mariadb_version }}.
          {%- endif %}
      vars:
        __nextcloud__major_version: '{{ __nextcloud__versions_result["stdout"].split()[0] }}'
        __nextcloud__mariadb_version: '{{ __nextcloud__mariadb_info_result["version"]["full"] | regex_search("^[0-9.]+") }}'
        __nextcloud__php_version: '{{ __nextcloud__versions_result["stdout"].split()[1] }}'

    when:
      - '__nextcloud__version_php_result["stat"]["exists"]'

  - name: 'Deploy /var/www/html/nextcloud/config/objectstore.config.php (storage backend)'
    ansible.builtin.template:
      backup: true
      src: 'var/www/html/nextcloud/config/objectstore.config.php.j2'
      dest: '/var/www/html/nextcloud/config/objectstore.config.php'
      owner: '{{ __shared__apache_httpd_user }}'
      group: '{{ __shared__apache_httpd_group }}'
      mode: 0o644
    when: '(nextcloud__storage_backend_s3["bucket"] is defined and nextcloud__storage_backend_s3["bucket"] | length > 0)
          or (nextcloud__storage_backend_swift["bucket"] is defined and nextcloud__storage_backend_swift["bucket"] | length > 0)'

  - name: 'chown -R {{ __shared__apache_httpd_user }}:{{ __shared__apache_httpd_group }} /var/www/html/nextcloud'
    ansible.builtin.file:
      path: '/var/www/html/nextcloud'
      owner: '{{ __shared__apache_httpd_user }}'
      group: '{{ __shared__apache_httpd_group }}'
      recurse: true

  - name: 'mkdir path/to/data; chown -R {{ __shared__apache_httpd_user }}:{{ __shared__apache_httpd_group }} path/to/data; chmod 0750 -R path/to/data'
    ansible.builtin.file:
      path: '{{ item }}'
      state: 'directory'
      owner: '{{ __shared__apache_httpd_user }}'
      group: '{{ __shared__apache_httpd_group }}'
      mode: 0o750
    loop:
      - '{{ nextcloud__datadir }}'
      - '/var/www/html/nextcloud/data'

  - name: 'chmod +x /var/www/html/nextcloud/occ'
    ansible.builtin.file:
      path: '/var/www/html/nextcloud/occ'
      mode: 0o755

  - name: 'restorecon -Fvr {{ nextcloud__datadir }} /var/www/html/nextcloud'
    ansible.builtin.command: 'restorecon -Fvr {{ nextcloud__datadir | quote }} /var/www/html/nextcloud'
    register: 'nextcloud__restorecon_nextcloud_result'
    changed_when: 'nextcloud__restorecon_nextcloud_result["stdout"] | length > 0'
    when:
      - 'ansible_facts["selinux"]["status"] != "disabled"'

  # The passwords reach occ on stdin, not on its command line, where every local user could
  # read them in the process list. Without --database-pass and --admin-pass, occ asks for
  # the database password first and the admin password second, and without a TTY it reads
  # one line of stdin per question (verified with Nextcloud 35.0.0 on Rocky 10).
  - name: 'Run the Nextcloud installer'
    ansible.builtin.command: >-
      php occ maintenance:install
        --admin-user '{{ nextcloud__users[0]["username"] }}'
        --data-dir '{{ nextcloud__datadir }}'
        --database 'mysql'
        --database-host '{{ nextcloud__database_host }}'
        --database-name '{{ nextcloud__database_name }}'
        --database-user '{{ nextcloud__mariadb_login["username"] }}'
    args:
      chdir: '/var/www/html/nextcloud/'
      creates: '/var/www/html/nextcloud/config/config.php'
      stdin: |-
        {{ nextcloud__mariadb_login["password"] }}
        {{ nextcloud__users[0]["password"] }}
    become: true
    become_user: '{{ __shared__apache_httpd_user }}'
    register: '__nextcloud__install_result'

  # Only on a fresh installation: enforcing it later would make every existing user set up a
  # second factor at the next login.
  - name: 'php occ twofactorauth:enforce --on'
    ansible.builtin.command: 'php occ twofactorauth:enforce --on'
    args:
      chdir: '/var/www/html/nextcloud/'
    become: true
    become_user: '{{ __shared__apache_httpd_user }}'
    changed_when: true # only runs right after the installation
    when:
      - '__nextcloud__install_result is changed'
      - 'nextcloud__twofactor_enforced | bool'

  # Only on a fresh installation: on an existing one this would delete deleted files and old
  # versions earlier than its users expect.
  - name: 'php occ config:system:set {{ item }} --value="auto, 30"'
    ansible.builtin.command: 'php occ config:system:set {{ item }} --value="auto, 30"'
    args:
      chdir: '/var/www/html/nextcloud/'
    become: true
    become_user: '{{ __shared__apache_httpd_user }}'
    changed_when: true # only runs right after the installation
    loop:
      - 'trashbin_retention_obligation'
      - 'versions_retention_obligation'
    when:
      - '__nextcloud__install_result is changed'

  # A new instance has no mimetype_version yet, so Nextcloud reports the migrations since
  # 29.0.0.10 as pending. They are part of the expensive repair steps only, and take no time on
  # the empty database. Verified against Nextcloud 35.0.2.
  - name: 'php occ maintenance:repair --include-expensive'
    ansible.builtin.command: 'php occ maintenance:repair --include-expensive'
    args:
      chdir: '/var/www/html/nextcloud/'
    become: true
    become_user: '{{ __shared__apache_httpd_user }}'
    changed_when: true # only runs right after the installation
    when:
      - '__nextcloud__install_result is changed'

  - name: 'Convert some database columns to big int'
    ansible.builtin.command: |
      php occ db:convert-filecache-bigint --no-interaction
    args:
      chdir: '/var/www/html/nextcloud/'
    become: true
    become_user: '{{ __shared__apache_httpd_user }}'
    register: 'nextcloud__convert_filecache_bigint_result'
    changed_when: '"All tables already up to date" not in nextcloud__convert_filecache_bigint_result["stdout"]'
    # changed_when: there is no easy way to check for changes

  tags:
    - 'nextcloud'


- block:

  # The socket is open to the members of the Redis / Valkey group only. The PHP-FPM restart below
  # gives the workers the new group.
  - name: 'usermod --append --groups {{ nextcloud__redis_group }} {{ __shared__apache_httpd_user }}'
    ansible.builtin.user:
      name: '{{ __shared__apache_httpd_user }}'
      groups: '{{ nextcloud__redis_group }}'
      append: true
    register: '__nextcloud__redis_group_result'
    when:
      - 'nextcloud__redis_unixsocket | length > 0'

  - name: 'Get Nextcloud config list'
    ansible.builtin.command: 'php /var/www/html/nextcloud/occ --no-interaction --output=json config:list --private'
    become: true
    become_user: '{{ __shared__apache_httpd_user }}'
    changed_when: false
    check_mode: false
    register: '__nextcloud__config_list_result'

  - name: 'Set Nextcloud system settings'
    linuxfabrik.lfops.nextcloud_occ_system_config:
      name: '{{ item["key"] }}'
      value: '{{ item["value"] }}'
      type: '{{ item["type"] | d("string") }}'
      state: '{{ item["state"] | d("present") }}'
      installed_config_json: '{{ __nextcloud__config_list_result["stdout"] | from_json }}'
    become: true
    become_user: '{{ __shared__apache_httpd_user }}'
    loop: '{{ nextcloud__sysconfig__combined_var }}'

  # Leaves a mail server alone that was configured by hand. Nextcloud treats a set mail_domain
  # without a test mail as verified, see EmailTestSuccessful.php.
  - name: 'Set the Nextcloud mail server'
    linuxfabrik.lfops.nextcloud_occ_system_config:
      name: '{{ item["key"] }}'
      value: '{{ item["value"] }}'
      type: '{{ item["type"] | d("string") }}'
      state: 'present'
      installed_config_json: '{{ __nextcloud__config_list_result["stdout"] | from_json }}'
    become: true
    become_user: '{{ __shared__apache_httpd_user }}'
    loop:
      - key: 'mail_domain'
        value: '{{ nextcloud__mail_from.split("@")[-1] }}'
      - key: 'mail_from_address'
        value: '{{ nextcloud__mail_from.split("@")[0] }}'
      - key: 'mail_smtpauth'
        value: '{{ (nextcloud__mail_smtp_password | length > 0) | string | lower }}'
        type: 'boolean'
      - key: 'mail_smtphost'
        value: '{{ nextcloud__mail_smtp_host }}'
      - key: 'mail_smtpmode'
        value: 'smtp'
      - key: 'mail_smtpname'
        value: '{{ nextcloud__mail_smtp_username }}'
      - key: 'mail_smtppassword'
        value: '{{ nextcloud__mail_smtp_password }}'
      - key: 'mail_smtpport'
        value: '{{ nextcloud__mail_smtp_port }}'
        type: 'integer'
    loop_control:
      label: '{{ item["key"] }}'
    when:
      - 'nextcloud__mail_smtp_host | length > 0'
      - '"@" in nextcloud__mail_from'
      - '"mail_domain" not in (__nextcloud__config_list_result["stdout"] | from_json)["system"]'

  # do this straight after the installation to get NC up and running
  # otherwise subsequent occ commands might fail
  - name: 'restart {{ __nextcloud__php_fpm_service_name }}'
    ansible.builtin.service:
      name: '{{ __nextcloud__php_fpm_service_name }}'
      state: 'restarted'

  tags:
    - 'nextcloud'
    - 'nextcloud:configure'


- block:

  - name: 'Get Nextcloud app list'
    ansible.builtin.command: 'php /var/www/html/nextcloud/occ --no-interaction --output=json app:list'
    become: true
    become_user: '{{ __shared__apache_httpd_user }}'
    changed_when: false
    check_mode: false
    register: '__nextcloud__app_list_result'

  - name: 'Manage Nextcloud apps'
    linuxfabrik.lfops.nextcloud_occ_app:
      name: '{{ item["name"] }}'
      state: '{{ item["state"] | d("enabled") }}'
      force: '{{ item["force"] | d(false) }}'
      installed_apps_json: '{{ __nextcloud__app_list_result["stdout"] | from_json }}'
    become: true
    become_user: '{{ __shared__apache_httpd_user }}'
    loop: '{{ nextcloud__apps__combined_var }}'

  - name: 'Get Nextcloud config list'
    ansible.builtin.command: 'php /var/www/html/nextcloud/occ --no-interaction --output=json config:list --private'
    become: true
    become_user: '{{ __shared__apache_httpd_user }}'
    changed_when: false
    check_mode: false
    register: '__nextcloud__config_list_result'

  - name: 'Set Nextcloud app settings'
    linuxfabrik.lfops.nextcloud_occ_app_config:
      app: '{{ (item["key"] | split)[0] }}'
      name: '{{ (item["key"] | split)[1:] | join(" ") }}'
      value: '{{ item["value"] }}'
      type: '{{ item["type"] | d("string") }}'
      state: '{{ item["state"] | d("present") }}'
      installed_config_json: '{{ __nextcloud__config_list_result["stdout"] | from_json }}'
    become: true
    become_user: '{{ __shared__apache_httpd_user }}'
    loop: '{{ nextcloud__app_configs__combined_var }}'

  - name: 'restart {{ __nextcloud__php_fpm_service_name }}'
    ansible.builtin.service:
      name: '{{ __nextcloud__php_fpm_service_name }}'
      state: 'restarted'

  when:
    - 'not nextcloud__skip_apps'
  tags:
    - 'nextcloud'
    - 'nextcloud:apps'


- block:

  - name: 'restorecon -Fvr /var/www/html/nextcloud/apps/notify_push/'
    ansible.builtin.command: 'restorecon -Fvr /var/www/html/nextcloud/apps/notify_push/'
    register: 'nextcloud__restorecon_notify_push_result'
    changed_when: 'nextcloud__restorecon_notify_push_result["stdout"] | length > 0'
    when:
      - 'ansible_facts["selinux"]["status"] != "disabled"'

  - name: 'systemctl restart notify_push.service'
    ansible.builtin.systemd_service:
      name: 'notify_push.service'
      state: 'restarted'

  - name: 'Setup notify_push at https://{{ nextcloud__fqdn }}/push'
    ansible.builtin.command: |
      php occ notify_push:setup https://{{ nextcloud__fqdn }}/push
    args:
      chdir: '/var/www/html/nextcloud/'
    become: true
    become_user: '{{ __shared__apache_httpd_user }}'
    changed_when: true # always runs, there is no easy way to tell whether it changed anything

  when:
    - 'not nextcloud__skip_notify_push'
  tags:
    - 'nextcloud'
    - 'nextcloud:configure'
    - 'nextcloud:notify_push'


- block:

  # nested loop construct (for user in users; for setting in user.settings; ...)
  - ansible.builtin.include_tasks: 'create-user.yml'
    loop: '{{ nextcloud__users }}'
    loop_control:
      loop_var: 'ncuser'

  tags:
    - 'nextcloud'
    - 'nextcloud:users'


- block:

  - name: 'chown -R {{ __shared__apache_httpd_user }}:{{ __shared__apache_httpd_group }} /var/www/html/nextcloud'
    ansible.builtin.file:
      path: '/var/www/html/nextcloud'
      owner: '{{ __shared__apache_httpd_user }}'
      group: '{{ __shared__apache_httpd_group }}'
      recurse: true

  tags:
    - 'nextcloud'


- block:

  - name: 'Deploy /etc/systemd/system/nextcloud-jobs.service'
    ansible.builtin.template:
      backup: true
      src: 'etc/systemd/system/nextcloud-jobs.service.j2'
      dest: '/etc/systemd/system/nextcloud-jobs.service'
      owner: 'root'
      group: 'root'
      mode: 0o644
    notify: 'nextcloud: systemctl daemon-reload'

  - name: 'Deploy /etc/systemd/system/nextcloud-jobs.timer'
    ansible.builtin.template:
      backup: true
      src: 'etc/systemd/system/nextcloud-jobs.timer.j2'
      dest: '/etc/systemd/system/nextcloud-jobs.timer'
      owner: 'root'
      group: 'root'
      mode: 0o644
    notify: 'nextcloud: systemctl daemon-reload'

  - name: 'Set background job to "cron"'
    ansible.builtin.command: |
      php occ background:cron
    args:
      chdir: '/var/www/html/nextcloud/'
    become: true
    become_user: '{{ __shared__apache_httpd_user }}'
    changed_when: true # there is no easy way to check for changes

  - name: 'Deploy /usr/local/bin/nextcloud-app-update'
    ansible.builtin.template:
      backup: true
      src: 'usr/local/bin/nextcloud-app-update.j2'
      dest: '/usr/local/bin/nextcloud-app-update'
      owner: 'root'
      group: 'root'
      mode: 0o755

  - name: 'Deploy /etc/systemd/system/nextcloud-app-update.service'
    ansible.builtin.template:
      backup: true
      src: 'etc/systemd/system/nextcloud-app-update.service.j2'
      dest: '/etc/systemd/system/nextcloud-app-update.service'
      owner: 'root'
      group: 'root'
      mode: 0o644
    notify: 'nextcloud: systemctl daemon-reload'

  - name: 'Deploy /etc/systemd/system/nextcloud-app-update.timer'
    ansible.builtin.template:
      backup: true
      src: 'etc/systemd/system/nextcloud-app-update.timer.j2'
      dest: '/etc/systemd/system/nextcloud-app-update.timer'
      owner: 'root'
      group: 'root'
      mode: 0o644
    notify: 'nextcloud: systemctl daemon-reload'

  - name: 'Deploy /etc/systemd/system/nextcloud-scan-files.service'
    ansible.builtin.template:
      backup: true
      src: 'etc/systemd/system/nextcloud-scan-files.service.j2'
      dest: '/etc/systemd/system/nextcloud-scan-files.service'
      owner: 'root'
      group: 'root'
      mode: 0o644
    notify: 'nextcloud: systemctl daemon-reload'

  - name: 'Deploy /etc/systemd/system/nextcloud-scan-files.timer'
    ansible.builtin.template:
      backup: true
      src: 'etc/systemd/system/nextcloud-scan-files.timer.j2'
      dest: '/etc/systemd/system/nextcloud-scan-files.timer'
      owner: 'root'
      group: 'root'
      mode: 0o644
    notify: 'nextcloud: systemctl daemon-reload'

