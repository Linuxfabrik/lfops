- block:

  - name: 'Manage the security group for the VM'
    linuxfabrik.lfops.exoscale_security_group:
      api_key: '{{ exoscale_vm__api_key }}'
      api_secret: '{{ exoscale_vm__api_secret }}'
      zone: '{{ exoscale_vm__zone }}'
      name: '{{ exoscale_vm__name }}'
      rules: '{{ exoscale_vm__security_group_rules }}'
      state: 'present'
    when:
      - 'exoscale_vm__security_group_rules is defined and exoscale_vm__security_group_rules | length > 0'
      - 'exoscale_vm__state != "absent"'

  delegate_to: 'localhost'
  become: false
  vars:
    ansible_become: false # noqa var-naming[pattern]
  tags:
    - 'exoscale_vm'
    - 'exoscale_vm:firewalls'


- block:

  - name: 'Create the private networks required by the VM'
    linuxfabrik.lfops.exoscale_private_network:
      api_key: '{{ exoscale_vm__api_key }}'
      api_secret: '{{ exoscale_vm__api_secret }}'
      zone: '{{ exoscale_vm__zone }}'
      name: '{{ item["name"] }}'
      cidr: '{{ item["cidr"] }}'
      state: 'present' # never delete, as it could be used by other VMs as well
    loop: '{{ exoscale_vm__private_networks }}'
    when:
      - 'exoscale_vm__state != "absent"'
      - 'item["cidr"] is defined'
      - 'item["state"] | d("present") != "absent"'

  delegate_to: 'localhost'
  become: false
  vars:
    ansible_become: false # noqa var-naming[pattern]
  tags:
    - 'exoscale_vm'
    - 'exoscale_vm:networks'


- block:

  # the instance also carries the attachments to the security groups and the
  # private networks, therefore it runs for those tags as well
  - name: 'Manage the VM at Exoscale'
    linuxfabrik.lfops.exoscale_instance:
      api_key: '{{ exoscale_vm__api_key }}'
      api_secret: '{{ exoscale_vm__api_secret }}'
      zone: '{{ exoscale_vm__zone }}'
      name: '{{ exoscale_vm__name }}'
      instance_type: '{{ exoscale_vm__service_offering }}'
      template: '{{ exoscale_vm__template }}'
      template_visibility: '{{ exoscale_vm__template_visibility }}'
      disk_size: '{{ exoscale_vm__disk_size }}'
      ssh_keys:
        - '{{ exoscale_vm__ssh_key }}'
      public_ip_assignment: '{{ (exoscale_vm__private_instance | bool) | ternary("none", "inet4") }}'
      security_groups: '{{
          ["default"]
          + ([exoscale_vm__name] if (exoscale_vm__security_group_rules is defined and exoscale_vm__security_group_rules | length > 0) else [])
        }}'
      # `cidr` is only for creating the network, see above
      private_networks: '{{ exoscale_vm__private_networks | ansible.utils.remove_keys(target=["cidr"]) }}'
      force: '{{ exoscale_vm__force | bool }}'
      state: '{{ exoscale_vm__state }}'

  delegate_to: 'localhost'
  become: false
  vars:
    ansible_become: false # noqa var-naming[pattern]
  tags:
    - 'exoscale_vm'
    - 'exoscale_vm:firewalls'
    - 'exoscale_vm:networks'


- block:

  - name: 'Delete the security group of the VM'
    linuxfabrik.lfops.exoscale_security_group:
      api_key: '{{ exoscale_vm__api_key }}'
      api_secret: '{{ exoscale_vm__api_secret }}'
      zone: '{{ exoscale_vm__zone }}'
      name: '{{ exoscale_vm__name }}'
      state: 'absent'
    when:
      - 'exoscale_vm__security_group_rules is defined and exoscale_vm__security_group_rules | length > 0'
      - 'exoscale_vm__state == "absent"'

  delegate_to: 'localhost'
  become: false
  vars:
    ansible_become: false # noqa var-naming[pattern]
  tags:
    - 'exoscale_vm'
    - 'exoscale_vm:firewalls'
