- block:

  # a precondition, not a result: the host cannot perform the reboot lfops__reboot_now asks of it,
  # so the run is refused before the modprobe configuration is written rather than after.
  - name: 'Assert that a reboot is possible'
    ansible.builtin.include_role:
      name: 'shared'
      tasks_from: 'assert-reboot-possible.yml'

  tags:
    - 'always'


- block:

  - name: 'Combined kernel modules'
    ansible.builtin.debug:
      var: 'kernel_modules__modules__combined_var'

  # dracut copies /etc/modprobe.d into the initramfs, so blocking usb-storage on a host that
  # boots from a USB disk or an SD card reader makes it unbootable after the next kernel update.
  # uas depends on usb-storage, so UAS disks are affected as well.
  - name: 'lsblk --nodeps --noheadings --raw --output TRAN,NAME'
    ansible.builtin.command: 'lsblk --nodeps --noheadings --raw --output TRAN,NAME'
    register: '__kernel_modules__lsblk_result'
    changed_when: false # read-only command, never changes anything
    check_mode: false # also run in check mode
    when:
      - '"usb_storage" in __kernel_modules__blocked_module_names | map("replace", "-", "_") | list'

  - name: 'Assert that no USB disk is attached while usb-storage gets blocked'
    ansible.builtin.assert:
      that:
        - '__kernel_modules__lsblk_result["stdout_lines"] | select("match", "usb ") | list | length == 0'
      quiet: true
      fail_msg: >-
        usb-storage is to be blocked, but the host has USB disks attached
        ({{ __kernel_modules__lsblk_result["stdout_lines"] | select("match", "usb ") | map("split", " ") | map("last") | join(", ") }}).
        If the host boots from one of them, it would no longer boot. Set `enabled: true` for
        usb-storage in kernel_modules__modules__host_var, or detach the disks.
    when:
      - '__kernel_modules__lsblk_result is not skipped'

  # An `install <module> /bin/true` line prevents the module from being loaded,
  # both automatically and via a manual `modprobe`. Already-loaded modules stay
  # loaded until the next reboot (see README).
  - name: 'Deploy /etc/modprobe.d/linuxfabrik-kernel-modules.conf'
    ansible.builtin.template:
      backup: true
      src: 'etc/modprobe.d/linuxfabrik-kernel-modules.conf.j2'
      dest: '/etc/modprobe.d/linuxfabrik-kernel-modules.conf'
      owner: 'root'
      group: 'root'
      mode: 0o644
    register: '__kernel_modules__conf_result'

  - name: 'cat /proc/modules'
    ansible.builtin.slurp:
      src: '/proc/modules'
    register: '__kernel_modules__proc_modules_result'
    when:
      - '__kernel_modules__conf_result is changed'

  # Only the run that changes the configuration asks for the reboot. A later run finds the file
  # already correct and stays quiet, even while the modules are still loaded and the reboot is
  # still pending: the spool file lives in /run and outlives those runs.
  - name: 'Request a reboot'
    ansible.builtin.include_role:
      name: 'shared'
      tasks_from: 'request-reboot.yml'
    vars:
      shared__reboot_reason: 'kernel_modules'
      shared__reboot_detail: 'blocked kernel modules are still loaded ({{ __kernel_modules__loaded_blocked_module_names | join(", ") }})'
    when:
      - '__kernel_modules__conf_result is changed'
      - '__kernel_modules__loaded_blocked_module_names | length > 0'

  tags:
    - 'kernel_modules'
