- block:

  - name: 'Set platform/version specific variables'
    ansible.builtin.import_role:
      name: 'shared'
      tasks_from: 'platform-variables.yml'

  tags:
    - 'always'


- block:

  # duplicity runs from the venv that python_venv builds from this definition. It falls back
  # to an empty list on other platforms, so without this check the role would set up backups
  # that have no duplicity to run.
  - name: 'Assert that this role supports the platform'
    ansible.builtin.assert:
      that:
        - 'duplicity__python_venv__venvs__dependent_var | length > 0'
      quiet: true
      fail_msg: 'duplicity: {{ ansible_facts["distribution"] }} {{ ansible_facts["distribution_version"] }} is not supported by this role. Supported platforms: {{ __duplicity__python_venv__venvs__dependent_var.keys() | join(", ") }}.'

  tags:
    # use 'always' so the validation runs even when other roles reference these variables.
    - 'always'


- block:

  - name: 'Install required packages'
    ansible.builtin.package:
      name: '{{ __duplicity__required_packages }}'
      state: 'present'
    retries: 3 # ride out a brief outage of the package repository
    delay: 10

  - name: 'mkdir /etc/duba'
    ansible.builtin.file:
      path: '/etc/duba'
      state: 'directory'
      owner: 'root'
      group: 'root'
      mode: 0o755

  tags:
    - 'duplicity'


- block:

  - name: 'Combined Paths'
    ansible.builtin.debug:
      var: 'duplicity__backup_sources__combined_var'

  - name: 'Generate local gpg key'
    linuxfabrik.lfops.gpg_key:
      name_real: 'duplicity'
      name_email: 'root@{{ ansible_facts["nodename"] }}'
      key_type: 'RSA'
      key_length: 4096
    register: 'duplicity__gpg_encrypt_local_key'

  - name: 'Deploy the public master GPG key to /tmp/public-master-key'
    ansible.builtin.copy:
      dest: '/tmp/public-master-key'
      content: '{{ duplicity__gpg_encrypt_master_key_block }}'
      mode: 0o600
    changed_when: false

  - name: 'gpg --import /tmp/public-master-key'
    ansible.builtin.command: 'gpg --import /tmp/public-master-key'
    register: 'duplicity__gpg_import_result'
    changed_when: '"not changed" not in duplicity__gpg_import_result.stderr'

  - name: 'rm -f /tmp/public-master-key'
    ansible.builtin.file:
      path: '/tmp/public-master-key'
      state: 'absent'
    changed_when: false

  - name: "echo '{{ duplicity__gpg_encrypt_master_key }}:6:' | gpg --import-ownertrust # set trust to ultimate"
    ansible.builtin.shell: "set -o pipefail; echo '{{ duplicity__gpg_encrypt_master_key }}:6:' | gpg --import-ownertrust"
    args:
      executable: '/bin/bash'
    register: 'duplicity__gpg_import_ownertrust_result'
    changed_when: '"ownertrust" in duplicity__gpg_import_ownertrust_result.stderr'

  # encrypted with systemd 251 and newer, see the systemd_credential module. duba merges it into
  # the environment of duplicity, over the `env` of duba.json. sftp with key authentication needs
  # no password, so there is no credential then.
  # Built inline instead of from a template: ansible-core before 2.19 turns a rendered string
  # that looks like a dict into one, which the module would then store as its Python repr; an
  # expression ending in `to_json` is exempt.
  - name: 'Store the backend password as the systemd credential duba-login.json'
    linuxfabrik.lfops.systemd_credential:
      name: 'duba-login.json'
      content: '{{ __duplicity__login_env | to_json }}'
      state: '{{ (__duplicity__login_env.values() | first | length > 0) | ternary("present", "absent") }}'
    vars:
      __duplicity__login_env: '{{
          {"SWIFT_PASSWORD": duplicity__swift_login["password"] | d("")}
          if duplicity__backup_backend == "swift" else
          {"FTP_PASSWORD": duplicity__sftp_password | d("")}
        }}'
    register: '__duplicity__login_credential_result'

  - name: 'Deploy /etc/duba/duba.json'
    ansible.builtin.template:
      src: 'etc/duba/duba.json.j2'
      dest: '/etc/duba/duba.json'
      owner: 'root'
      group: 'root'
      mode: 0o600

  # the copies `backup: true` left still contain the password, which is now in the credential
  - name: 'find /etc/duba -maxdepth 1 -name duba.json.*~'
    ansible.builtin.find:
      paths: '/etc/duba'
      patterns: 'duba.json.*~'
    register: '__duplicity__duba_json_backup_result'

  - name: 'rm -f /etc/duba/duba.json.*~'
    ansible.builtin.file:
      path: '{{ item["path"] }}'
      state: 'absent'
    loop: '{{ __duplicity__duba_json_backup_result["files"] }}'
    loop_control:
      label: '{{ item["path"] }}'

  - name: 'Deploy /etc/systemd/system/duba.service'
    ansible.builtin.template:
      backup: true
      src: 'etc/systemd/system/duba.service.j2'
      dest: '/etc/systemd/system/duba.service'
      owner: 'root'
      group: 'root'
      mode: 0o644
    notify: 'duplicity: systemctl daemon-reload'

  - name: 'Deploy /usr/local/bin/duba'
    ansible.builtin.template:
      backup: true
      src: 'usr/local/bin/duba.j2'
      dest: '/usr/local/bin/duba'
      owner: 'root'
      group: 'root'
      mode: 0o755

  - name: 'Deploy /etc/logrotate.d/duplicity'
    ansible.builtin.template:
      backup: true
      src: 'etc/logrotate.d/duplicity.j2'
      dest: '/etc/logrotate.d/duplicity'
      owner: 'root'
      group: 'root'
      mode: 0o644

  tags:
    - 'duplicity'
    - 'duplicity:configure'


- block:

  - name: 'Deploy /etc/systemd/system/duba.timer'
    ansible.builtin.template:
      backup: true
      src: 'etc/systemd/system/duba.timer.j2'
      dest: '/etc/systemd/system/duba.timer'
      owner: 'root'
      group: 'root'
      mode: 0o644
    notify: 'duplicity: systemctl daemon-reload'

  tags:
    - 'duplicity'
    - 'duplicity:configure'
    - 'duplicity:dump'


- block:

  - name: 'systemctl {{ duplicity__timer_enabled | bool | ternary("enable", "disable") }} duba.timer --now'
    ansible.builtin.systemd:
      name: 'duba.timer'
      state: '{{ duplicity__timer_enabled | bool | ternary("started", "stopped") }}'
      enabled: '{{ duplicity__timer_enabled | bool }}'

  tags:
    - 'duplicity'
    - 'duplicity:dump'
    - 'duplicity:state'
