# Order matters: maintenance windows and alert contacts must exist (or be
# deleted) before the monitors that reference them. PSPs come last because
# they reference monitors.

- name: 'Print UptimeRobot resource counts before applying'
  ansible.builtin.debug:
    msg: >-
      Will reconcile against UptimeRobot:
      {{ uptimerobot__mwindows | length }} maintenance window(s),
      {{ uptimerobot__monitors | length }} monitor(s),
      {{ uptimerobot__psps | length }} public status page(s),
      {{ uptimerobot__alert_contacts | length }} alert contact cleanup entr(y|ies).
  tags:
    - 'always'


- block:

  - name: 'Apply UptimeRobot maintenance windows'
    linuxfabrik.lfops.uptimerobot_mwindow:
      api_key: '{{ uptimerobot__api_key | d(omit, true) }}'
      api_key_file: '{{ uptimerobot__api_key_file | d(omit, true) }}'
      type: '{{ item.type | d(omit) }}'
      value: '{{ item.value | d(omit) }}'
      start_time: '{{ item.start_time | d(omit) }}'
      end_time: '{{ item.end_time | d(omit) }}'
      duration: '{{ item.duration | d(omit) }}'
      status: '{{ item.status | d(omit) }}'
      friendly_name: '{{ item.friendly_name | d(omit) }}'
      state: '{{ item.state | d("present") }}'
    loop: '{{ uptimerobot__mwindows }}'
    loop_control:
      label: >-
        {{ item.friendly_name
           | d(item.type
             ~ (" " ~ item.value if item.value is defined else "")
             ~ " " ~ item.start_time
             ~ "-" ~ item.end_time
           ) }}

  tags:
    - 'uptimerobot'
    - 'uptimerobot:mwindow'


- block:

  - name: 'Apply UptimeRobot monitors'
    linuxfabrik.lfops.uptimerobot_monitor:
      api_key: '{{ uptimerobot__api_key | d(omit, true) }}'
      api_key_file: '{{ uptimerobot__api_key_file | d(omit, true) }}'
      friendly_name: >-
        {{ item.friendly_name
           | d(((item.prefix ~ " " ~ (item.url | regex_replace("^https?://", "")))
                | replace(item.prefix ~ " " ~ item.prefix, item.prefix))) }}
      url: '{{ item.url | d(omit) }}'
      type: '{{ item.type | d("http") }}'
      sub_type: '{{ item.sub_type | d(omit) }}'
      port: '{{ item.port | d(omit) }}'
      keyword_type: '{{ item.keyword_type | d(omit) }}'
      keyword_case_type: '{{ item.keyword_case_type | d(omit) }}'
      keyword_value: '{{ item.keyword_value | d(omit) }}'
      interval: '{{ item.interval | d(omit) }}'
      timeout: '{{ item.timeout | d(omit) }}'
      status: '{{ item.status | d(omit) }}'
      http_username: '{{ item.http_username | d(omit) }}'
      http_password: '{{ item.http_password | d(omit) }}'
      http_auth_type: '{{ item.http_auth_type | d(omit) }}'
      http_method: '{{ item.http_method | d(omit) }}'
      post_type: '{{ item.post_type | d(omit) }}'
      post_value: '{{ item.post_value | d(omit) }}'
      post_content_type: '{{ item.post_content_type | d(omit) }}'
      custom_http_headers: '{{ item.custom_http_headers | d(omit) }}'
      custom_http_statuses: '{{ item.custom_http_statuses | d(omit) }}'
      ignore_ssl_errors: '{{ item.ignore_ssl_errors | d(omit) }}'
      disable_domain_expire_notifications: '{{ item.disable_domain_expire_notifications | d(omit) }}'
      alert_contacts: '{{ item.alert_contacts | d(omit) }}'
      mwindows: '{{ item.mwindows | d(omit) }}'
      state: '{{ item.state | d("present") }}'
    loop: '{{ uptimerobot__monitors }}'
    loop_control:
      label: >-
        {{ item.friendly_name
           | d(((item.prefix ~ " " ~ (item.url | regex_replace("^https?://", "")))
                | replace(item.prefix ~ " " ~ item.prefix, item.prefix))) }}

  tags:
    - 'uptimerobot'
    - 'uptimerobot:monitor'


- block:

  - name: 'Apply UptimeRobot public status pages'
    linuxfabrik.lfops.uptimerobot_psp:
      api_key: '{{ uptimerobot__api_key | d(omit, true) }}'
      api_key_file: '{{ uptimerobot__api_key_file | d(omit, true) }}'
      friendly_name: '{{ item.friendly_name }}'
      monitors: '{{ item.monitors | d(omit) }}'
      custom_domain: '{{ item.custom_domain | d(omit) }}'
      custom_url: '{{ item.custom_url | d(omit) }}'
      password: '{{ item.password | d(omit) }}'
      sort: '{{ item.sort | d(omit) }}'
      hide_url_links: '{{ item.hide_url_links | d(omit) }}'
      status: '{{ item.status | d(omit) }}'
      state: '{{ item.state | d("present") }}'
    loop: '{{ uptimerobot__psps }}'
    loop_control:
      label: '{{ item.friendly_name }}'

  tags:
    - 'uptimerobot'
    - 'uptimerobot:psp'


- block:

  - name: 'Clean up stale UptimeRobot alert contacts'
    linuxfabrik.lfops.uptimerobot_alert_contact:
      api_key: '{{ uptimerobot__api_key | d(omit, true) }}'
      api_key_file: '{{ uptimerobot__api_key_file | d(omit, true) }}'
      id: '{{ item.id | d(omit) }}'
      friendly_name: '{{ item.friendly_name | d(omit) }}'
      state: '{{ item.state | d("absent") }}'
    loop: '{{ uptimerobot__alert_contacts }}'
    loop_control:
      label: '{{ item.friendly_name | d(item.id) }}'

  tags:
    - 'uptimerobot'
    - 'uptimerobot:alert_contact'
