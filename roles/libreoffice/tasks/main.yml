- name: 'Set platform/version specific variables'
  ansible.builtin.import_role:
    name: 'shared'
    tasks_from: 'platform-variables.yml'
  tags:
    - 'always'


- block:

  - name: 'Install libreoffice-core'
    ansible.builtin.package:
      name:
        - 'libreoffice-core'
        - 'libreoffice-writer'    # convert text documents
        - 'libreoffice-calc'      # convert spreadsheets
        - 'libreoffice-impress'   # convert presentations
        - 'libreoffice-draw'      # convert drawings
        - 'libreoffice-math'      # convert formulas
      state: 'present'
    retries: 3 # ride out a brief outage of the package repository
    delay: 10

  tags:
    - 'libreoffice'


- block:

  - name: 'mkdir -p ~/.config/libreoffice ~/.cache ~/.ansible/tmp of the web server user'
    ansible.builtin.file:
      path: '{{ item["path"] }}'
      state: 'directory'
      owner: '{{ __shared__apache_httpd_user }}'
      group: '{{ __shared__apache_httpd_group }}'
      mode: '{{ item["mode"] }}'
    loop:
      - path: '{{ __libreoffice__apache_home }}/.ansible'
        mode: 0o700
      # remote_tmp of the task below that runs as the web server user
      - path: '{{ __libreoffice__apache_home }}/.ansible/tmp'
        mode: 0o700
      - path: '{{ __libreoffice__apache_home }}/.cache'
        mode: 0o755
      - path: '{{ __libreoffice__apache_home }}/.config'
        mode: 0o755
      - path: '{{ __libreoffice__apache_home }}/.config/libreoffice'
        mode: 0o755
    register: '__libreoffice__mkdir_result'

  # LibreOffice writes its profile below ~/.config, so hand over files that an earlier run as
  # root may have left there
  - name: 'chown --recursive --changes ~/.config of the web server user'
    ansible.builtin.command: 'chown --recursive --changes {{ __shared__apache_httpd_user }}:{{ __shared__apache_httpd_group }} {{ __libreoffice__apache_home }}/.config'
    register: '__libreoffice__chown_result'
    changed_when: '__libreoffice__chown_result["stdout"] | length > 0'

  # creates the user profile and exits. converting a missing file instead fails on newer
  # LibreOffice releases ("source file could not be loaded").
  - name: 'soffice --headless --terminate_after_init as the web server user'
    ansible.builtin.command: '/usr/bin/soffice --headless --terminate_after_init'
    args:
      creates: '{{ __libreoffice__apache_home }}/.config/libreoffice/4'
    become: true
    become_user: '{{ __shared__apache_httpd_user }}'
    register: '__libreoffice__soffice_result'

  # the selinux role, which the playbook runs before this role, sets the file contexts of these
  # directories, but they only exist now. only after creating them: LibreOffice moves files from
  # /tmp into its profile at runtime, which keep their tmp type (Verified with LibreOffice 7.1 on
  # Rocky 9), and relabelling them is not the job of a deployment run. without `-F`, as only the
  # type matters.
  - name: 'restorecon -vr ~/.cache ~/.config of the web server user'
    ansible.builtin.command: 'restorecon -vr {{ __libreoffice__apache_home }}/.cache {{ __libreoffice__apache_home }}/.config'
    register: '__libreoffice__restorecon_result'
    changed_when: '__libreoffice__restorecon_result["stdout"] | length > 0'
    when:
      - 'ansible_facts["os_family"] == "RedHat"'
      - 'ansible_facts["selinux"]["status"] != "disabled"'
      - '__libreoffice__mkdir_result is changed or __libreoffice__soffice_result is changed'

  when:
    - 'libreoffice__client_apache | bool'
  tags:
    - 'libreoffice'
