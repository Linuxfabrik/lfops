# the tasks should be ordered as follows:
# * modules
# * booleans / file contexts / ports
# * restorecon commands
# * setenforce
#
# because:
# * if there is a module, new booleans / types from the module can be used in the following tasks
# * if selinux was permissive before the role ran, but the 'selinux__state' variable is set to 'enforcing', the booleans and types will be set correctly before selinux is enabled
# * if selinux is disabled, all the other tasks are skipped anyway

- name: 'Set platform/version specific variables'
  ansible.builtin.import_role:
    name: 'shared'
    tasks_from: 'platform-variables.yml'
  tags:
    - 'selinux'
    - 'selinux:fcontext'
    - 'selinux:modules'
    - 'selinux:port'
    - 'selinux:restorecon'
    - 'selinux:setenforce'
    - 'selinux:setsebool'


- block:

  - name: 'Combined SELinux modules:'
    ansible.builtin.debug:
      var: 'selinux__modules__combined_var'
    when: 'selinux__state != "disabled"'

  tags:
    - 'selinux'
    - 'selinux:modules'


- block:

  # Without this the run would fail inside `make` with "No rule to make target", naming a path in a
  # temporary directory that says nothing about which inventory entry is at fault.
  - name: 'Assert that every SELinux module has a source'
    ansible.builtin.assert:
      that:
        - '__selinux__modules_without_source | length == 0'
      quiet: true
      fail_msg: 'SELinux modules without a "src" or "content_te" subkey: {{ __selinux__modules_without_source | join(", ") }}.'
    vars:
      __selinux__modules_without_source: '{{
          __selinux__modules_present
          | rejectattr("src", "defined")
          | rejectattr("content_te", "defined")
          | map(attribute="name")
          | list
        }}'

  - name: 'Install SELinux module compilation dependencies'
    ansible.builtin.package:
      name: '{{ __selinux__module_compilation_packages }}'
      state: 'present'

  # Everything from here up to the "semodule --install" below only writes into a scratch directory
  # and never touches the managed system, hence the `changed_when: false` and `check_mode: false` on
  # each of those tasks. Without them the role would report a change on every run even when the
  # policy is already up to date, and a `--check` run could not tell whether a module would be
  # installed at all.
  - name: 'Create temporary directory for module compilation'
    ansible.builtin.tempfile:
      state: 'directory'
      suffix: 'selinux__modules'
    register: '__selinux__temp_dir_result'
    changed_when: false
    check_mode: false

  - name: 'Create one directory per SELinux module'
    ansible.builtin.file:
      path: '{{ __selinux__temp_dir_result["path"] }}/{{ item["name"] }}'
      state: 'directory'
      mode: 0o0755
    loop: '{{ __selinux__modules_present }}'
    loop_control:
      label: '{{ item["name"] }}'
    changed_when: false
    check_mode: false

  - name: 'Copy SELinux module source directories to target'
    ansible.builtin.copy:
      src: '{{ item["src"] }}'
      dest: '{{ __selinux__temp_dir_result["path"] }}/{{ item["name"] }}/'
      mode: 0o0755
    loop: '{{ __selinux__modules_present | selectattr("src", "defined") | list }}'
    loop_control:
      label: '{{ item["name"] }}'
    changed_when: false
    check_mode: false

  - name: 'Deploy inline SELinux module sources to target'
    ansible.builtin.copy:
      content: '{{ item["content_te"] }}'
      dest: '{{ __selinux__temp_dir_result["path"] }}/{{ item["name"] }}/{{ item["name"] }}.te'
      mode: 0o0644
    loop: '{{ __selinux__modules_present | selectattr("content_te", "defined") | list }}'
    loop_control:
      label: '{{ item["name"] }}'
    changed_when: false
    check_mode: false

  - name: 'Compile SELinux modules using policy devel Makefile'
    ansible.builtin.command:
      cmd: 'make -f /usr/share/selinux/devel/Makefile {{ item["name"] }}.pp'
      chdir: '{{ __selinux__temp_dir_result["path"] }}/{{ item["name"] }}'
    loop: '{{ __selinux__modules_present }}'
    loop_control:
      label: '{{ item["name"] }}'
    register: '__selinux__compile_result'
    changed_when: false
    check_mode: false
    ignore_errors: '{{ ansible_check_mode }}' # ignore errors if `--check` is specified, as the compilation dependencies could not be installed yet

  # `semodule --extract` writes <name>.pp into the current working directory and refuses to
  # overwrite, so it needs a directory of its own. It exits non-zero when the module is not
  # installed, which the comparison below treats like a mismatch.
  - name: 'Create temporary directory for the installed SELinux modules'
    ansible.builtin.file:
      path: '{{ __selinux__temp_dir_result["path"] }}/__installed'
      state: 'directory'
      mode: 0o0700
    changed_when: false
    check_mode: false

  - name: 'semodule --extract ...'
    ansible.builtin.command:
      cmd: 'semodule --extract={{ item["name"] }}'
      chdir: '{{ __selinux__temp_dir_result["path"] }}/__installed'
    loop: '{{ __selinux__modules_present }}'
    loop_control:
      label: '{{ item["name"] }}'
    failed_when: false # the module is simply not installed yet
    changed_when: false
    check_mode: false

  # Compiling the same source twice yields a byte-identical policy package, so an unchanged module
  # does not have to be reinstalled. Without this comparison the role reports a change on every run,
  # for every host the module is deployed to.
  # Verified against libsemanage 2.9 / selinux-policy 3.14.3 on Rocky 8.
  - name: 'cmp the compiled SELinux modules with the installed ones'
    ansible.builtin.command:
      cmd: 'cmp --silent {{ __selinux__temp_dir_result["path"] }}/{{ item["name"] }}/{{ item["name"] }}.pp {{ __selinux__temp_dir_result["path"] }}/__installed/{{ item["name"] }}.pp'
    loop: '{{ __selinux__modules_present }}'
    loop_control:
      label: '{{ item["name"] }}'
    register: '__selinux__module_cmp_result'
    failed_when: false
    changed_when: false
    check_mode: false

  - name: 'semodule --install ...'
    ansible.builtin.command:
      cmd: 'semodule --install {{ __selinux__temp_dir_result["path"] }}/{{ item[0]["name"] }}/{{ item[0]["name"] }}.pp'
    loop: '{{ __selinux__modules_present | zip(__selinux__module_cmp_result["results"]) }}'
    loop_control:
      label: '{{ item[0]["name"] }}'
    register: '__selinux__install_module_result'
    changed_when: true # only reached when the comparison above found a difference
    when: 'item[1]["rc"] | d(1) != 0'

  - name: 'Clean up temporary directory'
    ansible.builtin.file:
      path: '{{ __selinux__temp_dir_result["path"] }}'
      state: 'absent'
    changed_when: false
    check_mode: false

  when:
    - 'selinux__state != "disabled"'
    - '__selinux__modules_present | length > 0'
  tags:
    - 'selinux'
    - 'selinux:modules'


- block:

  - name: 'Get currently installed SELinux modules'
    ansible.builtin.command: 'semodule --list-modules'
    register: '__selinux__installed_modules_result'
    changed_when: false

  - name: 'Remove SELinux modules'
    ansible.builtin.command:
      cmd: 'semodule --remove {{ item["name"] }}'
    loop: '{{ __selinux__modules_absent }}'
    loop_control:
      label: '{{ item["name"] }}'
    when: 'item["name"] in __selinux__installed_modules_result["stdout_lines"]'
    register: '__selinux__remove_module_result'
    changed_when: true # only reached when the module is actually installed

  when:
    - 'selinux__state != "disabled"'
    - '__selinux__modules_absent | length > 0'
  tags:
    - 'selinux'
    - 'selinux:modules'


- block:

  - name: 'Combined SELinux booleans:'
    ansible.builtin.debug:
      var: 'selinux__booleans__combined_var'

  - name: 'setsebool -P ...'
    ansible.posix.seboolean:
      name: '{{ item.key }}'
      state: '{{ item.value }}'
      persistent: true
      ignore_selinux_state: true
    loop: '{{ selinux__booleans__combined_var }}'
    when: 'selinux__state != "disabled"'

  tags:
    - 'selinux'
    - 'selinux:setsebool'


- block:

  - name: 'Combined SELinux file contexts:'
    ansible.builtin.debug:
      var: 'selinux__fcontexts__combined_var'

  - name: 'semanage fcontext --add --type ...'
    community.general.sefcontext:
      setype: '{{ item["setype"] }}'
      target: '{{ item["target"] }}'
      state: '{{ item["state"] | d("present") }}'
      ignore_selinux_state: true
    loop: '{{ selinux__fcontexts__combined_var }}'
    when: 'selinux__state != "disabled"'

  tags:
    - 'selinux'
    - 'selinux:fcontext'


- block:

  - name: 'Combined SELinux ports:'
    ansible.builtin.debug:
      var: 'selinux__ports__combined_var'

  - name: 'semanage port --add --type ... --proto ...'
    community.general.seport:
      setype: '{{ item["setype"] }}'
      ports:
        - '{{ item["port"] }}'
      proto: '{{ item["proto"] }}'
      state: '{{ item["state"] | d("present") }}'
      ignore_selinux_state: true
    loop: '{{ selinux__ports__combined_var }}'
    when: 'selinux__state != "disabled"'

  tags:
    - 'selinux'
    - 'selinux:port'


- block:

  - name: 'Combined SELinux restorecons:'
    ansible.builtin.debug:
      var: 'selinux__restorecons__combined_var'

  - name: 'restorecon -v ...'
    ansible.builtin.command:
      cmd: 'restorecon -v{{ "F" if item["force"] | d(true) else "" }}{{ "r" if item["recursive"] | d(true) else "" }} {{ item["path"] }}'
    loop: '{{ selinux__restorecons__combined_var }}'
    when:
      - 'selinux__state != "disabled"'
      - 'item["state"] | d("present") == "present"'
    register: '__selinux__restorecons_result'
    changed_when: '__selinux__restorecons_result["stdout"] | length > 0'

  tags:
    - 'selinux'
    - 'selinux:restorecon'


- block:

  - name: 'setenforce {{ selinux__state }}'
    ansible.posix.selinux:
      policy: '{{ selinux__policy }}'
      state: '{{ selinux__state }}'

  tags:
    - 'selinux'
    - 'selinux:setenforce'
