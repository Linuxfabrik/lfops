# OS-specific values consumed by a *different* role that runs *earlier* in the same play (the
# `__dependent_var` pattern). vars/<os>.yml would load too late for an earlier consumer, but
# vars/main.yml is auto-loaded at play parse and is visible to every role in the play. The public
# variable in defaults/main.yml selects from this dict with the linuxfabrik.lfops.platform_select
# filter.

# PHP modules installed by the linuxfabrik.lfops.php role via
# icingaweb2_module_fileshipper__php__modules__dependent_var.
# Debian names every extension per PHP version. The unversioned php-<module> metapackages resolve
# to whatever the configured repo declares as its default, which under Sury moves on Sury's
# schedule and would drag a second PHP runtime onto the host.
__icingaweb2_module_fileshipper__php__modules__dependent_var:
  Debian:
    - name: 'php{{ __php__installed_version }}-xml'
      state: 'present'
    - name: 'php{{ __php__installed_version }}-yaml'
      state: 'present'
    - name: 'php{{ __php__installed_version }}-zip'
      state: 'present'
  RedHat:
    - name: 'php-xml'
      state: 'present'
    - name: 'php-yaml'
      state: 'present'
    - name: 'php-zip'
      state: 'present'
