- block:

  - name: 'Install bind bind-utils'
    ansible.builtin.package:
      name:
        - 'bind'
        - 'bind-utils'
      state: 'present'

  tags:
    - 'bind'


- block:

  # validate-except was added in BIND 9.13; `named-checkconf` on BIND 9.11 rejects it as an unknown
  # option.
  - name: 'Assert that no zone has to be excluded from DNSSEC validation on RHEL 8'
    ansible.builtin.assert:
      that:
        - '__bind__dnssec_validate_except | length == 0'
      fail_msg: 'BIND 9.11 on RHEL 8 cannot exclude zones from DNSSEC validation, which the forward and stub zones in bind__zones and the zones in bind__dnssec_validate_except need: {{ __bind__dnssec_validate_except | join(", ") }}. Set bind__dnssec_validation: false.'
      quiet: true
    when:
      - 'ansible_facts["distribution_major_version"] | int == 8'
      - 'bind__dnssec_validation | bool'

  - name: 'Deploy /etc/sysconfig/named'
    ansible.builtin.template:
      backup: true
      src: 'etc/sysconfig/named.j2'
      dest: '/etc/sysconfig/named'
      owner: 'root'
      group: 'root'
      mode: 0o640
    notify: 'bind: restart named'

  - name: 'Deploy /etc/named.conf'
    ansible.builtin.template:
      backup: true
      src: 'etc/named.conf.j2'
      dest: '/etc/named.conf'
      owner: 'root'
      group: 'named'
      mode: 0o640
    notify: 'bind: reload named'

  - name: 'Remove rpmnew / rpmsave (and Debian equivalents)'
    ansible.builtin.include_role:
      name: 'shared'
      tasks_from: 'remove-rpmnew-rpmsave.yml'
    vars:
      shared__remove_rpmnew_rpmsave_config_file: '/etc/named.conf'

  - name: 'Deploy the forward and reverse zones'
    ansible.builtin.template:
      backup: true
      src: 'var/named/raw.zone.j2'
      dest: '/var/named/{{ item["file"] | d(item["name"] ~ ".zone") }}'
      owner: 'root'
      group: 'named'
      mode: 0o640
    loop: '{{ bind__zones }}'
    loop_control:
      label: '{{ item["name"] }}'
    when:
      - 'item["type"] | d("master") in ["primary", "master"]'
    notify: 'bind: named-checkzone ... && reload named'

  tags:
    - 'bind'
    - 'bind:configure'


- block:

  - name: 'systemctl {{ bind__named_service_enabled | bool | ternary("enable", "disable") }} named.service'
    ansible.builtin.systemd:
      name: 'named.service'
      enabled: '{{ bind__named_service_enabled }}'

  - name: 'systemctl {{ bind__named_service_state | regex_replace("p?ed$", "") }} named.service'
    ansible.builtin.systemd:
      name: 'named.service'
      state: '{{ bind__named_service_state }}'
    register: '__bind__named_service_state_result'

  tags:
    - 'bind'
    - 'bind:state'
