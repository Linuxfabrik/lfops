# An empty zone answers authoritatively for everything below it, so it would also answer for a
# forward or stub zone in bind__zones below it instead of passing the query on. Such parents keep
# being forwarded, as do zones that bind__zones defines itself.
__bind__empty_zones_without_forwarding: '{{
    (
      __bind__empty_zones
      + (["resolver.arpa"] if ansible_facts["distribution_major_version"] | int >= 10 else [])
    )
    | reject("in", bind__zones | map(attribute="name") | map("lower") | list)
    | reject("in", __bind__forwarded_zones_and_parents)
    | list
  }}'

# The forward and stub zones of bind__zones, each followed by all of its parent domains.
__bind__forwarded_zones_and_parents: '{%- set result = [] -%}
  {%- for name in __bind__forwarded_zones -%}
    {%- set labels = name.split(".") -%}
    {%- for index in range(labels | length) -%}
      {%- set _ = result.append(labels[index:] | join(".")) -%}
    {%- endfor -%}
  {%- endfor -%}
  {{ result }}'

__bind__forwarded_zones: '{{
    bind__zones
    | selectattr("type", "defined")
    | selectattr("type", "in", ["forward", "static-stub", "stub"])
    | map(attribute="name")
    | map("lower")
    | list
  }}'
