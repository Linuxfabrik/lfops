# Answers for zones that named forwards to or stubs from other servers are validated like any
# other, so an internal zone below a signed parent (a name under a public domain, or a TLD such
# as .internal that the signed root proves not to exist) fails with SERVFAIL. Exclude these zones
# from DNSSEC validation, together with the zones listed by the user.
__bind__dnssec_validate_except: '{{
    (
      __bind__forwarded_zones
      + bind__dnssec_validate_except
    )
    | unique
  }}'

# BIND answers lookups for private and special-use zones (RFC 1918, RFC 6303 and others) from
# built-in "automatic empty zones", but skips every zone that the global `forward only` would forward,
# which is all of them. named.conf therefore switches forwarding off for exactly these zones, which
# brings the empty zones back. The list is `empty_zones[]` in bin/named/server.c of BIND 9.18;
# BIND 9.11 and 9.16 lack resolver.arpa. 0.in-addr.arpa and the ::1 reverse zone are left out,
# /etc/named.rfc1912.zones defines them.
