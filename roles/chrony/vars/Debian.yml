# chronyd on Debian and Ubuntu only reads /etc/chrony/chrony.conf, not /etc/chrony.conf.
# chronyd.service is merely an alias of chrony.service there.
__chrony__conf_path: '/etc/chrony/chrony.conf'
# The sources the distribution's own chrony.conf uses. The template falls back to them when
# neither chrony__ntp_pools nor chrony__ntp_servers is set, so a host keeps its time sources.
__chrony__distro_pools:
  - '2.debian.pool.ntp.org iburst'
# Debian 12 still ships the right/ zones, Debian 13 only leap-seconds.list, see vars/Debian13.yml.
__chrony__leap_directive: 'leapsectz right/UTC'
__chrony__service_name: 'chrony.service'
