- name: 'Set platform/version specific variables'
  ansible.builtin.import_role:
    name: 'shared'
    tasks_from: 'platform-variables.yml'
  tags:
    - 'always'


- block:

  - name: 'Install chrony'
    ansible.builtin.package:
      name: 'chrony'
      state: 'present'

  # the template mirrors the target path, which differs between the RedHat and Debian families
  - name: 'Deploy {{ __chrony__conf_path }}'
    ansible.builtin.template:
      backup: true
      src: '{{ __chrony__conf_path[1:] }}.j2'
      dest: '{{ __chrony__conf_path }}'
      owner: 'root'
      group: 'root'
      mode: 0o644
    notify: 'chrony: restart chrony'

  # earlier versions of this role deployed /etc/chrony.conf on Debian and Ubuntu as well, where
  # chronyd never reads it. Remove it so nobody mistakes it for the active configuration.
  - name: 'rm -f /etc/chrony.conf'
    ansible.builtin.file:
      path: '/etc/chrony.conf'
      state: 'absent'
    when:
      - 'ansible_facts["os_family"] == "Debian"'

  - name: 'Remove rpmnew / rpmsave (and Debian equivalents)'
    ansible.builtin.include_role:
      name: 'shared'
      tasks_from: 'remove-rpmnew-rpmsave.yml'
    vars:
      shared__remove_rpmnew_rpmsave_config_file: '{{ __chrony__conf_path }}'

  tags:
    - 'chrony'


- block:

  - name: 'systemctl {{ chrony__service_enabled | bool | ternary("enable", "disable") }} {{ __chrony__service_name }}'
    ansible.builtin.systemd:
      name: '{{ __chrony__service_name }}'
      enabled: '{{ chrony__service_enabled }}'

  - name: 'systemctl {{ chrony__service_state | regex_replace("p?ed$", "") }} {{ __chrony__service_name }}'
    ansible.builtin.systemd:
      name: '{{ __chrony__service_name }}'
      state: '{{ chrony__service_state }}'
    register: '__chrony__service_state_result'

  tags:
    - 'chrony'
    - 'chrony:state'
