- block:

  - name: 'Update ansible_init (ansinv) itself' # noqa ignore-errors (best effort, continue with the existing checkout when the update fails)
    ansible.builtin.git:
      repo: '{{ ansible_init__url }}'
      dest: '{{ ansible_init__ansinv_path }}'
      version: '{{ ansible_init__version }}'
    retries: 3 # ride out a brief outage of the download source
    delay: 10
    ignore_errors: true

  - name: 'Update ../lfops' # noqa ignore-errors (best effort, continue with the existing checkout when the update fails)
    ansible.builtin.git:
      repo: '{{ ansible_init__lfops_url }}'
      dest: '{{ ansible_init__ansinv_path }}../lfops'
      version: 'main'
    retries: 3 # ride out a brief outage of the download source
    delay: 10
    ignore_errors: true

  tags:
    - 'ansible_init'


- block:

  - name: 'Load repo list'
    ansible.builtin.include_vars:
      file: '{{ ansible_init__ansinv_path }}/control_node/group_vars/repos.yml'

  tags:
    - 'ansible_init'
    - 'ansible_init:command'


- block:

  - name: 'Clone the inventories' # noqa ignore-errors (best effort, continue when a clone fails)
    ansible.builtin.git:
      repo: '{{ item["url"] }}'
      dest: '{{ ansible_init__ansinv_path }}/{{ item["name"] }}'
      version: '{{ item["version"] |d("main") }}'
    retries: 3 # ride out a brief outage of the download source
    delay: 10
    loop: '{{ ansible_init__inventories }}'
    ignore_errors: true

  - name: 'mkdir -p ../roles'
    ansible.builtin.file:
      path: '{{ ansible_init__ansinv_path }}../roles/'
      state: 'directory'
      mode: 0o755
    when: 'ansible_init__roles is defined and ansible_init__roles | length > 0'

  - name: 'Clone the roles to ../roles/' # noqa ignore-errors (best effort, continue when a clone fails)
    ansible.builtin.git:
      repo: '{{ item["url"] }}'
      dest: '{{ ansible_init__ansinv_path }}../roles/{{ item["name"] }}'
      version: '{{ item["version"] |d("main") }}'
    retries: 3 # ride out a brief outage of the download source
    delay: 10
    loop: '{{ ansible_init__roles }}'
    ignore_errors: true

  tags:
    - 'ansible_init'


- block:

  - name: 'Install ansible collections from requirements.yml' # noqa ignore-errors (best effort, continue with the installed collections)
    community.general.ansible_galaxy_install:
      requirements_file: '{{ ansible_init__ansinv_path }}../lfops/requirements.yml'
      type: 'collection'
      force: true # from the doc: *Ansible 2.9 and 2.10*: Must be `true' to upgrade roles and collections.
    ignore_errors: true

  - name: 'Install ansible collections' # noqa ignore-errors (best effort, continue with the installed collections)
    community.general.ansible_galaxy_install:
      name: '{{ item["name"] }}'
      # no_deps: '{{ item["no_deps"] | d("False") }}'
      type: '{{ item["type"] | d("collection") }}'
      force: true # from the doc: *Ansible 2.9 and 2.10*: Must be `true' to upgrade roles and collections.
    loop: '{{ ansible_init__ansible_collections }}'
    when: 'ansible_init__ansible_collections | length > 0'
    ignore_errors: true

  tags:
    - 'ansible_init'
    - 'ansible_init:collections'
