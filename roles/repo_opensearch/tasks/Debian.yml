- block:

  # https://docs.opensearch.org/latest/install-and-configure/install-opensearch/debian/
  # The key is ASCII-armored, so it needs the `.asc` extension. Ubuntu 26.04 ignores an
  # ASCII-armored key named `.pgp` ("unsupported filetype").
  # One file per series, since 2.x and 3.x are signed with different keys. get_url does
  # not download a file that already exists, so a shared name would deploy the key of the
  # series fetched first on this controller.
  - name: 'curl {{ __repo_opensearch__gpgkey_url[repo_opensearch__version__combined_var] }} --output /tmp/ansible.opensearch-{{ repo_opensearch__version__combined_var }}.asc'
    ansible.builtin.get_url:
      url: '{{ __repo_opensearch__gpgkey_url[repo_opensearch__version__combined_var] }}'
      dest: '/tmp/ansible.opensearch-{{ repo_opensearch__version__combined_var }}.asc'
      mode: 0o644
    retries: 3 # ride out a brief outage of the download source
    delay: 10
    delegate_to: 'localhost'
    become: false
    vars:
      ansible_become: false # noqa var-naming[pattern]
    changed_when: false # not an actual config change on the server
    check_mode: false # run task even if `--check` is specified

  - name: 'copy /tmp/ansible.opensearch-{{ repo_opensearch__version__combined_var }}.asc to remote host'
    ansible.builtin.copy:
      src: '/tmp/ansible.opensearch-{{ repo_opensearch__version__combined_var }}.asc'
      dest: '/etc/apt/keyrings/opensearch.asc'
      owner: 'root'
      group: 'root'
      mode: 0o644

  - name: 'rm -f /etc/apt/keyrings/opensearch.pgp # the key was deployed under this name before'
    ansible.builtin.file:
      path: '/etc/apt/keyrings/opensearch.pgp'
      state: 'absent'

  - name: 'deploy the repo file (mirror: {{ repo_opensearch__mirror_url | default("") }})'
    ansible.builtin.template:
      backup: true
      src: 'etc/apt/sources.list.d/opensearch-org.list.j2'
      dest: '/etc/apt/sources.list.d/opensearch-org.list'
      owner: 'root'
      group: 'root'
      mode: 0o644

  - name: 'Remove rpmnew / rpmsave (and Debian equivalents)'
    ansible.builtin.include_role:
      name: 'shared'
      tasks_from: 'remove-rpmnew-rpmsave.yml'
    vars:
      shared__remove_rpmnew_rpmsave_config_file: '/etc/apt/sources.list.d/opensearch-org.list'

  - name: 'apt update # update the cache'
    ansible.builtin.apt:
      update_cache: true
    retries: 3 # ride out a brief outage of the package repository
    delay: 10
    changed_when: false # refreshing the package cache is not a config change

  tags:
    - 'repo_opensearch'
