- block:

  # simple checks (required, type, choices) live in meta/argument_specs.yml. a connector
  # without `connector-id` or `mode` is already rejected by `combine_lod`, which names the
  # item.
  - name: 'Check that at least one connector is present'
    ansible.builtin.assert:
      that:
        - '__curaline__connectors_present | length > 0'
      quiet: true
      fail_msg: 'At least one connector must be present in curaline__connectors__host_var or curaline__connectors__group_var.'

  - name: 'Check that every connector sets content-type, source-folder and target-folder'
    ansible.builtin.assert:
      that:
        - '"content-type" in item'
        - '"source-folder" in item'
        - '"target-folder" in item'
      quiet: true
      fail_msg: 'Connector {{ item["connector-id"] }} ({{ item["mode"] }}) must set content-type, source-folder and target-folder.'
    loop: '{{ __curaline__connectors_present }}'
    loop_control:
      label: '{{ item["connector-id"] }} ({{ item["mode"] }})'

  - name: 'Check that the host is x86_64'
    ansible.builtin.assert:
      that:
        - 'ansible_facts["architecture"] == "x86_64"'
      quiet: true
      fail_msg: 'The curaLINE client is only published for linux-amd64, this host is {{ ansible_facts["architecture"] }}.'

  tags:
    - 'always'


- block:

  # the package comes from the Linuxfabrik repository. it creates the account the client runs
  # as, the default configuration and the systemd unit.
  - name: 'Install swisscom-schweiz-ag-cdr-client'
    ansible.builtin.package:
      name: 'swisscom-schweiz-ag-cdr-client'
      state: 'present'
    retries: 3 # ride out a brief outage of the package repository
    delay: 10

  - name: 'stat {{ __curaline__folders | join(" ") }}'
    ansible.builtin.stat:
      path: '{{ item }}'
    loop: '{{ __curaline__folders }}'
    register: '__curaline__folders_stat_result'

  # only missing folders are created, writable for the group of the account, so that the
  # accounts of the scripts that fill the source folders and empty the target folders can be
  # given access through it. existing folders keep their owner, mode and content.
  - name: 'mkdir -p {{ __curaline__folders | join(" ") }}'
    ansible.builtin.file:
      path: '{{ item["item"] }}'
      state: 'directory'
      owner: 'swisscom-schweiz-ag-cdr-client'
      group: 'swisscom-schweiz-ag-cdr-client'
      mode: 0o2770
    loop: '{{ __curaline__folders_stat_result["results"] | rejectattr("stat.exists") | list }}'
    loop_control:
      label: '{{ item["item"] }}'

  tags:
    - 'curaline'


- block:

  # the client refuses to start with a configuration file it does not own, and rewrites it when
  # it renews its credential.
  - name: 'Deploy {{ __curaline__config_dir }}/application-customer.yaml'
    ansible.builtin.template:
      backup: true
      src: 'etc/swisscom-schweiz-ag/cdr-client/application-customer.yaml.j2'
      dest: '{{ __curaline__config_dir }}/application-customer.yaml'
      owner: 'swisscom-schweiz-ag-cdr-client'
      group: 'swisscom-schweiz-ag-cdr-client'
      mode: 0o640 # contains the client secret
    diff: false # keep the client secret out of `--diff` output
    notify: 'curaline: restart swisscom-schweiz-ag-cdr-client'

  - name: 'mkdir -p /etc/systemd/system/swisscom-schweiz-ag-cdr-client.service.d'
    ansible.builtin.file:
      path: '/etc/systemd/system/swisscom-schweiz-ag-cdr-client.service.d'
      state: 'directory'
      owner: 'root'
      group: 'root'
      mode: 0o755

  - name: 'Deploy /etc/systemd/system/swisscom-schweiz-ag-cdr-client.service.d/read-write-paths.conf'
    ansible.builtin.template:
      backup: true
      src: 'etc/systemd/system/swisscom-schweiz-ag-cdr-client.service.d/read-write-paths.conf.j2'
      dest: '/etc/systemd/system/swisscom-schweiz-ag-cdr-client.service.d/read-write-paths.conf'
      owner: 'root'
      group: 'root'
      mode: 0o644
    register: '__curaline__dropin_result'
    notify: 'curaline: restart swisscom-schweiz-ag-cdr-client'

  - name: 'systemctl daemon-reload' # noqa no-handler would require flush_handlers here anyway
    ansible.builtin.systemd:
      daemon_reload: true
    when: '__curaline__dropin_result is changed'

  tags:
    - 'curaline'
    - 'curaline:configure'


- block:

  # the state task runs after every task that notifies the restart handler, see handlers/main.yml.
  - name: 'systemctl {{ curaline__service_enabled | bool | ternary("enable", "disable") }} swisscom-schweiz-ag-cdr-client.service'
    ansible.builtin.service:
      name: 'swisscom-schweiz-ag-cdr-client.service'
      enabled: '{{ curaline__service_enabled | bool }}'

  - name: 'systemctl {{ curaline__service_state | regex_replace("p?ed$", "") }} swisscom-schweiz-ag-cdr-client.service'
    ansible.builtin.service:
      name: 'swisscom-schweiz-ag-cdr-client.service'
      state: '{{ curaline__service_state }}'
    register: '__curaline__service_state_result'

  tags:
    - 'curaline'
    - 'curaline:state'


- block:

  - name: 'Flush handlers so that the restart happens before other roles continue'
    ansible.builtin.meta: 'flush_handlers'

  tags:
    - 'curaline'
    - 'curaline:configure'
    - 'curaline:state'
