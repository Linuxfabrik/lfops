curaline__cdr_api_base_path: 'api/documents'
curaline__cdr_api_host: 'cdr.health.swisscom.ch'
curaline__cdr_api_port: 443
curaline__cdr_api_scheme: 'https'

# list of dictionaries, merged on the composite key connector-id + mode, so the same connector
# can run in test and in production mode at once.
curaline__connectors__combined_var: '{{ (
      curaline__connectors__role_var +
      curaline__connectors__dependent_var +
      curaline__connectors__group_var +
      curaline__connectors__host_var
    ) | linuxfabrik.lfops.combine_lod(unique_key=["connector-id", "mode"])
  }}'
curaline__connectors__dependent_var: []
curaline__connectors__group_var: []
curaline__connectors__host_var: []
curaline__connectors__role_var: []

curaline__credential_api_base_path: 'api/client-credentials'
curaline__credential_api_host: '{{ curaline__cdr_api_host }}'
curaline__credential_api_port: '{{ curaline__cdr_api_port }}'
curaline__credential_api_scheme: '{{ curaline__cdr_api_scheme }}'
curaline__file_busy_test_strategy: 'file_size_changed'
curaline__file_synchronization_enabled: true
curaline__idp_endpoint: 'https://login.microsoftonline.com/{{ curaline__tenant_id }}/oauth2/v2.0/token'
# a time in the past makes the client renew its credential immediately on start, if
# curaline__renew_credential is enabled
curaline__last_credential_renewal_time: '1970-01-01T00:00:00Z'
curaline__local_folder: '/var/lib/swisscom-schweiz-ag/cdr-client'
curaline__renew_credential: false  # upstream default: true
curaline__schedule_delay: 'PT10M'
curaline__scope: 'https://identity.health.swisscom.ch/CdrApi/.default'
curaline__service_enabled: true
curaline__service_state: 'started'
# the Entra ID tenant of Swisscom, which the client ships with
curaline__tenant_id: '70b434db-eccb-4280-95dc-1e59220aca55'
