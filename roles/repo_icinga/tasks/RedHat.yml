- block:

  # Icinga serves its RPM repository for RHEL and compatible distributions to subscribers
  # only. Verified 2026-09-11: packages.icinga.com/subscription/rhel/{8,9,10} answers 401
  # without credentials, the former public release packages answer 403/404. The Fedora
  # repository is still public (200 for Fedora 42 to 44).
  - name: 'Assert that a mirror or subscription credentials are set'
    ansible.builtin.assert:
      that:
        - '(repo_icinga__mirror_url is defined and repo_icinga__mirror_url | length > 0) or
           (repo_icinga__basic_auth_login is defined and repo_icinga__basic_auth_login | length > 0)'
      fail_msg: 'Icinga provides its RPM repository for RHEL and compatible distributions to subscribers only. Set repo_icinga__basic_auth_login (Icinga Repo Subscription) or repo_icinga__mirror_url.'
      quiet: true

  when:
    - 'ansible_facts["distribution"] != "Fedora"'
  tags:
    - 'repo_icinga'


- block:

  - name: 'Deploy the icinga-release repo (mirror: {{ repo_icinga__mirror_url }})'
    ansible.builtin.template:
      backup: true
      src: 'etc/yum.repos.d/ICINGA-release.repo.j2'
      dest: '/etc/yum.repos.d/ICINGA-release.repo'
      owner: 'root'
      group: 'root'
      # 0600 while the file carries the mirror credentials
      mode: '{{ "0o600" if repo_icinga__basic_auth_login | default({}) | length > 0 else "0o644" }}'

  - name: 'Remove rpmnew / rpmsave (and Debian equivalents)'
    ansible.builtin.include_role:
      name: 'shared'
      tasks_from: 'remove-rpmnew-rpmsave.yml'
    vars:
      shared__remove_rpmnew_rpmsave_config_file: '/etc/yum.repos.d/ICINGA-release.repo'

  - name: 'Deploy the icinga-snapshot repo (mirror: {{ repo_icinga__mirror_url }})'
    ansible.builtin.template:
      backup: true
      src: 'etc/yum.repos.d/ICINGA-snapshot.repo.j2'
      dest: '/etc/yum.repos.d/ICINGA-snapshot.repo'
      owner: 'root'
      group: 'root'
      # 0600 while the file carries the mirror credentials
      mode: '{{ "0o600" if repo_icinga__basic_auth_login | default({}) | length > 0 else "0o644" }}'

  - name: 'Remove rpmnew / rpmsave (and Debian equivalents)'
    ansible.builtin.include_role:
      name: 'shared'
      tasks_from: 'remove-rpmnew-rpmsave.yml'
    vars:
      shared__remove_rpmnew_rpmsave_config_file: '/etc/yum.repos.d/ICINGA-snapshot.repo'

  - name: 'curl https://packages.icinga.com/icinga.key --output /tmp/ansible.RPM-GPG-KEY-ICINGA'
    ansible.builtin.get_url:
      url: 'https://packages.icinga.com/icinga.key'
      dest: '/tmp/ansible.RPM-GPG-KEY-ICINGA'
    delegate_to: 'localhost'
    become: false
    changed_when: false # not an actual config change on the server
    check_mode: false # run task even if `--check` is specified

  - name: 'copy /tmp/ansible.RPM-GPG-KEY-ICINGA to /etc/pki/rpm-gpg/RPM-GPG-KEY-ICINGA'
    ansible.builtin.copy:
      src: '/tmp/ansible.RPM-GPG-KEY-ICINGA'
      dest: '/etc/pki/rpm-gpg/RPM-GPG-KEY-ICINGA'

  tags:
    - 'repo_icinga'
