# The psi-* check plugins read /proc/pressure, which a kernel built with
# CONFIG_PSI_DEFAULT_DISABLED=y only creates when booted with psi=1 (kernel/sched/psi.c). Kernel
# configs verified 2026-10-06 from the distribution kernel packages: RHEL family 8, 9 and 10 ship
# the option set (kernel-core 4.18.0-553.171.1.el8_10, 5.14.0-687.54.1.el9_8,
# 6.12.0-211.61.1.el10_2), Fedora 44, Debian 12 and 13 and Ubuntu 22.04, 24.04 and 26.04 track
# pressure by default and need nothing.
# Published here and not in defaults/, because setup_basic runs the bootloader role before this
# role, see "OS-specific Dependent Variables" in CONTRIBUTING.md.
__monitoring_plugins__bootloader__cmdline_options__dependent_var:
  Fedora: []
  RedHat:
    - name: 'psi'
      value: 1
monitoring_plugins__bootloader__cmdline_options__dependent_var: '{{
    __monitoring_plugins__bootloader__cmdline_options__dependent_var
    | linuxfabrik.lfops.platform_select(ansible_facts, default=[])
  }}'

# The checkouts and staging trees on the controller are named after the state they hold: the
# release tag, or for `dev` the commit the main branch pointed to when the host resolved it
# (`git ls-remote`, see tasks/install.yml). Neither moves, so the first host that needs a state
# prepares it and every further host finds it done, and hosts with different versions in one
# play never share a working directory.
__monitoring_plugins__checkout_id: '{{
    ("main-" ~ __monitoring_plugins__main_commit_result["stdout"].split()[0][:12])
    if monitoring_plugins__version == "dev"
    else ("v" ~ monitoring_plugins__version)
  }}'

# The controller keeps them below /var/tmp, so that they outlive a reboot and later runs reuse
# them, see "Controller-side Caches" in CONTRIBUTING.md. The LFOps-wide parent lets
# ansible-navigator persist every such cache with one volume mount.
__monitoring_plugins__cache_dir: '/var/tmp/lfops/monitoring_plugins'
# systemd-tmpfiles removes what below /var/tmp has not been used for 30 days, file by file, so
# a cache entry could lose a part of its files and still look complete. Entries are removed
# whole once they are this old, and rebuilt by the next host that needs them, long before
# systemd-tmpfiles gets to them. This also takes away the versions no longer in use.
__monitoring_plugins__cache_max_age_days: 7
__monitoring_plugins__flattened_dir: '{{ __monitoring_plugins__cache_dir }}/flattened-{{ __monitoring_plugins__checkout_id }}'
__monitoring_plugins__icons_dir: '{{ __monitoring_plugins__cache_dir }}/icons-{{ __monitoring_plugins__checkout_id }}'
__monitoring_plugins__repo_dir: '{{ __monitoring_plugins__cache_dir }}/repo-{{ __monitoring_plugins__checkout_id }}'

# The paths an install manifest of a source install may list: everything below the locations a
# source install or the one-line installer writes to. Entries outside of them are ignored, so a
# damaged or tampered manifest cannot point a removal anywhere else.
__monitoring_plugins__manifest_allowed_paths: '{{
    "^(/usr/lib64/nagios/plugins/[^/]+"
    ~ "|/usr/lib64/nagios/plugins/device-(mibs|oids)/.+"
    ~ "|/usr/lib64/linuxfabrik-monitoring-plugins"
    ~ "|/etc/sudoers[.]d/linuxfabrik-monitoring-plugins(-logging)?"
    ~ "|/etc/bash_completion[.]d/linuxfabrik-monitoring-plugins"
    ~ "|/usr/share/selinux/packages/linuxfabrik-monitoring-plugins[.]cil)$"
  }}'
