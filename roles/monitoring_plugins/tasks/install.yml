- block:

  - name: 'Make sure that `monitoring_plugins__version` is set'
    ansible.builtin.assert:
      that:
        - 'monitoring_plugins__version | length > 0'
      fail_msg: 'monitoring_plugins__version is unset. Make sure to either set `monitoring_plugins__version` or `lfops__monitoring_plugins_version`.'

  - name: 'Make sure that `monitoring_plugins__version` does not start with a "v"'
    ansible.builtin.assert:
      that:
        - 'not monitoring_plugins__version.startswith("v")'
      fail_msg: '`monitoring_plugins__version` must be given without the leading `v`. Example: use `1.2.3`, not `v1.2.3`.'

  - name: 'Debug'
    ansible.builtin.debug:
      msg:
        - 'Target OS: {{ ansible_facts["os_family"] }}'
        - 'monitoring_plugins__install_method: {{ monitoring_plugins__install_method }}'
        - 'monitoring_plugins__version: {{ monitoring_plugins__version }}'
        - '__monitoring_plugins__icinga_user: {{ __monitoring_plugins__icinga_user | d("*unset*") }}'

  - name: 'Fail if monitoring_plugins__version is "dev" and is not monitoring_plugins__install_method is "source"'
    ansible.builtin.assert:
      that:
        - 'not (monitoring_plugins__version == "dev" and monitoring_plugins__install_method != "source")'
      fail_msg: 'Installing the dev version only works with `monitoring_plugins__install_method: "source"`'

  tags:
    - 'monitoring_plugins'


- block:

  - name: 'Set a downtime for the host' # noqa ignore-errors (it is possible that the host does not yet exist in icinga2)
    ansible.builtin.uri:
      url: '{{ monitoring_plugins__icinga2_api_url }}/actions/schedule-downtime'
      validate_certs: false
      user: '{{ monitoring_plugins__icinga2_api_user }}'
      password: '{{ monitoring_plugins__icinga2_api_password }}'
      force_basic_auth: true
      method: 'POST'
      body: >
        {
          "type": "Host",
          "filter": "host.name==\"{{ monitoring_plugins__icinga2_cn }}\"",
          "start_time": "{{ lookup('pipe', 'date +%s') }}",
          "end_time": "{{ lookup('pipe', 'date +%s') | int + 3600 }}",
          "author": "Ansible Role linuxfabrik.lfops.monitoring_plugins",
          "comment": "Downtime during deployment of the monitoring-plugins",
          "all_services": true
        }
      body_format: 'json'
      status_code: 200
      headers:
        Accept: 'application/json'
    when:
      - 'monitoring_plugins__icinga2_api_url is defined and monitoring_plugins__icinga2_api_url | length > 0'
      - 'monitoring_plugins__icinga2_api_user is defined and monitoring_plugins__icinga2_api_user | length > 0'
      - 'monitoring_plugins__icinga2_api_password is defined and monitoring_plugins__icinga2_api_password | length > 0'
    delegate_to: 'localhost'
    become: false
    vars:
      ansible_become: false # noqa var-naming[pattern]
    ignore_errors: true

  tags:
    - 'monitoring_plugins'


- block:

  # The cache holds what is deployed as root to every host, so it must not be writable for
  # other users of the controller. Below the world-writable /var/tmp, another user could create
  # the directory first; the mode then cannot be set, and the run aborts instead of deploying
  # what that user placed there.
  - name: 'mkdir -p {{ __monitoring_plugins__cache_dir }}'
    ansible.builtin.file:
      path: '{{ item }}'
      state: 'directory'
      mode: 0o700
    loop:
      - '{{ __monitoring_plugins__cache_dir | dirname }}'
      - '{{ __monitoring_plugins__cache_dir }}'
    delegate_to: 'localhost'
    become: false
    vars:
      ansible_become: false # noqa var-naming[pattern]
    throttle: 1 # serialize: shared dir on the controller, avoid races between hosts
    changed_when: false # no change on the remote host
    check_mode: false # run task even if `--check` is specified

  # see `__monitoring_plugins__cache_max_age_days`
  - name: 'Remove cache entries older than {{ __monitoring_plugins__cache_max_age_days }} days from {{ __monitoring_plugins__cache_dir }}'
    ansible.builtin.command:
      argv:
        - 'find'
        - '{{ __monitoring_plugins__cache_dir }}'
        - '-mindepth'
        - '1'
        - '-maxdepth'
        - '1'
        - '-mtime'
        - '+{{ __monitoring_plugins__cache_max_age_days }}'
        - '-exec'
        - 'rm'
        - '-rf'
        - '--'
        - '{}'
        - '+'
    delegate_to: 'localhost'
    become: false
    vars:
      ansible_become: false # noqa var-naming[pattern]
    throttle: 1 # serialize: shared dir on the controller, avoid races between hosts
    changed_when: false # no change on the remote host
    check_mode: false # run task even if `--check` is specified

  - name: 'Check if /usr/share/icingaweb2/public/img/icons exists'
    ansible.builtin.stat:
      path: '/usr/share/icingaweb2/public/img/icons'
    register: '__monitoring_plugins__stat_usr_share_icingaweb2_public_img_icons_result'

  # Everything the host needs in one run of the package manager, since every run loads the
  # repository metadata first, which took 2 s per host and up to 7 s:
  # * sudo, which the plugins run under (sometimes missing on Debian)
  # * rsync, for the transfers of the source install and of the icons
  # * the Python interpreter and venv support of the source install. On RHEL 8 the system
  #   python3 is 3.6, too old for the plugins, so the role installs python3.9 (package
  #   `python39`) and uses it; every other supported platform already ships python3 >= 3.9.
  - name: 'Install the packages the plugins need on the host'
    ansible.builtin.package:
      name: '{{
          ["sudo"]
          + (["rsync"]
             if monitoring_plugins__install_method == "source"
                or __monitoring_plugins__stat_usr_share_icingaweb2_public_img_icons_result["stat"]["exists"]
             else [])
          + ((__monitoring_plugins__source_python_packages | d([]))
             if monitoring_plugins__install_method == "source"
             else [])
        }}'
      state: 'present'
    retries: 3 # ride out a brief outage of the package repository
    delay: 10

  # Unlike on Windows, the Icinga2 agent keeps running while the plugins are replaced: it
  # starts a plugin afresh for every check, and package managers and rsync replace files by
  # renaming, so a check never sees a half-written plugin.
  - name: 'Install Linuxfabrik Monitoring Plugins from package (rpm, deb)'
    ansible.builtin.include_tasks: 'linux-package.yml'
    when:
      - 'monitoring_plugins__install_method == "package"'

  # The commit names the checkouts and staging trees of `dev` on the controller, so that the
  # first host prepares a commit and every further host finds it done, see
  # `__monitoring_plugins__checkout_id`. Read-only, so unlike the preparation itself it runs for
  # all hosts in parallel. A host that resolves main after a push gets the newer commit.
  - name: 'git ls-remote https://github.com/Linuxfabrik/monitoring-plugins.git refs/heads/main'
    ansible.builtin.command:
      argv:
        - 'git'
        - 'ls-remote'
        - 'https://github.com/Linuxfabrik/monitoring-plugins.git'
        - 'refs/heads/main'
    register: '__monitoring_plugins__main_commit_result'
    retries: 3 # ride out a brief outage of the download source
    delay: 10
    delegate_to: 'localhost'
    become: false
    vars:
      ansible_become: false # noqa var-naming[pattern]
      mitogen_task_isolation: 'fork' # noqa var-naming[pattern] see the plugin transfer in linux-source.yml
    changed_when: false # read-only
    failed_when: '__monitoring_plugins__main_commit_result["rc"] != 0 or __monitoring_plugins__main_commit_result["stdout"] | length == 0'
    check_mode: false # run task even if `--check` is specified
    when:
      - 'monitoring_plugins__install_method == "source"'
      - 'monitoring_plugins__version == "dev"'

  - name: 'Install Linuxfabrik Monitoring Plugins from source'
    ansible.builtin.include_tasks: 'linux-source.yml'
    when:
      - 'monitoring_plugins__install_method == "source"'

  when:
    - 'ansible_facts["os_family"] != "Windows"'
  tags:
    - 'monitoring_plugins'


- block:

  - name: 'Fail if monitoring_plugins__version is "dev" on Windows hosts'
    ansible.builtin.assert:
      that:
        - 'monitoring_plugins__version != "dev"'
      fail_msg: 'Installing the dev version on Windows hosts is not currently supported.'

  - name: 'Stop the Icinga2 service'
    ansible.windows.win_service:
      name: 'Icinga 2'
      state: 'stopped'
    register: '__monitoring_plugins__icinga2_service_stop_result'
    # ignore errors if the service does not exist
    failed_when:
      - '__monitoring_plugins__icinga2_service_stop_result["failed"] is defined'
      - '__monitoring_plugins__icinga2_service_stop_result["failed"]'
      - 'not "is not installed" in __monitoring_plugins__icinga2_service_stop_result["msg"]'

  - name: 'Install Linuxfabrik Monitoring Plugins from package'
    ansible.builtin.include_tasks: 'windows-package.yml'
    when:
      - 'monitoring_plugins__install_method == "package"'

  - name: 'Install Linuxfabrik Monitoring Plugins from archive'
    ansible.builtin.include_tasks: 'windows-archive.yml'
    when:
      - 'monitoring_plugins__install_method == "archive"'

  - name: 'Start the Icinga2 service'
    ansible.windows.win_service:
      name: 'Icinga 2'
      state: 'started'
    register: '__monitoring_plugins__icinga2_service_start_result'
    # ignore errors if the service does not exist
    failed_when:
      - '__monitoring_plugins__icinga2_service_start_result["failed"] is defined'
      - '__monitoring_plugins__icinga2_service_start_result["failed"]'
      - 'not "is not installed" in __monitoring_plugins__icinga2_service_start_result["msg"]'

  when:
    - 'ansible_facts["os_family"] == "Windows"'
  tags:
    - 'monitoring_plugins'


# Pimp local software
- block:

  - name: 'Check if /var/www/html/localhost exists (monitoring.php for php-status)'
    ansible.builtin.stat:
      path: '/var/www/html/localhost'
    register: 'monitoring_plugins__stat_var_www_html_localhost_result'

  - name: 'Deploy /var/www/html/localhost/monitoring.php (monitoring.php for php-status)'
    ansible.builtin.copy:
      src: '/usr/lib64/nagios/plugins/assets/monitoring.php'
      dest: '/var/www/html/localhost/monitoring.php'
      remote_src: true
      owner: 'root'
      group: 'root'
      mode: 0o644
    when:
      - 'monitoring_plugins__stat_var_www_html_localhost_result["stat"]["exists"]'

  - block:

    - name: 'Clone the monitoring-plugins repo'
      ansible.builtin.import_role:
        name: 'shared'
        tasks_from: 'clone-monitoring-plugins-repo.yml'
      vars:
        shared__monitoring_plugins_repo_dest: '{{ __monitoring_plugins__repo_dir }}'
        shared__monitoring_plugins_version: '{{ monitoring_plugins__version }}'

    # Built in a temporary directory and moved into place, so a run that aborts halfway leaves
    # no tree behind that a later host would take for complete. A tree that exists is final, see
    # `__monitoring_plugins__checkout_id`.
    - name: 'Flatten icon files from plugin directories'
      ansible.builtin.shell:
        cmd: |
          set -e -o pipefail
          dest='{{ __monitoring_plugins__icons_dir }}'
          if [ -d "$dest" ]; then
            exit 0
          fi
          tmp="$(mktemp --directory "$dest.XXXXXX")"
          trap 'rm -rf -- "$tmp"' EXIT
          find check-plugins -name '*.svg' -exec cp -- {} "$tmp/" \;
          cp -- assets/icons/*.svg "$tmp/"
          rm -rf -- "$dest"
          mv -- "$tmp" "$dest"
        chdir: '{{ __monitoring_plugins__repo_dir }}'
        executable: '/bin/bash'
      delegate_to: 'localhost'
      become: false
      vars:
        ansible_become: false # noqa var-naming[pattern]
      throttle: 1 # serialize: shared dir on the controller, avoid races between hosts
      check_mode: false # run task even if `--check` is specified
      changed_when: false # no change on the remote host

    # --checksum and --no-times for the reasons given at the plugin transfer in linux-source.yml:
    # without them, every run rewrote all icons, under a new inode that file integrity checks
    # such as AIDE report. --chown instead of --no-owner / --no-group, since the directory
    # belongs to the icingaweb2 package and has no chown task of its own: it also hands back to
    # root the icons earlier runs left with the numeric owner of the controller user.
    - name: 'rsync icons to IcingaWeb2'
      ansible.posix.synchronize:
        src: '{{ __monitoring_plugins__icons_dir }}/'
        dest: '/usr/share/icingaweb2/public/img/icons'
        mode: 'push'
        rsync_opts:
          - '--checksum'
          - '--chmod=D755,F644'
          - '--chown=root:root'
          - '--no-times'
      vars:
        mitogen_task_isolation: 'fork' # noqa var-naming[pattern] see the plugin transfer in linux-source.yml

    when:
      - '__monitoring_plugins__stat_usr_share_icingaweb2_public_img_icons_result["stat"]["exists"]'

  # block
  when:
    - 'ansible_facts["os_family"] != "Windows"'
  tags:
    - 'monitoring_plugins'


- block:

  - name: 'Check if custom plugins exist'
    ansible.builtin.stat:
      path: '{{ inventory_dir }}/host_files/{{ inventory_hostname }}/usr/lib64/nagios/plugins'
    delegate_to: 'localhost'
    become: false
    vars:
      ansible_become: false # noqa var-naming[pattern]
    changed_when: false
    register: '__monitoring_plugins__custom_plugins'

  - name: 'Copy the custom plugins to /usr/lib64/nagios/plugins'
    ansible.builtin.copy:
      src: '{{ item }}'
      dest: '/usr/lib64/nagios/plugins/'
      mode: 'preserve'
      backup: true
    # use loop for nicer diff. Guard the lookup itself: the loop is templated before
    # `when`, and fileglob warns about every host without the directory.
    loop: >-
      {{
        lookup("ansible.builtin.fileglob", inventory_dir ~ "/host_files/" ~ inventory_hostname ~ "/usr/lib64/nagios/plugins/*", wantlist=True)
        if __monitoring_plugins__custom_plugins["stat"]["exists"]
        else []
      }}

  # block
  when:
    - 'ansible_facts["os_family"] != "Windows"'
  tags:
    - 'monitoring_plugins'
    - 'monitoring_plugins:custom'


- block:

  - name: 'Remove the downtime for the host (Windows)' # noqa ignore-errors
    ansible.builtin.uri:
      url: '{{ monitoring_plugins__icinga2_api_url }}/actions/remove-downtime'
      validate_certs: false
      user: '{{ monitoring_plugins__icinga2_api_user }}'
      password: '{{ monitoring_plugins__icinga2_api_password }}'
      force_basic_auth: true
      method: 'POST'
      body: >
        {
          "type": "Downtime",
          "filter": "host.name==\"{{ monitoring_plugins__icinga2_cn }}\" && downtime.author==\"Ansible Role linuxfabrik.lfops.monitoring_plugins\""
        }
      body_format: 'json'
      status_code: 200
      headers:
        Accept: 'application/json'
    when:
      - 'monitoring_plugins__icinga2_api_url is defined and monitoring_plugins__icinga2_api_url | length > 0'
      - 'monitoring_plugins__icinga2_api_user is defined and monitoring_plugins__icinga2_api_user | length > 0'
      - 'monitoring_plugins__icinga2_api_password is defined and monitoring_plugins__icinga2_api_password | length > 0'
    delegate_to: 'localhost'
    become: false
    vars:
      ansible_become: false # noqa var-naming[pattern]
    ignore_errors: true # we still want to start the icinga2 service again

  tags:
    - 'monitoring_plugins'
