- block:

  - name: 'install {{ __monitoring_plugins__versionlock_package }}'
    ansible.builtin.package:
      name:
        - '{{ __monitoring_plugins__versionlock_package }}'
      state: 'present'
    retries: 3 # ride out a brief outage of the package repository
    delay: 10
    when:
      - 'not monitoring_plugins__skip_package_versionlock'
      - '__monitoring_plugins__versionlock_package is defined and __monitoring_plugins__versionlock_package | length > 0'

  - name: '{{ __monitoring_plugins__versionlock_list_command }}'
    ansible.builtin.command: '{{ __monitoring_plugins__versionlock_list_command }}'
    register: '__monitoring_plugins__versionlock_list_result'
    changed_when: false # read-only
    failed_when: false # a missing versionlock plugin (e.g. in check mode) means no lock
    check_mode: false # run task even if `--check` is specified
    when:
      - 'not monitoring_plugins__skip_package_versionlock'

  # the lock is lifted so the `state: latest` install below can update within
  # monitoring_plugins__version, and set again afterwards. Whether that changed anything is
  # reported by the lock task, so this intermediate step never reports a change.
  - name: '{{ __monitoring_plugins__versionlock_unlock_command }} linuxfabrik-monitoring-plugins*'
    ansible.builtin.command: '{{ __monitoring_plugins__versionlock_unlock_command }} linuxfabrik-monitoring-plugins*'
    changed_when: false
    failed_when: false # e.g. apt-mark unhold fails when the package is not known yet
    when:
      - 'not monitoring_plugins__skip_package_versionlock'

  # if a step below fails, the always section sets the lock lifted above again. Only a lock that
  # existed before the run is restored: locking a package that is not installed does not work
  # alike (apt-mark hold fails without the repository, dnf versionlock locks every available
  # version, zypper addlock blocks a later install).
  - name: 'Remember whether the lock has to be restored if the install fails'
    ansible.builtin.set_fact:
      __monitoring_plugins__versionlock_restore: '{{ "linuxfabrik-monitoring-plugins" in __monitoring_plugins__versionlock_list_result["stdout"] | d("") }}'
    when:
      - 'not monitoring_plugins__skip_package_versionlock'

  # refresh the apt cache so the following `state: latest` upgrade resolves
  # against current metadata, e.g. to roll out security updates. apt does not
  # auto-expire its cache the way dnf does, so without this the upgrade can
  # silently run against a stale cache and miss newer versions.
  - name: 'apt update # update the cache'
    ansible.builtin.apt:
      update_cache: true
    retries: 3 # ride out a brief outage of the package repository
    delay: 10
    changed_when: false # refreshing the package cache is not a config change
    when: 'ansible_facts["os_family"] == "Debian"'

  - name: 'install linuxfabrik-monitoring-plugins{{ __monitoring_plugins__package_version_suffix }}' # noqa package-latest
    ansible.builtin.package:
      name:
        - 'linuxfabrik-monitoring-plugins{{ __monitoring_plugins__package_version_suffix }}'
      state: 'latest' # use latest for the versionlock after
    retries: 3 # ride out a brief outage of the package repository
    delay: 10
    register: '__monitoring_plugins__package_result'

  - name: 'install linuxfabrik-monitoring-plugins-selinux{{ __monitoring_plugins__package_version_suffix }}' # noqa package-latest
    ansible.builtin.package:
      name:
        - 'linuxfabrik-monitoring-plugins-selinux{{ __monitoring_plugins__package_version_suffix }}'
      state: 'latest' # use latest for the versionlock after
    retries: 3 # ride out a brief outage of the package repository
    delay: 10
    register: '__monitoring_plugins__selinux_package_result'
    when:
      - 'ansible_facts["os_family"] == "RedHat"'

  # A host switched from the source install to the package keeps what the source install placed
  # where the package places nothing. The harmful part is the library in
  # /usr/lib64/nagios/plugins/lib, which the package ships in its venv instead: Python puts the
  # directory of a plugin first on sys.path, so the plugins go on importing the library of the
  # source install, which no package update reaches. Verified with linuxfabrik-monitoring-plugins
  # 8.1.0 on Rocky 10.
  # Of what the install manifest lists, only paths no package owns are removed, after the package
  # install, so that the plugins, the venv directory and the assets the package took over are
  # kept. Removing the manifest last makes this a one-off.
  - name: 'stat /usr/lib64/linuxfabrik-monitoring-plugins/install-manifest.txt'
    ansible.builtin.stat:
      path: '/usr/lib64/linuxfabrik-monitoring-plugins/install-manifest.txt'
    register: '__monitoring_plugins__manifest_stat'


  - block:

    - name: 'cat /usr/lib64/linuxfabrik-monitoring-plugins/install-manifest.txt'
      ansible.builtin.slurp:
        src: '/usr/lib64/linuxfabrik-monitoring-plugins/install-manifest.txt'
      register: '__monitoring_plugins__manifest'

    - name: 'Remove what the install manifest of the former source install lists and no package owns'
      ansible.builtin.shell:
        cmd: |
          owned() {
            if command -v rpm >/dev/null 2>&1 && rpm --query --file "$1" >/dev/null 2>&1; then
              return 0
            fi
            if command -v dpkg >/dev/null 2>&1 && dpkg --search "$1" >/dev/null 2>&1; then
              return 0
            fi
            return 1
          }
          failed=0
          while read -r path; do
            [ -e "$path" ] || [ -L "$path" ] || continue
            owned "$path" && continue
            if rm --recursive --force -- "$path"; then
              echo "removed: $path"
            else
              failed=1
            fi
          done
          exit "$failed"
        executable: '/bin/bash'
        # double quotes, so that YAML turns `\n` into the newline that separates the paths
        stdin: "{{
            (__monitoring_plugins__manifest['content'] | b64decode).splitlines()
            | select('match', __monitoring_plugins__manifest_allowed_paths)
            | reject('search', '/[.][.]?(/|$)')
            | join('\n')
          }}"
      register: '__monitoring_plugins__remove_source_leftovers_result'
      changed_when: '"removed:" in __monitoring_plugins__remove_source_leftovers_result["stdout"]'

    - name: 'rm -f /usr/lib64/linuxfabrik-monitoring-plugins/install-manifest.txt'
      ansible.builtin.file:
        path: '/usr/lib64/linuxfabrik-monitoring-plugins/install-manifest.txt'
        state: 'absent'

    when:
      - '__monitoring_plugins__manifest_stat["stat"]["exists"] | bool'

  - name: 'Make sure sudoers drop-ins placed under earlier names are absent (each would duplicate the Cmnd_Alias of the packaged /etc/sudoers.d/linuxfabrik-monitoring-plugins)'
    ansible.builtin.file:
      # monitoring-plugins: the name the source install used before; icinga2-plugins: the manual
      # scp deployment documented in the monitoring-plugins README before the Ansible/package era.
      path: '/etc/sudoers.d/{{ item }}'
      state: 'absent'
    loop:
      - 'icinga2-plugins'
      - 'monitoring-plugins'

  - name: 'The install succeeded, the lock task below takes over'
    ansible.builtin.set_fact:
      __monitoring_plugins__versionlock_restore: false
    when:
      - 'not monitoring_plugins__skip_package_versionlock'

  # the lock changed if there was none before, or if a package was updated (a dnf lock pins
  # the exact version). Every lock list names the package (dnf versionlock list, apt-mark
  # showhold, zypper locks).
  - name: '{{ __monitoring_plugins__versionlock_lock_command }} linuxfabrik-monitoring-plugins*'
    ansible.builtin.command: '{{ __monitoring_plugins__versionlock_lock_command }} linuxfabrik-monitoring-plugins*'
    changed_when:
      - '"linuxfabrik-monitoring-plugins" not in __monitoring_plugins__versionlock_list_result["stdout"] | d("")
        or __monitoring_plugins__package_result is changed
        or __monitoring_plugins__selinux_package_result is changed'
    when:
      - 'not monitoring_plugins__skip_package_versionlock'

  always:

  - name: '{{ __monitoring_plugins__versionlock_lock_command }} linuxfabrik-monitoring-plugins* # restore the lock after a failed install'
    ansible.builtin.command: '{{ __monitoring_plugins__versionlock_lock_command }} linuxfabrik-monitoring-plugins*'
    changed_when: false # restores the lock that existed before the run
    when:
      - '__monitoring_plugins__versionlock_restore | d(false) | bool'

  tags:
    - 'monitoring_plugins'
