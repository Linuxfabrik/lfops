- block:

  - name: 'Gather service facts'
    ansible.builtin.service_facts:  # yamllint disable-line rule:empty-values

  - name: 'systemctl stop icinga2.service'
    ansible.builtin.service:
      name: 'icinga2.service'
      state: 'stopped'
    when:
      - '"icinga2.service" in ansible_facts.services'

  # Every step below only touches what is there, so a host without the packages, or without
  # access to a package repository, gets through the removal: dnf resolves a glob against the
  # repositories even for a removal, and apt fails on a pattern that matches no installed package.
  #
  # The locks are taken from the lock list itself rather than from the installed packages, since
  # a lock outlives its package: an earlier version of this role unlocked the base package only,
  # and the entry of the -selinux package then blocked every later install of it at another
  # version. Without the dnf versionlock plugin there is nothing to unlock, and dnf says so with
  # "No such command"; any other failure is reported.
  - name: '{{ __monitoring_plugins__versionlock_list_command }}'
    ansible.builtin.command: '{{ __monitoring_plugins__versionlock_list_command }}'
    register: '__monitoring_plugins__versionlock_list_result'
    changed_when: false # read-only
    failed_when:
      - '__monitoring_plugins__versionlock_list_result["rc"] != 0'
      - '"No such command" not in __monitoring_plugins__versionlock_list_result["stderr"]'
    check_mode: false # run task even if `--check` is specified

  - name: '{{ __monitoring_plugins__versionlock_unlock_command }} {{ item }}'
    ansible.builtin.command: '{{ __monitoring_plugins__versionlock_unlock_command }} {{ item }}'
    changed_when: true # only runs for a lock the list above shows
    loop: '{{
        (__monitoring_plugins__versionlock_list_result["stdout"] | d(""))
        | regex_findall("linuxfabrik-(?:monitoring|notification)-plugins[^ \t|]*")
        | unique
        | list
      }}'

  - name: 'Gather the package facts'
    ansible.builtin.package_facts:  # yamllint disable-line rule:empty-values

  - name: 'Remember which of the packages are installed'
    ansible.builtin.set_fact:
      __monitoring_plugins__installed_packages: '{{
          ansible_facts["packages"].keys()
          | select("match", "^linuxfabrik-(monitoring|notification)-plugins")
          | list
        }}'

  # A purge rather than a remove: a removed package stays known to dpkg with its conffiles, the
  # sudoers drop-in among them, which then remain on the host. ansible.builtin.package cannot
  # purge, hence the apt module.
  - name: 'apt purge {{ __monitoring_plugins__installed_packages | join(" ") }}'
    ansible.builtin.apt:
      name: '{{ __monitoring_plugins__installed_packages }}'
      state: 'absent'
      purge: true
    when:
      - 'ansible_facts["os_family"] == "Debian"'
      - '__monitoring_plugins__installed_packages | length > 0'

  # An earlier version of this role removed without purging, which leaves the package in dpkg's
  # `rc` state. package_facts only lists installed packages, so these are looked up separately.
  - name: 'List the packages dpkg still tracks the conffiles of'
    ansible.builtin.shell:
      cmd: |
        set -o pipefail
        dpkg-query --show --showformat='${Package} ${db:Status-Abbrev}\n' \
          'linuxfabrik-monitoring-plugins*' 'linuxfabrik-notification-plugins*' 2>/dev/null \
          | awk '$2 == "rc" {print $1}'
        exit 0
      executable: '/bin/bash'
    register: '__monitoring_plugins__dpkg_rc_result'
    changed_when: false # read-only
    check_mode: false # run task even if `--check` is specified
    when:
      - 'ansible_facts["os_family"] == "Debian"'

  - name: 'dpkg --purge {{ item }}'
    ansible.builtin.command: 'dpkg --purge {{ item }}'
    changed_when: true # only runs for a package in the `rc` state
    loop: '{{ __monitoring_plugins__dpkg_rc_result["stdout_lines"] | d([]) }}'
    when:
      - 'ansible_facts["os_family"] == "Debian"'

  # Removing a package needs no repository, so none is loaded. ansible.builtin.package cannot
  # disable repositories, hence the dnf module.
  - name: 'dnf remove {{ __monitoring_plugins__installed_packages | join(" ") }}'
    ansible.builtin.dnf:
      name: '{{ __monitoring_plugins__installed_packages }}'
      state: 'absent'
      disablerepo: '*'
    when:
      - 'ansible_facts["os_family"] == "RedHat"'
      - '__monitoring_plugins__installed_packages | length > 0'

  - name: 'zypper remove {{ __monitoring_plugins__installed_packages | join(" ") }}'
    ansible.builtin.package:
      name: '{{ __monitoring_plugins__installed_packages }}'
      state: 'absent'
    when:
      - 'ansible_facts["os_family"] == "Suse"'
      - '__monitoring_plugins__installed_packages | length > 0'

  # A source install from this role or from the one-line installer lists everything it placed.
  # Only paths below the locations an install writes to are honoured, so a damaged or tampered
  # manifest cannot point the removal anywhere else.
  - name: 'Check whether an install manifest exists'
    ansible.builtin.stat:
      path: '/usr/lib64/linuxfabrik-monitoring-plugins/install-manifest.txt'
    register: '__monitoring_plugins__manifest_stat'

  - name: 'Read /usr/lib64/linuxfabrik-monitoring-plugins/install-manifest.txt'
    ansible.builtin.slurp:
      src: '/usr/lib64/linuxfabrik-monitoring-plugins/install-manifest.txt'
    register: '__monitoring_plugins__manifest'
    when:
      - '__monitoring_plugins__manifest_stat["stat"]["exists"] | bool'

  - name: 'Remove what the install manifest lists'
    ansible.builtin.file:
      path: '{{ item }}'
      state: 'absent'
    vars:
      __monitoring_plugins__manifest_allowed: '{{
          "^(/usr/lib64/nagios/plugins/[^/]+"
          ~ "|/usr/lib64/linuxfabrik-monitoring-plugins"
          ~ "|/etc/sudoers[.]d/linuxfabrik-monitoring-plugins(-logging)?"
          ~ "|/etc/bash_completion[.]d/linuxfabrik-monitoring-plugins"
          ~ "|/usr/share/selinux/packages/linuxfabrik-monitoring-plugins[.]cil)$"
        }}'
    loop: '{{
        (__monitoring_plugins__manifest["content"] | d("") | b64decode).splitlines()
        | select("match", __monitoring_plugins__manifest_allowed)
        | reject("search", "/[.][.]?$")
        | list
      }}'

  # Hosts set up before the manifest existed, by hand, from a zip or by an earlier version of
  # this role, carry whatever that release placed. The list holds every name any release ever
  # installed into the plugin directory. The directory is shared with the plugins of the
  # distribution, so a file that a package owns is left alone, whatever its name. A file that
  # cannot be removed fails the task, after every other name has been handled.
  - name: 'Remove every name ever installed that no package owns'
    ansible.builtin.shell:
      cmd: |
        set -o pipefail
        owned() {
          if command -v rpm >/dev/null 2>&1 && rpm --query --file "$1" >/dev/null 2>&1; then
            return 0
          fi
          if command -v dpkg >/dev/null 2>&1 && dpkg --search "$1" >/dev/null 2>&1; then
            return 0
          fi
          return 1
        }
        [ -d /usr/lib64/nagios/plugins ] || exit 0
        failed=0
        while read -r name; do
          case "$name" in ''|'#'*) continue ;; esac
          # unquoted on purpose: an entry may be a glob such as `libssl.so.*`
          for path in /usr/lib64/nagios/plugins/$name; do
            [ -e "$path" ] || [ -L "$path" ] || continue
            owned "$path" && continue
            if rm -rf -- "$path"; then
              echo "removed: $path"
            else
              failed=1
            fi
          done
        done
        exit "$failed"
      executable: '/bin/bash'
      stdin: '{{ lookup("ansible.builtin.file", "installed-names.txt") }}'
    register: '__monitoring_plugins__remove_names_result'
    changed_when: '"removed:" in __monitoring_plugins__remove_names_result["stdout"]'

  # Every other location a package or a source install ever wrote to. The packages are gone at
  # this point, so what is left here is a leftover.
  - name: 'Make sure the remaining files of the monitoring plugins are absent'
    ansible.builtin.file:
      path: '{{ item }}'
      state: 'absent'
    loop:
      - '/etc/bash_completion.d/linuxfabrik-monitoring-plugins'
      - '/etc/sudoers.d/icinga2-plugins'
      - '/etc/sudoers.d/linuxfabrik-monitoring-plugins'
      - '/etc/sudoers.d/linuxfabrik-monitoring-plugins-logging'
      - '/etc/sudoers.d/monitoring-plugins'
      # temporary files of earlier versions of this role
      - '/tmp/ansible.monitoring-plugins-legacy-requirements.txt'
      - '/tmp/ansible.monitoring-plugins-lib-requirements.txt'
      - '/tmp/ansible.monitoring-plugins-requirements.txt'
      - '/tmp/linuxfabrik-plugin-cache.db'
      - '/usr/lib64/linuxfabrik-monitoring-plugins'
      - '/usr/share/licenses/linuxfabrik-monitoring-plugins'
      - '/usr/share/linuxfabrik-monitoring-plugins'
      - '/usr/share/selinux/packages/linuxfabrik-monitoring-plugins.cil'
      - '/usr/share/selinux/packages/linuxfabrik-monitoring-plugins.pp'

  - name: 'systemctl start icinga2.service'
    ansible.builtin.service:
      name: 'icinga2.service'
      state: 'started'
    when:
      - '"icinga2.service" in ansible_facts.services'

  tags:
    - 'monitoring_plugins:remove'


# Older releases of the -selinux package left their module loaded when they were removed, and a
# source install loads it without any package. `nagios_run_sudo` is left as it is: it belongs to
# the distribution's nagios policy, and other sudo-based checks may rely on it.
- block:

  - name: 'semodule --list'
    ansible.builtin.command: 'semodule --list'
    register: '__monitoring_plugins__semodule_list'
    changed_when: false
    check_mode: false # run task even if `--check` is specified

  - name: 'semodule --remove linuxfabrik-monitoring-plugins'
    ansible.builtin.command: 'semodule --remove linuxfabrik-monitoring-plugins'
    changed_when: true # only runs while the module is loaded
    when:
      - '"linuxfabrik-monitoring-plugins" in __monitoring_plugins__semodule_list["stdout_lines"] | map("split") | map("first") | list'

  when:
    - 'ansible_facts["os_family"] == "RedHat"'
    - 'ansible_facts["selinux"]["status"] != "disabled"'
  tags:
    - 'monitoring_plugins:remove'
