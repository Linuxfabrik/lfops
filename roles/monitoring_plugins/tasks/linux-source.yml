- block:

  - name: 'Clone the monitoring-plugins repo'
    ansible.builtin.import_role:
      name: 'shared'
      tasks_from: 'clone-monitoring-plugins-repo.yml'
    vars:
      shared__monitoring_plugins_version: '{{ monitoring_plugins__version }}'

  # The Linuxfabrik library and the monitoring plugins are independent projects with their
  # own, unrelated version numbers, so the library version is deliberately NOT derived from
  # `monitoring_plugins__version`. Matching the "newest, unpinned" dependency policy of the
  # source install, the library is always deployed from its main branch.
  - name: 'Clone the lib repo'
    ansible.builtin.import_role:
      name: 'shared'
      tasks_from: 'clone-lib-repo.yml'
    vars:
      shared__lib_version: 'dev'

  # Mirrors `build/install-plugins.sh` of the monitoring-plugins repo, which is what the rpm and
  # deb packages run: every `<tree>/<name>/<name>` executable of check-plugins, event-plugins and
  # notification-plugins goes flat into the plugin directory, and the per-plugin assets go into a
  # single `assets/` directory next to them. The `example` plugin is skipped, as in the packages.
  # A pinned `monitoring_plugins__version` can predate a tree, so each one is only walked if the
  # checkout has it.
  #
  # The shebangs are rewritten here, on the controller, instead of on the target: the plugin
  # directory is shared with the distribution's own Nagios plugins, and rewriting it in place
  # would have to walk that directory and could catch a foreign plugin.
  - name: 'Flatten the plugins and their assets locally using shell'
    ansible.builtin.shell:
      cmd: |
        set -e -o pipefail
        rm -rf /tmp/ansible.monitoring-plugins-repo-flattened
        mkdir -p /tmp/ansible.monitoring-plugins-repo-flattened/assets
        mkdir -p /tmp/ansible.monitoring-plugins-repo-flattened/plugins
        for tree in check-plugins event-plugins notification-plugins; do
          [ -d "$tree" ] || continue
          find "$tree" \
            -maxdepth 2 \
            -type f \
            -not -name example \
            -regextype posix-extended \
            -regex '.*/([^/]+)/\1$' \
            -exec cp -- {} /tmp/ansible.monitoring-plugins-repo-flattened/plugins/ \;
          find "$tree" \
            -mindepth 3 \
            -type f \
            -path '*/assets/*' \
            -not -path '*/example/assets/*' \
            -exec cp -- {} /tmp/ansible.monitoring-plugins-repo-flattened/assets/ \;
        done
        # A checkout always carries plugins. None of them means the clone produced something
        # unusable, and going on would report a successful run on a host that has no plugins.
        if [ "$(ls -1 /tmp/ansible.monitoring-plugins-repo-flattened/plugins | wc -l)" -eq 0 ]; then
          echo 'found no plugins in the checkout' >&2
          exit 1
        fi
        sed -i '1s|^#!.*python.*|#!/usr/lib64/linuxfabrik-monitoring-plugins/venv/bin/python|' \
          /tmp/ansible.monitoring-plugins-repo-flattened/plugins/*
      chdir: '/tmp/ansible.monitoring-plugins-repo'
      executable: '/bin/bash'
    delegate_to: 'localhost'
    become: false
    throttle: 1 # serialize: shared dir on the controller, avoid races between hosts
    check_mode: false # run task even if `--check` is specified
    changed_when: false # no change on the remote host

  - name: 'Make sure rsync is installed'
    ansible.builtin.package:
      name: 'rsync'
      state: 'present'

  tags:
    - 'monitoring_plugins'


# Clean up the artifacts of the former source install, which used `pip --user` to place the
# dependencies into the home directories of root and the icinga user. The venv-based install
# no longer uses them, so remove them beforehand. The dependency closure is taken from the
# lockfile the former install used (matching the system python3). Only packages installed
# under the respective user's ~/.local are touched; system/site packages are never removed,
# so this cannot damage OS-managed Python packages.
- block:

  - name: 'Set the legacy pip --user lockfile tag (the former source install used the system python3)'
    ansible.builtin.set_fact:
      __monitoring_plugins__legacy_py_tag: 'py{{ ansible_facts["python"]["version"]["major"] }}{{ ansible_facts["python"]["version"]["minor"] }}'

  - name: 'Check whether a lockfile exists for the legacy interpreter'
    ansible.builtin.stat:
      path: '/tmp/ansible.monitoring-plugins-repo/lockfiles/{{ __monitoring_plugins__legacy_py_tag }}/requirements.txt'
    delegate_to: 'localhost'
    become: false
    changed_when: false
    register: '__monitoring_plugins__legacy_lockfile'

  - block:

    - name: 'rsync the legacy dependency list to the remote host'
      ansible.posix.synchronize:
        src: '/tmp/ansible.monitoring-plugins-repo/lockfiles/{{ __monitoring_plugins__legacy_py_tag }}/requirements.txt'
        dest: '/tmp/ansible.monitoring-plugins-legacy-requirements.txt'
        mode: 'push'

    - name: 'Uninstall the former `pip --user` dependencies from root'
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          command -v pip3 >/dev/null 2>&1 || exit 0
          pkgs="$(grep -oE '^[A-Za-z0-9][A-Za-z0-9._-]*==' /tmp/ansible.monitoring-plugins-legacy-requirements.txt | sed 's/==$//')"
          removed=''
          for pkg in $pkgs; do
            loc="$(pip3 show "$pkg" 2>/dev/null | awk -F': ' '/^Location:/ {print $2}')"
            case "$loc" in
              "$HOME/.local/"*)
                pip3 uninstall --yes "$pkg" >/dev/null 2>&1 && removed="$removed $pkg"
                ;;
            esac
          done
          [ -n "$removed" ] && echo "removed:$removed"
          exit 0
        executable: '/bin/bash'
      register: '__monitoring_plugins__legacy_cleanup_root'
      changed_when: '"removed:" in __monitoring_plugins__legacy_cleanup_root["stdout"]'

    - name: 'Check if user {{ monitoring_plugins__icinga_user }} exists'
      ansible.builtin.getent:
        database: 'passwd'
        key: '{{ monitoring_plugins__icinga_user }}'
      register: '__monitoring_plugins__legacy_icinga_user_check'
      changed_when: false
      failed_when: false

    - name: 'Uninstall the former `pip --user` dependencies from {{ monitoring_plugins__icinga_user }}'
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          command -v pip3 >/dev/null 2>&1 || exit 0
          pkgs="$(grep -oE '^[A-Za-z0-9][A-Za-z0-9._-]*==' /tmp/ansible.monitoring-plugins-legacy-requirements.txt | sed 's/==$//')"
          removed=''
          for pkg in $pkgs; do
            loc="$(pip3 show "$pkg" 2>/dev/null | awk -F': ' '/^Location:/ {print $2}')"
            case "$loc" in
              "$HOME/.local/"*)
                pip3 uninstall --yes "$pkg" >/dev/null 2>&1 && removed="$removed $pkg"
                ;;
            esac
          done
          [ -n "$removed" ] && echo "removed:$removed"
          exit 0
        executable: '/bin/bash'
      become: true
      become_user: '{{ monitoring_plugins__icinga_user }}'
      register: '__monitoring_plugins__legacy_cleanup_icinga'
      changed_when: '"removed:" in __monitoring_plugins__legacy_cleanup_icinga["stdout"]'
      when:
        - '__monitoring_plugins__legacy_icinga_user_check["getent"] is defined'
        - '__monitoring_plugins__legacy_icinga_user_check["getent"]["passwd"] is defined'
        - '__monitoring_plugins__legacy_icinga_user_check["getent"]["passwd"][monitoring_plugins__icinga_user] is defined'

    when:
      - '__monitoring_plugins__legacy_lockfile["stat"]["exists"] | bool'

  tags:
    - 'monitoring_plugins'


# Provision a suitable Python and build a self-contained venv, mirroring the rpm/deb
# package. On RHEL 8 the system python3 is 3.6, too old for the plugins, so the role
# installs python3.9 (package `python39`) and uses it; every other supported platform
# already ships python3 >= 3.9. Unlike the package (built once per release with pinned
# dependencies), the source install pulls the newest third-party dependencies from
# `requirements.in` and deploys the newest Linuxfabrik library straight from GitHub (see
# below). The plugin code itself follows the `monitoring_plugins__version` ref (`dev` ->
# main) instead of a frozen release.
- block:

  - name: 'Install the Python interpreter and venv support for the source install'
    ansible.builtin.package:
      name: '{{ __monitoring_plugins__source_python_packages }}'
      state: 'present'
    when:
      - '__monitoring_plugins__source_python_packages | length > 0'

  - name: '{{ __monitoring_plugins__source_python_interpreter }} --version'
    ansible.builtin.command: '{{ __monitoring_plugins__source_python_interpreter }} --version'
    register: '__monitoring_plugins__source_python_version_result'
    changed_when: false
    check_mode: false # run task even if `--check` is specified

  - name: 'Make sure the source venv interpreter is Python 3.9 or newer'
    ansible.builtin.assert:
      that:
        - '__monitoring_plugins__source_python_version_result["stdout"].split()[1] is version("3.9", ">=")'
      fail_msg: >-
        {{ __monitoring_plugins__source_python_interpreter }} is
        {{ __monitoring_plugins__source_python_version_result["stdout"].split()[1] }},
        but the monitoring plugins need Python 3.9 or newer. Install a newer Python
        and point __monitoring_plugins__source_python_interpreter at it.

  tags:
    - 'monitoring_plugins'


- block:

  - name: 'mkdir -p /usr/lib64/nagios/plugins/'
    ansible.builtin.file:
      path: '/usr/lib64/nagios/plugins/'
      state: 'directory'
      owner: 'root'
      group: 'root'
      mode: 0o755

  - name: 'mkdir -p /usr/lib64/nagios/plugins/lib/'
    ansible.builtin.file:
      path: '/usr/lib64/nagios/plugins/lib/'
      state: 'directory'
      owner: 'root'
      group: 'root'
      mode: 0o755

  # The rsync options are the same for all three transfers below:
  #
  # --chmod          forces the modes instead of inheriting them from the checkout on the
  #                  controller. A hardened controller umask (027 or 077) leaves the git working
  #                  directory unreadable for everyone but its owner, and rsync would carry that
  #                  over and leave the monitoring user unable to read and execute the plugins.
  # --checksum       compares content instead of size and modification time. The staging tree is
  #                  rebuilt on every run, so its modification times are always new and rsync
  #                  would re-transfer everything and report a change on an unchanged checkout.
  # --no-times       keeps rsync from writing those modification times to the target, which would
  #                  itself count as a change on every run.
  # --no-owner       leaves ownership to the receiving side, which runs as root. Without it rsync
  # --no-group       pushes the numeric owner of the controller user, which the chown below then
  #                  corrects, so both tasks report a change on every run.
  - name: 'rsync the flattened plugins to remote host'
    ansible.posix.synchronize:
      src: '/tmp/ansible.monitoring-plugins-repo-flattened/plugins/'
      dest: '/usr/lib64/nagios/plugins/'
      mode: 'push'
      rsync_opts:
        - '--checksum'
        - '--chmod=D755,F755'
        - '--no-group'
        - '--no-owner'
        - '--no-times'

  - name: 'rsync the flattened plugin assets to remote host'
    ansible.posix.synchronize:
      src: '/tmp/ansible.monitoring-plugins-repo-flattened/assets/'
      dest: '/usr/lib64/nagios/plugins/assets/'
      mode: 'push'
      rsync_opts:
        - '--checksum'
        - '--chmod=D755,F644'
        - '--no-group'
        - '--no-owner'
        - '--no-times'

  # The Linuxfabrik library is deployed straight from its GitHub repo (not via pip),
  # into the plugin directory. The plugins import it as `lib.*`, which resolves because a
  # script's own directory is first on sys.path, so `lib/` next to the plugins wins over
  # any site-packages copy. Development cruft is left behind via the excludes.
  - name: 'rsync the Linuxfabrik library from GitHub to /usr/lib64/nagios/plugins/lib/'
    ansible.posix.synchronize:
      src: '/tmp/ansible.lib-repo/'
      dest: '/usr/lib64/nagios/plugins/lib/'
      mode: 'push'
      delete: true
      rsync_opts:
        - '--checksum'
        - '--chmod=D755,F644'
        - '--no-group'
        - '--no-owner'
        - '--no-times'
        - '--exclude=.git'
        - '--exclude=.github'
        - '--exclude=dist'
        - '--exclude=lockfiles'
        - '--exclude=tests'
        - '--exclude=*.egg-info'

  - name: 'Make sure artifacts of earlier versions of this role are absent'
    ansible.builtin.file:
      path: '{{ item }}'
      state: 'absent'
    loop:
      # The notification plugins used to go into a `notifications/` subdirectory, but the Icinga
      # command definitions and the rpm/deb packages expect them next to the check plugins.
      # `example` was deployed along with the other check plugins; the packages skip it.
      - '/usr/lib64/nagios/plugins/example'
      - '/usr/lib64/nagios/plugins/notifications'

  tags:
    - 'monitoring_plugins'


- block:

  # `ansible.builtin.pip` reuses an existing virtual environment as it is, so a venv built by an
  # earlier run with a different interpreter would silently keep that Python and no longer match
  # the one this role selects. Drop it and let the next task rebuild it, which is what the
  # `python -m venv --clear` of the upstream installer does.
  - name: '/usr/lib64/linuxfabrik-monitoring-plugins/venv/bin/python --version'
    ansible.builtin.command: '/usr/lib64/linuxfabrik-monitoring-plugins/venv/bin/python --version'
    register: '__monitoring_plugins__venv_python_version_result'
    changed_when: false
    failed_when: false
    check_mode: false # run task even if `--check` is specified

  - name: 'Remove a venv that was built with another Python'
    ansible.builtin.file:
      path: '/usr/lib64/linuxfabrik-monitoring-plugins'
      state: 'absent'
    when:
      - '__monitoring_plugins__venv_python_version_result["rc"] == 0'
      - '__monitoring_plugins__venv_python_version_result["stdout"].split()[1].split(".")[0:2]
         != __monitoring_plugins__source_python_version_result["stdout"].split()[1].split(".")[0:2]'

  # linuxfabrik-lib is removed here because the library is deployed from GitHub above; the
  # rest of `requirements.in` (unpinned) provides the newest third-party dependencies.
  - name: 'Deploy the venv requirements (requirements.in without linuxfabrik-lib)'
    ansible.builtin.copy:
      content: |
        {{ lookup("ansible.builtin.file", "/tmp/ansible.monitoring-plugins-repo/requirements.in").split("\n")
           | reject("match", "^linuxfabrik-lib")
           | join("\n") }}
      dest: '/tmp/ansible.monitoring-plugins-requirements.txt'
      mode: 0o644

  # Dropping linuxfabrik-lib also drops everything the library itself needs (httpx, pymysql,
  # pypsrp, PySmbClient, pywinrm), because none of those is a direct dependency of the plugins.
  # Without them `lib.url.fetch()` answers `Python module "httpx" is not installed` and every
  # check that speaks HTTP or MySQL fails, so the library's own dependency list is deployed
  # alongside. The two lists overlap, which is why they go into separate pip calls.
  - name: 'Deploy the venv requirements of the Linuxfabrik library'
    ansible.builtin.copy:
      src: '/tmp/ansible.lib-repo/requirements.in'
      dest: '/tmp/ansible.monitoring-plugins-lib-requirements.txt'
      mode: 0o644

  - name: 'Create the dependency venv and install the newest plugin dependencies into it'
    ansible.builtin.pip:
      requirements: '/tmp/ansible.monitoring-plugins-requirements.txt'
      virtualenv: '/usr/lib64/linuxfabrik-monitoring-plugins/venv'
      virtualenv_command: '{{ __monitoring_plugins__source_python_interpreter }} -m venv'

  - name: 'Install the dependencies of the Linuxfabrik library into the venv'
    ansible.builtin.pip:
      requirements: '/tmp/ansible.monitoring-plugins-lib-requirements.txt'
      virtualenv: '/usr/lib64/linuxfabrik-monitoring-plugins/venv'
      virtualenv_command: '{{ __monitoring_plugins__source_python_interpreter }} -m venv'

  tags:
    - 'monitoring_plugins'


- block:

  # The plugins, the bundled lib and the venv interpreter must be owned by root, not by the
  # monitoring user. The whitelisted plugins run as root via sudo, so if the monitoring user
  # owned any of them it could edit a plugin, a lib module or the venv Python and gain
  # arbitrary root code execution. The monitoring user only needs to traverse, read and
  # execute, which the 0755/0644 modes already grant.
  - name: 'chown --recursive --changes root the plugins and the venv'
    ansible.builtin.command: 'chown --recursive --changes root:root /usr/lib64/nagios/plugins /usr/lib64/linuxfabrik-monitoring-plugins'
    register: '__monitoring_plugins__chown_result'
    changed_when: '__monitoring_plugins__chown_result["stdout"] | length > 0'

  # Same reasoning as for the plugins: the venv is created with the umask of the run, so on a
  # host hardened to umask 027 or 077 the monitoring user cannot traverse it and cannot execute
  # the interpreter the plugin shebangs point at. `X` grants the executable bit to directories
  # and to files that already carry one, so the library modules stay non-executable. The plugin
  # directory itself is left alone here, as it is shared with the distribution's own Nagios
  # plugins, some of which are setuid root.
  - name: 'chmod --recursive --changes u=rwX,go=rX the venv'
    ansible.builtin.command: 'chmod --recursive --changes u=rwX,go=rX /usr/lib64/linuxfabrik-monitoring-plugins'
    register: '__monitoring_plugins__chmod_result'
    changed_when: '__monitoring_plugins__chmod_result["stdout"] | length > 0'

  - name: 'restorecon -Fvr the plugins and the venv'
    ansible.builtin.command: 'restorecon -Fvr /usr/lib64/nagios/plugins/ /usr/lib64/linuxfabrik-monitoring-plugins/'
    register: '__monitoring_plugins__restorecon_result'
    changed_when:
      - '__monitoring_plugins__restorecon_result["stdout"] | length > 0'
    when:
      - 'ansible_facts["selinux"]["status"] != "disabled"'

  - name: 'Copy the /etc/sudoers.d/linuxfabrik-monitoring-plugins file to the server'
    ansible.builtin.copy:
      src: '/tmp/ansible.monitoring-plugins-repo/assets/sudoers/{{ ansible_facts["os_family"] }}.sudoers'
      # same file name as the rpm/deb packages
      dest: '/etc/sudoers.d/linuxfabrik-monitoring-plugins'
      mode: 0o440

  # Completes the plugins' command line options in an interactive shell, the same file the
  # rpm/deb packages install. It is only read when the bash-completion package is present,
  # which this role deliberately does not pull onto a monitored host.
  - name: 'Check whether the checkout ships the bash completion'
    ansible.builtin.stat:
      path: '/tmp/ansible.monitoring-plugins-repo/assets/bash-completion/linuxfabrik-monitoring-plugins.bash'
    delegate_to: 'localhost'
    become: false
    changed_when: false
    register: '__monitoring_plugins__bash_completion_source'

  # A host without the bash-completion package has no /etc/bash_completion.d, and this role does
  # not pull that package onto a monitored host, so the directory is created here.
  - name: 'mkdir -p /etc/bash_completion.d/'
    ansible.builtin.file:
      path: '/etc/bash_completion.d/'
      state: 'directory'
      owner: 'root'
      group: 'root'
      mode: 0o755
    when:
      # a pinned `monitoring_plugins__version` can predate the completion
      - '__monitoring_plugins__bash_completion_source["stat"]["exists"] | bool'

  - name: 'Copy the /etc/bash_completion.d/linuxfabrik-monitoring-plugins file to the server'
    ansible.builtin.copy:
      src: '/tmp/ansible.monitoring-plugins-repo/assets/bash-completion/linuxfabrik-monitoring-plugins.bash'
      # same file name as the rpm/deb packages
      dest: '/etc/bash_completion.d/linuxfabrik-monitoring-plugins'
      mode: 0o644
    when:
      # a pinned `monitoring_plugins__version` can predate the completion
      - '__monitoring_plugins__bash_completion_source["stat"]["exists"] | bool'

  - name: 'Make sure sudoers drop-ins placed under earlier names are absent (each would duplicate the Cmnd_Alias)'
    ansible.builtin.file:
      # monitoring-plugins: the name this role used before; icinga2-plugins: the manual scp
      # deployment documented in the monitoring-plugins README before the Ansible/package era.
      path: '/etc/sudoers.d/{{ item }}'
      state: 'absent'
    loop:
      - 'icinga2-plugins'
      - 'monitoring-plugins'

  tags:
    - 'monitoring_plugins'
