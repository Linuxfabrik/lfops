- block:

  # the repo files and GPG keys come from vars/RedHat<release>.yml and
  # templates/RedHat<release>/. without this check, an unsupported release fails on an
  # undefined variable instead of naming the releases the role covers.
  - name: 'Assert that this role supports the EL release of the host'
    ansible.builtin.assert:
      that:
        - 'ansible_facts["os_family"] == "RedHat"'
        - 'ansible_facts["distribution"] != "Fedora"'
        - 'ansible_facts["distribution_major_version"] in __repo_rpmfusion__supported_versions'
      quiet: true
      fail_msg: 'repo_rpmfusion does not support {{ ansible_facts["distribution"] }} {{ ansible_facts["distribution_major_version"] }}. Supported: RHEL {{ __repo_rpmfusion__supported_versions | join(", ") }} and their rebuilds.'

  - name: 'Set platform/version specific variables'
    ansible.builtin.import_role:
      name: 'shared'
      tasks_from: 'platform-variables.yml'

  tags:
    - 'always'


- block:

  - name: 'Deploy the repo files (mirror: {{ repo_rpmfusion__mirror_url }})'
    ansible.builtin.template:
      backup: true
      src: '{{ item }}.j2'
      dest: '/etc/yum.repos.d/{{ item | basename }}'
      owner: 'root'
      group: 'root'
      # 0600 while the file carries the mirror credentials
      mode: '{{ "0o600" if repo_rpmfusion__basic_auth_login | d({}) | length > 0 else "0o644" }}'
    loop: '{{ __repo_rpmfusion__repo_files }}'

  - name: 'Remove rpmnew / rpmsave (and Debian equivalents)'
    ansible.builtin.include_role:
      name: 'shared'
      tasks_from: 'remove-rpmnew-rpmsave.yml'
    vars:
      shared__remove_rpmnew_rpmsave_config_file: '/etc/yum.repos.d/{{ item | basename }}'
    loop: '{{ __repo_rpmfusion__repo_files }}'

  - ansible.builtin.include_tasks: 'download-gpg-key.yml'
    loop: '{{ __repo_rpmfusion__gpg_keys }}'
    loop_control:
      loop_var: 'gpg_key'

  tags:
    - 'repo_rpmfusion'
