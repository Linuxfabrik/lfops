argument_specs:
  main:
    options:

      repo_rpmfusion__basic_auth_login:
        # 'raw' rather than 'dict', because the default in defaults/main.yml
        # resolves to '' (empty string) when lfops__repo_basic_auth_login is
        # not set; a strict 'dict' spec would reject the empty default.
        type: 'raw'
        required: false
        description: >-
          HTTP basic auth credentials for a mirror of the RPM Fusion
          repositories. Expected as a dict with `username` and `password`
          keys. Only takes effect together with a custom mirror URL.
          Typically fed by `linuxfabrik.lfops.bitwarden_item`, which returns
          the full Bitwarden item with additional keys.

      repo_rpmfusion__mirror_url:
        type: 'str'
        required: false
        description: >-
          URL of a custom mirror server providing the repositories. Defaults
          to `lfops__repo_mirror_url`; if that is also unset, the default
          upstream mirrors are used.
