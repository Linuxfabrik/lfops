- block:

  # /usr/local/libexec is not part of every base layout: Debian ships it from trixie on and
  # Ubuntu from 26.04 on, while the RedHat family has always had it. Without this the deploy
  # below fails with "Destination directory /usr/local/libexec does not exist". root:root 0755
  # is what the distributions that do ship it use, and matches /usr/local/{bin,sbin} everywhere.
  # Verified against Debian 11, 12 and 13, Ubuntu 22.04 and 24.04, and Rocky 9.
  - name: 'Ensure /usr/local/libexec exists'
    ansible.builtin.file:
      path: '/usr/local/libexec'
      state: 'directory'
      owner: 'root'
      group: 'root'
      mode: 0o755

  # encrypted with systemd 251 and newer, see the systemd_credential module. do-reboot decrypts
  # it on every run, so a changed one needs no restart.
  - name: 'Store the Icinga2 API login as the systemd credential schedule-reboot-icinga2-login.curlrc'
    linuxfabrik.lfops.systemd_credential:
      name: 'schedule-reboot-icinga2-login.curlrc'
      content: '{{ lookup("ansible.builtin.template", "etc/credstore/schedule-reboot-icinga2-login.curlrc.j2") }}'
    when:
      - 'schedule_reboot__icinga2_api_user_login is defined'
      - 'schedule_reboot__icinga2_api_user_login | length > 0'

  - name: 'Remove the systemd credential schedule-reboot-icinga2-login.curlrc'
    linuxfabrik.lfops.systemd_credential:
      name: 'schedule-reboot-icinga2-login.curlrc'
      state: 'absent'
    when: 'schedule_reboot__icinga2_api_user_login is not defined or schedule_reboot__icinga2_api_user_login | length == 0'

  - name: 'Store the Rocket.Chat webhook as the systemd credential schedule-reboot-rocketchat-webhook.curlrc'
    linuxfabrik.lfops.systemd_credential:
      name: 'schedule-reboot-rocketchat-webhook.curlrc'
      content: '{{ lookup("ansible.builtin.template", "etc/credstore/schedule-reboot-rocketchat-webhook.curlrc.j2") }}'
    when:
      - 'schedule_reboot__rocketchat_url is defined'
      - 'schedule_reboot__rocketchat_url | length > 0'

  - name: 'Remove the systemd credential schedule-reboot-rocketchat-webhook.curlrc'
    linuxfabrik.lfops.systemd_credential:
      name: 'schedule-reboot-rocketchat-webhook.curlrc'
      state: 'absent'
    when: 'schedule_reboot__rocketchat_url is not defined or schedule_reboot__rocketchat_url | length == 0'

  - name: 'Deploy /usr/local/libexec/do-reboot'
    ansible.builtin.template:
      src: 'usr/local/libexec/do-reboot.j2'
      dest: '/usr/local/libexec/do-reboot'
      owner: 'root'
      group: 'root'
      mode: 0o700 # only schedule-reboot.service runs it

  # the copies `backup: true` left of earlier versions of do-reboot carry the credentials
  - name: 'find /usr/local/libexec -maxdepth 1 -name do-reboot.*~'
    ansible.builtin.find:
      paths: '/usr/local/libexec'
      patterns: 'do-reboot.*~'
    register: '__schedule_reboot__do_reboot_backups_result'

  - name: 'rm -f /usr/local/libexec/do-reboot.*~'
    ansible.builtin.file:
      path: '{{ item["path"] }}'
      state: 'absent'
    loop: '{{ __schedule_reboot__do_reboot_backups_result["files"] }}'
    loop_control:
      label: '{{ item["path"] }}'

  - name: 'Deploy /usr/local/sbin/schedule-reboot'
    ansible.builtin.template:
      backup: true
      src: 'usr/local/sbin/schedule-reboot.j2'
      dest: '/usr/local/sbin/schedule-reboot'
      owner: 'root'
      group: 'root'
      mode: 0o744

  - name: 'Deploy /etc/systemd/system/schedule-reboot.service'
    ansible.builtin.template:
      backup: true
      src: 'etc/systemd/system/schedule-reboot.service.j2'
      dest: '/etc/systemd/system/schedule-reboot.service'
      owner: 'root'
      group: 'root'
      mode: 0o644
    register: '__schedule_reboot__service_result'

  - name: 'Deploy /etc/systemd/system/schedule-reboot.timer'
    ansible.builtin.template:
      backup: true
      src: 'etc/systemd/system/schedule-reboot.timer.j2'
      dest: '/etc/systemd/system/schedule-reboot.timer'
      owner: 'root'
      group: 'root'
      mode: 0o644
    register: '__schedule_reboot__timer_result'

  - name: 'Deploy /etc/tmpfiles.d/schedule-reboot.conf'
    ansible.builtin.template:
      backup: true
      src: 'etc/tmpfiles.d/schedule-reboot.conf.j2'
      dest: '/etc/tmpfiles.d/schedule-reboot.conf'
      owner: 'root'
      group: 'root'
      mode: 0o644
    register: '__schedule_reboot__tmpfiles_result'

  # systemd-tmpfiles reports nothing at the default log level. At debug level, stderr has a
  # 'Created' or 'Changing' line for every change. Verified against systemd 239, 252 and 257 on
  # Rocky 8, 9 and 10 for `d` rules.
  - name: 'systemd-tmpfiles --create /etc/tmpfiles.d/schedule-reboot.conf' # noqa no-handler
    ansible.builtin.command: 'systemd-tmpfiles --create /etc/tmpfiles.d/schedule-reboot.conf'
    environment:
      SYSTEMD_LOG_LEVEL: 'debug'
    register: '__schedule_reboot__tmpfiles_create_result'
    changed_when: '__schedule_reboot__tmpfiles_create_result["stderr"] is search("^(Created|Changing) ", multiline=True)'
    when:
      - '__schedule_reboot__tmpfiles_result is changed'

  tags:
    - 'schedule_reboot'


- block:

  # run daemon-reload as a regular task (not a handler) before the state task, so the
  # enable/start acts on the freshly deployed unit. gated on any unit-file change.
  - name: 'systemctl daemon-reload'
    ansible.builtin.systemd:
      daemon_reload: true
    when:
      - '__schedule_reboot__service_result is changed or
         __schedule_reboot__timer_result is changed'

  - name: 'systemctl {{ schedule_reboot__enabled | bool | ternary("enable", "disable") }} schedule-reboot.timer --now'
    ansible.builtin.systemd:
      name: 'schedule-reboot.timer'
      state: '{{ schedule_reboot__enabled | bool | ternary("started", "stopped") }}'
      enabled: '{{ schedule_reboot__enabled }}'

  tags:
    - 'schedule_reboot'
    - 'schedule_reboot:state'
