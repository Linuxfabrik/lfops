- block:

  # dnf-makecache.service is not managed: it has no [Install] section (`systemctl is-enabled`
  # reports `static`), it runs `dnf makecache` once and only when dnf-makecache.timer triggers it
  - name: 'systemctl {{ dnf_makecache__timer_enabled | bool | ternary("enable", "disable") }} dnf-makecache.timer'
    ansible.builtin.service:
      name: 'dnf-makecache.timer'
      enabled: '{{ dnf_makecache__timer_enabled | bool }}'

  - name: 'systemctl {{ dnf_makecache__timer_state | regex_replace("p?ed$", "") }} dnf-makecache.timer'
    ansible.builtin.service:
      name: 'dnf-makecache.timer'
      state: '{{ dnf_makecache__timer_state }}'

  tags:
    - 'dnf_makecache'
