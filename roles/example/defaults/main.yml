# --- scalar injection pattern ---
# priority: host > group > dependent > role
example__backup_target: ''
example__conf_log_level__combined_var: '{{
    example__conf_log_level__host_var if (example__conf_log_level__host_var | string | length) else
    example__conf_log_level__group_var if (example__conf_log_level__group_var | string | length) else
    example__conf_log_level__dependent_var if (example__conf_log_level__dependent_var | string | length) else
    example__conf_log_level__role_var
  }}'

example__conf_log_level__dependent_var: ''
example__conf_log_level__group_var: ''
example__conf_log_level__host_var: ''
example__conf_log_level__role_var: 'info'
example__conf_max_connections__combined_var: '{{
    example__conf_max_connections__host_var if (example__conf_max_connections__host_var | string | length) else
    example__conf_max_connections__group_var if (example__conf_max_connections__group_var | string | length) else
    example__conf_max_connections__dependent_var if (example__conf_max_connections__dependent_var | string | length) else
    example__conf_max_connections__role_var
  }}'

example__conf_max_connections__dependent_var: ''
example__conf_max_connections__group_var: ''
example__conf_max_connections__host_var: ''
example__conf_max_connections__role_var: 100
example__conf_tls_protocols: 'TLSv1.2 TLSv1.3'


# version-specific default from vars/<version>.yml, overridable by the user via inventory
example__conf_worker_threads: '{{ __example__conf_worker_threads }}'

# referencing another role's variable keeps values consistent when the user sets it in
# their inventory. always provide a d() fallback, since role defaults are only loaded
# for roles that are part of the play.
example__logrotate: '{{ logrotate__rotate | d(14) }}'

# use inventory_hostname as seed for random but idempotent values.
# this ensures each host gets a different minute, but the same minute on every run.
example__maintenance_cron_minute: '{{ 59 | random(seed=inventory_hostname) }}'

# not all variables need the injection pattern. simple settings like service state
# are typically only set by the user, never injected by other roles.
example__service_enabled: true
example__service_state: 'started'

# --- publishing a dependent_var for another role ---
# the kernel settings this role's service needs. the playbook feeds this into the
# kernel_settings role, which hands it to TuneD (see playbooks/example.yml).
# a value the service reads once at startup, like the one below, additionally needs the
# After=tuned.service drop-in this role deploys, otherwise the service may come up before
# TuneD has applied the profile. see "systemd Drop-ins and Service Ordering" in
# CONTRIBUTING.md.
example__kernel_settings__sysctl__dependent_var:
  # the kernel clamps the accept queue to net.core.somaxconn inside listen(), so example
  # keeps the old queue size until it is restarted.
  - name: 'net.core.somaxconn'
    value: 4096

# --- list of dicts injection pattern ---
# combined using linuxfabrik.lfops.combine_lod
example__plugins__combined_var: '{{ (
      example__plugins__role_var +
      example__plugins__dependent_var +
      example__plugins__group_var +
      example__plugins__host_var
    ) | linuxfabrik.lfops.combine_lod
  }}'

example__plugins__dependent_var: []
example__plugins__group_var: []
example__plugins__host_var: []
example__plugins__role_var: []
example__users__combined_var: '{{ (
      example__users__role_var +
      example__users__dependent_var +
      example__users__group_var +
      example__users__host_var
    ) | linuxfabrik.lfops.combine_lod
  }}'

example__users__dependent_var: []
example__users__group_var: []
example__users__host_var: []
example__users__role_var: []
# --- list of dicts injection pattern with composite unique key ---
# when items are identified by a combination of keys (e.g. same name on different ports),
# pass a list of key names to unique_key.
example__listeners__combined_var: '{{ (
      example__listeners__role_var +
      example__listeners__dependent_var +
      example__listeners__group_var +
      example__listeners__host_var
    ) | linuxfabrik.lfops.combine_lod(unique_key=["name", "port"])
  }}'

example__listeners__dependent_var: []
example__listeners__group_var: []
example__listeners__host_var: []
example__listeners__role_var:
  - name: 'default'
    port: 8080
  - name: 'default'
    port: 8443
    ssl: true
