keycloak__db_url: ''
keycloak__db_url_database: 'keycloak'
keycloak__db_url_host: 'localhost'
keycloak__db_vendor: 'mariadb'
keycloak__expose_healthcheck_endpoints: true # upstream default: false
keycloak__expose_metrics_endpoints: true # upstream default: false
keycloak__hostname_backchannel_dynamic: false
keycloak__https_certificate_file: ''
keycloak__https_certificate_key_file: ''
keycloak__https_cipher_suites: []
keycloak__https_protocols:
  - 'TLSv1.3'
  - 'TLSv1.2'
keycloak__limit_nofile: 131072
keycloak__log: # upstream default: console
  - 'file'
keycloak__log_file: '/var/log/keycloak/keycloak.log' # upstream default: data/log/keycloak.log
keycloak__logrotate: '{{ logrotate__rotate | d(14) }}'
keycloak__mode: 'production'
keycloak__proxy_headers: 'xforwarded' # upstream default: unset
keycloak__proxy_trusted_addresses: []
keycloak__service_enabled: true
keycloak__service_state: 'started'
keycloak__spi_sticky_session_encoder_infinispan_should_attach_route: false # upstream default: true
keycloak__transaction_default_timeout: 3600 # upstream default: 5m
keycloak__transaction_setup_timeout: 3600 # upstream default: 30m

# -----------------------------------------------------------------------------
# no need to document the variables in the README below this line, as they
# are internally for this role

keycloak__mariadb_server__databases__dependent_var:
  - name: '{{ keycloak__db_url_database }}'
    collation: 'utf8mb4_unicode_ci'
    encoding: 'utf8mb4'
    state: 'present'

keycloak__mariadb_server__users__dependent_var:
  - username: '{{ keycloak__db_login["username"] }}'
    password: '{{ keycloak__db_login["password"] }}'
    host: '127.0.0.1'
    priv:
      - '{{ keycloak__db_url_database }}.*:ALL'
    state: 'present'
  - username: '{{ keycloak__db_login["username"] }}'
    password: '{{ keycloak__db_login["password"] }}'
    host: '{{ keycloak__db_url_host }}'
    priv:
      - '{{ keycloak__db_url_database }}.*:ALL'
    state: 'present'
