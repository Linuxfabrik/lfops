- block:

  # simple mandatory variable checks (required, type, choices) live in meta/argument_specs.yml.
  # this assert only covers what argument_specs cannot express.
  - name: 'Check variable constraints'
    ansible.builtin.assert:
      that:
        - 'keycloak__version.split(".")[0] in __keycloak__java_package'
      quiet: true
      fail_msg: 'Keycloak {{ keycloak__version }} is not supported by this role. Supported major versions: {{ __keycloak__java_package.keys() | join(", ") }}.'

  - name: 'stat /etc/ansible/facts.d/keycloak__admin_login_bootstrapped.state'
    ansible.builtin.stat:
      path: '/etc/ansible/facts.d/keycloak__admin_login_bootstrapped.state'
    register: '__keycloak__admin_login_bootstrapped_stat'

  # Read-only fact used in the debug output and as the default value of the per-render
  # `__keycloak__include_bootstrap_creds` flag below. Do NOT reuse this fact directly in the
  # sysconfig template: set_fact has higher Ansible variable precedence than task-level `vars:`,
  # so a task trying to override this fact would be silently ignored.
  - name: 'Set __keycloak__admin_login_bootstrapped'
    ansible.builtin.set_fact:
      __keycloak__admin_login_bootstrapped: '{{ __keycloak__admin_login_bootstrapped_stat["stat"]["exists"] }}'

  - name: 'Debug Variables'
    ansible.builtin.debug:
      msg:
        - 'keycloak__admin_login.username: {{ (keycloak__admin_login | d({}))["username"] | d("(unset)") }}'
        - '/etc/ansible/facts.d/keycloak__admin_login_bootstrapped.state exists: {{ __keycloak__admin_login_bootstrapped }}'
        - 'keycloak__db_login.username: {{ keycloak__db_login["username"] }}'
        - 'keycloak__db_url_database: {{ keycloak__db_url_database }}'
        - 'keycloak__db_url_host: {{ keycloak__db_url_host }}'
        - 'keycloak__db_vendor: {{ keycloak__db_vendor }}'
        - 'keycloak__expose_healthcheck_endpoints: {{ keycloak__expose_healthcheck_endpoints }}'
        - 'keycloak__expose_metrics_endpoints: {{ keycloak__expose_metrics_endpoints }}'
        - 'keycloak__hostname: {{ keycloak__hostname }}'
        - 'keycloak__hostname_backchannel_dynamic: {{ keycloak__hostname_backchannel_dynamic }}'
        - 'keycloak__https_certificate_file: {{ keycloak__https_certificate_file }}'
        - 'keycloak__https_certificate_key_file: {{ keycloak__https_certificate_key_file }}'
        - 'keycloak__https_protocols: {{ keycloak__https_protocols }}'
        - 'keycloak__log: {{ keycloak__log }}'
        - 'keycloak__log_file: {{ keycloak__log_file }}'
        - 'keycloak__mode: {{ keycloak__mode }}'
        - 'keycloak__proxy_headers: {{ keycloak__proxy_headers }}'
        - 'keycloak__service_enabled: {{ keycloak__service_enabled }}'
        - 'keycloak__spi_sticky_session_encoder_infinispan_should_attach_route: {{ keycloak__spi_sticky_session_encoder_infinispan_should_attach_route }}'
        - 'keycloak__service_state: {{ keycloak__service_state }}'
        - 'keycloak__version: {{ keycloak__version }}'

  tags:
    - 'always'


- block:

  - name: 'Ensure group keycloak exists'
    ansible.builtin.group:
      name: 'keycloak'
      state: 'present'

  - name: 'Add the user keycloak with primary group of keycloak'
    ansible.builtin.user:
      name: 'keycloak'
      comment: 'User for Keycloak service'
      group: 'keycloak'

  - name: 'mkdir -p {{ keycloak__log_file | dirname }}'
    ansible.builtin.file:
      path: '{{ keycloak__log_file | dirname }}'
      state: 'directory'
      owner: 'keycloak'
      group: 'keycloak'
      mode: 0o755

  - name: 'mkdir -p {{ __keycloak__install_dir }}'
    ansible.builtin.file:
      path: '{{ __keycloak__install_dir }}'
      state: 'directory'
      owner: 'keycloak'
      group: 'keycloak'
      mode: 0o755

  - name: 'Install {{ __keycloak__java_package[keycloak__version.split(".")[0]] }}'
    ansible.builtin.package:
      name: '{{ __keycloak__java_package[keycloak__version.split(".")[0]] }}'
      state: 'present'

  # version.txt ships inside the tarball and names the installed release ("Keycloak - Version
  # 26.4.7"), so it tells us whether the wanted version is already in place. Without this the
  # role re-downloads and re-extracts the tarball on every single run.
  - name: 'cat {{ __keycloak__install_dir }}/version.txt'
    ansible.builtin.slurp:
      src: '{{ __keycloak__install_dir }}/version.txt'
    register: '__keycloak__version_txt_result'
    failed_when: false # absent on a host that has no Keycloak installed yet
    changed_when: false
    check_mode: false

  - name: 'Set __keycloak__installed_version'
    ansible.builtin.set_fact:
      __keycloak__installed_version: '{{ __keycloak__version_txt_result["content"] | d("") | b64decode | regex_replace("(?s)^.*Version[ \t]+", "") | trim }}'


  # use a sub-block with a block-level when to avoid repeating the same condition on every task.
  - block:

    # download on the controller (`delegate_to: 'localhost'`) and copy to the target afterwards,
    # so that targets without internet access can still be provisioned.
    - name: 'curl --output /tmp/ansible.keycloak-{{ keycloak__version }}.tar.gz {{ __keycloak__download_url }}' # noqa risky-file-permissions (temporary file)
      ansible.builtin.get_url:
        url: '{{ __keycloak__download_url }}'
        dest: '/tmp/ansible.keycloak-{{ keycloak__version }}.tar.gz'
        mode: 0o644
      delegate_to: 'localhost'
      become: false
      changed_when: false # not an actual config change on the target
      check_mode: false # run task even if `--check` is specified

    - name: 'Copy /tmp/ansible.keycloak-{{ keycloak__version }}.tar.gz to the target' # noqa risky-file-permissions (temporary file)
      ansible.builtin.copy:
        src: '/tmp/ansible.keycloak-{{ keycloak__version }}.tar.gz'
        dest: '/tmp/keycloak-{{ keycloak__version }}.tar.gz'

    # an upgrade extracts over the existing tree. files the new release no longer ships are left
    # behind, which is documented in the role README under "How the Role Behaves".
    - name: 'tar xzf /tmp/keycloak-{{ keycloak__version }}.tar.gz -C {{ __keycloak__install_dir }} --strip-components=1'
      ansible.builtin.unarchive:
        src: '/tmp/keycloak-{{ keycloak__version }}.tar.gz'
        dest: '{{ __keycloak__install_dir }}'
        remote_src: true
        owner: 'keycloak'
        group: 'keycloak'
        extra_opts:
          - '--strip-components=1'
      register: '__keycloak__unarchive_result'

    when:
      - '__keycloak__installed_version != keycloak__version'

  # the module's recursive mode is slow on a tree the size of a Keycloak installation, so drive
  # chown directly and derive changed_when from its --changes output.
  - name: 'chown -R --changes keycloak:keycloak {{ __keycloak__install_dir | quote }}'
    ansible.builtin.command: 'chown -R --changes keycloak:keycloak {{ __keycloak__install_dir | quote }}'
    register: '__keycloak__chown_result'
    changed_when: '__keycloak__chown_result["stdout"] | length > 0'

  tags:
    - 'keycloak'


- block:

  - name: 'Deploy {{ __keycloak__install_dir }}/conf/keycloak.conf'
    ansible.builtin.template:
      backup: true
      src: 'opt/keycloak/conf/keycloak.conf.j2'
      dest: '{{ __keycloak__install_dir }}/conf/keycloak.conf'
      owner: 'keycloak'
      group: 'keycloak'
      mode: 0o640 # contains the database password
    register: '__keycloak__conf_result'
    notify: 'keycloak: systemctl restart keycloak'

  - name: 'Deploy {{ __keycloak__sysconfig_path }}'
    ansible.builtin.template:
      backup: true
      src: 'etc/sysconfig/keycloak-sysconfig.j2'
      dest: '{{ __keycloak__sysconfig_path }}'
      owner: 'root'
      group: 'root'
      mode: 0o640
    vars:
      __keycloak__include_bootstrap_creds: '{{ not __keycloak__admin_login_bootstrapped }}'
    notify: 'keycloak: systemctl restart keycloak'

  # Keycloak ships no systemd unit with its tarball, so the unit itself is templated here rather
  # than being overridden through a drop-in.
  - name: 'Deploy /etc/systemd/system/keycloak.service'
    ansible.builtin.template:
      backup: true
      src: 'etc/systemd/system/keycloak.service.j2'
      dest: '/etc/systemd/system/keycloak.service'
      owner: 'root'
      group: 'root'
      mode: 0o644
    register: '__keycloak__unit_result'
    notify: 'keycloak: systemctl restart keycloak'

  - name: 'systemctl daemon-reload' # noqa no-handler would require flush_handlers here anyway
    ansible.builtin.systemd:
      daemon_reload: true
    when: '__keycloak__unit_result is changed'

  # kc.sh build re-augments the server for its build-time options, the database vendor above all.
  # It is not a handler because it has to run before the service is (re)started, and a handler
  # would only run after the state task below. Gating it on the two inputs that can carry a
  # changed build option keeps an unchanged host from paying for a rebuild on every run.
  - name: 'cd {{ __keycloak__install_dir }} && bin/kc.sh build --db {{ keycloak__db_vendor }}' # noqa no-handler must run before the service is started
    ansible.builtin.command: 'bin/kc.sh build --db {{ keycloak__db_vendor }}'
    args:
      chdir: '{{ __keycloak__install_dir }}'
    become: true
    become_user: 'keycloak'
    changed_when: true # kc.sh build gives no idempotency signal, but it only runs on a real change
    when:
      - 'keycloak__mode == "production"'
      - '(__keycloak__unarchive_result is defined and __keycloak__unarchive_result is changed) or
         (__keycloak__conf_result is defined and __keycloak__conf_result is changed)'

  tags:
    - 'keycloak'
    - 'keycloak:configure'


- block:

  - name: 'systemctl {{ keycloak__service_enabled | bool | ternary("enable", "disable") }} keycloak.service'
    ansible.builtin.service:
      name: 'keycloak.service'
      enabled: '{{ keycloak__service_enabled | bool }}'

  - name: 'systemctl {{ keycloak__service_state | regex_replace("p?ed$", "") }} keycloak.service'
    ansible.builtin.service:
      name: 'keycloak.service'
      state: '{{ keycloak__service_state }}'
    register: '__keycloak__service_state_result'

  tags:
    - 'keycloak'
    - 'keycloak:configure'
    - 'keycloak:state'


- block:

  - name: 'Flush handlers so Keycloak restarts with the bootstrap credentials loaded'
    ansible.builtin.meta: 'flush_handlers'

  # Port-up only proves Quarkus is listening, not that the bootstrap admin was provisioned.
  # The admin-cli token request below is the actual readiness check; this wait_for just
  # avoids spamming "connection refused" before Keycloak has bound the socket.
  - name: 'Wait for Keycloak listener on port {{ __keycloak__listen_port }}'
    ansible.builtin.wait_for:
      port: '{{ __keycloak__listen_port }}'
      host: '127.0.0.1'
      delay: 5
      sleep: 2
      timeout: 300
    vars:
      __keycloak__listen_port: '{{ (keycloak__https_certificate_file | length > 0) | ternary(8443, 8080) }}'

  # Verify the bootstrap admin actually exists with the configured password before touching
  # the marker. If this fails, the marker stays absent and a re-run with corrected variables
  # will re-render the credentials and retry.
  # The retry budget covers Keycloak's bootstrap, not just a slow request: once the socket is
  # bound, Keycloak still creates its database schema and the admin account, and answers every
  # request with 503 from its BootstrapFilter until that is done. Measured on a fresh database:
  # "Bootstrap completed in 95.064000 seconds" on a 2 vCPU Rocky 9 VM with keycloak 26.7.3, so
  # 5 minutes leaves room on a slower host or a larger database.
  - name: 'curl --data grant_type=password --data client_id=admin-cli {{ __keycloak__base_url }}/realms/master/protocol/openid-connect/token'
    ansible.builtin.uri:
      url: '{{ __keycloak__base_url }}/realms/master/protocol/openid-connect/token'
      method: 'POST'
      body_format: 'form-urlencoded'
      body:
        client_id: 'admin-cli'
        grant_type: 'password'
        password: '{{ keycloak__admin_login["password"] }}'
        username: '{{ keycloak__admin_login["username"] }}'
      status_code: 200
      validate_certs: false
    register: '__keycloak__admin_token_result'
    until: '__keycloak__admin_token_result["status"] | d(0) == 200'
    retries: 60
    delay: 5
    no_log: true
    changed_when: false
    check_mode: false
    vars:
      __keycloak__listen_port: '{{ (keycloak__https_certificate_file | length > 0) | ternary(8443, 8080) }}'
      __keycloak__scheme: '{{ (keycloak__https_certificate_file | length > 0) | ternary("https", "http") }}'
      __keycloak__base_url: '{{ __keycloak__scheme }}://127.0.0.1:{{ __keycloak__listen_port }}'

  # `backup: false` is on purpose. The previous file contained the cleartext bootstrap password;
  # writing a `.<timestamp>~` backup would leave those credentials on disk and defeat the
  # whole point of this cleanup pass.
  - name: 'Deploy {{ __keycloak__sysconfig_path }} (without bootstrap credentials)'
    ansible.builtin.template:
      backup: false
      src: 'etc/sysconfig/keycloak-sysconfig.j2'
      dest: '{{ __keycloak__sysconfig_path }}'
      owner: 'root'
      group: 'root'
      mode: 0o640
    vars:
      __keycloak__include_bootstrap_creds: false

  - name: 'mkdir -p /etc/ansible/facts.d'
    ansible.builtin.file:
      path: '/etc/ansible/facts.d'
      state: 'directory'
      owner: 'root'
      group: 'root'
      mode: 0o755

  # `copy` with `content: ''` instead of `file` with `state: touch` so the task does not
  # report changed on every run after the bootstrap is complete.
  - name: 'Create state marker /etc/ansible/facts.d/keycloak__admin_login_bootstrapped.state'
    ansible.builtin.copy:
      content: ''
      dest: '/etc/ansible/facts.d/keycloak__admin_login_bootstrapped.state'
      owner: 'root'
      group: 'root'
      mode: 0o600

  rescue:

    # The admin-cli token request above failed. The most common non-transient
    # cause is the permanent-admin handover (see the role README, "Post-Installation
    # Steps"): the temporary `-temp` bootstrap account was deleted, but the marker
    # file is missing (e.g. a fresh Ansible controller, or a lost
    # `/etc/ansible/facts.d`). The role cannot obtain a token and cannot tell this
    # apart from a genuine error, so it fails loudly with recovery guidance
    - name: 'Explain how to recover from a missing bootstrap marker'
      ansible.builtin.fail:
        msg: >-
          Could not obtain an admin-cli token for
          "{{ keycloak__admin_login["username"] }}" in the master realm. If you
          already created a permanent admin and deleted this temporary bootstrap
          account, the bootstrap is effectively done but the marker file is
          missing. Recreate it on the target and re-run the role:
          `mkdir --parents /etc/ansible/facts.d &&
          touch /etc/ansible/facts.d/keycloak__admin_login_bootstrapped.state`.
          Otherwise verify that keycloak.service is running and that
          `keycloak__admin_login` matches the bootstrap admin.

  # block
  when:
    - 'not (__keycloak__admin_login_bootstrapped | bool)'
    - 'keycloak__service_state == "started"'
  tags:
    - 'keycloak'
    - 'keycloak:configure'
