- block:

  - name: 'Install fail2ban'
    ansible.builtin.package:
      name:
        - 'fail2ban'
      state: 'present'
    retries: 3 # ride out a brief outage of the package repository
    delay: 10

  # The iptables actions match ports with xt_multiport. RHEL 10 ships it in kernel-modules-extra,
  # which iptables-nft only recommends; dnf resolves that with the package of the newest kernel,
  # so the running kernel lacks the module until the next reboot. Until then iptables rejects
  # every ban, while fail2ban still lists the address as banned. RHEL 8 and 9 ship the module in
  # kernel-core and kernel-modules-core. Verified with iptables-nft 1.8.11 on Rocky 10.3.
  - name: 'modinfo --field filename xt_multiport'
    ansible.builtin.command: 'modinfo --field filename xt_multiport'
    register: '__fail2ban__xt_multiport_result'
    changed_when: false
    failed_when: false
    check_mode: false
    when:
      - 'fail2ban__jail_default_banaction is match("iptables")'

  - block:

    # ansible.builtin.dnf instead of package for allow_downgrade: the dnf module compares by name
    # only and treats the package as installed when the one of a newer kernel is
    # (_is_newer_version_installed(), ansible-core 2.16). kernel-modules-extra is installonly,
    # so this installs it next to the newer one and downgrades nothing.
    # no host fact in the task name: Ansible renders it with the facts of the first host
    - name: 'dnf install kernel-modules-extra-$(uname -r)'
      ansible.builtin.dnf:
        name: 'kernel-modules-extra-{{ ansible_facts["kernel"] }}'
        state: 'present'
        allow_downgrade: true
      retries: 3 # ride out a brief outage of the package repository
      delay: 10

    # Every later kernel package requires its own kernel-modules-extra while
    # kernel-modules-extra-matched is installed, in any version, so the module survives the next
    # kernel update. Unversioned, since it is no installonly package.
    - name: 'dnf install kernel-modules-extra-matched'
      ansible.builtin.package:
        name: 'kernel-modules-extra-matched'
        state: 'present'
      retries: 3 # ride out a brief outage of the package repository
      delay: 10

    rescue:

    - name: 'Fail if the running kernel cannot get xt_multiport'
      ansible.builtin.fail:
        msg: >-
          The running kernel {{ ansible_facts["kernel"] }} has no xt_multiport module, so the
          {{ fail2ban__jail_default_banaction }} banaction cannot block anything, and installing
          kernel-modules-extra for this kernel failed: {{ ansible_failed_result["msg"] | d("") }}.
          If the repositories no longer offer it, reboot into the newest installed kernel and run
          the playbook again.

    when:
      - '__fail2ban__xt_multiport_result["rc"] | d(0) != 0'

  tags:
    - 'fail2ban'


# The policy module that lets the ss-kill action close the connections of a banned client. It
# needs the fail2ban_t type, which RHEL 10 only gets from fail2ban-selinux, a dependency of the
# fail2ban package, so it is installed here and not by the selinux role, which the playbook runs
# before this role. The module is CIL, which semodule loads without a policy compiler on the host.
- block:

  - name: 'Deploy /usr/share/selinux/packages/lfops_fail2ban_ss_kill.cil'
    ansible.builtin.template:
      backup: true
      src: 'usr/share/selinux/packages/lfops_fail2ban_ss_kill.cil.j2'
      dest: '/usr/share/selinux/packages/lfops_fail2ban_ss_kill.cil'
      owner: 'root'
      group: 'root'
      mode: 0o644
    register: '__fail2ban__selinux_module_result'

  - name: 'semodule --list'
    ansible.builtin.command: 'semodule --list'
    register: '__fail2ban__semodule_list_result'
    changed_when: false
    check_mode: false

  - name: 'semodule --install /usr/share/selinux/packages/lfops_fail2ban_ss_kill.cil'
    ansible.builtin.command: 'semodule --install /usr/share/selinux/packages/lfops_fail2ban_ss_kill.cil'
    changed_when: true # only runs when the module is missing or changed
    when:
      - '__fail2ban__selinux_module_result is changed
         or "lfops_fail2ban_ss_kill" not in __fail2ban__semodule_list_result["stdout_lines"] | map("split") | map("first") | list'

  when:
    - 'ansible_facts["os_family"] == "RedHat"'
    - 'ansible_facts["selinux"]["status"] != "disabled"'
  tags:
    - 'fail2ban'
    - 'fail2ban:configure'


- block:

  - name: 'Deploy /etc/fail2ban/action.d/rocketchat.conf'
    ansible.builtin.template:
      backup: true
      src: 'etc/fail2ban/action.d/rocketchat.conf.j2'
      dest: '/etc/fail2ban/action.d/rocketchat.conf'
      owner: 'root'
      group: 'root'
      mode: 0o644
    notify:
      - 'fail2ban: restart fail2ban'

  - name: 'Deploy /etc/fail2ban/action.d/ss-kill.conf'
    ansible.builtin.template:
      backup: true
      src: 'etc/fail2ban/action.d/ss-kill.conf.j2'
      dest: '/etc/fail2ban/action.d/ss-kill.conf'
      owner: 'root'
      group: 'root'
      mode: 0o644
    notify:
      - 'fail2ban: restart fail2ban'

  - name: 'Combined Filters'
    ansible.builtin.debug:
      var: 'fail2ban__filters__combined_var'

  - name: 'Remove Filters'
    ansible.builtin.file:
      path: '/etc/fail2ban/filter.d/{{ item["filename"] }}.conf'
      state: 'absent'
    loop: '{{ fail2ban__filters__combined_var }}'
    loop_control:
      label: '{{ item["filename"] }}'
    when:
      - 'item["state"] | d("present") == "absent"'
    notify:
      - 'fail2ban: restart fail2ban'

  - name: 'Create Filters'
    ansible.builtin.template:
      backup: true
      src: 'etc/fail2ban/filter.d/{{ item["template"] }}.conf.j2'
      dest: '/etc/fail2ban/filter.d/{{ item["filename"] }}.conf'
      owner: 'root'
      group: 'root'
      mode: 0o644
    loop: '{{ fail2ban__filters__combined_var }}'
    loop_control:
      label: '{{ item["filename"] }}'
    when:
      - 'item["state"] | d("present") != "absent"'
    notify:
      - 'fail2ban: restart fail2ban'

  - name: 'Deploy /etc/fail2ban/jail.d/z00-defaults.conf'
    ansible.builtin.template:
      backup: true
      src: 'etc/fail2ban/jail.d/z00-defaults.conf.j2'
      dest: '/etc/fail2ban/jail.d/z00-defaults.conf'
      owner: 'root'
      group: 'root'
      mode: 0o640
    notify:
      - 'fail2ban: restart fail2ban'

  - name: 'stat /var/log/httpd'
    ansible.builtin.stat:
      path: '/var/log/httpd'
    register: '__fail2ban__apache_log_dir_result'

  - name: 'Combined Jails'
    ansible.builtin.debug:
      var: 'fail2ban__jails__combined_var'

  - name: 'Remove Jails'
    ansible.builtin.file:
      path: '/etc/fail2ban/jail.d/{{ item["filename"] }}.conf'
      state: 'absent'
    loop: '{{ fail2ban__jails__combined_var }}'
    loop_control:
      label: '{{ item["filename"] }}'
    when:
      - 'item["state"] | d("present") == "absent"'
    notify:
      - 'fail2ban: restart fail2ban'

  - name: 'Create Jails'
    ansible.builtin.template:
      backup: true
      src: 'etc/fail2ban/jail.d/z10-{{ item["template"] }}.conf.j2'
      dest: '/etc/fail2ban/jail.d/{{ item["filename"] }}.conf'
      owner: 'root'
      group: 'root'
      mode: 0o644
    loop: '{{ fail2ban__jails__combined_var }}'
    loop_control:
      label: '{{ item["filename"] }}'
    when:
      - 'item["state"] | d("present") != "absent"'
    notify:
      - 'fail2ban: restart fail2ban'

  tags:
    - 'fail2ban'
    - 'fail2ban:configure'


# runs last, after the jails and filters above, so that a fresh installation starts fail2ban with
# the deployed configuration and the restart handler can skip the redundant bounce.
- block:

  - name: 'systemctl {{ fail2ban__service_enabled | bool | ternary("enable", "disable") }} fail2ban.service'
    ansible.builtin.service:
      name: 'fail2ban.service'
      enabled: '{{ fail2ban__service_enabled | bool }}'

  - name: 'systemctl {{ fail2ban__service_state | regex_replace("p?ed$", "") }} fail2ban.service'
    ansible.builtin.service:
      name: 'fail2ban.service'
      state: '{{ fail2ban__service_state }}'
    register: '__fail2ban__service_state_result'

  tags:
    - 'fail2ban'
    - 'fail2ban:state'
