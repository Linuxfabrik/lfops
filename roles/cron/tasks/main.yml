- name: 'Set platform/version specific variables'
  ansible.builtin.import_role:
    name: 'shared'
    tasks_from: 'platform-variables.yml'
  tags:
    - 'always'


- block:

  - name: 'Install {{ __cron__package }}'
    ansible.builtin.package:
      name: '{{ __cron__package }}'
      state: 'present'
    retries: 3 # ride out a brief outage of the package repository
    delay: 10

  - name: 'stat {{ item["path"] }}'
    ansible.builtin.stat:
      path: '{{ item["path"] }}'
    loop: '{{ __cron__paths }}'
    loop_control:
      label: '{{ item["path"] }}'
    register: '__cron__paths_stat_result'

  # A package update may reset the mode of the paths the package owns, so every run sets it again.
  - name: 'chmod {{ item["mode"] | replace("0o", "") }} {{ item["path"] }}'
    ansible.builtin.file:
      path: '{{ item["path"] }}'
      owner: 'root'
      group: 'root'
      mode: '{{ item["mode"] }}'
    loop: '{{ __cron__paths }}'
    loop_control:
      label: '{{ item["path"] }}'
    when:
      - 'item["path"] in __cron__existing_paths'
    vars:
      __cron__existing_paths: '{{ __cron__paths_stat_result["results"] | selectattr("stat.exists") | map(attribute="item.path") | list }}'

  tags:
    - 'cron'


- block:

  - name: 'systemctl {{ cron__service_enabled | bool | ternary("enable", "disable") }} {{ __cron__service_name }}.service'
    ansible.builtin.service:
      name: '{{ __cron__service_name }}.service'
      enabled: '{{ cron__service_enabled | bool }}'

  - name: 'systemctl {{ cron__service_state | regex_replace("p?ed$", "") }} {{ __cron__service_name }}.service'
    ansible.builtin.service:
      name: '{{ __cron__service_name }}.service'
      state: '{{ cron__service_state }}'

  tags:
    - 'cron'
    - 'cron:state'
