- block:

  - name: 'Install haveged'
    ansible.builtin.package:
      name: 'haveged'
      state: 'present'
    retries: 3 # ride out a brief outage of the package repository
    delay: 10

  tags:
    - 'haveged'


- block:

  - name: 'systemctl {{ haveged__service_enabled | bool | ternary("enable", "disable") }} haveged.service'
    ansible.builtin.service:
      name: 'haveged.service'
      enabled: '{{ haveged__service_enabled | bool }}'

  - name: 'systemctl {{ haveged__service_state | regex_replace("p?ed$", "") }} haveged.service'
    ansible.builtin.service:
      name: 'haveged.service'
      state: '{{ haveged__service_state }}'

  tags:
    - 'haveged'
    - 'haveged:state'
