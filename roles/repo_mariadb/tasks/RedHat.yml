- block:

  # MariaDB publishes no RHEL 10 packages before 10.11. The repository for an older release would
  # answer 404, and with skip_if_unavailable off that breaks every dnf transaction on the host, not
  # only the MariaDB install. Verified on Rocky 10: 10.6 answers 404, while 10.11, 11.4 and 11.8
  # carry MariaDB-server.
  - name: 'Assert that MariaDB publishes packages for this RHEL release'
    ansible.builtin.assert:
      that:
        - 'repo_mariadb__version is version("10.11", ">=")'
      quiet: true
      fail_msg: 'MariaDB {{ repo_mariadb__version }} publishes no packages for RHEL {{ ansible_facts["distribution_major_version"] }}. MariaDB ships RHEL 10 packages from 10.11 on; deploying this repository would break every dnf transaction on the host.'
    when:
      - 'ansible_facts["distribution"] != "Fedora"'
      - 'ansible_facts["distribution_major_version"] | int >= 10'

  tags:
    - 'always'


- name: 'Set platform/version specific variables'
  ansible.builtin.import_role:
    name: 'shared'
    tasks_from: 'platform-variables.yml'
  tags:
    - 'always'


- block:

  - name: 'deploy the repo file (mirror: {{ repo_mariadb__mirror_url | default("") }})'
    ansible.builtin.template:
      backup: true
      src: 'etc/yum.repos.d/RedHat-MariaDB.repo.j2'
      dest: '/etc/yum.repos.d/MariaDB.repo'
      owner: 'root'
      group: 'root'
      # 0600 while the file carries the mirror credentials
      mode: '{{ "0o600" if repo_mariadb__basic_auth_login | default({}) | length > 0 else "0o644" }}'

  - name: 'Remove rpmnew / rpmsave (and Debian equivalents)'
    ansible.builtin.include_role:
      name: 'shared'
      tasks_from: 'remove-rpmnew-rpmsave.yml'
    vars:
      shared__remove_rpmnew_rpmsave_config_file: '/etc/yum.repos.d/MariaDB.repo'

  - name: 'curl https://rpm.mariadb.org/RPM-GPG-KEY-MariaDB --output /tmp/ansible.MariaDB-Server-GPG-KEY'
    ansible.builtin.get_url:
      url: 'https://rpm.mariadb.org/RPM-GPG-KEY-MariaDB'
      dest: '/tmp/ansible.MariaDB-Server-GPG-KEY'
      mode: 0o644
    delegate_to: 'localhost'
    become: false
    changed_when: false # not an actual config change on the server
    check_mode: false # run task even if `--check` is specified

  - name: 'copy /tmp/ansible.MariaDB-Server-GPG-KEY to /etc/pki/rpm-gpg/MariaDB-Server-GPG-KEY'
    ansible.builtin.copy:
      src: '/tmp/ansible.MariaDB-Server-GPG-KEY'
      dest: '/etc/pki/rpm-gpg/MariaDB-Server-GPG-KEY'
      mode: 0o644

  - name: 'dnf -y module disable mariadb # prevent the default module stream from being used'
    ansible.builtin.command: 'dnf -y module disable mariadb'
    register: 'repo_mariadb__command_result'
    changed_when: "'Nothing to do' not in repo_mariadb__command_result.stdout"
    when: 'ansible_facts["distribution_major_version"] | int in [8, 9]'

  tags:
    - 'repo_mariadb'
