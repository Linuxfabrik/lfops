- name: 'Set platform/version specific variables'
  ansible.builtin.import_role:
    name: 'shared'
    tasks_from: 'platform-variables.yml'
  tags:
    - 'redis'
    - 'redis:state'


- block:

  - name: 'Install {{ __redis__package }}'
    ansible.builtin.package:
      name: '{{ __redis__package }}'
      state: 'present'

  - name: 'Get the list of installed packages'
    ansible.builtin.package_facts:  # yamllint disable-line rule:empty-values
    check_mode: false # run task even if `--check` is specified

  - name: 'Get Redis version'
    ansible.builtin.set_fact:
      redis__installed_version: '{{ ansible_facts.packages[__redis__package][0]["version"] | regex_search("\d+\.\d+") }}'

  - name: 'Assert that a configuration template for the installed Redis version exists'
    ansible.builtin.assert:
      that:
        - 'redis__installed_version in __redis__supported_versions'
      quiet: true
      fail_msg: 'Redis {{ redis__installed_version }} is not supported by this role. Supported versions: {{ __redis__supported_versions | join(", ") }}.'

  - name: 'Deploy {{ __redis__config_dir }}/{{ __redis__config_file }} (v{{ redis__installed_version }})'
    ansible.builtin.template:
      backup: true
      src: 'etc/redis/{{ redis__installed_version }}-redis.conf.j2'
      dest: '{{ __redis__config_dir }}/{{ __redis__config_file }}'
      owner: 'root'
      group: 'redis'
      mode: 0o640
    notify: 'redis: restart redis'

  - name: 'Remove rpmnew / rpmsave (and Debian equivalents)'
    ansible.builtin.include_role:
      name: 'shared'
      tasks_from: 'remove-rpmnew-rpmsave.yml'
    vars:
      shared__remove_rpmnew_rpmsave_config_file: '{{ __redis__config_dir }}/{{ __redis__config_file }}'

  - name: 'mkdir -p /etc/systemd/system/{{ __redis__service_name }}.d/'
    ansible.builtin.file:
      path: '/etc/systemd/system/{{ __redis__service_name }}.d/'
      state: 'directory'

  - name: 'Deploy /etc/systemd/system/{{ __redis__service_name }}.d/z00-linuxfabrik.conf.j2'
    ansible.builtin.template:
      backup: true
      src: 'etc/systemd/system/redis.service.d/z00-linuxfabrik.conf.j2'
      dest: '/etc/systemd/system/{{ __redis__service_name }}.d/z00-linuxfabrik.conf'
      owner: 'root'
      group: 'root'
      mode: 0o644

  tags:
    - 'redis'


- block:

  - name: 'systemctl {{ redis__service_enabled | bool | ternary("enable", "disable") }} {{ __redis__service_name }}'
    ansible.builtin.systemd:
      name: '{{ __redis__service_name }}'
      enabled: '{{ redis__service_enabled }}'
      daemon_reload: true

  - name: 'systemctl {{ redis__service_state | regex_replace("p?ed$", "") }} {{ __redis__service_name }}'
    ansible.builtin.systemd:
      name: '{{ __redis__service_name }}'
      state: '{{ redis__service_state }}'
    register: '__redis__service_state_result'

  tags:
    - 'redis'
    - 'redis:state'
