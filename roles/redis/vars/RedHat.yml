__redis__conf_logfile: '/var/log/redis/redis.log'
__redis__conf_unixsocket: '/run/redis/redis.sock'
__redis__config_dir: '/etc/redis'
__redis__config_file: 'redis.conf'
# The package's tmpfiles.d rule (Z /etc/redis ~0750 redis root) resets the ownership to this on
# every boot and every systemd-tmpfiles run, so the role keeps it rather than fighting it.
__redis__config_file_group: 'root'
__redis__config_file_owner: 'redis'
__redis__data_dir: '/var/lib/redis'
__redis__module_dir: '/etc/redis/modules'
__redis__package: 'redis'
__redis__runtime_dir: '/var/run/redis'

__redis__service_name: 'redis.service'
