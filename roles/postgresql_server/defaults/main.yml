postgresql_server__conf_listen_addresses:
  - 'localhost'
postgresql_server__conf_max_connections: 100
postgresql_server__conf_password_encryption: 'scram-sha-256'
postgresql_server__conf_port: 5432
postgresql_server__databases__combined_var: '{{ (
      postgresql_server__databases__role_var +
      postgresql_server__databases__dependent_var +
      postgresql_server__databases__group_var +
      postgresql_server__databases__host_var
    ) | linuxfabrik.lfops.combine_lod
  }}'

postgresql_server__databases__dependent_var: []
postgresql_server__databases__group_var: []
postgresql_server__databases__host_var: []
postgresql_server__databases__role_var: []
postgresql_server__dump_directory: '/backup/postgresql-dump'
postgresql_server__dump_on_calendar: '*-*-* 21:{{ 59 | random(start=0, seed=inventory_hostname) }}:00'
postgresql_server__enabled: true
# pg_hba.conf is split by connection kind because a `local` record has no address. A `local`
# record only matches Unix-socket connections and a `host*` record only TCP connections
# (check_hba() in src/backend/libpq/hba.c), so rendering all local records before all host
# records does not change which record a connection matches.
# `type` is part of the host key because `host` matches the same TCP connection as `hostssl` or
# `hostnossl`.
postgresql_server__pg_hba_host_entries__combined_var: '{{ (
      postgresql_server__pg_hba_host_entries__role_var +
      postgresql_server__pg_hba_host_entries__dependent_var +
      postgresql_server__pg_hba_host_entries__group_var +
      postgresql_server__pg_hba_host_entries__host_var
    ) | linuxfabrik.lfops.combine_lod(unique_key=["type", "database", "user", "address"])
  }}'
postgresql_server__pg_hba_host_entries__dependent_var: []
postgresql_server__pg_hba_host_entries__group_var: []
postgresql_server__pg_hba_host_entries__host_var: []
postgresql_server__pg_hba_host_entries__role_var:
  - type: 'host'
    database: 'all'
    user: 'all'
    address: '127.0.0.1/32'
    auth_method: 'scram-sha-256'
  # `localhost` also resolves to ::1, and libpq does not fall back to 127.0.0.1 when the server
  # rejects the connection on ::1 (connection_failed() in src/interfaces/libpq/fe-connect.c).
  - type: 'host'
    database: 'all'
    user: 'all'
    address: '::1/128'
    auth_method: 'scram-sha-256'
postgresql_server__pg_hba_local_entries__combined_var: '{{ (
      postgresql_server__pg_hba_local_entries__role_var +
      postgresql_server__pg_hba_local_entries__dependent_var +
      postgresql_server__pg_hba_local_entries__group_var +
      postgresql_server__pg_hba_local_entries__host_var
    ) | linuxfabrik.lfops.combine_lod(unique_key=["database", "user"])
  }}'
postgresql_server__pg_hba_local_entries__dependent_var: []
postgresql_server__pg_hba_local_entries__group_var: []
postgresql_server__pg_hba_local_entries__host_var: []
postgresql_server__pg_hba_local_entries__role_var:
  - database: 'all'
    user: 'postgres'
    auth_method: 'peer'
  - database: 'all'
    user: 'all'
    auth_method: 'scram-sha-256'
postgresql_server__privs__combined_var: '{{ (
      postgresql_server__privs__role_var +
      postgresql_server__privs__dependent_var +
      postgresql_server__privs__group_var +
      postgresql_server__privs__host_var
    ) | linuxfabrik.lfops.combine_lod(unique_key="objs")
  }}'

postgresql_server__privs__dependent_var: []
postgresql_server__privs__group_var: []
postgresql_server__privs__host_var: []
postgresql_server__privs__role_var: []
postgresql_server__state: 'started'
postgresql_server__users__combined_var: '{{ (
      postgresql_server__users__role_var +
      postgresql_server__users__dependent_var +
      postgresql_server__users__group_var +
      postgresql_server__users__host_var
    ) | linuxfabrik.lfops.combine_lod(unique_key="username")
  }}'

postgresql_server__users__dependent_var: []
postgresql_server__users__group_var: []
postgresql_server__users__host_var: []
postgresql_server__users__role_var: []
# -----------------------------------------------------------------------------

postgresql_server__python__modules__dependent_var:
  - name: 'python3-psycopg2'
