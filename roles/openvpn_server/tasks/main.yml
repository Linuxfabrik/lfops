- name: 'Set platform/version specific variables'
  ansible.builtin.import_role:
    name: 'shared'
    tasks_from: 'platform-variables.yml'
  tags:
    - 'always'


- block:

  - name: 'Assert that the platform is supported'
    ansible.builtin.assert:
      that:
        - 'ansible_facts["os_family"] == "RedHat"'
        - 'ansible_facts["distribution_major_version"] in ["8", "9", "10"]'
      fail_msg: 'openvpn_server: {{ ansible_facts["distribution"] }} {{ ansible_facts["distribution_version"] }} is not supported by this role. Supported platforms: RHEL 8, 9 and 10 and their derivatives.'
      quiet: true

  tags:
    # use 'always' so the validation runs even when other roles reference these variables.
    - 'always'


- block:

  - name: 'rpm --query openvpn # version before this run' # noqa command-instead-of-module (package_facts would gather every package)
    ansible.builtin.command: 'rpm --query --queryformat=%{VERSION} openvpn'
    register: '__openvpn_server__version_before_result'
    changed_when: false
    failed_when: false
    check_mode: false # run task even if `--check` is specified

  - block:

    # ansible.builtin.package cannot skip weak dependencies. The Copr packages recommend
    # kmod-ovpn, which pulls DKMS, a compiler and the kernel headers onto the VPN server, and
    # the module stays unused on RHEL anyway (kernel < 6.16, and the SELinux policy denies
    # openvpn_t the generic netlink socket). Verified with OpenVPN 2.7.7 on Rocky 8, 9 and 10.
    # The version specifier upgrades an older OpenVPN to 2.7, without `state: latest`.
    - name: 'dnf install --setopt=install_weak_deps=False "openvpn >= 2.7"'
      ansible.builtin.dnf:
        name: 'openvpn >= 2.7'
        state: 'present'
        install_weak_deps: false
      register: '__openvpn_server__dnf_result'
      retries: 3 # ride out a brief outage of the package repository
      delay: 10

    rescue:

    - name: 'Fail with a hint where to get OpenVPN 2.7'
      ansible.builtin.fail:
        msg: >-
          openvpn_server: The role requires OpenVPN 2.7 or newer, but dnf cannot install it
          ({{ __openvpn_server__dnf_result["msg"] | d("") }}
          {{ __openvpn_server__dnf_result["failures"] | d([]) | join(" ") }}).
          EPEL ships outdated versions on RHEL 8 and 9. Enable the OpenVPN repository with the
          linuxfabrik.lfops.repo_openvpn role, which the openvpn_server playbook runs unless
          openvpn_server__skip_repo_openvpn is set.

  - name: 'rpm --query openvpn # version after this run' # noqa command-instead-of-module (package_facts would gather every package)
    ansible.builtin.command: 'rpm --query --queryformat=%{VERSION} openvpn'
    register: '__openvpn_server__version_result'
    changed_when: false
    failed_when: false # in check mode, a fresh host has no OpenVPN yet
    check_mode: false # run task even if `--check` is specified

  # The package restarts openvpn-server@server.service on its own during an upgrade, but on
  # RHEL 8 it does so with the unit file of the old package. The restart that applies the new
  # unit file and the new configuration drops every client, so it is left to the operator.
  - name: 'Report the OpenVPN upgrade to the operator'
    ansible.builtin.debug:
      msg: '{{ __openvpn_server__upgrade_message }}'
    when: '__openvpn_server__upgraded | bool'

  - name: 'Collect the OpenVPN upgrade message for the end of the play'
    ansible.builtin.set_fact:
      __shared__end_of_play_messages: '{{ __shared__end_of_play_messages | d([]) + [__openvpn_server__upgrade_message] }}'
    when: '__openvpn_server__upgraded | bool'

  # 0750: the daemon drops privileges to the openvpn user (`user openvpn` in server.conf) and
  # reads a client's file from here when that client connects, so the group needs to traverse
  # the directory. Nobody else has any business reading which clients exist.
  - name: 'mkdir /etc/openvpn/ccd'
    ansible.builtin.file:
      path: '/etc/openvpn/ccd'
      state: 'directory'
      owner: 'root'
      group: 'openvpn'
      mode: 0o750

  # the client-config-dir entries get no restart notification: OpenVPN reads the file of a
  # client when that client connects (multi_client_connect_source_ccd() in multi.c), so a
  # changed entry applies on the next connect of that client. Verified against OpenVPN 2.6.
  - name: 'Remove client-configs from /etc/openvpn/ccd'
    ansible.builtin.file:
      path: '/etc/openvpn/ccd/{{ item["name"] }}'
      state: 'absent'
    when:
      - 'item["state"] | d("present") == "absent"'
    loop: '{{ openvpn_server__client_configs }}'

  - name: 'Deploy client-configs to /etc/openvpn/ccd'
    ansible.builtin.template:
      backup: true
      src: 'etc/openvpn/ccd/raw.j2'
      dest: '/etc/openvpn/ccd/{{ item["name"] }}'
      owner: 'root'
      group: 'openvpn'
      mode: 0o640
    when:
      - 'item["state"] | d("present") != "absent"'
    loop: '{{ openvpn_server__client_configs }}'

  - name: 'Deploy /etc/openvpn/server/server.conf'
    ansible.builtin.template:
      backup: true
      src: 'etc/openvpn/server/server.conf.j2'
      dest: '/etc/openvpn/server/server.conf'
      owner: 'root'
      group: 'openvpn'
      mode: 0o640
    notify: 'openvpn_server: restart openvpn-server@server.service'

  - name: 'set "ip forwarding on" in /proc and reload the sysctl file'
    ansible.posix.sysctl:
      name: 'net.ipv4.ip_forward'
      value: 1
      state: 'present'

  - name: 'Deploy /etc/openvpn/server/server.p12'
    ansible.builtin.copy:
      src: '{{ inventory_dir }}/host_vars/{{ inventory_hostname }}/files{{ openvpn_server__pkcs12 }}'
      dest: '{{ openvpn_server__pkcs12 }}'
      mode: 0o400
      owner: 'root'
      group: 'root'
      seuser: 'system_u'
      serole: 'object_r'
      setype: '{{ __openvpn_server__selinux_etc_type }}'
    notify: 'openvpn_server: restart openvpn-server@server.service'
    when:
      - 'not openvpn_server__pkcs12_skip_deploy'

  - name: 'semanage port --add --type openvpn_port_t --proto udp {{ openvpn_server__port }}'
    community.general.seport:
      ports: '{{ openvpn_server__port }}'
      proto: 'udp'
      setype: 'openvpn_port_t'
    when:
      - 'ansible_facts["selinux"]["status"] != "disabled"'

  - name: 'Deploy example client config to /tmp/{{ inventory_hostname }}.conf (on ansible control node)'
    ansible.builtin.template:
      backup: true
      src: 'tmp/client.conf.j2'
      dest: '/tmp/{{ inventory_hostname }}.conf'
      mode: 0o600
    delegate_to: 'localhost'
    become: false
    vars:
      ansible_become: false # noqa var-naming[pattern]
    changed_when: false # not an actual config change to the server

  tags:
    - 'openvpn_server'


- block:

  # the CRL gets no restart notification: OpenVPN stats the file before every TLS negotiation
  # and reloads it when it changed (tls_ctx_reload_crl() in ssl.c), so a revoked certificate
  # takes effect on the next connection attempt. Verified against OpenVPN 2.6.
  - name: 'Deploy /etc/openvpn/server/crl.pem'
    ansible.builtin.copy:
      src: '{{ inventory_dir }}/host_vars/{{ inventory_hostname }}/files{{ openvpn_server__crl_verify }}'
      dest: '{{ openvpn_server__crl_verify }}'
      mode: 0o600
      owner: 'openvpn'
      group: 'openvpn'
      seuser: 'system_u'
      serole: 'object_r'
      setype: '{{ __openvpn_server__selinux_etc_type }}'
    when:
      - 'not openvpn_server__crl_verify_skip_deploy'

  tags:
    - 'openvpn_server'
    - 'openvpn_server:crl'


- block:

  - name: 'systemctl {{ openvpn_server__service_enabled | bool | ternary("enable", "disable") }} openvpn-server@server.service'
    ansible.builtin.service:
      name: 'openvpn-server@server.service'
      enabled: '{{ openvpn_server__service_enabled | bool }}'

  - name: 'systemctl {{ openvpn_server__service_state | regex_replace("p?ed$", "") }} openvpn-server@server.service'
    ansible.builtin.service:
      name: 'openvpn-server@server.service'
      state: '{{ openvpn_server__service_state }}'
    register: '__openvpn_server__service_state_result'

  tags:
    - 'openvpn_server'
    - 'openvpn_server:state'
