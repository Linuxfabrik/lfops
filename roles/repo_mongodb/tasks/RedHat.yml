- block:

  - name: 'curl {{ __repo_mongodb__gpg_key_url }} --output /tmp/ansible.RPM-GPG-KEY-MONGODB-{{ repo_mongodb__version }}.asc'
    ansible.builtin.get_url:
      url: '{{ __repo_mongodb__gpg_key_url }}'
      dest: '/tmp/ansible.RPM-GPG-KEY-MONGODB-{{ repo_mongodb__version }}.asc'
      mode: 0o644
    retries: 3 # ride out a brief outage of the download source
    delay: 10
    delegate_to: 'localhost'
    become: false
    vars:
      ansible_become: false # noqa var-naming[pattern]
    changed_when: false # not an actual config change on the server
    check_mode: false # run task even if `--check` is specified

  - name: 'copy /tmp/ansible.RPM-GPG-KEY-MONGODB-{{ repo_mongodb__version }}.asc to remote host'
    ansible.builtin.copy:
      src: '/tmp/ansible.RPM-GPG-KEY-MONGODB-{{ repo_mongodb__version }}.asc'
      dest: '/etc/pki/rpm-gpg/RPM-GPG-KEY-MONGODB.asc'
      mode: 0o644

  # https://www.mongodb.com/docs/manual/tutorial/install-mongodb-on-red-hat/#install-mongodb-community-edition
  - name: 'deploy the MongoDB repo (mirror: {{ repo_mongodb__mirror_url }})'
    ansible.builtin.template:
      backup: true
      src: 'etc/yum.repos.d/mongodb-org.repo.j2'
      dest: '/etc/yum.repos.d/mongodb-org.repo'
      owner: 'root'
      group: 'root'
      # 0600 while the file carries the mirror credentials
      mode: '{{ "0o600" if repo_mongodb__basic_auth_login | default({}) | length > 0 else "0o644" }}'

  - name: 'Remove rpmnew / rpmsave (and Debian equivalents)'
    ansible.builtin.include_role:
      name: 'shared'
      tasks_from: 'remove-rpmnew-rpmsave.yml'
    vars:
      shared__remove_rpmnew_rpmsave_config_file: '/etc/yum.repos.d/mongodb-org.repo'

  tags:
    - 'repo_mongodb'
