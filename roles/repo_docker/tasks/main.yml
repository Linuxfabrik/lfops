- block:

  # https://docs.docker.com/engine/install/centos/
  - name: 'deploy the Docker CE repo (mirror: {{ repo_docker__mirror_url }})'
    ansible.builtin.template:
      backup: true
      src: 'etc/yum.repos.d/docker-ce.repo.j2'
      dest: '/etc/yum.repos.d/docker-ce.repo'
      owner: 'root'
      group: 'root'
      # 0600 while the file carries the mirror credentials
      mode: '{{ "0o600" if repo_docker__basic_auth_login | default({}) | length > 0 else "0o644" }}'

  - name: 'Remove rpmnew / rpmsave (and Debian equivalents)'
    ansible.builtin.include_role:
      name: 'shared'
      tasks_from: 'remove-rpmnew-rpmsave.yml'
    vars:
      shared__remove_rpmnew_rpmsave_config_file: '/etc/yum.repos.d/docker-ce.repo'

  tags:
    - 'repo_docker'
