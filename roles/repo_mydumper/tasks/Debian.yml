- block:

  # https://mydumper.github.io/mydumper/docs/html/installing.html
  - name: 'curl https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x1D357EA7D10C9320371BDD0279EA15C0E82E34BA&exact=on --output /tmp/ansible.mydumper.asc'
    ansible.builtin.get_url:
      url: 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x1D357EA7D10C9320371BDD0279EA15C0E82E34BA&exact=on'
      dest: '/tmp/ansible.mydumper.asc'
      mode: 0o644
    retries: 3 # ride out a brief outage of the download source
    delay: 10
    delegate_to: 'localhost'
    become: false
    vars:
      ansible_become: false # noqa var-naming[pattern]
    changed_when: false # not an actual config change on the server
    check_mode: false # run task even if `--check` is specified

  # keyserver.ubuntu.com answers from several servers, which put the optional armor headers
  # `Comment:` and `Version:` in a different order. Without them the key is the same on every
  # download, so the file only changes with the key. Verified with rpm 4.14 on Rocky 8, rpm
  # 4.19 on Rocky 10 and gpg 2.4.7 on Debian 13.
  - name: 'copy /tmp/ansible.mydumper.asc to remote host'
    ansible.builtin.copy:
      content: '{{ lookup("ansible.builtin.file", "/tmp/ansible.mydumper.asc", rstrip=false) | regex_replace("(?m)^(Comment|Version): .*\n", "") }}'
      dest: '/etc/apt/keyrings/mydumper.asc'
      owner: 'root'
      group: 'root'
      mode: 0o644

  - name: 'deploy the repo file (mirror: {{ repo_mydumper__mirror_url | default("") }})'
    ansible.builtin.template:
      backup: true
      src: 'etc/apt/sources.list.d/mydumper.list.j2'
      dest: '/etc/apt/sources.list.d/mydumper.list'
      owner: 'root'
      group: 'root'
      mode: 0o644

  - name: 'apt update # update the cache'
    ansible.builtin.apt:
      update_cache: true
    retries: 3 # ride out a brief outage of the package repository
    delay: 10
    changed_when: false # refreshing the package cache is not a config change

  tags:
    - 'repo_mydumper'
