# now() returns a naive datetime in the controller's local time, so a %z in its fmt stays empty;
# astimezone() adds the controller's UTC offset. Verified with ansible-core 2.16 and 2.22.
- name: 'Log END to /var/log/linuxfabrik-lfops.log'
  ansible.builtin.lineinfile:
    path: '/var/log/linuxfabrik-lfops.log'
    line: '{{ now().astimezone().isoformat(timespec="microseconds") }} - {{ ansible_play_name }}: END'
    create: true
    owner: 'root'
    group: 'root'
    mode: 0o644
  when:
    - 'ansible_facts["os_family"] != "Windows"'
    - 'not ansible_check_mode'
  changed_when: false
