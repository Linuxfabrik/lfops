- name: 'Translate shared__monitoring_plugins_repo_version'
  ansible.builtin.set_fact:
    __shared__monitoring_plugins_version: >-
      {{ 'main' if shared__monitoring_plugins_version == 'dev'
         else shared__monitoring_plugins_version if shared__monitoring_plugins_version.startswith('v')
         else 'v' ~ shared__monitoring_plugins_version
      }}
    __shared__monitoring_plugins_repo_dest: '{{ shared__monitoring_plugins_repo_dest | d("/tmp/ansible.monitoring-plugins-repo") }}'
    # A caller that passes a directory of its own names it after the state it wants, a tag or a
    # resolved commit of main, so a checkout found there is final, and every further host uses
    # it without asking GitHub. The shared default directory is brought up to date on every call.
    __shared__monitoring_plugins_repo_update: '{{ shared__monitoring_plugins_repo_dest is not defined }}'


- block:

  - name: 'Clone the monitoring plugins git repo to localhost (version: {{ __shared__monitoring_plugins_version }})'
    ansible.builtin.git:
      repo: 'https://github.com/Linuxfabrik/monitoring-plugins.git'
      dest: '{{ __shared__monitoring_plugins_repo_dest }}'
      version: '{{ __shared__monitoring_plugins_version }}'
      depth: 1
      update: '{{ __shared__monitoring_plugins_repo_update | bool }}'
    retries: 3 # ride out a brief outage of the download source
    delay: 10
    delegate_to: 'localhost'
    become: false
    vars:
      ansible_become: false # noqa var-naming[pattern]
    throttle: 1 # serialize: shared git working dir on the controller, avoid races between hosts
    check_mode: false # run task even if `--check` is specified

  rescue:

    - name: 'Remove the old repo and clone again'
      ansible.builtin.file:
        path: '{{ __shared__monitoring_plugins_repo_dest }}'
        state: 'absent'
      delegate_to: 'localhost'
      become: false
      vars:
        ansible_become: false # noqa var-naming[pattern]
      throttle: 1 # serialize: shared git working dir on the controller, avoid races between hosts
      changed_when: false # no change on the remote host

    - name: 'Clone the monitoring plugins git repo to localhost (version: {{ __shared__monitoring_plugins_version }})'
      ansible.builtin.git:
        repo: 'https://github.com/Linuxfabrik/monitoring-plugins.git'
        dest: '{{ __shared__monitoring_plugins_repo_dest }}'
        version: '{{ __shared__monitoring_plugins_version }}'
        depth: 1
      retries: 3 # ride out a brief outage of the download source
      delay: 10
      delegate_to: 'localhost'
      become: false
      vars:
        ansible_become: false # noqa var-naming[pattern]
      throttle: 1 # serialize: shared git working dir on the controller, avoid races between hosts
      check_mode: false # run task even if `--check` is specified
