- name: 'Translate shared__lib_version'
  ansible.builtin.set_fact:
    __shared__lib_version: >-
      {{ 'main' if shared__lib_version == 'dev'
         else shared__lib_version if shared__lib_version.startswith('v')
         else 'v' ~ shared__lib_version
      }}
    __shared__lib_repo_dest: '{{ shared__lib_repo_dest | d("/tmp/ansible.lib-repo") }}'
    # see clone-monitoring-plugins-repo.yml
    __shared__lib_repo_update: '{{ shared__lib_repo_dest is not defined }}'


- block:

  - name: 'Clone the lib git repo to localhost (version: {{ __shared__lib_version }})'
    ansible.builtin.git:
      repo: 'https://github.com/Linuxfabrik/lib.git'
      dest: '{{ __shared__lib_repo_dest }}'
      version: '{{ __shared__lib_version }}'
      depth: 1
      update: '{{ __shared__lib_repo_update | bool }}'
    retries: 3 # ride out a brief outage of the download source
    delay: 10
    delegate_to: 'localhost'
    become: false
    vars:
      ansible_become: false # noqa var-naming[pattern]
    throttle: 1 # serialize: shared git working dir on the controller, avoid races between hosts
    check_mode: false # run task even if `--check` is specified

  rescue:

    - name: 'Remove the old repo and clone again'
      ansible.builtin.file:
        path: '{{ __shared__lib_repo_dest }}'
        state: 'absent'
      delegate_to: 'localhost'
      become: false
      vars:
        ansible_become: false # noqa var-naming[pattern]
      throttle: 1 # serialize: shared git working dir on the controller, avoid races between hosts
      changed_when: false # no change on the remote host

    - name: 'Clone the lib git repo to localhost (version: {{ __shared__lib_version }})'
      ansible.builtin.git:
        repo: 'https://github.com/Linuxfabrik/lib.git'
        dest: '{{ __shared__lib_repo_dest }}'
        version: '{{ __shared__lib_version }}'
        depth: 1
      retries: 3 # ride out a brief outage of the download source
      delay: 10
      delegate_to: 'localhost'
      become: false
      vars:
        ansible_become: false # noqa var-naming[pattern]
      throttle: 1 # serialize: shared git working dir on the controller, avoid races between hosts
      check_mode: false # run task even if `--check` is specified
