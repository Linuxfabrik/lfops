- name: 'Set platform/version specific variables'
  ansible.builtin.import_role:
    name: 'shared'
    tasks_from: 'platform-variables.yml'
  tags:
    - 'always'


- block:

  - ansible.builtin.debug:
      msg:
        - 'Combined sysctl:'
        - '{{ kernel_settings__sysctl__combined_var }}'
        - 'Combined sysfs:'
        - '{{ kernel_settings__sysfs__combined_var }}'
        - 'Combined systemd_cpu_affinity: {{ kernel_settings__systemd_cpu_affinity__combined_var }}'
        - 'Combined transparent_hugepages: {{ kernel_settings__transparent_hugepages__combined_var }}'
        - 'Combined transparent_hugepages_defrag: {{ kernel_settings__transparent_hugepages_defrag__combined_var }}'

  # fedora.linux_system_roles.kernel_settings merges the given sysctls into the profile it wrote
  # before (kernel_settings_purge is false), so the profile keeps the settings of earlier runs of
  # other playbooks, e.g. the sunrpc.* setting of mariadb_server, and `tuned-adm verify` checks
  # them in every run. Verified with fedora.linux_system_roles 1.121.0
  # (roles/kernel_settings/tasks/main.yml). Depending on the TuneD release, that role writes the
  # profile below /etc/tuned or /etc/tuned/profiles. grep exits with 2 for the path that does not
  # exist, so only its output counts.
  - name: 'grep sunrpc.* in the TuneD profile of fedora.linux_system_roles.kernel_settings'
    ansible.builtin.command: >-
      grep --no-filename --no-messages --only-matching --extended-regexp '^sunrpc\.[^ =]+'
      /etc/tuned/kernel_settings/tuned.conf /etc/tuned/profiles/kernel_settings/tuned.conf
    register: '__kernel_settings__profile_sunrpc_result'
    changed_when: false # read-only command, never changes anything
    failed_when: false # see above
    check_mode: false # also run in check mode

  # prevent errors like "Failed to read sysctl parameter 'sunrpc.tcp_slot_table_entries', the parameter does not exist" on RHEL.
  # persistent, because nothing else loads sunrpc on a host without NFS: after a reboot, TuneD could
  # not apply the setting and `tuned-adm verify` failed until the next run of this role.
  # `persistent` writes /etc/modules-load.d/sunrpc.conf (community.general >= 7.0.0).
  - name: 'modprobe sunrpc'
    community.general.modprobe:
      name: 'sunrpc'
      persistent: 'present'
      state: 'present'
    register: '__kernel_settings__modprobe_sunrpc_result'
    when: '__kernel_settings__sunrpc_names | length > 0'
    vars:
      # the sunrpc.* keys the profile will hold after this run: those of this run and those the
      # profile already has, minus the ones this run removes
      __kernel_settings__sunrpc_names: '{{
          (kernel_settings__sysctl__combined_var | selectattr("name", "match", "^sunrpc\.") | map(attribute="name") | list
            + __kernel_settings__profile_sunrpc_result["stdout_lines"])
          | unique
          | difference(kernel_settings__sysctl__combined_var | selectattr("state", "defined") | selectattr("state", "eq", "absent") | map(attribute="name") | list)
        }}'

  # The sunrpc.* setting is already in the profile, but the module was missing, so TuneD could
  # not apply it. fedora.linux_system_roles.kernel_settings only applies the profile when the
  # profile changes, which it does not here, so `tuned-adm verify` would keep failing. A task and
  # not a handler, since the verification inside that role runs before any handler would.
  - name: 'systemctl restart tuned.service'
    ansible.builtin.service:
      name: 'tuned.service'
      state: 'restarted'
    when:
      - '__kernel_settings__modprobe_sunrpc_result is changed'
      - '__kernel_settings__profile_sunrpc_result["stdout_lines"] | length > 0'

  # fedora.linux_system_roles >= 2.5.0 accepts only null (leave the setting alone) for an unset
  # value and rejects the empty string our defaults carry, while a template cannot hand a role a
  # null (`{{ none }}` and `omit` arrive as strings, verified with ansible-core 2.16 and 2.18).
  # So pass a value only if it is set; otherwise the null from the role's own defaults applies.
  # Older versions treat both alike.
  - name: 'Pass systemd_cpu_affinity to the kernel_settings role if it is set'
    ansible.builtin.set_fact:
      kernel_settings_systemd_cpu_affinity: '{{ kernel_settings__systemd_cpu_affinity__combined_var }}' # noqa var-naming[pattern]
    when: 'kernel_settings__systemd_cpu_affinity__combined_var | string | length > 0'

  - name: 'Pass transparent_hugepages to the kernel_settings role if it is set'
    ansible.builtin.set_fact:
      kernel_settings_transparent_hugepages: '{{ kernel_settings__transparent_hugepages__combined_var }}' # noqa var-naming[pattern]
    when: 'kernel_settings__transparent_hugepages__combined_var | string | length > 0'

  - name: 'Pass transparent_hugepages_defrag to the kernel_settings role if it is set'
    ansible.builtin.set_fact:
      kernel_settings_transparent_hugepages_defrag: '{{ kernel_settings__transparent_hugepages_defrag__combined_var }}' # noqa var-naming[pattern]
    when: 'kernel_settings__transparent_hugepages_defrag__combined_var | string | length > 0'

  - name: 'Use fedora.linux_system_roles.kernel_settings role to configure the kernel settings'
    ansible.builtin.include_role:
      name: 'fedora.linux_system_roles.kernel_settings'
    vars:
      kernel_settings_sysctl: '{{ kernel_settings__sysctl__combined_var }}' # noqa var-naming[pattern]
      kernel_settings_sysfs: '{{ kernel_settings__sysfs__combined_var }}' # noqa var-naming[pattern]

  tags:
    - 'kernel_settings'
