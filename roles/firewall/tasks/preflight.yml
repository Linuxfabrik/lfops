# Checks that need nothing changed on the host and abort before the role stops any firewall.
# Imported at the top of tasks/main.yml, and included by playbooks that run many roles (e.g.
# setup_basic) in their pre_tasks, so a missing prerequisite aborts the run before any role
# changes the host.
#
# Validated before any firewall is stopped: without /etc/fwb.sh, fwb.service fails right after
# `systemctl start` (Type=simple, status=203/EXEC), and the host would end up with no firewall at
# all. The same applies to a repository in firewall__fwbuilder_repo_url that has no compiled file
# for this host, so it is cloned and checked here, before the block that stops the firewalls.
- block:

  - name: 'stat /etc/fwb.sh'
    ansible.builtin.stat:
      path: '/etc/fwb.sh'
    register: '__firewall__fwb_sh_stat_result'

  - name: 'Assert that there is an /etc/fwb.sh for fwb.service to run'
    ansible.builtin.assert:
      that:
        - '__firewall__fwb_sh_stat_result["stat"]["exists"] | bool'
      quiet: true
      fail_msg: >-
        firewall__firewall is 'fwbuilder', but there is no /etc/fwb.sh, so the host would run
        without a firewall. Deploy /etc/fwb.sh, set firewall__fwbuilder_repo_url, or set
        firewall__firewall to the firewall this host uses.

  when:
    - 'firewall__firewall == "fwbuilder"'
    - 'firewall__fwbuilder_repo_url is not defined or firewall__fwbuilder_repo_url | length == 0'
  tags:
    - 'firewall'
    - 'firewall:deploy_fwb_sh'


# One clone per repository, in a directory named after its URL, so hosts whose firewall files live
# in different repositories each deploy their own. The first host clones; the others sharing the
# URL fetch into the same directory, and `force` resets it to the newest commit, also after a
# force push. Verified with ansible-core 2.16 against a local repository.
- block:

  - name: 'Clone the fwb git repo to localhost' # noqa latest[git] the newest compiled firewall is what is deployed
    ansible.builtin.git:
      repo: '{{ firewall__fwbuilder_repo_url }}'
      dest: '{{ __firewall__fwbuilder_repo_dir }}'
      depth: 1
      single_branch: true
      force: true
    retries: 3 # ride out a brief outage of the download source
    delay: 10
    changed_when: false # not a config change on the server
    delegate_to: 'localhost'
    become: false
    vars:
      ansible_become: false # noqa var-naming[pattern]
    throttle: 1 # serialize: shared git working dir on the controller, avoid races between hosts
    check_mode: false # run task even if `--check` is specified

  - name: 'Assert that {{ firewall__fwbuilder_repo_url }} has a compiled firewall for this host'
    ansible.builtin.assert:
      that:
        # the parentheses are needed: `is` binds tighter than `~`
        - '(__firewall__fwbuilder_repo_dir ~ "/" ~ firewall__fwbuilder_fw_file ~ ".fw") is file'
      quiet: true
      fail_msg: >-
        There is no {{ firewall__fwbuilder_fw_file }}.fw in {{ firewall__fwbuilder_repo_url }},
        so the host would run without a firewall. Compile the firewall for this host in Firewall
        Builder and push it, or set firewall__fwbuilder_fw_file to the name of the compiled file.

  when:
    - 'firewall__firewall == "fwbuilder"'
    - 'firewall__fwbuilder_repo_url is defined and firewall__fwbuilder_repo_url | length > 0'
  tags:
    - 'firewall'
    - 'firewall:deploy_fwb_sh'
