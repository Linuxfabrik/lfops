# What a FirewallFabrik nftables script (fwf-nft) calls: `nft`, and `ip` for the interface
# addresses and routing rules. iptables-based scripts are not supported.
#
# iptables-nft is not needed by the firewall. Podman (netavark) and docker-ce require `iptables`,
# and on RHEL 9 with EPEL, dnf satisfies that with iptables-legacy. Its rules live in the legacy
# xtables tables, beside the nftables ruleset, and rootless Podman containers then need the
# ip_tables kernel module, which a rootless user may not load. With iptables-nft installed first,
# the requirement is met. On a host that already has iptables-legacy, `iptables` keeps pointing
# to it (alternatives priority) until `dnf swap iptables-legacy iptables-nft`. Verified with
# Rocky 9.9; EPEL 8 and EPEL 10 have no iptables-legacy.
__firewall__fwbuilder_packages:
  - 'iproute'
  - 'iptables-nft'
  - 'nftables'
