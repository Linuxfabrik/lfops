- name: 'postfix: newaliases'
  ansible.builtin.command: '/usr/bin/newaliases'
  changed_when: true # must report changed so the chained reload handler is triggered
  notify: 'postfix: reload postfix'

- name: 'postfix: postmap /etc/postfix/canonical'
  ansible.builtin.command: '/usr/sbin/postmap {{ __postfix__map_type }}:/etc/postfix/canonical'
  changed_when: true # must report changed so the chained reload handler is triggered
  notify: 'postfix: reload postfix'

- name: 'postfix: postmap /etc/postfix/recipient_canonical'
  ansible.builtin.command: '/usr/sbin/postmap {{ __postfix__map_type }}:/etc/postfix/recipient_canonical'
  changed_when: true # must report changed so the chained reload handler is triggered
  notify: 'postfix: reload postfix'

# skip restart if the operator deferred restarts LFOps-wide (lfops__skip_restart_handlers), if
# the service was just started (redundant), or if the user wants it stopped.
# `| bool` is mandatory on the flag: `--extra-vars 'lfops__skip_restart_handlers=false'` passes
# the string "false", which is truthy on its own.
# `is not defined` covers a run that skips the state block (`--skip-tags postfix:state`), where
# the result is never registered.
# this guard is only sound because the state task runs after every task that notifies a handler.
- name: 'postfix: restart postfix'
  ansible.builtin.service:
    name: 'postfix'
    state: 'restarted'
  when:
    - 'not (lfops__skip_restart_handlers | d(false) | bool)'
    - '__postfix__service_state_result is not defined or __postfix__service_state_result is not changed'
    - 'postfix__service_state != "stopped"'

# skip reload if the service was just started (redundant) or if the user wants it stopped.
# __postfix__service_state_result is registered on a dedicated state-only task (not the enabled
# task), so that enabled-only changes don't prevent the reload.
# `is not defined` covers a run that skips the state block (`--skip-tags postfix:state`), where
# the result is never registered.
- name: 'postfix: reload postfix'
  ansible.builtin.systemd:
    name: 'postfix'
    state: 'reloaded'
  when:
    - '__postfix__service_state_result is not defined or __postfix__service_state_result is not changed'
    - 'postfix__service_state != "stopped"'
