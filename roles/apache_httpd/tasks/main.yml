- name: 'Set platform/version specific variables'
  ansible.builtin.import_role:
    name: 'shared'
    tasks_from: 'platform-variables.yml'
  tags:
    - 'always'


- block:

  - name: 'Assert that the OWASP Core Rule Set version is set and supported'
    ansible.builtin.assert:
      that:
        - 'apache_httpd__mod_security_coreruleset_version is defined'
        - 'apache_httpd__mod_security_coreruleset_version in __apache_httpd__mod_security_coreruleset_sha256'
      quiet: true
      fail_msg: >-
        Set `apache_httpd__mod_security_coreruleset_version` to a version this role supports:
        {{ __apache_httpd__mod_security_coreruleset_sha256 | list | join(", ") }}.
        Or set `apache_httpd__skip_mod_security_coreruleset: true`.

  when:
    - 'not apache_httpd__skip_mod_security_coreruleset | bool'
  tags:
    - 'always'


# Manage required system packages (Installation)
- block:

  - name: 'Base Packages:'
    ansible.builtin.debug:
      var: '__apache_httpd__base_packages'

  - name: 'Ensure base packages are in their desired state'
    ansible.builtin.package:
      name: '{{ q("flattened", __apache_httpd__base_packages) }}'
      state: 'present'
    retries: 3 # ride out a brief outage of the package repository
    delay: 10

  - name: 'Combined Packages:'
    ansible.builtin.debug:
      var: 'apache_httpd__packages__combined_var'

  - name: 'Ensure Apache packages/modules are absent'
    ansible.builtin.package:
      name: '{{ apache_httpd__packages__combined_var | selectattr("state", "defined") | selectattr("state", "eq", "absent") | map(attribute="name") }}'
      state: 'absent'

  - name: 'Ensure Apache packages/modules are present'
    ansible.builtin.package:
      name: '{{ (apache_httpd__packages__combined_var | selectattr("state", "defined") | selectattr("state", "ne", "absent") | map(attribute="name"))
          + (apache_httpd__packages__combined_var | selectattr("state", "undefined") | map(attribute="name")) }}'
      state: 'present'
    retries: 3 # ride out a brief outage of the package repository
    delay: 10

  - name: 'mkdir -p {{ __apache_httpd__config_path}}/{conf,mods,sites}-{available,enabled}'
    ansible.builtin.file:
      path: '{{ item }}'
      state: 'directory'
      owner: 'root'
      group: 'root'
      mode: 0o755
    loop:
      - '{{ __apache_httpd__config_path }}/{{ __apache_httpd__config_prefix }}conf-available'
      - '{{ __apache_httpd__config_path }}/{{ __apache_httpd__config_prefix }}conf-enabled'
      - '{{ __apache_httpd__config_path }}/{{ __apache_httpd__config_prefix }}mods-available'
      - '{{ __apache_httpd__config_path }}/{{ __apache_httpd__config_prefix }}mods-enabled'
      - '{{ __apache_httpd__config_path }}/{{ __apache_httpd__config_prefix }}sites-available'
      - '{{ __apache_httpd__config_path }}/{{ __apache_httpd__config_prefix }}sites-enabled'

  - name: 'ln -s {{ __apache_httpd__config_path}}/logs {{ __apache_httpd__log_path }}'
    ansible.builtin.file:
      dest: '{{ __apache_httpd__config_path}}/logs'
      src: '{{ __apache_httpd__log_path }}'
      state: 'link'

  tags:
    - 'apache_httpd'
    - 'apache_httpd:mods'


- block:

  - ansible.builtin.include_tasks: 'mod_security_coreruleset.yml'
  when:
    - 'not apache_httpd__skip_mod_security_coreruleset | bool'

  tags:
    - 'apache_httpd'
    - 'apache_httpd:mod_security_coreruleset'


# Manage global Apache config
- block:

  # Before the role set PidFile, Apache on Debian and Ubuntu wrote its PID to the compiled-in
  # default /run/apache2.pid, where apachectl no longer looks. `apachectl graceful` then takes
  # the server for stopped, tries to start a second one and fails on the bound ports, so such a
  # server has to be restarted once instead of reloaded.
  - name: 'stat /run/apache2.pid'
    ansible.builtin.stat:
      path: '/run/apache2.pid'
    register: '__apache_httpd__legacy_pid_file_result'
    when:
      - 'ansible_facts["os_family"] == "Debian"'

  - name: 'Create or update global Apache configuration {{ __apache_httpd__config_file }}'
    ansible.builtin.template:
      backup: true
      src: 'etc/httpd/conf/httpd.conf.j2'
      dest: '{{ __apache_httpd__config_file }}'
      owner: 'root'
      group: 'root'
      mode: 0o644
    notify:
      - 'apache_httpd: httpd -t; systemctl reload httpd'

  - name: 'Request a restart of {{ __apache_httpd__service_name }}, which runs with the PID file of an earlier role version'
    ansible.builtin.debug:
      msg: '/run/apache2.pid exists, so {{ __apache_httpd__service_name }} is restarted instead of reloaded'
    changed_when: true # notify the restart handler; the reload handler skips this case
    notify:
      - 'apache_httpd: httpd -t; systemctl restart httpd'
    when:
      - '__apache_httpd__legacy_pid_file_result["stat"]["exists"] | d(false)'

  - name: 'Remove rpmnew / rpmsave (and Debian equivalents)'
    ansible.builtin.include_role:
      name: 'shared'
      tasks_from: 'remove-rpmnew-rpmsave.yml'
    vars:
      shared__remove_rpmnew_rpmsave_config_file: '{{ __apache_httpd__config_file }}'

  tags:
    - 'apache_httpd'
    - 'apache_httpd:configure'


- block:

  - ansible.builtin.include_tasks: 'mods.yml'

  tags:
    - 'apache_httpd'
    - 'apache_httpd:mods'


- block:

  - ansible.builtin.include_tasks: 'confs.yml'

  tags:
    - 'apache_httpd'
    - 'apache_httpd:configure'


- block:

  - ansible.builtin.include_tasks: 'htpasswd.yml'

  tags:
    - 'apache_httpd'
    - 'apache_httpd:htpasswd'


# A vHost that references a certificate that does not exist yet keeps httpd from starting, and
# such a certificate is often issued by acme_sh over the port 80 vHost of this very server. A
# self-signed placeholder at the same path lets httpd start, and acme_sh replaces it once the
# certificate is issued. Only missing files are created, an existing certificate is never touched.
- block:

  - name: 'Install openssl to create placeholder certificates'
    ansible.builtin.package:
      name: 'openssl'
      state: 'present'
    retries: 3 # ride out a brief outage of the package repository
    delay: 10

  # only creates a missing directory, so the mode of an existing one such as /etc/ssl/private
  # (0710 root:ssl-cert on Debian) is left alone
  - name: 'mkdir --parents --mode={{ item[1] }} {{ item[0] }}'
    ansible.builtin.command:
      cmd: 'mkdir --parents --mode={{ item[1] }} {{ item[0] }}'
      creates: '{{ item[0] }}'
    loop: '{{ ((apache_httpd__placeholder_certificates__combined_var | map(attribute="cert_path") | product(["0755"]) | list)
        + (apache_httpd__placeholder_certificates__combined_var | map(attribute="key_path") | product(["0700"]) | list))
        | unique }}'

  # openssl writes the key with mode 0600 (verified with OpenSSL 1.1.1 on RHEL 8)
  - name: 'openssl req -x509 -newkey ec -subj /CN=... -keyout <name>.key -out <name>.crt'
    ansible.builtin.command:
      cmd: >-
        openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 365
        -subj '/CN={{ item["name"] }}'
        -keyout '{{ item["key_path"] }}/{{ item["name"] }}.key'
        -out '{{ item["cert_path"] }}/{{ item["name"] }}.crt'
      creates: '{{ item["cert_path"] }}/{{ item["name"] }}.crt'
    loop: '{{ apache_httpd__placeholder_certificates__combined_var }}'
    loop_control:
      label: '{{ item["name"] }}'
    when:
      - 'item["state"] | d("present") != "absent"'

  # a self-signed certificate is its own chain
  - name: 'cp <name>.crt <name>{{ item[1] }}.crt'
    ansible.builtin.command:
      cmd: >-
        cp
        '{{ item[0]["cert_path"] }}/{{ item[0]["name"] }}.crt'
        '{{ item[0]["cert_path"] }}/{{ item[0]["name"] }}{{ item[1] }}.crt'
      creates: '{{ item[0]["cert_path"] }}/{{ item[0]["name"] }}{{ item[1] }}.crt'
    loop: '{{ apache_httpd__placeholder_certificates__combined_var | product(["-chain", "-fullchain"]) | list }}'
    loop_control:
      label: '{{ item[0]["name"] }}{{ item[1] }}'
    when:
      - 'item[0]["state"] | d("present") != "absent"'

  when:
    - 'apache_httpd__placeholder_certificates__combined_var | map(attribute="state", default="present") | select("ne", "absent") | list | length > 0'
  tags:
    - 'apache_httpd'
    - 'apache_httpd:certs'
    - 'apache_httpd:vhosts'


- block:

  - ansible.builtin.include_tasks: 'vhosts.yml'

  tags:
    - 'apache_httpd'
    - 'apache_httpd:vhosts'


- block:

  - name: 'chmod -R g-w {{ __apache_httpd__config_path }} # enhance security a little bit'
    ansible.builtin.file:
      path: '{{ __apache_httpd__config_path }}'
      mode: 'g-w'
      recurse: true

  tags:
    - 'apache_httpd'


# Manage Systemd start and enable
- block:

  - name: 'mkdir -p /etc/systemd/system/{{ __apache_httpd__service_name }}.service.d/'
    ansible.builtin.file:
      path: '/etc/systemd/system/{{ __apache_httpd__service_name }}.service.d/'
      owner: 'root'
      group: 'root'
      mode: 0o755
      state: 'directory'

  # Apache's own shutdown escalation ends in a SIGKILL for children that do not exit, but the
  # parent waits for that escalation to finish. Bounding systemd's patience is what actually
  # shortens a restart on a host with long-lived proxied connections.
  - name: 'Deploy /etc/systemd/system/{{ __apache_httpd__service_name }}.service.d/z00-timeout.conf'
    ansible.builtin.template:
      backup: true
      src: 'etc/systemd/system/z00-timeout.conf.j2'
      dest: '/etc/systemd/system/{{ __apache_httpd__service_name }}.service.d/z00-timeout.conf'
      owner: 'root'
      group: 'root'
      mode: 0o644
    register: '__apache_httpd__z00_timeout_result'

  - name: 'systemctl daemon-reload' # noqa no-handler would require flush_handlers here anyway
    ansible.builtin.systemd:
      daemon_reload: true
    when: '__apache_httpd__z00_timeout_result is changed'

  - name: 'systemctl {{ apache_httpd__systemd_enabled | bool | ternary("enable", "disable") }} {{ __apache_httpd__service_name }}'
    ansible.builtin.systemd:
      name: '{{ __apache_httpd__service_name }}'
      enabled: '{{ apache_httpd__systemd_enabled }}'
    ignore_errors: "{{ ansible_check_mode }}" # ignore errors if `--check` is specified

  - name: 'systemctl {{ apache_httpd__systemd_state | regex_replace("p?ed$", "") }} {{ __apache_httpd__service_name }}'
    ansible.builtin.systemd:
      name: '{{ __apache_httpd__service_name }}'
      state: '{{ apache_httpd__systemd_state }}'
    register: '__apache_httpd__service_state_result'
    ignore_errors: "{{ ansible_check_mode }}" # ignore errors if `--check` is specified

  tags:
    - 'apache_httpd'
    - 'apache_httpd:state'
