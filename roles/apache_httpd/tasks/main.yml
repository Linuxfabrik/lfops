- name: 'Set platform/version specific variables'
  ansible.builtin.import_role:
    name: 'shared'
    tasks_from: 'platform-variables.yml'
  tags:
    - 'apache_httpd'
    - 'apache_httpd:configure'
    - 'apache_httpd:htpasswd'
    - 'apache_httpd:mod_security_coreruleset'
    - 'apache_httpd:mods'
    - 'apache_httpd:state'
    - 'apache_httpd:vhosts'


# Manage required system packages (Installation)
- block:

  - name: 'Base Packages:'
    ansible.builtin.debug:
      var: '__apache_httpd__base_packages'

  - name: 'Ensure base packages are in their desired state'
    ansible.builtin.package:
      name: '{{ q("flattened", __apache_httpd__base_packages) }}'
      state: 'present'

  - name: 'Combined Packages:'
    ansible.builtin.debug:
      var: 'apache_httpd__packages__combined_var'

  - name: 'Ensure Apache packages/modules are absent'
    ansible.builtin.package:
      name: '{{ apache_httpd__packages__combined_var | selectattr("state", "defined") | selectattr("state", "eq", "absent") | map(attribute="name") }}'
      state: 'absent'

  - name: 'Ensure Apache packages/modules are present'
    ansible.builtin.package:
      name: '{{ (apache_httpd__packages__combined_var | selectattr("state", "defined") | selectattr("state", "ne", "absent") | map(attribute="name"))
          + (apache_httpd__packages__combined_var | selectattr("state", "undefined") | map(attribute="name")) }}'
      state: 'present'

  - name: 'mkdir -p {{ __apache_httpd__config_path}}/{conf,mods,sites}-{available,enabled}'
    ansible.builtin.file:
      path: '{{ item }}'
      state: 'directory'
      owner: 'root'
      group: 'root'
      mode: 0o755
    loop:
      - '{{ __apache_httpd__config_path }}/{{ __apache_httpd__config_prefix }}conf-available'
      - '{{ __apache_httpd__config_path }}/{{ __apache_httpd__config_prefix }}conf-enabled'
      - '{{ __apache_httpd__config_path }}/{{ __apache_httpd__config_prefix }}mods-available'
      - '{{ __apache_httpd__config_path }}/{{ __apache_httpd__config_prefix }}mods-enabled'
      - '{{ __apache_httpd__config_path }}/{{ __apache_httpd__config_prefix }}sites-available'
      - '{{ __apache_httpd__config_path }}/{{ __apache_httpd__config_prefix }}sites-enabled'

  - name: 'ln -s {{ __apache_httpd__config_path}}/logs {{ __apache_httpd__log_path }}'
    ansible.builtin.file:
      dest: '{{ __apache_httpd__config_path}}/logs'
      src: '{{ __apache_httpd__log_path }}'
      state: 'link'

  tags:
    - 'apache_httpd'
    - 'apache_httpd:mods'


- block:

  - ansible.builtin.include_tasks: 'mod_security_coreruleset.yml'
  when:
    - 'not apache_httpd__skip_mod_security_coreruleset'

  tags:
    - 'apache_httpd'
    - 'apache_httpd:mod_security_coreruleset'


# Manage global Apache config
- block:

  - name: 'Create or update global Apache configuration {{ __apache_httpd__config_file }}'
    ansible.builtin.template:
      backup: true
      src: 'etc/httpd/conf/httpd.conf.j2'
      dest: '{{ __apache_httpd__config_file }}'
      owner: 'root'
      group: 'root'
      mode: 0o644
    notify:
      - 'apache_httpd: httpd -t; systemctl reload httpd'

  - name: 'Remove rpmnew / rpmsave (and Debian equivalents)'
    ansible.builtin.include_role:
      name: 'shared'
      tasks_from: 'remove-rpmnew-rpmsave.yml'
    vars:
      shared__remove_rpmnew_rpmsave_config_file: '{{ __apache_httpd__config_file }}'

  tags:
    - 'apache_httpd'
    - 'apache_httpd:configure'


- block:

  - ansible.builtin.include_tasks: 'mods.yml'

  tags:
    - 'apache_httpd'
    - 'apache_httpd:mods'


- block:

  - ansible.builtin.include_tasks: 'confs.yml'

  tags:
    - 'apache_httpd'
    - 'apache_httpd:configure'


- block:

  - ansible.builtin.include_tasks: 'htpasswd.yml'

  tags:
    - 'apache_httpd'
    - 'apache_httpd:htpasswd'


- block:

  - ansible.builtin.include_tasks: 'vhosts.yml'

  tags:
    - 'apache_httpd'
    - 'apache_httpd:vhosts'


- block:

  - name: 'chmod -R g-w {{ __apache_httpd__config_path }} # enhance security a little bit'
    ansible.builtin.file:
      path: '{{ __apache_httpd__config_path }}'
      mode: 'g-w'
      recurse: true

  - name: 'chown -R apache:apache {{ apache_httpd__conf_document_root }}'
    ansible.builtin.file:
      path: '{{ apache_httpd__conf_document_root }}'
      owner: '{{ __shared__apache_httpd_user }}'
      group: '{{ __shared__apache_httpd_group }}'
      recurse: true
    ignore_errors: true
    when: 'not apache_httpd__skip_document_root_chown'

  tags:
    - 'apache_httpd'


# Manage Systemd start and enable
- block:

  - name: 'mkdir -p /etc/systemd/system/{{ __apache_httpd__service_name }}.service.d/'
    ansible.builtin.file:
      path: '/etc/systemd/system/{{ __apache_httpd__service_name }}.service.d/'
      owner: 'root'
      group: 'root'
      mode: 0o755
      state: 'directory'

  # Apache's own shutdown escalation ends in a SIGKILL for children that do not exit, but the
  # parent waits for that escalation to finish. Bounding systemd's patience is what actually
  # shortens a restart on a host with long-lived proxied connections.
  - name: 'Deploy /etc/systemd/system/{{ __apache_httpd__service_name }}.service.d/z00-timeout.conf'
    ansible.builtin.template:
      backup: true
      src: 'etc/systemd/system/z00-timeout.conf.j2'
      dest: '/etc/systemd/system/{{ __apache_httpd__service_name }}.service.d/z00-timeout.conf'
      owner: 'root'
      group: 'root'
      mode: 0o644
    register: '__apache_httpd__z00_timeout_result'

  - name: 'systemctl daemon-reload' # noqa no-handler would require flush_handlers here anyway
    ansible.builtin.systemd:
      daemon_reload: true
    when: '__apache_httpd__z00_timeout_result is changed'

  - name: 'systemctl {{ apache_httpd__systemd_enabled | bool | ternary("enable", "disable") }} {{ __apache_httpd__service_name }}'
    ansible.builtin.systemd:
      name: '{{ __apache_httpd__service_name }}'
      enabled: '{{ apache_httpd__systemd_enabled }}'
    ignore_errors: "{{ ansible_check_mode }}" # ignore errors if `--check` is specified

  - name: 'systemctl {{ apache_httpd__systemd_state | regex_replace("p?ed$", "") }} {{ __apache_httpd__service_name }}'
    ansible.builtin.systemd:
      name: '{{ __apache_httpd__service_name }}'
      state: '{{ apache_httpd__systemd_state }}'
    register: '__apache_httpd__service_state_result'
    ignore_errors: "{{ ansible_check_mode }}" # ignore errors if `--check` is specified

  tags:
    - 'apache_httpd'
    - 'apache_httpd:state'
