# Manage OWASP ModSecurity Core Rule Set (CRS), https://coreruleset.org/docs/deployment/install/

- name: 'Get the list of installed packages'
  ansible.builtin.package_facts:  # yamllint disable-line rule:empty-values
  check_mode: false # run task even if `--check` is specified

# CRS 4 references the MULTIPART_PART_HEADERS collection, which ModSecurity 2.9.6 introduced.
# ModSecurity 2.9.5 rejects the rule files with "Unknown variable: &MULTIPART_PART_HEADERS", so
# Apache would refuse to start or reload once the rules are included. Verified with CRS 4.27.0 and
# 4.30.0 against mod_security 2.9.5-1 on Ubuntu 22.04 (fails) and 2.9.6 on Rocky 8 and 9 (works).
# A missing package is left to the package tasks of the role, which run before this file.
- name: 'Assert that the installed ModSecurity supports the Core Rule Set'
  ansible.builtin.assert:
    that:
      - '__apache_httpd__mod_security_package not in ansible_facts["packages"]
        or ansible_facts["packages"][__apache_httpd__mod_security_package][0]["version"] is version("2.9.6", ">=")'
    quiet: true
    fail_msg: >-
      {{ __apache_httpd__mod_security_package }}
      {{ ansible_facts["packages"][__apache_httpd__mod_security_package][0]["version"] | d("") }}
      is too old for the OWASP Core Rule Set 4, which needs ModSecurity 2.9.6 or newer.
      Set `apache_httpd__skip_mod_security_coreruleset: true` on this host.

- name: 'curl --output /tmp/ansible.coreruleset-v{{ apache_httpd__mod_security_coreruleset_version }}.tar.gz {{ apache_httpd__mod_security_coreruleset_url }}/v{{ apache_httpd__mod_security_coreruleset_version }}.tar.gz' # noqa risky-file-permissions (temporary file)
  ansible.builtin.get_url:
    url: '{{ apache_httpd__mod_security_coreruleset_url }}/v{{ apache_httpd__mod_security_coreruleset_version }}.tar.gz'
    dest: '/tmp/ansible.coreruleset-v{{ apache_httpd__mod_security_coreruleset_version }}.tar.gz'
    checksum: 'sha256:{{ __apache_httpd__mod_security_coreruleset_sha256[apache_httpd__mod_security_coreruleset_version] }}'
    mode: 0o644
  retries: 3 # ride out a brief outage of the download source
  delay: 10
  delegate_to: 'localhost'
  become: false
  vars:
    ansible_become: false # noqa var-naming[pattern]
  changed_when: false # not an actual config change on the target
  check_mode: false # run task even if `--check` is specified

- name: 'install tar'
  ansible.builtin.package:
    name: 'tar'
    state: 'present'
  retries: 3 # ride out a brief outage of the package repository
  delay: 10

# The mod_security package creates this directory on the Red Hat family, the Debian package does not.
- name: 'mkdir -p {{ __apache_httpd__config_path }}/modsecurity.d'
  ansible.builtin.file:
    path: '{{ __apache_httpd__config_path }}/modsecurity.d'
    state: 'directory'
    owner: 'root'
    group: 'root'
    mode: 0o755

- name: 'tar xzf /tmp/ansible.coreruleset-v{{ apache_httpd__mod_security_coreruleset_version }}.tar.gz -C {{ __apache_httpd__config_path }}/modsecurity.d/'
  ansible.builtin.unarchive:
    src: '/tmp/ansible.coreruleset-v{{ apache_httpd__mod_security_coreruleset_version }}.tar.gz'
    dest: '{{ __apache_httpd__config_path }}/modsecurity.d/'
    owner: 'root'
    group: 'root'
    # the archive carries group-writable files, which the `chmod -R g-w` of the config directory
    # further down would revert, so the archive would be extracted again on every run
    mode: 'u=rwX,g=rX,o=rX'
  ignore_errors: '{{ ansible_check_mode }}' # ignore errors if `--check` is specified

- name: 'ln -s {{ __apache_httpd__config_path }}/modsecurity.d/coreruleset-{{ apache_httpd__mod_security_coreruleset_version }} {{ __apache_httpd__config_path }}/modsecurity.d/crs'
  ansible.builtin.file:
    src: '{{ __apache_httpd__config_path }}/modsecurity.d/coreruleset-{{ apache_httpd__mod_security_coreruleset_version }}'
    dest: '{{ __apache_httpd__config_path }}/modsecurity.d/crs'
    state: 'link'
  ignore_errors: '{{ ansible_check_mode }}' # ignore errors if `--check` is specified
  # Apache reads the rules at startup, so it keeps applying the previous release until it is reloaded
  notify: 'apache_httpd: httpd -t; systemctl reload httpd'

- name: 'cp {{ __apache_httpd__config_path }}/modsecurity.d/crs/crs-setup.conf.example {{ __apache_httpd__config_path }}/modsecurity.d/crs/crs-setup.conf'
  ansible.builtin.copy:
    src: '{{ __apache_httpd__config_path }}/modsecurity.d/crs/crs-setup.conf.example'
    dest: '{{ __apache_httpd__config_path }}/modsecurity.d/crs/crs-setup.conf'
    remote_src: true
    owner: 'root'
    group: 'root'
    mode: 0o644
  ignore_errors: '{{ ansible_check_mode }}' # ignore errors if `--check` is specified
  notify: 'apache_httpd: httpd -t; systemctl reload httpd'
