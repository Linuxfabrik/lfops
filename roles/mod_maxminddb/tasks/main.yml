- name: 'Set platform/version specific variables'
  ansible.builtin.import_role:
    name: 'shared'
    tasks_from: 'platform-variables.yml'
  tags:
    - 'always'


- block:

  - name: 'install build dependencies ({{ __mod_maxminddb__build_packages | join(" ") }})'
    ansible.builtin.package:
      name: '{{ __mod_maxminddb__build_packages }}'
      state: 'present'
    retries: 3 # ride out a brief outage of the package repository
    delay: 10

  - name: 'curl https://github.com/maxmind/mod_maxminddb/releases/download/{{ mod_maxminddb__version }}/mod_maxminddb-{{ mod_maxminddb__version }}.tar.gz --output /tmp/mod_maxminddb-{{ mod_maxminddb__version }}.tar.gz'
    ansible.builtin.get_url:
      url: 'https://github.com/maxmind/mod_maxminddb/releases/download/{{ mod_maxminddb__version }}/mod_maxminddb-{{ mod_maxminddb__version }}.tar.gz'
      dest: '/tmp/mod_maxminddb-{{ mod_maxminddb__version }}.tar.gz'
      mode: 0o644
    retries: 3 # ride out a brief outage of the download source
    delay: 10
    delegate_to: 'localhost'
    become: false
    vars:
      ansible_become: false # noqa var-naming[pattern]
    check_mode: false # run task even if `--check` is specified

  - name: 'mkdir -p {{ ansible_env["HOME"] }}/mod_maxminddb-{{ mod_maxminddb__version }}'
    ansible.builtin.file:
      path: '{{ ansible_env["HOME"] }}/mod_maxminddb-{{ mod_maxminddb__version }}'
      state: 'directory'
      mode: 0o755

  - name: 'tar xfz --strip-components 1 -C {{ ansible_env["HOME"] }}/mod_maxminddb-{{ mod_maxminddb__version }} /tmp/mod_maxminddb-{{ mod_maxminddb__version }}.tar.gz'
    ansible.builtin.unarchive:
      src: '/tmp/mod_maxminddb-{{ mod_maxminddb__version }}.tar.gz'
      dest: '{{ ansible_env["HOME"] }}/mod_maxminddb-{{ mod_maxminddb__version }}'
      remote_src: false
      extra_opts:
        - '--strip-components=1'

  - name: './configure'
    ansible.builtin.command: './configure'
    args:
      chdir: '{{ ansible_env["HOME"] }}/mod_maxminddb-{{ mod_maxminddb__version }}'
    changed_when: false # only writes build files

  - name: 'Create Apache `LoadModule` directive in {{ mod_maxminddb__apache_conf_modules_d }}'
    ansible.builtin.copy:
      dest: '{{ mod_maxminddb__apache_conf_modules_d }}'
      content: 'LoadModule maxminddb_module {{ __mod_maxminddb__module_path }}'
      mode: 0o644

  - name: 'make'
    community.general.make:
      chdir: '{{ ansible_env["HOME"] }}/mod_maxminddb-{{ mod_maxminddb__version }}'
    changed_when: false # only builds in the build directory, the copy below reports the change

  # not `make install`, as its `apxs -i -a` also edits the Apache config: a second `LoadModule`
  # in httpd.conf on Red Hat, a rewritten maxminddb.load plus a .bak~ file on Debian/Ubuntu.
  # Verified against mod_maxminddb 1.2.0 on Rocky 8/9/10, Debian 13 and Ubuntu 24.04.
  - name: 'cp src/.libs/mod_maxminddb.so {{ __mod_maxminddb__module_path }}'
    ansible.builtin.copy:
      src: '{{ ansible_env["HOME"] }}/mod_maxminddb-{{ mod_maxminddb__version }}/src/.libs/mod_maxminddb.so'
      dest: '{{ __mod_maxminddb__module_path }}'
      remote_src: true
      mode: 0o755

  - name: 'a2enmod maxminddb'
    community.general.apache2_module:
      name: 'maxminddb'
      state: 'present'
    when:
      - 'ansible_facts["os_family"] == "Debian"'

  tags:
    - 'mod_maxminddb'
