- block:

  - name: 'deploy the GitLab Runner repo (mirror: {{ repo_gitlab_runner__mirror_url }})'
    ansible.builtin.template:
      backup: true
      src: 'etc/yum.repos.d/gitlab_gitlab-ce.repo.j2'
      dest: '/etc/yum.repos.d/gitlab_gitlab-ce.repo'
      owner: 'root'
      group: 'root'
      # 0600 while the file carries the mirror credentials
      mode: '{{ "0o600" if repo_gitlab_runner__basic_auth_login | default({}) | length > 0 else "0o644" }}'

  - name: 'Remove rpmnew / rpmsave (and Debian equivalents)'
    ansible.builtin.include_role:
      name: 'shared'
      tasks_from: 'remove-rpmnew-rpmsave.yml'
    vars:
      shared__remove_rpmnew_rpmsave_config_file: '/etc/yum.repos.d/gitlab_gitlab-ce.repo'

  tags:
    - 'repo_gitlab_runner'
