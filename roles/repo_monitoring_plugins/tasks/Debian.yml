- block:

  - name: 'curl https://repo.linuxfabrik.ch/linuxfabrik.key --output /tmp/ansible.linuxfabrik.key'
    ansible.builtin.get_url:
      url: 'https://repo.linuxfabrik.ch/linuxfabrik.key'
      dest: '/tmp/ansible.linuxfabrik.key'
      mode: 0o644
    delegate_to: 'localhost'
    become: false
    vars:
      ansible_become: false # noqa var-naming[pattern]
    changed_when: false # not an actual config change on the server
    check_mode: false # run task even if `--check` is specified

  - name: 'mkdir -p /etc/apt/keyrings'
    ansible.builtin.file:
      path: '/etc/apt/keyrings'
      state: 'directory'
      owner: 'root'
      group: 'root'
      mode: 0o755

  - name: 'Copy /tmp/ansible.linuxfabrik.key to the remote host'
    ansible.builtin.copy:
      src: '/tmp/ansible.linuxfabrik.key'
      dest: '/etc/apt/keyrings/linuxfabrik.asc' # use asc for ASCII-armored keys
      owner: 'root'
      group: 'root'
      mode: 0o644

  - name: 'Deploy /etc/apt/sources.list.d/linuxfabrik-monitoring-plugins.list'
    ansible.builtin.template:
      backup: true
      src: 'etc/apt/sources.list.d/linuxfabrik-monitoring-plugins.list.j2'
      dest: '/etc/apt/sources.list.d/linuxfabrik-monitoring-plugins.list'
      owner: 'root'
      group: 'root'
      mode: 0o644

  - name: 'apt update # update the cache'
    ansible.builtin.apt:
      update_cache: true
    changed_when: false # refreshing the package cache is not a config change

  tags:
    - 'repo_monitoring_plugins'


# `backup: true` above leaves timestamped copies next to the sources file, which apt ignores, as
# it only reads files ending in `.list` or `.sources`. They are removed along with it.
- block:

  - name: 'Find /etc/apt/sources.list.d/linuxfabrik-monitoring-plugins*'
    ansible.builtin.find:
      paths: '/etc/apt/sources.list.d'
      patterns: 'linuxfabrik-monitoring-plugins*'
    register: '__repo_monitoring_plugins__repo_files'

  - name: 'rm -f /etc/apt/sources.list.d/linuxfabrik-monitoring-plugins* /etc/apt/keyrings/linuxfabrik.asc'
    ansible.builtin.file:
      path: '{{ item }}'
      state: 'absent'
    loop: '{{
        __repo_monitoring_plugins__repo_files["files"] | map(attribute="path") | list
        + ["/etc/apt/keyrings/linuxfabrik.asc"]
      }}'

  tags:
    - 'never'
    - 'repo_monitoring_plugins:remove'
