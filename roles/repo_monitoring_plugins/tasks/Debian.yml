# The match also covers the timestamped backups an earlier version of this role left next to the
# sources file. The ASCII-armored key was only referenced by that file; the Linuxfabrik
# repository brings its own keyring in /usr/share/keyrings.
- block:

  - name: 'Find /etc/apt/sources.list.d/linuxfabrik-monitoring-plugins*'
    ansible.builtin.find:
      paths: '/etc/apt/sources.list.d'
      patterns: 'linuxfabrik-monitoring-plugins*'
    register: '__repo_monitoring_plugins__repo_files'

  - name: 'rm -f /etc/apt/sources.list.d/linuxfabrik-monitoring-plugins* /etc/apt/keyrings/linuxfabrik.asc'
    ansible.builtin.file:
      path: '{{ item }}'
      state: 'absent'
    loop: '{{
        __repo_monitoring_plugins__repo_files["files"] | map(attribute="path") | list
        + ["/etc/apt/keyrings/linuxfabrik.asc"]
      }}'

  tags:
    - 'repo_monitoring_plugins'
    - 'repo_monitoring_plugins:remove'
