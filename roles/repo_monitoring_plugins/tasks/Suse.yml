# The match also covers the timestamped backups an earlier version of this role left next to the
# repo file, and the linuxfabrik-monitoring-plugins-release.repo of older installations. The
# signing key stays in the rpm database: the Linuxfabrik repository is signed with the same key.
- block:

  - name: 'Find /etc/zypp/repos.d/linuxfabrik-monitoring-plugins*'
    ansible.builtin.find:
      paths: '/etc/zypp/repos.d'
      patterns: 'linuxfabrik-monitoring-plugins*'
    register: '__repo_monitoring_plugins__repo_files'

  - name: 'rm -f /etc/zypp/repos.d/linuxfabrik-monitoring-plugins*'
    ansible.builtin.file:
      path: '{{ item["path"] }}'
      state: 'absent'
    loop: '{{ __repo_monitoring_plugins__repo_files["files"] }}'
    loop_control:
      label: '{{ item["path"] }}'

  tags:
    - 'repo_monitoring_plugins'
    - 'repo_monitoring_plugins:remove'
