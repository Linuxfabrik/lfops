- name: 'Set platform/version specific variables'
  ansible.builtin.import_role:
    name: 'shared'
    tasks_from: 'platform-variables.yml'
  tags:
    - 'always'


- block:

  # the package comes from the Linuxfabrik repository and pulls in curl and openssl.
  # everything that migrates away from the former /opt/acme.sh installation runs after this
  # task, so an unreachable repository leaves that installation working.
  - name: 'Install acme.sh'
    ansible.builtin.package:
      name: 'acme.sh'
      state: 'present'
    register: '__acme_sh__package_result'
    retries: 3 # ride out a brief outage of the package repository
    delay: 10

  # writes /etc/acme.sh/account.conf on a fresh host, with the same settings the former
  # online installer wrote, so that both kinds of hosts share one layout. existing hosts
  # already have the file and keep it. the packaged /usr/bin/acme.sh sets ACME_PACKAGED, so
  # `--install` copies no script, and `--no-profile` keeps it from writing an alias into the
  # rc files of root (that alias would bypass the wrapper and with it ACME_PACKAGED).
  # `--home /etc/acme.sh` avoids an empty /root/.acme.sh. Verified against acme.sh 3.1.6.
  - name: 'acme.sh --install --no-cron --no-profile --home /etc/acme.sh --config-home /etc/acme.sh ...'
    ansible.builtin.command: >-
      acme.sh --install
        --no-cron
        --no-profile
        --home /etc/acme.sh
        --config-home /etc/acme.sh
        --cert-home /etc/acme.sh/certs
        --accountemail '{{ acme_sh__account_email }}'
        --accountkey /etc/acme.sh/account.key
        --accountconf /etc/acme.sh/account.conf
    args:
      creates: '/etc/acme.sh/account.conf'

  # the former online installer kept only code below /opt/acme.sh; certificates, account and
  # state live in /etc/acme.sh, which stays untouched.
  - name: 'rm -rf /opt/acme.sh'
    ansible.builtin.file:
      path: '/opt/acme.sh'
      state: 'absent'

  # an `acme.sh --install` without `--home` put a copy of the program into /root/.acme.sh.
  # remove it only if it holds nothing but program files, since acme.sh keeps certificates,
  # account and configuration there as well when it runs without `--config-home`.
  - name: 'stat /root/.acme.sh'
    ansible.builtin.stat:
      path: '/root/.acme.sh'
    register: '__acme_sh__root_home_stat_result'

  - name: 'find /root/.acme.sh -mindepth 1 -maxdepth 1'
    ansible.builtin.find:
      paths: '/root/.acme.sh'
      file_type: 'any'
      hidden: true
    register: '__acme_sh__root_home_find_result'
    when: '__acme_sh__root_home_stat_result["stat"]["isdir"] | d(false)'

  - name: 'rm -rf /root/.acme.sh'
    ansible.builtin.file:
      path: '/root/.acme.sh'
      state: 'absent'
    when:
      - '__acme_sh__root_home_find_result["files"] is defined'
      - '__acme_sh__root_home_foreign_files | length == 0'

  - name: 'Report that /root/.acme.sh was left alone'
    ansible.builtin.debug:
      msg: '{{ __acme_sh__root_home_message }}'
    when:
      - '__acme_sh__root_home_find_result["files"] is defined'
      - '__acme_sh__root_home_foreign_files | length > 0'

  - name: 'Collect the message for the end of the play'
    ansible.builtin.set_fact:
      __shared__end_of_play_messages: '{{ __shared__end_of_play_messages | d([]) + [__acme_sh__root_home_message] }}'
    when:
      - '__acme_sh__root_home_find_result["files"] is defined'
      - '__acme_sh__root_home_foreign_files | length > 0'

  # the former online installer sources acme.sh.env (bash, zsh, sh) from the one profile of
  # root that `_detect_profile()` picks (.bashrc or .bash_profile for bash, .zshrc for zsh, else
  # the first existing of .profile, .bashrc, .bash_profile and .zshrc), and acme.sh.csh from
  # .cshrc and .tcshrc. Verified against acme.sh 3.1.6. on the Red Hat family, .cshrc and
  # .tcshrc belong to the rootfiles package, so remove the line, not the file. lineinfile
  # leaves a missing file alone and does not create it.
  - name: 'Remove the acme.sh lines of the former installation from the rc files of root'
    ansible.builtin.lineinfile:
      path: '{{ item }}'
      regexp: '^.*"(/opt/acme\.sh|/root/\.acme\.sh)/acme\.sh\.(env|csh)"$'
      state: 'absent'
    loop:
      - '/root/.bash_profile'
      - '/root/.bashrc'
      - '/root/.cshrc'
      - '/root/.profile'
      - '/root/.tcshrc'
      - '/root/.zshrc'

  # replaces the alias of the former installation, so that a plain `acme.sh --list` works on
  # /etc/acme.sh instead of ~/.acme.sh.
  - name: 'Deploy /etc/profile.d/acme-sh.sh'
    ansible.builtin.template:
      backup: true
      src: 'etc/profile.d/acme-sh.sh.j2'
      dest: '/etc/profile.d/acme-sh.sh'
      owner: 'root'
      group: 'root'
      mode: 0o644

  - name: 'Deploy /etc/systemd/system/acme-sh.service'
    ansible.builtin.template:
      backup: true
      src: 'etc/systemd/system/acme-sh.service.j2'
      dest: '/etc/systemd/system/acme-sh.service'
      owner: 'root'
      group: 'root'
      mode: 0o644
    notify: 'acme_sh: systemctl daemon-reload'

  - name: 'Deploy /etc/systemd/system/acme-sh.timer'
    ansible.builtin.template:
      backup: true
      src: 'etc/systemd/system/acme-sh.timer.j2'
      dest: '/etc/systemd/system/acme-sh.timer'
      owner: 'root'
      group: 'root'
      mode: 0o644
    register: '__acme_sh__timer_result'
    notify: 'acme_sh: systemctl daemon-reload'

  - name: 'Reload systemd for the changed timers'
    ansible.builtin.include_role:
      name: 'shared'
      tasks_from: 'reload-changed-timers.yml'
    vars:
      shared__reload_changed_timers: '{{
          (__acme_sh__timer_result is changed) | ternary(["acme-sh.timer"], [])
        }}'

  - name: 'mkdir -p /var/www/html/letsencrypt/.well-known/acme-challenge'
    ansible.builtin.file:
      path: '/var/www/html/letsencrypt/.well-known/acme-challenge'
      state: 'directory'
      owner: 'root'
      group: 'root'
      mode: 0o755

  - name: "echo 'it works' > /var/www/html/letsencrypt/.well-known/acme-challenge/index.html"
    ansible.builtin.copy:
      content: 'it works'
      dest: '/var/www/html/letsencrypt/.well-known/acme-challenge/index.html'
      owner: 'root'
      group: 'root'
      mode: 0o644

  vars:
    # what `install()` and `_installalias()` put into the working directory, verified against
    # acme.sh 3.1.6
    __acme_sh__root_home_foreign_files: '{{ __acme_sh__root_home_find_result["files"]
        | map(attribute="path") | map("basename")
        | difference(["acme.sh", "acme.sh.completion", "acme.sh.csh", "acme.sh.env", "deploy", "dnsapi", "notify"]) }}'
    __acme_sh__root_home_message: >-
      /root/.acme.sh was left alone, since it holds more than a copy of the acme.sh program
      ({{ __acme_sh__root_home_foreign_files | join(", ") }}). Move what is still needed to
      /etc/acme.sh, then remove the directory.
  tags:
    - 'acme_sh'


- block:

  # a vHost for the ACME challenge that an earlier role in the play just deployed is only
  # served after its reload handler ran
  - name: 'Flush handlers so that the web server serves the current config'
    ansible.builtin.meta: 'flush_handlers'

  # in check mode the package is not actually installed, so a host still on the former
  # /opt/acme.sh installation has no acme.sh on its PATH. The former script reads the same
  # /etc/acme.sh and lists the same certificates, so the check shows what a real run would
  # issue. A fresh host has neither and lists nothing.
  - name: 'stat /opt/acme.sh/acme.sh'
    ansible.builtin.stat:
      path: '/opt/acme.sh/acme.sh'
    register: '__acme_sh__former_script_result'
    when: '__acme_sh__package_pending | bool'

  - name: 'acme.sh --config-home /etc/acme.sh --list --listraw'
    ansible.builtin.command: '{{ __acme_sh__list_cmd }}'
    changed_when: false # just gathering information
    check_mode: false # run task even if `--check` is specified
    register: 'acme_sh__list_result'
    when: '__acme_sh__list_possible | bool'

  # `--listraw` prints one `Main_Domain|"KeyLength"|...` line per issued certificate (plus a
  # header line). Reduce it to a `name|keylength` list so we can tell whether a certificate
  # already exists with the requested key type. RSA and ECDSA certificates for the same name
  # live in separate stores and therefore show up as two separate lines.
  - name: 'Parse issued certificates into a name|keylength list'
    ansible.builtin.set_fact:
      __acme_sh__issued: >-
        {{ (acme_sh__list_result["stdout_lines"] if acme_sh__list_result["stdout_lines"] is defined else [])
           | map("regex_replace", '^([^|]*)\|"?([^"|]*)"?\|.*$', '\1|\2')
           | list }}

  # Names that do not yet have a certificate with the requested key length, so they need to be
  # (re)issued. This drives the RSA -> ECDSA conversion too: changing the key length makes the
  # existing RSA line stop matching, so the name lands here and acme.sh issues a fresh
  # certificate into the ECC store (a different directory), without needing `--force`.
  - name: 'Determine which certificates need to be issued'
    ansible.builtin.set_fact:
      __acme_sh__to_issue: >-
        {{ acme_sh__certificates | map(attribute="name")
           | difference(__acme_sh__issued
                        | select("search", '\|' ~ (acme_sh__key_length | string) ~ '$')
                        | map("regex_replace", '\|.*$', '')
                        | list) }}

  - ansible.builtin.include_tasks: 'issue-cert.yml'
    loop: '{{ acme_sh__certificates }}'
    loop_control:
      loop_var: 'certificate'
    when: 'certificate["name"] in __acme_sh__to_issue'

  # acme.sh re-runs install-cert (copy to /etc/pki + reload) on every renewal by itself, using
  # the paths it saved on the last install. So this role only needs to install when a
  # certificate was just (re)issued above, or when the installed file differs from the one in
  # acme.sh's store (self-heal), e.g. a placeholder that apache_httpd created before the
  # certificate was issued and that an aborted install never replaced. install-cert copies the
  # file byte for byte (`cat "$CERT_PATH" >"$_real_cert"`, verified against acme.sh 3.1.5), so
  # comparing checksums is enough. Installing on every run would reload the web server on every
  # run, which is not idempotent.
  - name: 'sha1sum the installed certificates'
    ansible.builtin.stat:
      path: '{{ __acme_sh__cert_path }}/{{ item["name"] }}.crt'
    loop: '{{ acme_sh__certificates }}'
    loop_control:
      label: '{{ item["name"] }}'
    register: '__acme_sh__installed_stat_result'

  # acme.sh keeps an ECDSA certificate in `<name>_ecc/`, an RSA one in `<name>/`.
  - name: 'sha1sum the certificates in the acme.sh store'
    ansible.builtin.stat:
      path: '/etc/acme.sh/certs/{{ item["name"] }}{{ "_ecc" if (acme_sh__key_length | string) is match("^ec-") else "" }}/{{ item["name"] }}.cer'
    loop: '{{ acme_sh__certificates }}'
    loop_control:
      label: '{{ item["name"] }}'
    register: '__acme_sh__store_stat_result'

  - name: 'acme.sh --config-home /etc/acme.sh --install-cert ...'
    ansible.builtin.command: |-
      acme.sh --config-home /etc/acme.sh --install-cert \
      {{ '--ecc' if (acme_sh__key_length | string) is match('^ec-') else '' }} \
      --domain '{{ item["name"] }}' \
      --ca-file '{{ __acme_sh__cert_path }}/{{ item["name"] }}-chain.crt' \
      --cert-file '{{ __acme_sh__cert_path }}/{{ item["name"] }}.crt' \
      --fullchain-file '{{ __acme_sh__cert_path }}/{{ item["name"] }}-fullchain.crt' \
      --key-file '{{ __acme_sh__key_path }}/{{ item["name"] }}.key' \
      --reloadcmd '{{ acme_sh__reload_cmd | d((item["reload_cmd"] is defined and item["reload_cmd"] | length > 0) | ternary(item["reload_cmd"], __acme_sh__reload_cmd)) }}'
    loop: '{{ acme_sh__certificates }}'
    loop_control:
      index_var: '__acme_sh__index'
      label: '{{ item["name"] }}'
    when: >-
      item["name"] in __acme_sh__to_issue
      or (__acme_sh__store_stat_result["results"][__acme_sh__index]["stat"]["exists"]
          and __acme_sh__installed_stat_result["results"][__acme_sh__index]["stat"]["checksum"] | d("")
              != __acme_sh__store_stat_result["results"][__acme_sh__index]["stat"]["checksum"])
    changed_when: true

  - name: 'acme.sh --config-home /etc/acme.sh --deploy ...'
    ansible.builtin.command: |-
      acme.sh --config-home /etc/acme.sh --deploy \
      {{ '--ecc' if (acme_sh__key_length | string) is match('^ec-') else '' }} \
      --domain '{{ item["name"] }}' \
      --deploy-hook {{ acme_sh__deploy_to_host_hook }}
    environment:
      DEPLOY_SSH_USER: '{{ acme_sh__deploy_to_host_user }}'
      DEPLOY_SSH_SERVER: '{{ acme_sh__deploy_to_host }}'
      DEPLOY_SSH_CERTFILE: '{{ __acme_sh__cert_path }}/{{ item["name"] }}.crt'
      DEPLOY_SSH_KEYFILE: '{{ __acme_sh__key_path }}/{{ item["name"] }}.key'
      DEPLOY_SSH_FULLCHAIN: '{{ __acme_sh__cert_path }}/{{ item["name"] }}-fullchain.crt'
      DEPLOY_SSH_CAFILE: '{{ __acme_sh__cert_path }}/{{ item["name"] }}-chain.crt'
      DEPLOY_SSH_REMOTE_CMD: '{{ acme_sh__deploy_to_host_reload_cmd | d((item["reload_cmd"] is defined and item["reload_cmd"] | length > 0) | ternary(item["reload_cmd"], "systemctl reload httpd")) }}'
    loop: '{{ acme_sh__certificates }}'
    # acme.sh re-runs the deploy hook on every renewal by itself, so deploy only when the
    # certificate was just (re)issued above.
    when:
      - 'acme_sh__deploy_to_host is defined and acme_sh__deploy_to_host | length > 0'
      - 'item["name"] in __acme_sh__to_issue'
    changed_when: true

  # After a RSA -> ECDSA conversion the superseded RSA certificate still sits in acme.sh's
  # renewal list and would keep getting renewed pointlessly. List the certificates again (the
  # ECDSA ones now exist) and drop the RSA certificate from renewal for every name that has
  # both a freshly issued ECDSA certificate and a leftover RSA one. `--remove` without `--ecc`
  # targets the RSA store; it only detaches the certificate from renewal and leaves the files
  # in place.
  - name: 'acme.sh --config-home /etc/acme.sh --list --listraw (after issuing)'
    ansible.builtin.command: '{{ __acme_sh__list_cmd }}'
    changed_when: false # just gathering information
    check_mode: false # run task even if `--check` is specified
    register: 'acme_sh__list_after_result'
    when:
      - '(acme_sh__key_length | string) is match("^ec-")'
      - '__acme_sh__list_possible | bool'

  - name: 'Parse issued certificates (after issuing) into a name|keylength list'
    ansible.builtin.set_fact:
      __acme_sh__issued_after: >-
        {{ (acme_sh__list_after_result["stdout_lines"] if acme_sh__list_after_result["stdout_lines"] is defined else [])
           | map("regex_replace", '^([^|]*)\|"?([^"|]*)"?\|.*$', '\1|\2')
           | list }}
    when: '(acme_sh__key_length | string) is match("^ec-")'

  - name: 'acme.sh --config-home /etc/acme.sh --remove (superseded RSA cert)'
    ansible.builtin.command: "acme.sh --config-home /etc/acme.sh --remove --domain '{{ item['name'] }}'"
    loop: '{{ acme_sh__certificates }}'
    when:
      - '(acme_sh__key_length | string) is match("^ec-")'
      # the requested ECDSA certificate now exists for this name ...
      - '(item["name"] ~ "|" ~ (acme_sh__key_length | string)) in __acme_sh__issued_after'
      # ... and a leftover certificate with a different (RSA) key length still exists for it
      - >-
        __acme_sh__issued_after
        | reject('search', '\|' ~ (acme_sh__key_length | string) ~ '$')
        | map('regex_replace', '\|.*$', '')
        | list | select('equalto', item['name']) | list | length > 0
    changed_when: true

  vars:
    # `is defined`, since `--tags acme_sh:certificates` skips the package task
    __acme_sh__package_pending: '{{ ansible_check_mode and __acme_sh__package_result is defined and __acme_sh__package_result is changed }}'
    __acme_sh__list_possible: '{{ not __acme_sh__package_pending | bool or __acme_sh__former_script_result["stat"]["exists"] }}'
    __acme_sh__list_cmd: '{{ "/opt/acme.sh/acme.sh" if __acme_sh__package_pending | bool else "acme.sh" }} --config-home /etc/acme.sh --list --listraw'
  tags:
    - 'acme_sh'
    - 'acme_sh:certificates'


- block:

  - name: 'systemctl {{ acme_sh__timer_enabled | bool | ternary("enable", "disable") }} acme-sh.timer --now'
    ansible.builtin.systemd:
      name: 'acme-sh.timer'
      state: '{{ acme_sh__timer_enabled | bool | ternary("started", "stopped") }}'
      enabled: '{{ acme_sh__timer_enabled }}'
    # under `--check` the role deploys no unit file, so a new acme-sh.timer is unknown to
    # systemd and a changed one is not in effect yet. `is defined`, since
    # `--tags acme_sh:state` skips the deployment.
    when: 'not (ansible_check_mode and __acme_sh__timer_result is defined and __acme_sh__timer_result is changed)'

  tags:
    - 'acme_sh'
    - 'acme_sh:state'
