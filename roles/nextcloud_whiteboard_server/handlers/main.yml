# skip the restart if the operator deferred restarts LFOps-wide (lfops__skip_restart_handlers) or
# if the container should be stopped.
# The `is not changed` half of the usual guard is not expressible here: the container service is
# managed by the podman_containers role via
# nextcloud_whiteboard_server__podman_containers__containers__dependent_var, so this role has no
# state task of its own whose result could tell whether the service was just started.
# ansible.builtin.systemd instead of ansible.builtin.service, which has no `scope: 'user'`.
- name: 'nextcloud_whiteboard_server: systemctl --user restart nextcloud-whiteboard-server-container.service'
  ansible.builtin.systemd:
    name: 'nextcloud-whiteboard-server-container.service'
    scope: 'user'
    state: 'restarted'
  become: true
  become_user: 'nextcloud-whiteboard'
  when:
    - 'not (lfops__skip_restart_handlers | d(false) | bool)'
    - 'nextcloud_whiteboard_server__container_state != "stopped"'
