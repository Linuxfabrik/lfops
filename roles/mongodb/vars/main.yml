# MongoDB versions this role ships a configuration template for, per OS family, since
# the template name carries the family. The installed version is matched against the
# list so an unsupported one aborts with a clear message instead of a missing-file
# error. Extend it whenever a template for a new version is added.
__mongodb__supported_versions_per_os_family:
  Debian:
    - '7.0'
    - '8.0'
    - '9.0'
  RedHat:
    - '7.0'
    - '8.0'
    - '9.0'
__mongodb__supported_versions: '{{
    __mongodb__supported_versions_per_os_family
    | linuxfabrik.lfops.platform_select(ansible_facts)
  }}'

# The series a host may upgrade to from its installed series with the `mongodb:upgrade` tag. MongoDB
# upgrades one major release at a time and needs the featureCompatibilityVersion of the installed
# series before each step: 7.0 only goes to 8.0, 8.0 to 8.3 or 9.0, see
# https://www.mongodb.com/docs/manual/release-notes/8.0-upgrade-replica-set/ and
# https://www.mongodb.com/docs/manual/release-notes/9.0-upgrade-from-8.0-replica-set/. The role
# ships no 8.3 template, so 8.0 lists 9.0 only. The own series is listed for patch releases.
__mongodb__upgrade_paths:
  '7.0':
    - '7.0'
    - '8.0'
  '8.0':
    - '8.0'
    - '9.0'
  '9.0':
    - '9.0'

# The login for __mongodb__fcv_script, as the admin user when authorization is enabled.
__mongodb__fcv_login: '{{
    {"host": mongodb__conf_net_bind_ip[0], "port": mongodb__conf_net_port}
    | combine(__mongodb__fcv_login_credentials if mongodb__conf_security_authorization | bool else {})
  }}'
__mongodb__fcv_login_credentials:
  username: '{{ mongodb__admin_user["username"] | d("") }}'
  password: '{{ mongodb__admin_user["password"] | d("") }}'

# Reads the featureCompatibilityVersion (FCV), after setting it to `target` if given. MongoDB
# refuses to raise the FCV without `confirm: true`, verified with 8.0.38 on Rocky 9. The
# login comes as JSON on stdin, so the password stays off the command line. `targetVersion` is only
# set while an FCV change is unfinished.
__mongodb__fcv_script: |-
  import json
  import sys

  import pymongo

  login = json.load(sys.stdin)
  client = pymongo.MongoClient(
      host=login['host'],
      port=int(login['port']),
      username=login.get('username'),
      password=login.get('password'),
      authSource='admin',
      directConnection=True,
      serverSelectionTimeoutMS=10000,
  )
  if login.get('target'):
      client.admin.command(
          {'setFeatureCompatibilityVersion': login['target'], 'confirm': True}
      )
  query = {'getParameter': 1, 'featureCompatibilityVersion': 1}
  fcv = client.admin.command(query)['featureCompatibilityVersion']
  print(json.dumps({
      'target_version': fcv.get('targetVersion', ''),
      'version': fcv['version'],
  }))

# Checks whether a user can log in with the password from the inventory. community.mongodb's
# mongodb_user only knows `update_password: always`, which reports a change on every run, and
# `on_create`, which never applies a changed password, so the role probes first and only sets the
# password when the login fails. The login comes as JSON on stdin, so the password stays off the
# command line. Exit code 3 means authentication failed (also for a user that does not exist yet).
__mongodb__password_check_script: |-
  import json
  import sys

  import pymongo
  from pymongo.errors import OperationFailure

  login = json.load(sys.stdin)
  client = pymongo.MongoClient(
      host=login['host'],
      port=int(login['port']),
      username=login['username'],
      password=login['password'],
      authSource=login['auth_source'],
      directConnection=True,
      serverSelectionTimeoutMS=10000,
  )
  try:
      client.admin.command('ping')
  except OperationFailure as e:
      if e.code == 18:  # AuthenticationFailed
          sys.exit(3)
      raise

# Collected in __shared__end_of_play_messages and printed once at the end of the play, see
# roles/shared/tasks/print-messages.yml, when the FCV lags behind the installed series.
__mongodb__fcv_end_of_play_message: 'mongodb: featureCompatibilityVersion is {{ __mongodb__fcv["version"] | d("") }}, mongod runs {{ __mongodb__installed_version | d("") }}. After the burn-in period, set mongodb__feature_compatibility_version to "{{ __mongodb__installed_version | d("") }}". The next major upgrade needs it.'
