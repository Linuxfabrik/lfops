# skip restart if the operator deferred restarts LFOps-wide (lfops__skip_restart_handlers), if
# the service was just started (redundant), or if the user wants it stopped.
# __mongodb__service_state_result is registered on a dedicated state-only task (not the enabled
# task), so that enabled-only changes don't prevent the restart.
# `is not defined` covers a run that skips the state block (`--skip-tags mongodb:state`), where
# the result is never registered.
- name: 'mongodb: systemctl restart mongod.service'
  ansible.builtin.systemd:
    name: 'mongod.service'
    state: 'restarted'
  notify: 'mongodb: wait for the replicaset to stabilise'
  when:
    - 'not (lfops__skip_restart_handlers | d(false) | bool)'
    - '__mongodb__service_state_result is not defined or __mongodb__service_state_result is not changed'
    - 'mongodb__service_state != "stopped"'

# The playbook manages one host at a time (`serial: 1`), so waiting here keeps a replica set from
# losing more than one member to a restart.
- name: 'mongodb: wait for the replicaset to stabilise'
  community.mongodb.mongodb_status:
    login_host: '{{ mongodb__conf_net_bind_ip[0] }}'
    login_port: '{{ mongodb__conf_net_port }}'
    login_user: '{{ mongodb__admin_user["username"] | d(omit) }}'
    login_password: '{{ mongodb__admin_user["password"] | d(omit) }}'
    login_database: 'admin'
    replica_set: '{{ mongodb__conf_replication_repl_set_name__combined_var }}'
    poll: 5
    interval: 10
  vars:
    ansible_python_interpreter: '/opt/python-venv/pymongo/bin/python3'
  when:
    - 'mongodb__conf_replication_repl_set_name__combined_var | length > 0'

- name: 'mongodb: systemctl daemon-reload'
  ansible.builtin.systemd:
    daemon_reload: true
