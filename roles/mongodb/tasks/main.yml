- name: 'Set platform/version specific variables'
  ansible.builtin.import_role:
    name: 'shared'
    tasks_from: 'platform-variables.yml'
  tags:
    - 'always'


- block:

  # User management (DBA, regular users and the dump user) authenticates as the admin user,
  # which is only created when authorization is enabled. Defining users without authorization
  # would silently skip them, so fail early instead.
  - name: 'Check that authorization is enabled when users are defined'
    ansible.builtin.assert:
      that:
        - 'mongodb__conf_security_authorization | bool'
      quiet: true
      fail_msg: >-
        MongoDB users are defined in the inventory but mongodb__conf_security_authorization is
        disabled. Managing users (admin, regular or dump user) requires authorization to be
        enabled. Set mongodb__conf_security_authorization to true, or remove the user definitions.
    when:
      - >-
        (mongodb__users__combined_var | length > 0)
        or (mongodb__admin_user is defined and mongodb__admin_user | length > 0)
        or (mongodb__dump_user is defined and mongodb__dump_user | length > 0)
    tags:
      - 'always'

  - name: 'Make sure that Ansible local facts directory exists'
    ansible.builtin.file:
      path: '/etc/ansible/facts.d'
      state: 'directory'
      owner: 'root'
      group: 'root'
      mode: 0o755

  - name: 'install mongodb-org tar'
    ansible.builtin.package:
      name:
        - 'mongodb-org'
        - 'tar'
      state: 'present'
    retries: 3 # ride out a brief outage of the package repository
    delay: 10

  - name: 'Get the list of installed packages'
    ansible.builtin.package_facts:  # yamllint disable-line rule:empty-values
    check_mode: false # run task even if `--check` is specified
    tags:
      - 'mongodb:fcv'
      - 'mongodb:upgrade'

  - name: 'Get mongodb-org-server version'
    ansible.builtin.set_fact:
      # keep major.minor only, also if a package version ever carries a Debian revision (`8.0.4-1`)
      mongodb__installed_version: '{{ ansible_facts["packages"]["mongodb-org-server"][0]["version"] | regex_search("^\d+\.\d+") }}'
      __mongodb__installed_version_full: '{{ ansible_facts["packages"]["mongodb-org-server"][0]["version"] | regex_search("^\d+\.\d+\.\d+") }}'
    tags:
      - 'mongodb:fcv'
      - 'mongodb:upgrade'

  tags:
    - 'mongodb'


# Upgrades to the newest version the repository offers, see the `mongodb:upgrade` tag in the README.
# The role installs with `state: present` otherwise, so a changed repo_mongodb__version alone does
# not upgrade an existing installation. It only stops mongod and upgrades the packages; the blocks
# after it also carry the tag, deploy the configuration for the new series and start mongod again.
- block:

  - name: 'apt update # update the cache'
    ansible.builtin.apt:
      update_cache: true
    retries: 3 # ride out a brief outage of the package repository
    delay: 10
    changed_when: false # refreshing the package cache is not a config change
    when: 'ansible_facts["os_family"] == "Debian"'

  # dnf repoquery lists the packages of the enabled repositories, not the installed one. A repository
  # of an older series is caught by the assert below.
  - name: 'dnf repoquery --latest-limit=1 --queryformat=%{version} mongodb-org-server'
    ansible.builtin.command:
      argv:
        - 'dnf'
        - 'repoquery'
        - '--quiet'
        - '--latest-limit=1'
        - '--queryformat=%{version}'
        - 'mongodb-org-server'
    register: '__mongodb__candidate_version_result'
    changed_when: false # just gathering information
    check_mode: false # run task even if `--check` is specified
    when: 'ansible_facts["os_family"] == "RedHat"'

  - name: 'apt-cache policy mongodb-org-server'
    ansible.builtin.command:
      argv:
        - 'apt-cache'
        - 'policy'
        - 'mongodb-org-server'
    environment:
      LC_ALL: 'C' # the regex below parses the English "Candidate:" line
    register: '__mongodb__candidate_policy_result'
    changed_when: false # just gathering information
    check_mode: false # run task even if `--check` is specified
    when: 'ansible_facts["os_family"] == "Debian"'

  - name: 'Get the mongodb-org-server version offered by the repository'
    ansible.builtin.set_fact:
      __mongodb__candidate_version_full: '{{ __mongodb__candidate_version_result["stdout"] | trim | regex_search("^\d+\.\d+\.\d+") | d("", true) }}'
    when: 'ansible_facts["os_family"] == "RedHat"'

  - name: 'Get the mongodb-org-server version offered by the repository'
    ansible.builtin.set_fact:
      __mongodb__candidate_version_full: '{{ __mongodb__candidate_policy_result["stdout"] | regex_search("Candidate: \d+\.\d+\.\d+") | d("", true) | replace("Candidate: ", "") }}'
    when: 'ansible_facts["os_family"] == "Debian"'

  - name: 'Assert that the upgrade to {{ __mongodb__candidate_version_full }} does not skip a release'
    ansible.builtin.assert:
      that:
        - '__mongodb__candidate_version_full | length > 0'
        - '__mongodb__candidate_version_full | regex_search("^\d+\.\d+") in __mongodb__upgrade_paths[mongodb__installed_version] | d([])'
        - '__mongodb__candidate_version_full | regex_search("^\d+\.\d+") in __mongodb__supported_versions'
      quiet: true
      fail_msg: >-
        The repository offers mongodb-org-server {{ __mongodb__candidate_version_full | d("(none)", true) }},
        but MongoDB {{ mongodb__installed_version }} can only be upgraded to
        {{ __mongodb__upgrade_paths[mongodb__installed_version] | d([]) | join(", ") }}, one major release at a time.
        Set repo_mongodb__version accordingly and deploy the repository with the `repo_mongodb` tag.

  - name: 'Get the featureCompatibilityVersion'
    ansible.builtin.command:
      argv:
        - '/opt/python-venv/pymongo/bin/python3'
        - '-c'
        - '{{ __mongodb__fcv_script }}'
      stdin: '{{ __mongodb__fcv_login | to_json }}'
    register: '__mongodb__upgrade_fcv_result'
    changed_when: false # read only, no target is given
    failed_when: false # reported by the next task, which can show the error without the password
    check_mode: false # run task even if `--check` is specified
    no_log: true # the stdin carries the password
    when: '__mongodb__candidate_version_full | regex_search("^\d+\.\d+") != mongodb__installed_version'

  - name: 'Assert that the featureCompatibilityVersion could be read'
    ansible.builtin.assert:
      that: '__mongodb__upgrade_fcv_result["rc"] == 0'
      quiet: true
      fail_msg: '{{ __mongodb__upgrade_fcv_result["stderr"] | d("") }}'
    when: '__mongodb__upgrade_fcv_result is not skipped'

  # mongod of the next series refuses to start on data files with an older FCV
  - name: 'Assert that the featureCompatibilityVersion is {{ mongodb__installed_version }}'
    ansible.builtin.assert:
      that:
        - '(__mongodb__upgrade_fcv_result["stdout"] | from_json)["version"] == mongodb__installed_version'
        - '(__mongodb__upgrade_fcv_result["stdout"] | from_json)["target_version"] | length == 0'
      quiet: true
      fail_msg: >-
        The featureCompatibilityVersion is {{ (__mongodb__upgrade_fcv_result["stdout"] | from_json)["version"] }}
        (target {{ (__mongodb__upgrade_fcv_result["stdout"] | from_json)["target_version"] | d("none", true) }}),
        but has to be {{ mongodb__installed_version }} before upgrading to {{ __mongodb__candidate_version_full }}.
        Set mongodb__feature_compatibility_version to "{{ mongodb__installed_version }}" and run the role first.
    when: '__mongodb__upgrade_fcv_result is not skipped'

  # decided once: a `when` on the block below is evaluated for each of its tasks, and the version
  # facts change halfway through it
  - name: 'Decide whether to upgrade'
    ansible.builtin.set_fact:
      __mongodb__upgrade_needed: '{{ __mongodb__candidate_version_full is version(__mongodb__installed_version_full, ">") }}'

  - block:

    - name: 'systemctl stop mongod.service'
      ansible.builtin.systemd:
        name: 'mongod.service'
        state: 'stopped'

    - name: 'dnf upgrade mongodb-org* # noqa package-latest (latest is necessary for upgrade)'
      ansible.builtin.dnf:
        name: 'mongodb-org*'
        state: 'latest'
        update_only: true # only update already installed packages
      retries: 3 # ride out a brief outage of the package repository
      delay: 10
      when: 'ansible_facts["os_family"] == "RedHat"'

    - name: 'apt-get install --only-upgrade mongodb-org* # noqa package-latest (latest is necessary for upgrade)'
      ansible.builtin.apt:
        name: 'mongodb-org*'
        state: 'latest'
        only_upgrade: true # only update already installed packages
      retries: 3 # ride out a brief outage of the package repository
      delay: 10
      when: 'ansible_facts["os_family"] == "Debian"'

    - name: 'Get the list of installed packages'
      ansible.builtin.package_facts:  # yamllint disable-line rule:empty-values

    - name: 'Get mongodb-org-server version'
      ansible.builtin.set_fact:
        mongodb__installed_version: '{{ ansible_facts["packages"]["mongodb-org-server"][0]["version"] | regex_search("^\d+\.\d+") }}'
        __mongodb__installed_version_full: '{{ ansible_facts["packages"]["mongodb-org-server"][0]["version"] | regex_search("^\d+\.\d+\.\d+") }}'

    when:
      - '__mongodb__upgrade_needed | bool'
      - 'not ansible_check_mode'

  tags:
    - 'mongodb:upgrade'
    - 'never'


- block:

  # the template name carries the OS family, so the supported versions are per family too
  - name: 'Assert that a configuration template for the installed MongoDB version exists'
    ansible.builtin.assert:
      that:
        - 'mongodb__installed_version in __mongodb__supported_versions'
      quiet: true
      fail_msg: 'MongoDB {{ mongodb__installed_version }} is not supported by this role on {{ ansible_facts["os_family"] }}. Supported versions: {{ __mongodb__supported_versions | join(", ") }}.'

  - name: 'Deploy /etc/mongod.conf'
    ansible.builtin.template:
      backup: true
      src: 'etc/{{ ansible_facts["os_family"] }}-{{ mongodb__installed_version }}-mongod.conf.j2'
      dest: '/etc/mongod.conf'
      owner: 'root'
      group: 'root'
      mode: 0o644
    notify: 'mongodb: systemctl restart mongod.service'

  - name: 'Remove rpmnew / rpmsave (and Debian equivalents)'
    ansible.builtin.include_role:
      name: 'shared'
      tasks_from: 'remove-rpmnew-rpmsave.yml'
    vars:
      shared__remove_rpmnew_rpmsave_config_file: '/etc/mongod.conf'

  - name: 'Deploy /etc/logrotate.d/mongod'
    ansible.builtin.template:
      backup: true
      src: 'etc/logrotate.d/mongod.j2'
      dest: '/etc/logrotate.d/mongod'
      owner: 'root'
      group: 'root'
      mode: 0o644

  - name: 'Deploy keyfile to /etc/mongod.key'
    ansible.builtin.template:
      backup: true
      src: 'etc/mongod.key.j2'
      dest: '/etc/mongod.key'
      owner: '{{ __mongodb__mongodb_user }}'
      group: '{{ __mongodb__mongodb_user }}'
      mode: 0o400 # contains secrets
    when:
      - 'mongodb__keyfile_content is defined and mongodb__keyfile_content | length > 0'

  - name: 'mkdir -p /etc/systemd/system/mongod.service.d/'
    ansible.builtin.file:
      path: '/etc/systemd/system/mongod.service.d/'
      owner: 'root'
      group: 'root'
      mode: 0o755
      state: 'directory'

  # mongod checks transparent hugepages once at startup, so it has to come up after TuneD has
  # applied the profile (role: kernel_settings).
  - name: 'Deploy /etc/systemd/system/mongod.service.d/z00-after-tuned.conf'
    ansible.builtin.template:
      backup: true
      src: 'etc/systemd/system/mongod.service.d/z00-after-tuned.conf.j2'
      dest: '/etc/systemd/system/mongod.service.d/z00-after-tuned.conf'
      owner: 'root'
      group: 'root'
      mode: 0o644
    register: '__mongodb__z00_after_tuned_result'

  - name: 'systemctl daemon-reload' # noqa no-handler would require flush_handlers here anyway
    ansible.builtin.systemd:
      daemon_reload: true
    when: '__mongodb__z00_after_tuned_result is changed'

  tags:
    - 'mongodb'
    - 'mongodb:upgrade'


- block:

  - name: 'systemctl {{ mongodb__service_enabled | bool | ternary("enable", "disable") }} mongod.service'
    ansible.builtin.systemd:
      name: 'mongod.service'
      enabled: '{{ mongodb__service_enabled }}'

  - name: 'systemctl {{ mongodb__service_state | regex_replace("p?ed$", "") }} mongod.service'
    ansible.builtin.systemd:
      name: 'mongod.service'
      state: '{{ mongodb__service_state }}'
    register: '__mongodb__service_state_result'

  tags:
    - 'mongodb'
    - 'mongodb:state'
    - 'mongodb:upgrade'

- block:

  - name: 'Wait for port {{ mongodb__conf_net_port }} to become open on the host'
    ansible.builtin.wait_for:
      host: '{{ mongodb__conf_net_bind_ip[0] }}'
      port: '{{ mongodb__conf_net_port }}'
      delay: 5

  - name: 'Ensure replicaset "{{ mongodb__conf_replication_repl_set_name__combined_var }}" exists'
    community.mongodb.mongodb_replicaset:
      login_host: '{{ mongodb__conf_net_bind_ip[0] }}'
      login_port: '{{ mongodb__conf_net_port }}'
      login_user: '{{ mongodb__admin_user["username"] | d(omit) }}'
      login_password: '{{ mongodb__admin_user["password"] | d(omit) }}'
      login_database: 'admin'
      replica_set: '{{ mongodb__conf_replication_repl_set_name__combined_var }}'
      members: '{{ mongodb__repl_set_members }}'
      validate: '{{ (mongodb__repl_set_members | length > 1) | bool }}' # prevent error with only one member
      debug: true
    vars:
      ansible_python_interpreter: '/opt/python-venv/pymongo/bin/python3'

  - name: 'Wait for the replicaset to stabilise'
    community.mongodb.mongodb_status:
      login_host: '{{ mongodb__conf_net_bind_ip[0] }}'
      login_port: '{{ mongodb__conf_net_port }}'
      login_user: '{{ mongodb__admin_user["username"] | d(omit) }}'
      login_password: '{{ mongodb__admin_user["password"] | d(omit) }}'
      login_database: 'admin'
      replica_set: '{{ mongodb__conf_replication_repl_set_name__combined_var }}'
      poll: 5
      interval: 10
    vars:
      ansible_python_interpreter: '/opt/python-venv/pymongo/bin/python3'

  when:
    - 'not mongodb__repl_set_skip_init'
    - 'mongodb__conf_replication_repl_set_name__combined_var | length > 0'
  tags:
    - 'mongodb'
    - 'mongodb:upgrade'


- block:

  - name: 'Wait for port {{ mongodb__conf_net_port }} to become open on the host'
    ansible.builtin.wait_for:
      host: '{{ mongodb__conf_net_bind_ip[0] }}'
      port: '{{ mongodb__conf_net_port }}'
      delay: 5

  - name: 'check if host is primary and writable'
    community.mongodb.mongodb_shell:
      login_host: '{{ mongodb__conf_net_bind_ip[0] }}'
      login_port: '{{ mongodb__conf_net_port }}'
      eval: 'db.hello().isWritablePrimary'
      mongo_cmd: 'mongosh'
      transform: 'json'
    register: 'mongodb__is_writable_primary_result'
    changed_when: false # just gathering information
    check_mode: false # run task even if `--check` is specified
    vars:
      ansible_python_interpreter: '/opt/python-venv/pymongo/bin/python3'

  tags:
    - 'mongodb'
    - 'mongodb:dump'
    - 'mongodb:fcv'
    - 'mongodb:status'
    - 'mongodb:upgrade'
    - 'mongodb:users'


- block:

  - name: 'make sure we restarted mongodb if the config changed'
    ansible.builtin.meta: 'flush_handlers'

  - name: 'Create DBA "{{ mongodb__admin_user["username"] }}" (if first user, using localhost exception)' # https://www.mongodb.com/docs/manual/core/localhost-exception/
    community.mongodb.mongodb_user:
      login_host: '{{ mongodb__conf_net_bind_ip[0] }}'
      login_port: '{{ mongodb__conf_net_port }}'
      name: '{{ mongodb__admin_user["username"] }}'
      password: '{{ mongodb__admin_user["password"] }}'
      database: 'admin'
      roles: 'root'
      state: 'present'
      update_password: 'always'
      create_for_localhost_exception: '/etc/ansible/facts.d/mongodb__dba_created.state'
    when:
      - 'mongodb__conf_security_authorization | bool'
    vars:
      ansible_python_interpreter: '/opt/python-venv/pymongo/bin/python3'

  - name: 'Combined Users:'
    ansible.builtin.debug:
      var: 'mongodb__users__combined_var'

  # see __mongodb__password_check_script for why the password is checked first
  - name: 'Check the passwords of the MongoDB users'
    ansible.builtin.command:
      argv:
        - '/opt/python-venv/pymongo/bin/python3'
        - '-c'
        - '{{ __mongodb__password_check_script }}'
      stdin: '{{ {"host": mongodb__conf_net_bind_ip[0], "port": mongodb__conf_net_port, "username": item["username"], "password": item["password"], "auth_source": item["database"]} | to_json }}'
    loop: '{{ mongodb__users__combined_var }}'
    loop_control:
      label: '{{ item["username"] }}'
    register: '__mongodb__users_password_check_result'
    changed_when: false # read-only login
    failed_when: '__mongodb__users_password_check_result["rc"] not in [0, 3]'
    check_mode: false # run task even if `--check` is specified
    no_log: true # the stdin carries the password
    when:
      - 'mongodb__conf_security_authorization | bool'
      - 'item["state"] | d("present") == "present"'

  - name: 'Create, update or delete MongoDB users'
    community.mongodb.mongodb_user:
      login_host: '{{ mongodb__conf_net_bind_ip[0] }}'
      login_port: '{{ mongodb__conf_net_port }}'
      login_user: '{{ mongodb__admin_user["username"] }}'
      login_password: '{{ mongodb__admin_user["password"] }}'
      login_database: 'admin'
      name: '{{ item["username"] }}'
      password: '{{ item["password"] }}'
      database: '{{ item["database"] }}'
      roles: '{{ item["roles"] | d(omit) }}'
      state: '{{ item["state"] | d("present") }}'
      # only set the password if the login with it failed, `always` would report a change on every run
      update_password: '{{ (__mongodb__users_password_check_result["results"][index]["rc"] | d(0) == 3) | ternary("always", "on_create") }}'
    loop: '{{ mongodb__users__combined_var }}'
    loop_control:
      index_var: 'index'
      label: '{{ item["username"] }}'
    when:
      - 'mongodb__conf_security_authorization | bool'
      - 'item["state"] | d("present") != "skip"'
    vars:
      ansible_python_interpreter: '/opt/python-venv/pymongo/bin/python3'

  when:
    - 'mongodb__is_writable_primary_result["transformed_output"]'
  tags:
    - 'mongodb'
    - 'mongodb:users'


# FCV: featureCompatibilityVersion, see the `mongodb:fcv` tag in the README. It belongs to the
# replica set, so only the primary sets and reports it.
- block:

  - name: 'Assert that mongodb__feature_compatibility_version is not newer than the installed MongoDB {{ mongodb__installed_version }}'
    ansible.builtin.assert:
      that:
        - 'mongodb__feature_compatibility_version is version(mongodb__installed_version, "<=")'
      quiet: true
      fail_msg: 'mongodb__feature_compatibility_version is "{{ mongodb__feature_compatibility_version }}", but MongoDB {{ mongodb__installed_version }} is installed. Upgrade first (tag `mongodb:upgrade`).'
    when: 'mongodb__feature_compatibility_version | string | length > 0'

  # In check mode, the script only reads the FCV, and the task reports the change it would make.
  - name: 'Get or set the featureCompatibilityVersion'
    ansible.builtin.command:
      argv:
        - '/opt/python-venv/pymongo/bin/python3'
        - '-c'
        - '{{ __mongodb__fcv_script }}'
      stdin: '{{ __mongodb__fcv_login | combine({"target": ansible_check_mode | ternary("", mongodb__feature_compatibility_version | string)}) | to_json }}'
    register: '__mongodb__fcv_result'
    changed_when: >-
      __mongodb__fcv_result["rc"] == 0 and (__mongodb__fcv_result["stdout"] | from_json)["changed"]
      or (ansible_check_mode
          and __mongodb__fcv_result["rc"] == 0
          and mongodb__feature_compatibility_version | string | length > 0
          and (__mongodb__fcv_result["stdout"] | from_json)["version"] != mongodb__feature_compatibility_version | string)
    failed_when: false # reported by the next task, which can show the error without the password
    check_mode: false # the script itself does not set the FCV in check mode, see the stdin
    no_log: true # the stdin carries the password

  - name: 'Assert that the featureCompatibilityVersion could be read or set'
    ansible.builtin.assert:
      that: '__mongodb__fcv_result["rc"] == 0'
      quiet: true
      fail_msg: '{{ __mongodb__fcv_result["stderr"] | d("") }}'

  - name: 'Get the featureCompatibilityVersion from the result'
    ansible.builtin.set_fact:
      __mongodb__fcv: '{{ __mongodb__fcv_result["stdout"] | from_json }}'

  - name: 'Report that the featureCompatibilityVersion lags behind the installed MongoDB'
    ansible.builtin.debug:
      msg: '{{ __mongodb__fcv_end_of_play_message }}'
    when: '__mongodb__fcv["version"] != mongodb__installed_version'

  - name: 'Collect the message for the end of the play'
    ansible.builtin.set_fact:
      __shared__end_of_play_messages: '{{ __shared__end_of_play_messages | d([]) + [__mongodb__fcv_end_of_play_message] }}'
    when: '__mongodb__fcv["version"] != mongodb__installed_version'

  when:
    - 'mongodb__is_writable_primary_result["transformed_output"]'
  tags:
    - 'mongodb'
    - 'mongodb:fcv'
    - 'mongodb:upgrade'

- block:

  # see __mongodb__password_check_script for why the password is checked first
  - name: 'Check the password of the MongoDB Dump user'
    ansible.builtin.command:
      argv:
        - '/opt/python-venv/pymongo/bin/python3'
        - '-c'
        - '{{ __mongodb__password_check_script }}'
      stdin: '{{ {"host": mongodb__conf_net_bind_ip[0], "port": mongodb__conf_net_port, "username": mongodb__dump_user["username"], "password": mongodb__dump_user["password"], "auth_source": mongodb__dump_user["auth_database"] | d("admin")} | to_json }}'
    register: '__mongodb__dump_user_password_check_result'
    changed_when: false # read-only login
    failed_when: '__mongodb__dump_user_password_check_result["rc"] not in [0, 3]'
    check_mode: false # run task even if `--check` is specified
    no_log: true # the stdin carries the password
    when:
      - 'mongodb__conf_security_authorization | bool'
      - 'mongodb__dump_user is defined'
      - 'mongodb__dump_user | length > 0'
      - 'mongodb__dump_user["state"] | d("present") == "present"'

  # The file-based dump runs db.fsyncLock() and db.fsyncUnlock() as the dump user, which need the
  # `fsync` and `unlock` actions on the cluster (verified against MongoDB 8.0 on Rocky 9: each
  # call fails with "not authorized" without its action). The built-in `backup` role has neither, and the
  # built-in roles that have them (`hostManager`, `clusterAdmin`) also allow e.g. `shutdown`, so
  # the dump user gets a role with these two actions only. Dropping the role also revokes it
  # from the user, so disabling the file-based dump takes the privileges away again.
  - name: 'Create or drop the MongoDB role lfopsFsyncLock'
    community.mongodb.mongodb_role:
      login_host: '{{ mongodb__conf_net_bind_ip[0] }}'
      login_port: '{{ mongodb__conf_net_port }}'
      login_user: '{{ mongodb__admin_user["username"] }}'
      login_password: '{{ mongodb__admin_user["password"] }}'
      login_database: 'admin'
      name: 'lfopsFsyncLock'
      database: 'admin'
      privileges:
        - resource:
            cluster: true
          actions:
            - 'fsync'
            - 'unlock'
      state: '{{
          (mongodb__dump_method_file_based | bool and mongodb__dump_user["state"] | d("present") == "present")
          | ternary("present", "absent")
        }}'
    when:
      - 'mongodb__conf_security_authorization | bool'
      - 'mongodb__dump_user is defined'
      - 'mongodb__dump_user | length > 0'
    vars:
      ansible_python_interpreter: '/opt/python-venv/pymongo/bin/python3'

  - name: 'Create MongoDB Dump user'
    community.mongodb.mongodb_user:
      login_host: '{{ mongodb__conf_net_bind_ip[0] }}'
      login_port: '{{ mongodb__conf_net_port }}'
      login_user: '{{ mongodb__admin_user["username"] }}'
      login_password: '{{ mongodb__admin_user["password"] }}'
      login_database: 'admin'
      name: '{{ mongodb__dump_user["username"] }}'
      password: '{{ mongodb__dump_user["password"] }}'
      database: '{{ mongodb__dump_user["auth_database"] | d("admin") }}'
      # https://www.mongodb.com/docs/manual/reference/built-in-roles/#mongodb-authrole-backup
      roles: '{{
          ["backup"]
          + ((mongodb__dump_method_file_based | bool) | ternary([{"role": "lfopsFsyncLock", "db": "admin"}], []))
        }}'
      state: '{{ mongodb__dump_user["state"] | d("present") }}'
      # only set the password if the login with it failed, `always` would report a change on every run
      update_password: '{{ (__mongodb__dump_user_password_check_result["rc"] | d(0) == 3) | ternary("always", "on_create") }}'
    when:
      - 'mongodb__conf_security_authorization | bool'
      - 'mongodb__dump_user is defined'
      - 'mongodb__dump_user | length > 0'
    vars:
      ansible_python_interpreter: '/opt/python-venv/pymongo/bin/python3'

  when:
    - 'mongodb__is_writable_primary_result["transformed_output"]'
  tags:
    - 'mongodb'
    - 'mongodb:dump'
    - 'mongodb:users'


- block:

  - name: 'install tar'
    ansible.builtin.package:
      name:
        - 'tar'
      state: 'present'
    retries: 3 # ride out a brief outage of the package repository
    delay: 10

  - name: 'Deploy /etc/mongodb-dump.conf'
    ansible.builtin.template:
      backup: true
      src: 'etc/mongodb-dump.conf.j2'
      dest: '/etc/mongodb-dump.conf'
      owner: 'root'
      group: 'root'
      mode: 0o600

  # encrypted with systemd 251 and newer, see the systemd_credential module. The service loads
  # credentials on every start, so a changed one needs no restart. Read by `mongodump --config`,
  # which rejects any key besides `password`, `uri` and `sslPEMKeyPassword`, and by mongosh.
  # Built inline instead of from a template: ansible-core before 2.19 turns a rendered string
  # that looks like a dict into one, which the module would then store as its Python repr; an
  # expression ending in `to_json` is exempt.
  - name: 'Store the dump login as the systemd credential mongodb-dump-login.json'
    linuxfabrik.lfops.systemd_credential:
      name: 'mongodb-dump-login.json'
      content: '{{ {"password": mongodb__dump_user["password"]} | to_json }}'
    register: '__mongodb__dump_login_credential_result'
    when:
      - 'mongodb__conf_security_authorization | bool'
      - 'mongodb__dump_user is defined'
      - 'mongodb__dump_user | length > 0'

  # without a dump user, the dump logs in without a password
  - name: 'Remove the systemd credential mongodb-dump-login.json'
    linuxfabrik.lfops.systemd_credential:
      name: 'mongodb-dump-login.json'
      state: 'absent'
    when: 'not (mongodb__conf_security_authorization | bool) or mongodb__dump_user is not defined or mongodb__dump_user | length == 0'

  # the plain-text predecessor of the credential, including the copies `backup: true` left
  - name: 'find /etc -maxdepth 1 -name mongodb-dump-login.json*'
    ansible.builtin.find:
      paths: '/etc'
      patterns: 'mongodb-dump-login.json*'
      hidden: true
    register: '__mongodb__dump_login_plain_result'

  - name: 'rm -f /etc/mongodb-dump-login.json*'
    ansible.builtin.file:
      path: '{{ item["path"] }}'
      state: 'absent'
    loop: '{{ __mongodb__dump_login_plain_result["files"] }}'
    loop_control:
      label: '{{ item["path"] }}'

  # /usr/local/libexec is missing on Debian before trixie and Ubuntu before 26.04, see
  # roles/schedule_reboot.
  - name: 'Ensure /usr/local/libexec exists'
    ansible.builtin.file:
      path: '/usr/local/libexec'
      state: 'directory'
      owner: 'root'
      group: 'root'
      mode: 0o755

  # Only mongodb-dump.service can run the script, since only the unit gets the decrypted login.
  - name: 'Deploy /usr/local/libexec/mongodb-dump'
    ansible.builtin.template:
      backup: true
      src: 'usr/local/libexec/mongodb-dump.j2'
      dest: '/usr/local/libexec/mongodb-dump'
      owner: 'root'
      group: 'root'
      mode: 0o755

  - name: 'rm -f /usr/local/sbin/mongodb-dump'
    ansible.builtin.file:
      path: '/usr/local/sbin/mongodb-dump'
      state: 'absent'

  - name: 'Deploy /etc/systemd/system/mongodb-dump.service'
    ansible.builtin.template:
      backup: true
      src: 'etc/systemd/system/mongodb-dump.service.j2'
      dest: '/etc/systemd/system/mongodb-dump.service'
      owner: 'root'
      group: 'root'
      mode: 0o644
    notify: 'mongodb: systemctl daemon-reload'

  - name: 'Deploy /etc/systemd/system/mongodb-dump.timer'
    ansible.builtin.template:
      backup: true
      src: 'etc/systemd/system/mongodb-dump.timer.j2'
      dest: '/etc/systemd/system/mongodb-dump.timer'
      owner: 'root'
      group: 'root'
      mode: 0o644
    register: '__mongodb__dump_timer_result'
    notify: 'mongodb: systemctl daemon-reload'

  - name: 'Reload systemd for the changed timers'
    ansible.builtin.include_role:
      name: 'shared'
      tasks_from: 'reload-changed-timers.yml'
    vars:
      shared__reload_changed_timers: '{{
          (__mongodb__dump_timer_result is changed) | ternary(["mongodb-dump.timer"], [])
        }}'

  - name: 'systemctl enable mongodb-dump.timer --now'
    ansible.builtin.systemd:
      name: 'mongodb-dump.timer'
      state: 'started'
      enabled: true

  tags:
    - 'mongodb'
    - 'mongodb:dump'


- ansible.builtin.debug:
    msg: 'NOTE: No user operations were executed as this is not the primary in the replica set. Make sure to run this role against the primary as well.'
  when:
    - 'not mongodb__is_writable_primary_result["transformed_output"]'
