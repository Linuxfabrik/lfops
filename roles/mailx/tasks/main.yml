- name: 'Set platform/version specific variables'
  ansible.builtin.import_role:
    name: 'shared'
    tasks_from: 'platform-variables.yml'
  tags:
    - 'always'


- block:

  - name: 'Install {{ __mailx__package }} package'
    ansible.builtin.package:
      name: '{{ __mailx__package }}'
      state: 'present'
    retries: 3 # ride out a brief outage of the package repository
    delay: 10

  - name: 'Deploy bash wrapper script that makes sending mail easier to /root/send-mail'
    ansible.builtin.template:
      backup: true
      dest: '/root/send-mail'
      mode: 0o755
      owner: 'root'
      src: 'root/send-mail.j2'

  tags:
    - 'mailx'
