- block:

  - name: 'Set platform/version specific variables'
    ansible.builtin.import_role:
      name: 'shared'
      tasks_from: 'platform-variables.yml'

  tags:
    - 'always'


- block:

  # grubby reports these outside args="...", where the role cannot see them, so it would add them
  # again on every run. Rejected up front instead of silently reporting a change forever.
  - name: 'Assert that no option grubby reports separately is managed'
    ansible.builtin.assert:
      that:
        - '__bootloader__configured_option_names | intersect(__bootloader__grubby_reserved_option_names) | length == 0'
      quiet: true
      fail_msg: 'grubby reports {{ __bootloader__configured_option_names | intersect(__bootloader__grubby_reserved_option_names) | join(", ") }} outside the kernel command line, so this role cannot manage it. Remove the entry from bootloader__cmdline_options__*_var.'
    when:
      - 'ansible_facts["os_family"] == "RedHat"'

  tags:
    # use 'always' so the validation runs even when other roles reference these variables.
    - 'always'


- block:

  - name: 'Combined cmdline options'
    ansible.builtin.debug:
      var: 'bootloader__cmdline_options__combined_var'

  # reset on every run, so a second run of the role in the same play does not inherit the
  # findings of the first one
  - name: 'Reset the state of a previous run'
    ansible.builtin.set_fact:
      __bootloader__missing_options: []
      __bootloader__reboot_needed: false
      __bootloader__superfluous_options: []

  # include_tasks is required here because import_tasks cannot handle dynamic variables.
  #
  # Deliberately not the first_found lookup from CONTRIBUTING.md ("OS-specific Tasks"). That
  # pattern ends in `skip: true`, which is right for a role whose platform file holds a few
  # extras on top of a common main.yml: a platform without one loses those extras and the rest
  # of the role still runs. Here the platform file IS the role, so skipping it would leave a run
  # that reports ok, changes nothing and never touches the kernel command line, on a host the
  # admin put in lfops_bootloader precisely to have it changed. Naming the file directly fails
  # the run instead, with "Could not find or access 'Suse.yml'" naming the family the role would
  # need a file for.
  - name: 'Perform platform specific tasks'
    ansible.builtin.include_tasks: '{{ ansible_facts["os_family"] }}.yml'

  - name: 'stat /usr/local/sbin/schedule-reboot'
    ansible.builtin.stat:
      path: '/usr/local/sbin/schedule-reboot'
    register: '__bootloader__schedule_reboot_stat_result'

  # absolute path on purpose: the default sudoers of the Red Hat family sets
  # `secure_path = /sbin:/bin:/usr/sbin:/usr/bin`, which leaves /usr/local/sbin out, so the bare
  # command name is not found under `become: true`. Verified against sudo on Rocky 9.
  - name: '/usr/local/sbin/schedule-reboot bootloader "kernel command line changed"'
    ansible.builtin.command:
      argv:
        - '/usr/local/sbin/schedule-reboot'
        - 'bootloader'
        - 'kernel command line changed'
    register: '__bootloader__schedule_reboot_result'
    changed_when: '__bootloader__schedule_reboot_result["rc"] == 0'
    when:
      - '__bootloader__reboot_needed | bool'
      - '__bootloader__schedule_reboot_stat_result["stat"]["exists"] | bool'

  - name: 'Report that a manual reboot is required'
    ansible.builtin.debug:
      msg: 'The kernel command line has changed. Please reboot the server manually to apply it.'
    when:
      - '__bootloader__reboot_needed | bool'
      - 'not __bootloader__schedule_reboot_stat_result["stat"]["exists"] | bool'

  tags:
    - 'bootloader'
