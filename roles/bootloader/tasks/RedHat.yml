# Red Hat family 8 keeps the kernel command line in the GRUB environment block and lets the boot
# entries reference it as `options $kernelopts`. grubby-bls writes it with
# `grub2-editenv /boot/grub2/grubenv set kernelopts=...` and reads it back the same way, so it
# reports success whether or not the boot loader can read the file: only the next boot shows the
# difference. grub2-efi-x64 ships /boot/grub2/grubenv as the relative symlink
# ../efi/EFI/<vendor>/grubenv. grub2-editenv follows it into the ESP (Red Hat patch "Make editenv
# chase symlinks including those across devices"), but GRUB resolves a symlink within the
# filesystem it is on (grub-core/fs/fshelp.c), where /boot/efi is only an empty mount point. Booted
# UEFI that does not matter, GRUB reads the copy in the ESP directly. Booted BIOS, the
# `[ -f ${config_directory}/grubenv ]` test in grub.cfg fails, load_env is never called, and the
# fallback `set kernelopts="root=... ro ${args}"` compiled into grub.cfg (10_linux) is used, so a
# changed option never reaches the kernel.
#
# On a BIOS boot the symlink is therefore replaced with a regular copy of its target, which is what
# an installed BIOS host has. The copy keeps the current kernelopts, and grub2-editenv writes to it
# from then on: it writes grubenv.new with mode 0644 and renames it over the resolved target. The
# copy in the ESP goes stale, which only a UEFI boot would read. The replacement survives package
# updates: /boot/grub2/grubenv is %config(noreplace) in grub2-common and grub2-efi-x64, so that
# grub2-efi does not overwrite an existing file (rhbz#1680572), and no scriptlet touches it. Images
# carrying both boot paths, such as the Rocky 8 GenericCloud image, have the symlink. Red Hat family
# 9 and later put the options in the boot entry itself.
#
# Verified against the sources of grub2-2.02-170.el8_10.3 and grubby-8.40-51.el8_10 on Rocky 8, and
# empirically: an upgrade of grub2-efi-x64 from 2.02-170.el8_10.2 to .3 keeps the regular file.
- name: 'stat /sys/firmware/efi'
  ansible.builtin.stat:
    path: '/sys/firmware/efi'
  register: '__bootloader__efi_stat_result'
  when:
    - 'ansible_facts["distribution_major_version"] | int == 8'

- name: 'stat /boot/grub2/grubenv'
  ansible.builtin.stat:
    path: '/boot/grub2/grubenv'
    follow: false
  register: '__bootloader__grubenv_stat_result'
  when:
    - 'ansible_facts["distribution_major_version"] | int == 8'

# Only while the symlink is there: once it is a regular file, grubby writes kernelopts to it, and a
# copy from the stale ESP file would revert the command line. With follow: false the copy module
# replaces a symlink at dest instead of writing through it (verified against the source of
# ansible.builtin.copy in ansible-core 2.16). 0644 is the mode grub2-editenv leaves on every write.
- name: 'cp --remove-destination "$(readlink --canonicalize /boot/grub2/grubenv)" /boot/grub2/grubenv'
  ansible.builtin.copy:
    remote_src: true
    src: '{{ __bootloader__grubenv_stat_result["stat"]["lnk_source"] }}'
    dest: '/boot/grub2/grubenv'
    follow: false
    owner: 'root'
    group: 'root'
    mode: 0o644
  when:
    - 'ansible_facts["distribution_major_version"] | int == 8'
    - 'not __bootloader__efi_stat_result["stat"]["exists"] | bool'
    - '__bootloader__grubenv_stat_result["stat"]["islnk"] | d(false) | bool'


# grubby writes the boot entries on the Red Hat family, so the role calls it directly instead of
# going through fedora.linux_system_roles.bootloader. That role rewrites GRUB_TIMEOUT in
# /etc/default/grub and every `set timeout=` in grub.cfg on each run, which also replaces the
# timeouts of the menu_auto_hide and menu_show_once blocks (`set timeout="${menu_show_once_timeout}"`
# becomes a literal), and its bootloader_settings module declares supports_check_mode without ever
# reading module.check_mode, so a --check run rewrites the boot entries for real.
# Verified against grubby 8.40 on Rocky 9.
- name: 'grubby --info=ALL'
  ansible.builtin.command:
    cmd: 'grubby --info=ALL'
  register: '__bootloader__grubby_info_result'
  changed_when: false
  check_mode: false # read-only, and it has to run in check mode too to report what would change

# The comparison covers every boot entry, not just the default one, and the option is escaped
# before it goes into the pattern, so a dot in an option name matches a dot.
- name: 'Determine the options missing from at least one boot entry'
  ansible.builtin.set_fact:
    __bootloader__missing_options: '{{ __bootloader__missing_options + [item] }}'
  loop: '{{ __bootloader__wanted_options }}'
  when:
    - '__bootloader__current_args | reject("search", "(^| )" ~ (item | regex_escape) ~ "( |$)")
        | list | length > 0'

- name: 'Determine the options still set on at least one boot entry'
  ansible.builtin.set_fact:
    __bootloader__superfluous_options: '{{ __bootloader__superfluous_options + [item] }}'
  loop: '{{ __bootloader__unwanted_option_names }}'
  when:
    - '__bootloader__current_args | select("search", "(^| )" ~ (item | regex_escape) ~ "(=| |$)")
        | list | length > 0'

# a `command` task is skipped in check mode, so without this a dry run would report nothing to do
# although there is. This reports what would happen and marks the run as changed.
- name: 'Report the pending kernel command line change'
  ansible.builtin.debug:
    msg: 'grubby --update-kernel=ALL would add [{{ __bootloader__missing_options | join(" ") }}]
      and remove [{{ __bootloader__superfluous_options | join(" ") }}]'
  changed_when: true
  when:
    - 'ansible_check_mode | bool'
    - '(__bootloader__missing_options | length > 0) or (__bootloader__superfluous_options | length > 0)'

- name: 'grubby --update-kernel=ALL --remove-args={{ __bootloader__superfluous_options | join(" ") }}'
  ansible.builtin.command:
    cmd: 'grubby --update-kernel=ALL --remove-args={{ __bootloader__superfluous_options
        | join(" ") | quote }}'
  changed_when: true
  when:
    - '__bootloader__superfluous_options | length > 0'

- name: 'grubby --update-kernel=ALL --args={{ __bootloader__missing_options | join(" ") }}'
  ansible.builtin.command:
    cmd: 'grubby --update-kernel=ALL --args={{ __bootloader__missing_options | join(" ") | quote }}'
  changed_when: true
  when:
    - '__bootloader__missing_options | length > 0'

- name: 'Remember that the kernel command line changed'
  ansible.builtin.set_fact:
    __bootloader__reboot_needed: true
  when:
    - '(__bootloader__missing_options | length > 0) or (__bootloader__superfluous_options | length > 0)'
