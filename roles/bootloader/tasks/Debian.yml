# grub-mkconfig sources /etc/default/grub first and every /etc/default/grub.d/*.cfg after it, so
# a drop-in overrides the packaged configuration without editing a file the package owns.
# Verified against grub-common 2.12-9+deb13u2 on Debian 13 and 2.12-1ubuntu7.3 on Ubuntu 24.04.
- name: 'Deploy {{ __bootloader__grub_dropin_path }}'
  ansible.builtin.template:
    backup: true
    src: 'etc/default/grub.d/z00-lfops.cfg.j2'
    dest: '{{ __bootloader__grub_dropin_path }}'
    owner: 'root'
    group: 'root'
    mode: 0o644
  register: '__bootloader__grub_dropin_result'
  when:
    - '__bootloader__wanted_options | length > 0'

# nothing left to set means the drop-in has nothing to say, so it goes away instead of staying
# behind as an empty file
- name: 'rm {{ __bootloader__grub_dropin_path }}'
  ansible.builtin.file:
    path: '{{ __bootloader__grub_dropin_path }}'
    state: 'absent'
  register: '__bootloader__grub_dropin_removed_result'
  when:
    - '__bootloader__wanted_options | length == 0'

# update-grub is a wrapper that execs grub-mkconfig, which in turn calls grub-probe and friends,
# all of them in /usr/sbin. An unprivileged login has no /usr/sbin in its PATH, and both `su` and
# a sudoers file without secure_path hand that PATH to the task, so the command needs one of its
# own. Verified on Debian 13, where the run otherwise ends in
# "/usr/sbin/update-grub: 3: exec: grub-mkconfig: not found".
- name: '{{ __bootloader__update_grub_command }}'
  ansible.builtin.command:
    cmd: '{{ __bootloader__update_grub_command }}'
  environment:
    PATH: '/usr/sbin:/usr/bin:/sbin:/bin'
  changed_when: true
  when:
    - '(__bootloader__grub_dropin_result is changed) or (__bootloader__grub_dropin_removed_result is changed)'

- name: 'Remember that the kernel command line changed'
  ansible.builtin.set_fact:
    __bootloader__reboot_needed: true
  when:
    - '(__bootloader__grub_dropin_result is changed) or (__bootloader__grub_dropin_removed_result is changed)'
