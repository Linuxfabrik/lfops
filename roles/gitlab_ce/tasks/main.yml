- block:

  - name: 'Get the list of installed packages'
    ansible.builtin.package_facts:  # yamllint disable-line rule:empty-values
    check_mode: false # run task even if `--check` is specified

  # gitlab.rb uses the gitlab_rails['nginx'] and registry['nginx'] keys, which GitLab only
  # knows since 19.2; older versions would silently ignore them
  - name: 'Assert that GitLab is 19.2 or newer'
    ansible.builtin.assert:
      that:
        - 'gitlab_ce__version | default("") | length == 0 or gitlab_ce__version is version("19.2", ">=")'
        - '"gitlab-ce" not in ansible_facts["packages"] or ansible_facts["packages"]["gitlab-ce"][0]["version"] is version("19.2", ">=")'
      quiet: true
      fail_msg: 'This role needs GitLab 19.2 or newer (installed: {{ ansible_facts["packages"]["gitlab-ce"][0]["version"] | default("none") }}, gitlab_ce__version: {{ gitlab_ce__version | default("unset") }}). Upgrade GitLab first, following the GitLab upgrade path.'

  - name: 'install gitlab-ce'
    ansible.builtin.package:
      name: 'gitlab-ce'
      state: 'present'
    retries: 3 # ride out a brief outage of the package repository
    delay: 10
    environment:
      EXTERNAL_URL: '{{ gitlab_ce__rb_external_url }}'
    when: 'not (gitlab_ce__version is defined and gitlab_ce__version | length > 0)'

  - name: 'install gitlab-ce-{{ gitlab_ce__version }}'
    ansible.builtin.package:
      name: 'gitlab-ce-{{ gitlab_ce__version }}'
      state: 'present'
    retries: 3 # ride out a brief outage of the package repository
    delay: 10
    environment:
      EXTERNAL_URL: '{{ gitlab_ce__rb_external_url }}'
    when: 'gitlab_ce__version is defined and gitlab_ce__version | length > 0'

  tags:
    - 'gitlab_ce'


- block:

  - name: 'mkdir -p /backup/gitlab'
    ansible.builtin.file:
      path: '/backup/gitlab'
      state: 'directory'
      owner: 'git'
      group: 'root'
      mode: 0o700

  - name: 'Deploy /etc/systemd/system/gitlab-dump.service'
    ansible.builtin.template:
      backup: true
      src: 'etc/systemd/system/gitlab-dump.service.j2'
      dest: '/etc/systemd/system/gitlab-dump.service'
      owner: 'root'
      group: 'root'
      mode: 0o644
    notify: 'gitlab_ce: systemctl daemon-reload'

  - name: 'Deploy /etc/systemd/system/gitlab-dump.timer'
    ansible.builtin.template:
      backup: true
      src: 'etc/systemd/system/gitlab-dump.timer.j2'
      dest: '/etc/systemd/system/gitlab-dump.timer'
      owner: 'root'
      group: 'root'
      mode: 0o644
    register: '__gitlab_ce__dump_timer_result'
    notify: 'gitlab_ce: systemctl daemon-reload'

  - name: 'Reload systemd for the changed timers'
    ansible.builtin.include_role:
      name: 'shared'
      tasks_from: 'reload-changed-timers.yml'
    vars:
      shared__reload_changed_timers: '{{
          (__gitlab_ce__dump_timer_result is changed) | ternary(["gitlab-dump.timer"], [])
        }}'

  - name: 'systemctl enable gitlab-dump.timer --now'
    ansible.builtin.systemd:
      name: 'gitlab-dump.timer'
      state: 'started'
      enabled: true

  - name: 'Deploy /etc/gitlab/gitlab.rb'
    ansible.builtin.template:
      backup: true
      src: 'etc/gitlab/gitlab.rb.j2'
      dest: '/etc/gitlab/gitlab.rb'
      owner: 'root'
      group: 'root'
      mode: 0o600
    register: 'gitlab_ce___gitlab_rb_template_result'

  - name: 'Remove rpmnew / rpmsave (and Debian equivalents)'
    ansible.builtin.include_role:
      name: 'shared'
      tasks_from: 'remove-rpmnew-rpmsave.yml'
    vars:
      shared__remove_rpmnew_rpmsave_config_file: '/etc/gitlab/gitlab.rb'

  - name: 'gitlab-ctl reconfigure'
    ansible.builtin.command: |-
      gitlab-ctl reconfigure
    changed_when: true
    when: 'gitlab_ce___gitlab_rb_template_result is changed' # noqa no-handler (reconfigure and restart run in this order right after gitlab.rb changed)

  # `gitlab-ctl` waits SVWAIT seconds for a service to come back (`export SVWAIT=${SVWAIT:-30}`
  # in omnibus-gitlab config/software/gitlab-ctl.rb), and `sv restart` exits non-zero with
  # "timeout: run: puma ..." when it has not, although the restart carries on (runit 2.1.2
  # src/sv.c). Puma finishes running requests before it exits, which takes longer than 30
  # seconds on an instance that has been running for a while.
  - name: 'gitlab-ctl restart'
    ansible.builtin.command: |-
      gitlab-ctl restart
    environment:
      SVWAIT: '120'
    register: '__gitlab_ce__restart_result'
    changed_when: true
    when: 'gitlab_ce___gitlab_rb_template_result is changed' # noqa no-handler (reconfigure and restart run in this order right after gitlab.rb changed)

  # GitLab answers "Bad Gateway" until Puma is up again. /-/readiness is open to 127.0.0.0/8 by default
  # (gitlab_rails['monitoring_whitelist']). Skipped under `--check`, where the restart is.
  - name: 'Wait for GitLab to be ready'
    ansible.builtin.uri:
      url: '{{ gitlab_ce__rb_nginx_listen_https | bool | ternary("https", "http") }}://127.0.0.1:{{ gitlab_ce__rb_nginx_listen_port }}/-/readiness'
      validate_certs: false # the certificate is issued for the external name, not for 127.0.0.1
    register: '__gitlab_ce__readiness_result'
    until: '__gitlab_ce__readiness_result is not failed'
    retries: 30
    delay: 10
    when: '__gitlab_ce__restart_result is changed' # noqa no-handler (waits right after the restart)

  tags:
    - 'gitlab_ce'
    - 'gitlab_ce:configure'
