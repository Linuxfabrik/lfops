name: 'Linuxfabrik: Release'

on:
  push:
    tags:
      - 'v*'

# modify the default permissions granted to the GITHUB_TOKEN
permissions: 'read-all'

jobs:
  release:
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'write' # to push to the repo and create the release

    steps:

      - name: 'Harden the runner (Audit all outbound calls)'
        uses: 'step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a' # v2.22.4
        with:
          egress-policy: 'audit'

      - name: 'Create GitHub Release for ${{ github.ref_name }}'
        uses: 'softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3' # v3.0.4
        with:
          tag_name: '${{ github.ref_name }}'
          body: |
            Release Notes/CHANGELOG at https://github.com/Linuxfabrik/lfops/blob/main/CHANGELOG.md
          prerelease: false
