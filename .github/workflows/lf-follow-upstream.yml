name: 'Linuxfabrik: Follow upstream'

# Opens an issue for every upstream release whose packaged configuration LFOps does not
# cover yet, see tools/follow-upstream-issues. Applications whose repository needs a
# token (Collabora Enterprise) are skipped here; their releases are checked on a machine
# that holds the token, so the token never becomes a repository secret.

on:
  schedule:
    - cron: '30 5 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: 'read'

jobs:
  check:
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      issues: 'write'
    steps:
      - name: 'Harden the runner (Audit all outbound calls)'
        uses: 'step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43' # v2.22.3
        with:
          egress-policy: 'audit'

      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          persist-credentials: false

      - name: 'Set up Python'
        uses: 'actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0' # v7.1.0
        with:
          python-version: '3.13'

      - name: 'Install PyYAML'
        run: 'pip install --require-hashes --requirement .github/follow-upstream/requirements.txt'

      # The repositories are queried in a Rocky Linux container; podman is preinstalled
      # on the runner.
      - name: 'Open an issue per release LFOps does not cover yet'
        env:
          GH_REPO: '${{ github.repository }}'
          GH_TOKEN: '${{ github.token }}'
        run: 'tools/follow-upstream-issues'
