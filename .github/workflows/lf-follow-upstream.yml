name: 'Linuxfabrik: Follow upstream'

# Opens an issue for every upstream release whose packaged configuration LFOps does not
# cover yet, see tools/follow-upstream-issues. Applications whose repository needs a
# token (Collabora Enterprise) are skipped here; their releases are checked on a machine
# that holds the token, so the token never becomes a repository secret.

on:
  schedule:
    - cron: '30 5 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: 'read'

jobs:
  check:
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      issues: 'write'
    steps:
      - name: 'Harden the runner (Audit all outbound calls)'
        uses: 'step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25' # v2.22.1
        with:
          egress-policy: 'audit'

      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          persist-credentials: false

      - name: 'Set up Python'
        uses: 'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97' # v7.0.0
        with:
          python-version: '3.13'

      - name: 'Install PyYAML'
        run: 'pip install --require-hashes --requirement .github/follow-upstream/requirements.txt'

      # The repositories are queried in a Rocky Linux container; podman is preinstalled
      # on the runner.
      - name: 'Open an issue per release LFOps does not cover yet'
        env:
          GH_REPO: '${{ github.repository }}'
          GH_TOKEN: '${{ github.token }}'
        run: 'tools/follow-upstream-issues'
