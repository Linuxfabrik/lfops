name: 'CodeQL'

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  schedule:
    - cron: '0 5 * * 5'

permissions:
  contents: 'read'

# A newer push to the same pull request makes the running analysis obsolete.
# Pushes to main are left to finish.
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  # A pull request is only analysed for the languages it touches. Pushes to
  # main and the weekly run analyse everything.
  changes:
    name: 'Detect relevant changes'
    runs-on: 'ubuntu-latest'
    permissions:
      pull-requests: 'read'
    outputs:
      languages: '${{ steps.filter.outputs.languages }}'
    steps:
      - name: 'Harden Runner'
        uses: 'step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43' # v2.22.3
        with:
          egress-policy: 'audit'

      # The files API returns at most 3000 files, so a pull request that
      # large analyses everything.
      - name: 'Determine the languages to analyse'
        id: 'filter'
        env:
          EVENT_NAME: '${{ github.event_name }}'
          GH_TOKEN: '${{ github.token }}'
          PR_NUMBER: '${{ github.event.pull_request.number }}'
        run: |
          languages='["actions","python"]'
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')"
            if [[ "$(wc --lines <<< "$files")" -lt 3000 ]]; then
              languages="$(jq --compact-output --null-input --raw-input '
                [inputs] as $files
                | [
                    if any($files[]; test("^\\.github/(actions|workflows)/")) then "actions" else empty end,
                    if any($files[]; test("\\.py$|^\\.github/workflows/codeql\\.yml$")) then "python" else empty end
                  ]' <<< "$files")"
            fi
          fi
          echo "languages=${languages}" | tee --append "$GITHUB_OUTPUT"

  analyze:
    name: 'Analyze'
    needs: 'changes'
    if: "needs.changes.outputs.languages != '[]'"
    runs-on: 'ubuntu-latest'
    permissions:
      actions: 'read'
      contents: 'read'
      security-events: 'write'

    strategy:
      fail-fast: false
      matrix:
        language: '${{ fromJSON(needs.changes.outputs.languages) }}'

    steps:
      - name: 'Harden Runner'
        uses: 'step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43' # v2.22.3
        with:
          egress-policy: 'audit'

      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

      - name: 'Initialize CodeQL'
        uses: 'github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370' # v4.39.1
        with:
          languages: '${{ matrix.language }}'

      - name: 'Autobuild'
        uses: 'github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370' # v4.39.1

      - name: 'Perform CodeQL Analysis'
        uses: 'github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370' # v4.39.1
        with:
          category: '/language:${{ matrix.language }}'

  # The only check the branch ruleset requires from this workflow. A job
  # skipped above never reports its matrix names, so requiring those would
  # block every pull request that skips them. Skipped counts as passed here.
  result:
    name: 'CodeQL'
    if: 'always()'
    needs:
      - 'analyze'
      - 'changes'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Harden Runner'
        uses: 'step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43' # v2.22.3
        with:
          egress-policy: 'audit'

      - name: 'Fail unless every job passed or was skipped'
        env:
          NEEDS: '${{ toJSON(needs) }}'
        run: |
          jq --exit-status 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS"
