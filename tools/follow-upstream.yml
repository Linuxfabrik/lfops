# Applications whose LFOps templates are copies of the packaged configuration file, one
# template per release series. `tools/follow-upstream` reads this file to fetch the packaged
# files and merge upstream changes into the templates. See
# `.claude/skills/lfops-follow-upstream/SKILL.md` for the workflow around it.
#
# Per application:
#
# * `upstream`: project names as newreleases.io reports them, used to map a release
#   notice to this entry.
# * `series_parts`: how many version components form a release series that gets its own
#   template (2: one template per `7.2`, 3: one per `26.04.5`).
# * `deb_repo`: optional, APT repository serving every release of a series, written like
#   a sources.list line (`<url> <suite> <component>`), `{series}` is replaced. Without it,
#   only the RPM is checked.
# * `gpg_key`: the key the packages (RPM) and the repository metadata (DEB) are signed
#   with, the same one the `repo_*` role imports. `{series}` is replaced. A package that
#   is not signed with it is not extracted.
# * `series_gpg_key`: optional, `{<series>: {url: <key>, sha1: <bool>}}` for a series
#   signed with another key than `gpg_key`. `sha1: true` lets the RPM check accept a key
#   bound with a SHA-1 signature, which the default crypto policy of Rocky 9 rejects.
# * `rpm_repo`: Yum repository serving every release of a series, `{series}` is replaced.
#   `tools/follow-upstream --check` looks for new releases here.
# * `repo_series_parts`: optional, how many version components `{series}` has in the
#   repository URLs, if not `series_parts` (2: one repository per `26.04`).
# * `series_suffix`: optional, appended to the series in the template header and in
#   `supported_versions` (`.x`: series `3` is named `3.x` there). `{series}` in paths
#   and URLs stays without it.
#
# A repository URL can reference an environment variable, e.g. a customer token:
# `https://example.com/repo-${EXAMPLE_TOKEN}/`. An application whose variable is not set
# is skipped by `--check`, so the token never has to be in the repository or the CI.
# * `files`: the packaged files and the templates built from them, sorted by `path`.
#   * `path`: the packaged file. Usually below /etc, but it can also be a sample the
#     package copies to /etc on installation (`/usr/share/grafana/conf/sample.ini`).
#   * `template`: `{series}` is replaced. A template without `{series}` serves every
#     series and is merged in place.
#   * `supported_versions`: the vars file and the list that has to contain every series
#     a template exists for. Only for templates with `{series}`. `<file>:<var>.<key>`
#     names the list below a key of a dictionary, e.g. one list per OS family.
#   * `deb_path`: where the DEB ships the file, if not at `path`.
#   * `format`: optional, `deb` builds the template from the DEB file instead of the RPM
#     file, for a Debian family template whose packaged file differs from the RPM one.
#     The file then needs one entry per format, and RPM and DEB are not compared.
#     `--check` still looks for new releases in the RPM repository only.
#   * `copies`: further templates that stay identical to `template`, e.g. the Debian
#     counterpart of a file the RPM ships under another path. They get the merge result.
# * `ignore`: packaged files below /etc that LFOps deliberately does not template.
#   Every other file a release ships is reported, so a file upstream adds is noticed. An
#   entry ending in `/` ignores every file below that directory.
#
# The comment above each application records how its install scripts treat the templated
# files, for the release that was checked. `tools/follow-upstream` reports later changes
# to the scripts.

# Install scripts (graylog-server and graylog-datanode 7.2.1, RPM and DEB): create the
# user, the directories and node-id, never touch the templated files.
graylog:
  upstream:
    - 'Graylog2/graylog2-server'
  series_parts: 2
  deb_repo: 'https://packages.graylog2.org/repo/debian/ stable {series}'
  gpg_key: 'https://packages.graylog2.org/repo/debian/pubkey.gpg'
  rpm_repo: 'https://downloads.graylog.org/repo/el/stable/{series}/x86_64/'
  files:
    - package: 'graylog-datanode'
      path: '/etc/graylog/datanode/datanode.conf'
      template: 'roles/graylog_datanode/templates/etc/graylog/datanode/{series}-datanode.conf.j2'
      supported_versions: 'roles/graylog_datanode/vars/main.yml:__graylog_datanode__supported_versions'
    - package: 'graylog-datanode'
      path: '/etc/graylog/datanode/jvm.options'
      template: 'roles/graylog_datanode/templates/etc/graylog/datanode/jvm.options.j2'
    - package: 'graylog-server'
      path: '/etc/graylog/server/server.conf'
      template: 'roles/graylog_server/templates/etc/graylog/server/{series}-server.conf.j2'
      supported_versions: 'roles/graylog_server/vars/main.yml:__graylog_server__supported_versions'
    - package: 'graylog-server'
      path: '/etc/sysconfig/graylog-server'
      deb_path: '/etc/default/graylog-server'
      template: 'roles/graylog_server/templates/etc/sysconfig/graylog-server.j2'
      copies:
        - 'roles/graylog_server/templates/etc/default/graylog-server.j2'
  ignore:
    # the packaged defaults are used
    - '/etc/default/graylog-datanode'
    - '/etc/graylog/datanode/log4j2.xml'
    - '/etc/graylog/server/log4j2.xml'
    - '/etc/logrotate.d/graylog-server'
    - '/etc/needrestart/conf.d/500-graylog.conf'
    - '/etc/sysconfig/graylog-datanode'

# Install scripts (coolwsd 26.04.5.1, RPM): coolwsd.xml is only rewritten by
# `coolconfig migrateconfig --write`, which runs if a /etc/loolwsd/loolwsd.xml of
# Collabora Online 6.4 or older exists. `coolconfig generate-proof-key` writes the
# separate /etc/coolwsd/proof_key.
collabora_code:
  series_parts: 3
  gpg_key: 'https://www.collaboraoffice.com/repos/CollaboraOnline/CODE-rpm/repodata/repomd.xml.key'
  rpm_repo: 'https://www.collaboraoffice.com/repos/CollaboraOnline/CODE-rpm/'
  files:
    - package: 'coolwsd'
      path: '/etc/coolwsd/coolwsd.xml'
      template: 'roles/collabora/templates/etc/coolwsd/{series}-coolwsd-code.xml.j2'
      supported_versions: 'roles/collabora/vars/main.yml:__collabora__supported_versions_code'
  ignore:
    # the packaged defaults are used, LFOps does not configure a reverse proxy here
    - '/etc/apache2/conf-available/coolwsd.conf'
    - '/etc/coolwsd/coolkitconfig.xcu'
    - '/etc/httpd/conf/coolwsd.conf'
    - '/etc/nginx/snippets/coolwsd.conf'
    - '/etc/pam.d/coolwsd'

# Install scripts: not checked, the repository needs the customer token. Probably the
# same as collabora_code.
collabora_enterprise:
  series_parts: 3
  repo_series_parts: 2
  gpg_key: 'https://www.collaboraoffice.com/repos/CollaboraOnline/{series}/customer-rpm-${COLLABORA_CUSTOMER_TOKEN}/repodata/repomd.xml.key'
  rpm_repo: 'https://www.collaboraoffice.com/repos/CollaboraOnline/{series}/customer-rpm-${COLLABORA_CUSTOMER_TOKEN}/'
  files:
    - package: 'coolwsd'
      path: '/etc/coolwsd/coolwsd.xml'
      template: 'roles/collabora/templates/etc/coolwsd/{series}-coolwsd.xml.j2'
      supported_versions: 'roles/collabora/vars/main.yml:__collabora__supported_versions_enterprise'
  ignore:
    # the packaged defaults are used, LFOps does not configure a reverse proxy here
    - '/etc/apache2/conf-available/coolwsd.conf'
    - '/etc/coolwsd/coolkitconfig.xcu'
    - '/etc/httpd/conf/coolwsd.conf'
    - '/etc/nginx/snippets/coolwsd.conf'
    - '/etc/pam.d/coolwsd'

# Elasticsearch, Kibana and Logstash are released in lockstep, one repository per major
# version. The templates have no `{series}` and serve every major version the roles
# support, but only the newest major version (9.x) is followed.
#
# Install scripts (elasticsearch, kibana and logstash 9.5.5, RPM and DEB):
# * elasticsearch: on the first installation, `elasticsearch-cli auto-configure-node`
#   appends a security block to elasticsearch.yml and creates certs/ and the keystore.
#   The template carries its own version of that block. Upgrades leave the file alone.
# * kibana: set root:kibana 0660 on kibana.yml, as the kibana role does.
# * logstash: on every installation and upgrade, `sed` uncomments `# path.logs:` and
#   `# path.data:` in logstash.yml (both set by the template) and sets
#   /etc/default/logstash to 0600.
elastic:
  upstream:
    - 'elastic/elasticsearch'
    - 'elastic/kibana'
    - 'elastic/logstash'
  series_parts: 1
  deb_repo: 'https://artifacts.elastic.co/packages/{series}.x/apt stable main'
  gpg_key: 'https://artifacts.elastic.co/GPG-KEY-elasticsearch'
  rpm_repo: 'https://artifacts.elastic.co/packages/{series}.x/yum/'
  files:
    - package: 'logstash'
      path: '/etc/default/logstash'
      template: 'roles/logstash/templates/etc/default/logstash.j2'
    - package: 'elasticsearch'
      path: '/etc/elasticsearch/elasticsearch.yml'
      template: 'roles/elasticsearch/templates/etc/elasticsearch/elasticsearch.yml.j2'
    - package: 'elasticsearch'
      path: '/etc/elasticsearch/log4j2.properties'
      template: 'roles/elasticsearch/templates/etc/elasticsearch/log4j2.properties.j2'
    - package: 'kibana'
      path: '/etc/kibana/kibana.yml'
      template: 'roles/kibana/templates/etc/kibana/kibana.yml.j2'
    - package: 'logstash'
      path: '/etc/logstash/logstash.yml'
      template: 'roles/logstash/templates/etc/logstash/logstash.yml.j2'
    - package: 'logstash'
      path: '/etc/logstash/pipelines.yml'
      template: 'roles/logstash/templates/etc/logstash/pipelines.yml.j2'
    - package: 'elasticsearch'
      path: '/etc/sysconfig/elasticsearch'
      deb_path: '/etc/default/elasticsearch'
      template: 'roles/elasticsearch/templates/etc/sysconfig/elasticsearch.j2'
  ignore:
    # the packaged defaults are used
    - '/etc/default/kibana'
    - '/etc/elasticsearch/elasticsearch-plugins.example.yml'
    - '/etc/elasticsearch/jvm.options'
    - '/etc/elasticsearch/role_mapping.yml'
    - '/etc/elasticsearch/roles.yml'
    - '/etc/elasticsearch/users'
    - '/etc/elasticsearch/users_roles'
    - '/etc/kibana/node.options'
    - '/etc/logstash/jvm.options'
    - '/etc/logstash/log4j2.properties'
    - '/etc/logstash/logstash-sample.conf'
    - '/etc/logstash/startup.options'
    - '/etc/sysconfig/kibana'

# Install scripts (grafana 13.2.4, RPM and DEB): on the first installation, copy
# sample.ini and ldap.toml unchanged to /etc/grafana, then set root:grafana 0640, as the
# grafana role does.
grafana:
  upstream:
    - 'grafana/grafana'
  series_parts: 2
  deb_repo: 'https://apt.grafana.com stable main'
  gpg_key: 'https://rpm.grafana.com/gpg.key'
  rpm_repo: 'https://rpm.grafana.com/'
  files:
    # the package copies these samples to /etc/grafana on installation
    - package: 'grafana'
      path: '/usr/share/grafana/conf/ldap.toml'
      template: 'roles/grafana/templates/etc/grafana/ldap.toml.j2'
    - package: 'grafana'
      path: '/usr/share/grafana/conf/sample.ini'
      template: 'roles/grafana/templates/etc/grafana/grafana.ini.j2'
  ignore:
    # the packaged defaults are used
    - '/etc/default/grafana-server'
    - '/etc/sysconfig/grafana-server'

# Install scripts (icingadb 1.5.1, RPM and DEB): create the user and register the
# systemd unit. The DEB postinst also sets the owner of /etc/icingadb and the mode 0640
# of config.yml on every run, as the icingadb role does. None touch the file content.
# Icinga's RHEL repository is for subscribers only, so the public Fedora repository
# stands in for it. It has no version-independent path: before Fedora 44 drops out,
# bump the release in `rpm_repo` to a newer Fedora whose repository already serves the
# release of the `Based on` line.
icingadb:
  upstream:
    - 'Icinga/icingadb'
  series_parts: 2
  deb_repo: 'https://packages.icinga.com/debian icinga-trixie main'
  gpg_key: 'https://packages.icinga.com/icinga.key'
  rpm_repo: 'https://packages.icinga.com/fedora/44/release/'
  files:
    - package: 'icingadb'
      path: '/etc/icingadb/config.yml'
      template: 'roles/icingadb/templates/etc/icingadb/config.yml.j2'

# Install scripts (influxdb 1.13.1, RPM and DEB): only move an old /etc/opt/influxdb
# to /etc/influxdb, keeping a backup of influxdb.conf. The repositories of all EL
# versions serve the same build, so the EL 9 repository stands for all.
influxdb:
  upstream:
    - 'influxdata/influxdb'
  series_parts: 2
  deb_repo: 'https://repos.influxdata.com/debian stable main'
  gpg_key: 'https://repos.influxdata.com/influxdata-archive.key'
  rpm_repo: 'https://repos.influxdata.com/rhel/9/x86_64/stable/'
  files:
    - package: 'influxdb'
      path: '/etc/influxdb/influxdb.conf'
      template: 'roles/influxdb/templates/etc/influxdb/influxdb.conf.j2'

# One template per major version (`3.x-opensearch.yml.j2`); sysconfig serves both and
# follows the newest major only. The RPM ships the environment file as
# /etc/sysconfig/opensearch. The DEB of 3.x ships it as /etc/default/opensearch, plus an
# outdated copy as /etc/sysconfig/opensearch (2.x: the other way round). The systemd unit
# reads both, /etc/sysconfig last, and the opensearch role deploys /etc/sysconfig on
# every platform.
#
# Install scripts (opensearch 2.19.7 and 3.9.0, RPM and DEB): create the user, append
# the Performance Analyzer settings to jvm.options once, chown /etc/opensearch to
# opensearch, and on every installation and upgrade run the demo security configuration.
# It appends a demo `plugins.security` block to opensearch.yml, but quits if the file
# already sets a `plugins.security` key, which the template always does.
opensearch:
  upstream:
    - 'opensearch-project/OpenSearch'
  series_parts: 1
  series_suffix: '.x'
  deb_repo: 'https://artifacts.opensearch.org/releases/bundle/opensearch/{series}.x/apt stable main'
  gpg_key: 'https://artifacts.opensearch.org/publickeys/opensearch-release.pgp'
  series_gpg_key:
    '2':
      url: 'https://artifacts.opensearch.org/publickeys/opensearch.pgp'
      sha1: true
  rpm_repo: 'https://artifacts.opensearch.org/releases/bundle/opensearch/{series}.x/yum/'
  files:
    - package: 'opensearch'
      path: '/etc/opensearch/opensearch.yml'
      template: 'roles/opensearch/templates/etc/opensearch/{series}.x-opensearch.yml.j2'
      supported_versions: 'roles/opensearch/vars/main.yml:__opensearch__supported_versions'
    - package: 'opensearch'
      path: '/etc/sysconfig/opensearch'
      deb_path: '/etc/default/opensearch'
      template: 'roles/opensearch/templates/etc/sysconfig/opensearch.j2'
  ignore:
    # the packaged defaults are used
    - '/etc/init.d/opensearch'
    - '/etc/opensearch/fips_java.security'
    - '/etc/opensearch/jvm.options'
    - '/etc/opensearch/log4j2.properties'
    - '/etc/opensearch/opensearch-notifications-core/notifications-core.yml'
    - '/etc/opensearch/opensearch-notifications/notifications.yml'
    - '/etc/opensearch/opensearch-observability/observability.yml'
    - '/etc/opensearch/opensearch-performance-analyzer/'  # 2.x only
    - '/etc/opensearch/opensearch-reports-scheduler/reports-scheduler.yml'
    - '/etc/opensearch/opensearch-security/action_groups.yml'
    - '/etc/opensearch/opensearch-security/allowlist.yml'
    - '/etc/opensearch/opensearch-security/audit.yml'
    - '/etc/opensearch/opensearch-security/config.yml'
    - '/etc/opensearch/opensearch-security/nodes_dn.yml'
    - '/etc/opensearch/opensearch-security/opensearch.yml.example'
    - '/etc/opensearch/opensearch-security/roles.yml'
    - '/etc/opensearch/opensearch-security/roles_mapping.yml'
    - '/etc/opensearch/opensearch-security/tenants.yml'
    - '/etc/opensearch/opensearch-security/whitelist.yml'  # 2.x only
    # Sigma detection rules of the Security Analytics plugin, about 2300 files
    - '/etc/opensearch/opensearch-security-analytics/'
    # the opensearch role writes it from scratch, it is no copy of the packaged file
    - '/etc/opensearch/opensearch-security/internal_users.yml'

# Install scripts (proxysql 3.0.11, RPM): create the user and apply the systemd preset to
# proxysql.service on the first installation, never touch the templated file. One
# template serves 2.7 and 3.0. The DEB is not checked: the role supports RHEL only, and
# upstream's flat APT repository (`<url> ./`) is not supported by this tool.
proxysql:
  upstream:
    - 'sysown/proxysql'
  series_parts: 2
  gpg_key: 'https://repo.proxysql.com/ProxySQL/proxysql-{series}.x/repo_pub_key'
  rpm_repo: 'https://repo.proxysql.com/ProxySQL/proxysql-{series}.x/centos/9/'
  files:
    - package: 'proxysql'
      path: '/etc/proxysql.cnf'
      template: 'roles/proxysql/templates/etc/proxysql.cnf.j2'
  ignore:
    # the packaged defaults are used
    - '/etc/logrotate.d/proxysql'
    - '/etc/systemd/system/proxysql-initial.service'
    - '/etc/systemd/system/proxysql.service'

# Install scripts (telegraf 1.40.2, RPM): create the user and group, move an old
# /etc/opt/telegraf to /etc/telegraf, keeping a backup of telegraf.conf, enable the
# service and try-restart it on upgrade. Their copy of telegraf.conf.sample to a missing
# telegraf.conf never runs, the RPM ships no sample but telegraf.conf itself. They never
# modify an existing telegraf.conf. Only the RPM is followed, the telegraf role supports
# the RHEL family only. The repositories of all EL versions serve the same build, so the
# EL 9 repository stands for all.
telegraf:
  upstream:
    - 'influxdata/telegraf'
  series_parts: 2
  gpg_key: 'https://repos.influxdata.com/influxdata-archive.key'
  rpm_repo: 'https://repos.influxdata.com/rhel/9/x86_64/stable/'
  files:
    - package: 'telegraf'
      path: '/etc/telegraf/telegraf.conf'
      template: 'roles/telegraf/templates/etc/telegraf/telegraf.conf.j2'
  ignore:
    # the packaged defaults are used
    - '/etc/logrotate.d/telegraf'
    # placeholder that keeps the drop-in directory in the package
    - '/etc/telegraf/telegraf.d/.ignore'
