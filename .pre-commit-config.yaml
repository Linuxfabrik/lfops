repos:
  - repo: 'https://github.com/adrienverge/yamllint'
    rev: 'v1.38.0'
    hooks:
      - id: 'yamllint'
        args: ['-c=.yamllint.yml']
        files: '\.(yaml|yml)$'
        types: ['file', 'yaml']
        entry: 'yamllint'

  - repo: 'https://github.com/gitleaks/gitleaks'
    rev: 'v8.30.0'
    hooks:
      - id: 'gitleaks'

  # Needs `shellcheck` on the PATH (the GitHub runners have it). It sees `*.sh` files and
  # executables with a shell shebang, not the `.j2` script templates of the roles.
  - repo: 'https://github.com/jumanjihouse/pre-commit-hooks'
    rev: '3.0.0'
    hooks:
      - id: 'shellcheck'

  - repo: 'https://github.com/pre-commit/pre-commit-hooks'
    rev: 'v6.0.0'
    hooks:
      - id: 'check-added-large-files'
      - id: 'check-ast'
      - id: 'fix-byte-order-marker'
      - id: 'check-case-conflict'
      - id: 'check-executables-have-shebangs'
      - id: 'check-json'
      - id: 'check-merge-conflict'
      - id: 'check-yaml'
        args: ['--unsafe']
      - id: 'debug-statements'
      - id: 'detect-private-key'
        # gpg_key returns ASCII-armored exports; the RETURN sample contains
        # the literal PGP private key block header for documentation, which
        # the hook regex-matches as if it were a real key.
        exclude: '^plugins/modules/gpg_key\.py$'
      - id: 'end-of-file-fixer'
      - id: 'mixed-line-ending'
      - id: 'trailing-whitespace'

  - repo: 'https://github.com/astral-sh/ruff-pre-commit'
    rev: 'v0.17.2'
    hooks:
      - id: 'ruff-check'
        args: ['--fix']
      - id: 'ruff-format'

  - repo: 'https://github.com/PyCQA/bandit'
    rev: '1.9.4'
    hooks:
      - id: 'bandit'
        args: ['-c', 'pyproject.toml', '--severity-level=low', '--confidence-level=low']
        additional_dependencies: ['bandit[toml]']
        # `plugins/modules/ipa*.py` is vendored ansible-freeipa code; bandit
        # false-positives on the project's own code style (`shell=dict(...)`
        # in argument_spec triggers B604, the literal `'on_create'` sentinel
        # triggers B105). Out of scope for in-tree review.
        # `plugins/module_utils/gnupg.py` is vendored python-gnupg kept
        # byte-identical with upstream; bandit flags its (expected) subprocess
        # use (B404/B603) and asserts (B101), which we do not patch out.
        # `tests/` holds unit tests whose fixtures use throwaway passwords
        # (B105/B106); scanning test fixtures for hardcoded secrets is noise.
        exclude: '^(plugins/modules/ipa.*|plugins/module_utils/gnupg|tests/.*)\.py$'
        types_or: ['python']

  - repo: 'https://github.com/jendrikseipp/vulture'
    rev: 'v2.16'
    hooks:
      # The upstream hook ships `pass_filenames: false` and reads its scope from
      # `[tool.vulture] paths`, which only finds `*.py` files. The scripts in `tools/`
      # have no extension, so the files are passed explicitly, together with the
      # whitelist. min_confidence lives in pyproject.toml.
      - id: 'vulture'
        args: ['.vulture_whitelist.py']
        pass_filenames: true
        types_or: ['python']

  - repo: 'local'
    hooks:
      # ansible-core runs `#!/usr/bin/env python3` as it is, without interpreter
      # discovery or `ansible_python_interpreter` (only an interpreter named
      # `python` gets them), so such a module fails on RHEL 8 hosts without
      # python3. Same rule as ansible-test sanity's `shebang` test.
      - id: 'module-shebang'
        name: 'modules use #!/usr/bin/python'
        entry: '\A#!(?!/usr/bin/python\n)'
        language: 'pygrep'
        args: ['--multiline']
        files: '^plugins/modules/.*\.py$'

      - id: 'pytest-unit'
        name: 'pytest (plugin unit tests)'
        # Fast single-interpreter run of the controller-plugin unit tests on
        # every commit. The full Python x ansible-core matrix runs in CI via
        # tox; see tests/README.md.
        entry: 'pytest tests/unit'
        language: 'python'
        additional_dependencies: ['ansible-core', 'pytest', 'pyyaml']
        pass_filenames: false
        files: '^(plugins/|tests/unit/)'
        types_or: ['python']
