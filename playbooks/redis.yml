- name: 'Playbook linuxfabrik.lfops.redis'
  hosts:
    - 'lfops_redis'

  pre_tasks:
    - ansible.builtin.import_role:
        name: 'shared'
        tasks_from: 'log-start.yml'
      tags:
        - 'always'

    - ansible.builtin.import_role:
        name: 'shared'
        tasks_from: 'global-variables.yml'
      tags:
        - 'always'


  roles:

    - role: 'linuxfabrik.lfops.kernel_settings'
      kernel_settings__sysctl__dependent_var: '{{ redis__kernel_settings__sysctl__dependent_var | d([]) }}'
      kernel_settings__transparent_hugepages__dependent_var: "{{ redis__kernel_settings__transparent_hugepages__dependent_var | d('') }}"
      when:
        - 'not redis__skip_kernel_settings | d(false)'

    - role: 'linuxfabrik.lfops.repo_baseos'
      repo_baseos__crb_repo_enabled__dependent_var: '{{
          repo_epel__repo_baseos__crb_repo_enabled__dependent_var
        }}'
      # CRB is shipped in the Rocky default repo file (Rocky 9+, formerly from EPEL), so enable it there only.
      when:
        - 'ansible_facts["distribution"] == "Rocky" and ansible_facts["distribution_major_version"] | int >= 9'
        - 'not redis__skip_repo_baseos | d(false)'

    # remi packages link against EPEL content, so EPEL has to be available alongside remi.
    - role: 'linuxfabrik.lfops.repo_epel'
      when:
        - 'ansible_facts["os_family"] == "RedHat"'
        - 'ansible_facts["distribution"] != "Fedora"'
        - 'not redis__skip_repo_epel | d(false)'

    - role: 'linuxfabrik.lfops.repo_remi'
      when:
        - 'ansible_facts["os_family"] == "RedHat"'
        - 'not redis__skip_repo_remi | default(false)'

    - role: 'linuxfabrik.lfops.repo_redis'
      when:
        - 'ansible_facts["os_family"] == "Debian"' # not available for RedHat, instead using repo_remi there
        - 'not redis__skip_repo_redis'

    - role: 'linuxfabrik.lfops.redis'


  post_tasks:
    - ansible.builtin.import_role:
        name: 'shared'
        tasks_from: 'log-end.yml'
      tags:
        - 'always'
