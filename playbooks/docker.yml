- name: 'Playbook linuxfabrik.lfops.docker'
  hosts:
    - 'lfops_docker'
  force_handlers: true

  pre_tasks:
    - ansible.builtin.import_role:
        name: 'shared'
        tasks_from: 'log-start.yml'
      tags:
        - 'always'

    - ansible.builtin.import_role:
        name: 'shared'
        tasks_from: 'global-variables.yml'
      tags:
        - 'always'


  roles:

    - role: 'linuxfabrik.lfops.repo_docker'
      when:
        - 'not docker__skip_repo_docker | d(false)'

    - role: 'linuxfabrik.lfops.docker'

    # No net.bridge.bridge-nf-call-ip{,6}tables here: dockerd loads br_netfilter only for
    # icc=false or userland-proxy=false and then sets them itself (Docker 27.3+). Without the
    # module, the keys do not exist and kernel_settings fails. Verified against the moby source
    # (29.7) and with Docker 29.10 on Rocky 9 and 10.
    - role: 'linuxfabrik.lfops.kernel_settings'
      when:
        - 'not docker__skip_kernel_settings | d(false)'


  post_tasks:
    - ansible.builtin.import_role:
        name: 'shared'
        tasks_from: 'log-end.yml'
      tags:
        - 'always'

    - ansible.builtin.import_role:
        name: 'shared'
        tasks_from: 'print-messages.yml'
      tags:
        - 'always'
