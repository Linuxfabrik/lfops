- name: 'Playbook linuxfabrik.lfops.monitoring_plugins'
  hosts:
    - 'lfops_monitoring_plugins'
  force_handlers: true

  pre_tasks:
    - ansible.builtin.import_role:
        name: 'shared'
        tasks_from: 'log-start.yml'
      tags:
        - 'always'

    - ansible.builtin.import_role:
        name: 'shared'
        tasks_from: 'global-variables.yml'
      tags:
        - 'always'


  roles:

    # removes the former repository of the monitoring plugins, which repo_linuxfabrik replaces
    - role: 'linuxfabrik.lfops.repo_monitoring_plugins'
      when:
        - 'ansible_facts["os_family"] != "Windows"'
        - 'not monitoring_plugins__skip_repo_monitoring_plugins | d(false)'

    - role: 'linuxfabrik.lfops.repo_linuxfabrik'
      when:
        - 'ansible_facts["os_family"] != "Windows"'
        # a source install needs no package repository
        - 'monitoring_plugins__install_method | d("package") == "package"'
        - 'not monitoring_plugins__skip_repo_linuxfabrik | d(false)'

    - role: 'linuxfabrik.lfops.monitoring_plugins'


  post_tasks:
    - ansible.builtin.import_role:
        name: 'shared'
        tasks_from: 'log-end.yml'
      tags:
        - 'always'

    - ansible.builtin.import_role:
        name: 'shared'
        tasks_from: 'print-messages.yml'
      tags:
        - 'always'
