- name: 'Playbook linuxfabrik.lfops.setup_mastodon'
  hosts:
    - 'lfops_setup_mastodon'

  # Redis and Valkey are interchangeable for Mastodon: same protocol, same port. Which of the
  # two is available depends on the platform, so the defaults follow the OS - RHEL 10 has no
  # Redis, while Debian 12 and Ubuntu 22.04 have no Valkey. Override either variable to pin a
  # host to a specific server, or set both to run neither.
  vars:
    setup_mastodon__skip_redis__internal_var: '{{ setup_mastodon__skip_redis | d(ansible_facts["os_family"] == "RedHat" and ansible_facts["distribution_major_version"] | int >= 10) }}'
    setup_mastodon__skip_valkey__internal_var: '{{ setup_mastodon__skip_valkey | d(not (ansible_facts["os_family"] == "RedHat" and ansible_facts["distribution_major_version"] | int >= 10)) }}'

  pre_tasks:
    - ansible.builtin.import_role:
        name: 'shared'
        tasks_from: 'log-start.yml'
      tags:
        - 'always'

    - ansible.builtin.import_role:
        name: 'shared'
        tasks_from: 'global-variables.yml'
      tags:
        - 'always'


  roles:

    - role: 'linuxfabrik.lfops.python'
      python__modules__dependent_var: '{{
          postgresql_server__python__modules__dependent_var
        }}'
      when:
        - 'not setup_mastodon__skip_python | d(false)'

    - role: 'linuxfabrik.lfops.repo_postgresql'
      when:
        - 'not setup_mastodon__skip_repo_postgresql | d(false)'

    - role: 'linuxfabrik.lfops.postgresql_server'
      postgresql_server__databases__dependent_var: '{{
          mastodon__postgresql_server__databases__dependent_var
        }}'
      postgresql_server__users__dependent_var: '{{
          mastodon__postgresql_server__users__dependent_var
        }}'
      when:
        - 'not setup_mastodon__skip_postgresql_server | d(false)'

    # The sysctl entries go in from both roles unconditionally: the two ship identical values and
    # combine_lod folds the duplicates back into one. Transparent hugepages is a scalar, so it has
    # to name the server that is actually installed. Nested rather than chained with default():
    # the defaults of a role load even when its tasks are skipped, so redis is always defined and
    # a chain would never reach the valkey branch.
    - role: 'linuxfabrik.lfops.kernel_settings'
      kernel_settings__sysctl__dependent_var: '{{
          redis__kernel_settings__sysctl__dependent_var | d([]) +
          valkey__kernel_settings__sysctl__dependent_var | d([])
        }}'
      kernel_settings__transparent_hugepages__dependent_var: '{{
          (not setup_mastodon__skip_redis__internal_var) | ternary(
            redis__kernel_settings__transparent_hugepages__dependent_var,
            (not setup_mastodon__skip_valkey__internal_var) | ternary(
              valkey__kernel_settings__transparent_hugepages__dependent_var, "")) }}'
      when:
        - 'not setup_mastodon__skip_kernel_settings | d(false)'

    - role: 'linuxfabrik.lfops.repo_remi'
      when:
        - 'ansible_facts["os_family"] == "RedHat"'
        - 'not setup_mastodon__skip_repo_remi | default(false)'

    # Tied to the redis role below: with Valkey selected, the server comes from the distribution
    # and this repository is not needed.
    - role: 'linuxfabrik.lfops.repo_redis'
      when:
        - 'ansible_facts["os_family"] == "Debian"' # not available for RedHat, instead using repo_remi there
        - 'not setup_mastodon__skip_repo_redis'
        - 'not setup_mastodon__skip_redis__internal_var'

    - role: 'linuxfabrik.lfops.redis'
      when:
        - 'not setup_mastodon__skip_redis__internal_var'

    - role: 'linuxfabrik.lfops.valkey'
      when:
        - 'not setup_mastodon__skip_valkey__internal_var'

    - role: 'linuxfabrik.lfops.repo_elasticsearch'
      repo_elasticsearch__version__dependent_var: '{{
          mastodon__repo_elasticsearch__version__dependent_var
        }}'
      when:
        - 'ansible_facts["os_family"] == "RedHat"'
        - 'not setup_mastodon__skip_repo_elasticsearch | default(false)'

    - role: 'linuxfabrik.lfops.elasticsearch'
      elasticsearch__cluster_name__dependent_var: '{{
         mastodon__elasticsearch__cluster_name__dependent_var
        }}'
      when:
        - 'not setup_mastodon__skip_elasticsearch | d(false)'

    - role: 'linuxfabrik.lfops.login'
      login__users__dependent_var: '{{
          mastodon__login__users__dependent_var
        }}'
      when:
        - 'not setup_mastodon__skip_login | d(false)'

    - role: 'linuxfabrik.lfops.repo_baseos'
      repo_baseos__crb_repo_enabled__dependent_var: '{{
          repo_epel__repo_baseos__crb_repo_enabled__dependent_var
        }}'
      # CRB is shipped in the Rocky default repo file (Rocky 9+, formerly from EPEL), so enable it there only.
      when:
        - 'ansible_facts["distribution"] == "Rocky" and ansible_facts["distribution_major_version"] | int >= 9'
        - 'not setup_mastodon__skip_repo_baseos | d(false)'

    - role: 'linuxfabrik.lfops.repo_epel'
      when:
        - 'ansible_facts["os_family"] == "RedHat" and ansible_facts["distribution"] != "Fedora"'
        - 'not setup_mastodon__skip_repo_epel | default(false)'

    - role: 'linuxfabrik.lfops.policycoreutils'
      when:
        - 'ansible_facts["os_family"] == "RedHat"'
        - 'not setup_mastodon__skip_policycoreutils | default(false)'

    - role: 'linuxfabrik.lfops.selinux'
      selinux__booleans__dependent_var: '{{
          apache_httpd__selinux__booleans__dependent_var
        }}'
      when:
        - 'ansible_facts["os_family"] == "RedHat"'
        - 'not setup_mastodon__skip_selinux | default(false)'

    - role: 'linuxfabrik.lfops.apache_httpd'
      apache_httpd__mods__dependent_var: '{{
          mastodon__apache_httpd__mods__dependent_var
        }}'
      apache_httpd__vhosts__dependent_var: '{{
          mastodon__apache_httpd__vhosts__dependent_var
        }}'
      when:
        - 'not setup_mastodon__skip_apache_httpd | default(false)'

    - role: 'linuxfabrik.lfops.mastodon'


  post_tasks:
    - ansible.builtin.import_role:
        name: 'shared'
        tasks_from: 'log-end.yml'
      tags:
        - 'always'
