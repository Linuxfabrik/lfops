- name: 'Playbook linuxfabrik.lfops.setup_basic'
  hosts:
    - 'lfops_setup_basic'
  force_handlers: true

  vars:

    # Every role of this play with the condition under which the play skips it, in play order.
    # The pre_tasks validate the variables of the roles that run before any role changes the
    # host. tests/unit/test_playbooks.py keeps this list in sync with the roles below.
    setup_basic__roles__internal_var:
      - name: 'network'
        skip: '{{ ansible_facts["os_family"] != "RedHat" or setup_basic__skip_network | d(false) }}'
      - name: 'repo_baseos'
        skip: '{{ ansible_facts["os_family"] != "RedHat" or setup_basic__skip_repo_baseos | d(false) }}'
      - name: 'repo_epel'
        skip: '{{ ansible_facts["os_family"] != "RedHat" or setup_basic__skip_repo_epel | d(false) }}'
      - name: 'hostname'
        skip: '{{ setup_basic__skip_hostname | d(false) }}'
      - name: 'mailx'
        skip: '{{ setup_basic__skip_mailx | d(false) }}'
      - name: 'postfix'
        skip: '{{ setup_basic__skip_postfix | d(false) }}'
      - name: 'mailto_root'
        skip: '{{ setup_basic__skip_mailto_root | d(false) }}'
      - name: 'schedule_reboot'
        skip: '{{ setup_basic__skip_schedule_reboot | d(false) }}'
      - name: 'crypto_policy'
        skip: '{{ ansible_facts["os_family"] != "RedHat" or setup_basic__skip_crypto_policy | d(false) }}'
      - name: 'policycoreutils'
        skip: '{{ ansible_facts["os_family"] != "RedHat" or setup_basic__skip_policycoreutils | d(false) }}'
      - name: 'selinux'
        skip: '{{ ansible_facts["os_family"] != "RedHat" or setup_basic__skip_selinux | d(false) }}'
      - name: 'kernel_modules'
        skip: '{{ setup_basic__skip_kernel_modules | d(false) }}'
      - name: 'kernel_settings'
        skip: '{{ setup_basic__skip_kernel_settings | d(false) }}'
      - name: 'core_dumps'
        skip: '{{ setup_basic__skip_core_dumps | d(false) }}'
      - name: 'lynis'
        skip: '{{ setup_basic__skip_lynis | d(false) }}'
      - name: 'systemd_journald'
        skip: '{{ setup_basic__skip_systemd_journald | d(false) }}'
      - name: 'timezone'
        skip: '{{ setup_basic__skip_timezone | d(false) }}'
      - name: 'logrotate'
        skip: '{{ setup_basic__skip_logrotate | d(false) }}'
      - name: 'rsyslog'
        skip: '{{ setup_basic__skip_rsyslog | d(false) }}'
      - name: 'cloud_init'
        skip: '{{ setup_basic__skip_cloud_init | d(false) }}'
      - name: 'cockpit'
        skip: '{{ setup_basic__skip_cockpit | d(false) }}'
      - name: 'dnf_makecache'
        skip: '{{ ansible_facts["os_family"] != "RedHat" or setup_basic__skip_dnf_makecache | d(false) }}'
      - name: 'kdump'
        skip: '{{ setup_basic__skip_kdump | d(false) }}'
      - name: 'chrony'
        skip: '{{ setup_basic__skip_chrony | d(false) }}'
      - name: 'motd'
        skip: '{{ setup_basic__skip_motd | d(false) }}'
      - name: 'at'
        skip: '{{ setup_basic__skip_at | d(false) }}'
      - name: 'python'
        skip: '{{ setup_basic__skip_python | d(false) }}'
      - name: 'python_venv'
        skip: '{{ setup_basic__skip_python_venv | d(false) }}'
      - name: 'glances'
        skip: '{{ setup_basic__skip_glances | d(false) }}'
      - name: 'tools'
        skip: '{{ setup_basic__skip_tools | d(false) }}'
      - name: 'tmux'
        skip: '{{ setup_basic__skip_tmux | d(false) }}'
      - name: 'yum_utils'
        skip: '{{ ansible_facts["os_family"] != "RedHat" or setup_basic__skip_yum_utils | d(false) }}'
      - name: 'lvm'
        skip: '{{ setup_basic__skip_lvm | d(false) }}'
      - name: 'sshd'
        skip: '{{ setup_basic__skip_sshd | d(false) }}'
      - name: 'login'
        skip: '{{ setup_basic__skip_login | d(false) }}'
      - name: 'firewall'
        skip: '{{ setup_basic__skip_firewall | d(false) }}'
      - name: 'system_update'
        skip: '{{ setup_basic__skip_system_update | d(false) }}'
      - name: 'duplicity'
        skip: '{{ setup_basic__skip_duplicity | d(false) }}'
      - name: 'repo_monitoring_plugins'
        skip: '{{ not (monitoring_plugins__install_method | d("package") == "package" or "repo_monitoring_plugins:remove" in ansible_run_tags) or setup_basic__skip_repo_monitoring_plugins | d(false) }}'
      - name: 'monitoring_plugins'
        skip: '{{ setup_basic__skip_monitoring_plugins | d(false) }}'
      - name: 'bootloader'
        skip: '{{ ansible_facts["os_family"] != "RedHat" or setup_basic__skip_bootloader | d(false) }}'
      - name: 'repo_icinga'
        skip: '{{ setup_basic__skip_repo_icinga | d(false) }}'
      - name: 'icinga2_agent'
        skip: '{{ setup_basic__skip_icinga2_agent | d(false) }}'
      - name: 'aide'
        skip: '{{ setup_basic__skip_aide | d(false) }}'

  pre_tasks:
    - ansible.builtin.import_role:
        name: 'shared'
        tasks_from: 'log-start.yml'
      tags:
        - 'always'

    - ansible.builtin.import_role:
        name: 'shared'
        tasks_from: 'global-variables.yml'
      tags:
        - 'always'

    # Abort on a missing prerequisite before the first role changes the host. A run that aborts
    # halfway through leaves SSH hardened and the firewall replaced, and the next run may then no
    # longer be able to connect with the bootstrap user.
    - name: 'Validate the variables of every role this playbook runs'
      ansible.builtin.import_role:
        name: 'shared'
        tasks_from: 'validate-role-arguments.yml'
      vars:
        shared__validate_role_arguments_roles: '{{ setup_basic__roles__internal_var | rejectattr("skip") | map(attribute="name") | list }}'
      tags:
        - 'always'

    - name: 'Run the preflight checks of the firewall role'
      ansible.builtin.include_role:
        name: 'linuxfabrik.lfops.firewall'
        tasks_from: 'preflight.yml'
      when:
        - 'not setup_basic__skip_firewall | d(false)'
      tags:
        - 'firewall'
        - 'firewall:deploy_fwb_sh'

    - name: 'Run the preflight checks of the icinga2_agent role'
      ansible.builtin.include_role:
        name: 'linuxfabrik.lfops.icinga2_agent'
        tasks_from: 'preflight.yml'
      when:
        - 'not setup_basic__skip_icinga2_agent | d(false)'
      tags:
        - 'icinga2_agent'
        - 'icinga2_agent:node_setup'


  roles:

    # we need correct network settings for the rest to work.
    # fedora.linux_system_roles.network supports Fedora and EL only. Without a running
    # NetworkManager, as on Debian and Ubuntu, it falls back to its initscripts provider and
    # installs the Red Hat package network-scripts, which aborts the play there.
    - role: 'linuxfabrik.lfops.network'
      when:
        - 'ansible_facts["os_family"] == "RedHat"'
        - 'not setup_basic__skip_network | d(false)'

    # === Basic repositories ===
    - role: 'linuxfabrik.lfops.repo_baseos'
      repo_baseos__crb_repo_enabled__dependent_var: '{{
          repo_epel__repo_baseos__crb_repo_enabled__dependent_var
        }}'
      when:
        - 'ansible_facts["os_family"] == "RedHat"'
        - 'not setup_basic__skip_repo_baseos | d(false)'

    - role: 'linuxfabrik.lfops.repo_epel'
      when:
        - 'ansible_facts["os_family"] == "RedHat"'
        - 'not setup_basic__skip_repo_epel | d(false)'

    # === Identity ===
    # ahead of every role that renders the host's name into a configuration file.
    # ansible.builtin.hostname returns the new name as ansible_facts, so a role running after it
    # sees the final ansible_facts["nodename"], while one running before it renders the name the
    # host booted with and rewrites the file on the next run. mailto_root builds its sender
    # canonical from that fact, and schedule_reboot its Icinga host name.
    - role: 'linuxfabrik.lfops.hostname'
      when:
        - 'not setup_basic__skip_hostname | d(false)'

    # === Mailing ===
    - role: 'linuxfabrik.lfops.mailx'
      when:
        - 'not setup_basic__skip_mailx | d(false)'

    - role: 'linuxfabrik.lfops.postfix'
      postfix__aliases__dependent_var: '{{
          mailto_root__postfix__aliases__dependent_var
        }}'
      postfix__sender_canonicals__dependent_var: '{{
          mailto_root__postfix__sender_canonicals__dependent_var
        }}'
      when:
        - 'not setup_basic__skip_postfix | d(false)'

    - role: 'linuxfabrik.lfops.mailto_root'
      when:
        - 'not setup_basic__skip_mailto_root | d(false)'

    # === Reboots ===
    # ahead of every role that can request a reboot, so that /usr/local/sbin/schedule-reboot is
    # already on the host when one of them changes something that only takes effect on the next
    # boot. The security roles below are three such roles (crypto_policy, kernel_modules,
    # selinux). Deployed later, they would only ever report the pending reboot to the operator:
    # they file the request on the run that makes the change, and by the next run there is
    # nothing left to change. The mailing section above it comes first in turn, because
    # schedule_reboot takes the addresses for its notification from mailto_root and delivers it
    # with the sendmail that postfix provides.
    - role: 'linuxfabrik.lfops.schedule_reboot'
      when:
        - 'not setup_basic__skip_schedule_reboot | d(false)'

    # === Security ===
    - role: 'linuxfabrik.lfops.crypto_policy'
      when:
        - 'ansible_facts["os_family"] == "RedHat"'
        - 'not setup_basic__skip_crypto_policy | d(false)'

    - role: 'linuxfabrik.lfops.policycoreutils'
      when:
        - 'ansible_facts["os_family"] == "RedHat"'
        - 'not setup_basic__skip_policycoreutils | d(false)'

    - role: 'linuxfabrik.lfops.selinux'
      when:
        - 'ansible_facts["os_family"] == "RedHat"'
        - 'not setup_basic__skip_selinux | d(false)'

    - role: 'linuxfabrik.lfops.kernel_modules'
      when:
        - 'not setup_basic__skip_kernel_modules | d(false)'

    - role: 'linuxfabrik.lfops.kernel_settings'
      kernel_settings__sysctl__dependent_var: '{{
          (not setup_basic__skip_core_dumps | d(false)) | ternary(core_dumps__kernel_settings__sysctl__dependent_var, []) | d([])
        }}'
      when:
        - 'not setup_basic__skip_kernel_settings | d(false)'

    - role: 'linuxfabrik.lfops.core_dumps'
      when:
        - 'not setup_basic__skip_core_dumps | d(false)'

    - role: 'linuxfabrik.lfops.lynis'
      when:
        - 'not setup_basic__skip_lynis | d(false)'

    # === Sensible defaults ===
    - role: 'linuxfabrik.lfops.systemd_journald'
      when:
        - 'not setup_basic__skip_systemd_journald | d(false)'

    - role: 'linuxfabrik.lfops.timezone'
      when:
        - 'not setup_basic__skip_timezone | d(false)'

    - role: 'linuxfabrik.lfops.logrotate'
      when:
        - 'not setup_basic__skip_logrotate | d(false)'

    - role: 'linuxfabrik.lfops.rsyslog'
      when:
        - 'not setup_basic__skip_rsyslog | d(false)'

    - role: 'linuxfabrik.lfops.cloud_init'
      when:
        - 'not setup_basic__skip_cloud_init | d(false)'

    - role: 'linuxfabrik.lfops.cockpit'
      when:
        - 'not setup_basic__skip_cockpit | d(false)'

    - role: 'linuxfabrik.lfops.dnf_makecache'
      when:
        - 'ansible_facts["os_family"] == "RedHat"'
        - 'not setup_basic__skip_dnf_makecache | d(false)'

    - role: 'linuxfabrik.lfops.kdump'
      when:
        - 'not setup_basic__skip_kdump | d(false)'

    - role: 'linuxfabrik.lfops.chrony'
      when:
        - 'not setup_basic__skip_chrony | d(false)'

    - role: 'linuxfabrik.lfops.motd'
      when:
        - 'not setup_basic__skip_motd | d(false)'

    # === Various tools / dependencies ===
    - role: 'linuxfabrik.lfops.at'
      when:
        - 'not setup_basic__skip_at | d(false)'

    - role: 'linuxfabrik.lfops.python'
      when:
        - 'not setup_basic__skip_python | d(false)'

    # python_venv must run before glances: on RHEL 10 glances has no distro package and is installed
    # into a venv via glances__python_venv__venvs__dependent_var. duplicity also consumes this role's
    # venvs (further down in the Backups section).
    - role: 'linuxfabrik.lfops.python_venv'
      python_venv__venvs__dependent_var: '{{
          (not setup_basic__skip_duplicity | d(false)) | ternary(duplicity__python_venv__venvs__dependent_var, []) +
          (not setup_basic__skip_glances | d(false)) | ternary(glances__python_venv__venvs__dependent_var, [])
        }}'
      when:
        - 'not setup_basic__skip_python_venv | d(false)'

    - role: 'linuxfabrik.lfops.glances'
      when:
        - 'not setup_basic__skip_glances | d(false)'

    - role: 'linuxfabrik.lfops.tools'
      when:
        - 'not setup_basic__skip_tools | d(false)'

    - role: 'linuxfabrik.lfops.tmux'
      when:
        - 'not setup_basic__skip_tmux | d(false)'

    - role: 'linuxfabrik.lfops.yum_utils'
      when:
        - 'ansible_facts["os_family"] == "RedHat"'
        - 'not setup_basic__skip_yum_utils | d(false)'


    # === LVM ===
    - role: 'linuxfabrik.lfops.lvm'
      when:
        - 'not setup_basic__skip_lvm | d(false)'


    # === SSH ===
    - role: 'linuxfabrik.lfops.sshd'
      when:
        - 'not setup_basic__skip_sshd | d(false)'

    - role: 'linuxfabrik.lfops.login'
      when:
        - 'not setup_basic__skip_login | d(false)'


    # === Firewalling ===
    - role: 'linuxfabrik.lfops.firewall'
      when:
        - 'not setup_basic__skip_firewall | d(false)'


    # === Automatic updates ===
    - role: 'linuxfabrik.lfops.system_update'
      when:
        - 'not setup_basic__skip_system_update | d(false)'


    # === Backups ===
    - role: 'linuxfabrik.lfops.duplicity'
      when:
        - 'not setup_basic__skip_duplicity | d(false)'


    # === Monitoring ===
    - role: 'linuxfabrik.lfops.repo_monitoring_plugins'
      when:
        # a source install needs no package repository, and re-registering it would undo its removal
        - 'monitoring_plugins__install_method | d("package") == "package" or "repo_monitoring_plugins:remove" in ansible_run_tags'
        - 'not setup_basic__skip_repo_monitoring_plugins | d(false)'

    - role: 'linuxfabrik.lfops.monitoring_plugins'
      when:
        - 'not setup_basic__skip_monitoring_plugins | d(false)'

    # The psi-* plugins need pressure stall information, which RHEL kernels only keep when booted
    # with psi=1. The bootloader role puts it on the kernel command line and requests a reboot at
    # the maintenance window, so schedule_reboot has to be in place already (see above). Debian
    # and Ubuntu track pressure by default, so the role runs on the Red Hat family only.
    - role: 'linuxfabrik.lfops.bootloader'
      bootloader__cmdline_options__dependent_var: '{{
          (not setup_basic__skip_monitoring_plugins | d(false)) | ternary(monitoring_plugins__bootloader__cmdline_options__dependent_var, []) | d([])
        }}'
      when:
        - 'ansible_facts["os_family"] == "RedHat"'
        - 'not setup_basic__skip_bootloader | d(false)'

    - role: 'linuxfabrik.lfops.repo_icinga'
      when:
        - 'not setup_basic__skip_repo_icinga | d(false)'

    - role: 'linuxfabrik.lfops.icinga2_agent'
      when:
        - 'not setup_basic__skip_icinga2_agent | d(false)'

    # last, so that the AIDE database created on the first run contains what the roles above
    # deployed, and a later change by any of them is reported by the next check
    - role: 'linuxfabrik.lfops.aide'
      when:
        - 'not setup_basic__skip_aide | d(false)'


  post_tasks:
    - ansible.builtin.import_role:
        name: 'shared'
        tasks_from: 'log-end.yml'
      tags:
        - 'always'

    - ansible.builtin.import_role:
        name: 'shared'
        tasks_from: 'print-messages.yml'
      tags:
        - 'always'
