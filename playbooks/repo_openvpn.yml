- name: 'Playbook linuxfabrik.lfops.repo_openvpn'
  hosts:
    - 'lfops_repo_openvpn'

  pre_tasks:
    - ansible.builtin.import_role:
        name: 'shared'
        tasks_from: 'log-start.yml'
      tags:
        - 'always'

    - ansible.builtin.import_role:
        name: 'shared'
        tasks_from: 'global-variables.yml'
      tags:
        - 'always'


  roles:

    - role: 'linuxfabrik.lfops.repo_epel'
      when:
        - 'not repo_openvpn__skip_repo_epel | d(false)'

    - role: 'linuxfabrik.lfops.repo_openvpn'


  post_tasks:
    - ansible.builtin.import_role:
        name: 'shared'
        tasks_from: 'log-end.yml'
      tags:
        - 'always'

    - ansible.builtin.import_role:
        name: 'shared'
        tasks_from: 'print-messages.yml'
      tags:
        - 'always'
