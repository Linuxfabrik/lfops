- name: 'Playbook linuxfabrik.lfops.uptimerobot'
  hosts:
    - 'lfops_uptimerobot'
  # Runs on the Ansible controller against the UptimeRobot API. The role needs no facts, and unlike
  # the playbooks for managed hosts this one does not log to /var/log/linuxfabrik-lfops.log: that
  # would need root on the controller, and modules running as root would look for the API key in
  # /root/.uptimerobot.
  gather_facts: false
  force_handlers: true

  roles:

    - role: 'linuxfabrik.lfops.uptimerobot'
