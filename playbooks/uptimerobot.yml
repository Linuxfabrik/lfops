- name: 'Playbook linuxfabrik.lfops.uptimerobot'
  hosts:
    - 'lfops_uptimerobot'
  force_handlers: true

  # Runs on the Ansible controller against the UptimeRobot API, so unlike the playbooks for managed
  # hosts it does not log to /var/log/linuxfabrik-lfops.log: that would need root on the controller,
  # and modules running as root would look for the API key in /root/.uptimerobot.
  pre_tasks:
    - ansible.builtin.import_role:
        name: 'shared'
        tasks_from: 'global-variables.yml'
      tags:
        - 'always'


  roles:

    - role: 'linuxfabrik.lfops.uptimerobot'


  post_tasks:
    - ansible.builtin.import_role:
        name: 'shared'
        tasks_from: 'print-messages.yml'
      tags:
        - 'always'
