- name: 'Playbook linuxfabrik.lfops.setup_moodle'
  hosts:
    - 'lfops_setup_moodle'

  # Redis and Valkey are interchangeable for Moodle: same protocol, same port. Which of the
  # two is available depends on the platform, so the defaults follow the OS - RHEL 10 has no
  # Redis, while Debian 12 and Ubuntu 22.04 have no Valkey. Override either variable to pin a
  # host to a specific server, or set both to run neither.
  vars:
    setup_moodle__skip_redis__internal_var: '{{ setup_moodle__skip_redis | d(ansible_facts["os_family"] == "RedHat" and ansible_facts["distribution_major_version"] | int >= 10) }}'
    setup_moodle__skip_valkey__internal_var: '{{ setup_moodle__skip_valkey | d(not (ansible_facts["os_family"] == "RedHat" and ansible_facts["distribution_major_version"] | int >= 10)) }}'

  pre_tasks:
    - ansible.builtin.import_role:
        name: 'shared'
        tasks_from: 'log-start.yml'
      tags:
        - 'always'

    - ansible.builtin.import_role:
        name: 'shared'
        tasks_from: 'global-variables.yml'
      tags:
        - 'always'


  roles:

      # === Prepare the system
    - role: 'linuxfabrik.lfops.policycoreutils'
      when:
        - 'ansible_facts["os_family"] == "RedHat"'
        - 'not setup_moodle__skip_policycoreutils | default(false)'

    # The sysctl entries go in from both roles unconditionally: the two ship identical values and
    # combine_lod folds the duplicates back into one. Transparent hugepages is a scalar, so it has
    # to name the server that is actually installed. Nested rather than chained with default():
    # the defaults of a role load even when its tasks are skipped, so redis is always defined and
    # a chain would never reach the valkey branch.
    - role: 'linuxfabrik.lfops.kernel_settings'
      kernel_settings__sysctl__dependent_var: '{{
          mariadb_server__kernel_settings__sysctl__dependent_var | d([]) +
          redis__kernel_settings__sysctl__dependent_var | d([]) +
          valkey__kernel_settings__sysctl__dependent_var | d([])
        }}'
      kernel_settings__transparent_hugepages__dependent_var: '{{
          (not setup_moodle__skip_redis__internal_var) | ternary(
            redis__kernel_settings__transparent_hugepages__dependent_var,
            (not setup_moodle__skip_valkey__internal_var) | ternary(
              valkey__kernel_settings__transparent_hugepages__dependent_var, "")) }}'
      when:
        - 'not setup_moodle__skip_kernel_settings | d(false)'

    - role: 'linuxfabrik.lfops.python'
      python__modules__dependent_var: '{{
          mariadb_server__python__modules__dependent_var +
          apache_httpd__python__modules__dependent_var
        }}'
      when:
        - 'not setup_moodle__skip_python | default(false)'

    - role: 'linuxfabrik.lfops.apps'
      apps__apps__dependent_var: '{{ moodle__apps__apps__dependent_var }}'
      when:
        - 'not setup_moodle__skip_apps | default(false)'


      # === Redis, PHP and PHP-FPM from Remi Repo
    - role: 'linuxfabrik.lfops.repo_baseos'
      repo_baseos__crb_repo_enabled__dependent_var: '{{
          repo_epel__repo_baseos__crb_repo_enabled__dependent_var
        }}'
      # CRB is shipped in the Rocky default repo file (Rocky 9+, formerly from EPEL), so enable it there only.
      when:
        - 'ansible_facts["distribution"] == "Rocky" and ansible_facts["distribution_major_version"] | int >= 9'
        - 'not setup_moodle__skip_repo_baseos | d(false)'

    # remi packages link against EPEL content, so EPEL has to be available alongside remi.
    - role: 'linuxfabrik.lfops.repo_epel'
      when:
        - 'ansible_facts["os_family"] == "RedHat"'
        - 'ansible_facts["distribution"] != "Fedora"'
        - 'not setup_moodle__skip_repo_epel | d(false)'

    - role: 'linuxfabrik.lfops.repo_remi'
      when:
        - 'ansible_facts["os_family"] == "RedHat" and ansible_facts["distribution"] != "Fedora"'
        - 'not setup_moodle__skip_repo_remi | default(false)'

    - role: 'linuxfabrik.lfops.php'
      php__ini_max_input_vars__dependent_var: '{{ moodle__php__ini_max_input_vars__dependent_var }}'
      php__modules__dependent_var: '{{ moodle__php__modules__dependent_var }}'
      when:
        - 'not setup_moodle__skip_php | default(false)'

    - role: 'linuxfabrik.lfops.redis'
      when:
        - 'not setup_moodle__skip_redis__internal_var'

    - role: 'linuxfabrik.lfops.valkey'
      when:
        - 'not setup_moodle__skip_valkey__internal_var'


      # === MariaDB
    - role: 'linuxfabrik.lfops.repo_mydumper'
      when:
        - 'ansible_facts["os_family"] == "RedHat" and ansible_facts["distribution"] != "Fedora"'
        - 'not setup_moodle__skip_repo_mydumper | d(false)'

    - role: 'linuxfabrik.lfops.repo_mariadb'
      when:
        - 'not setup_moodle__skip_repo_mariadb | d(false)'

    - role: 'linuxfabrik.lfops.mariadb_server'
      mariadb_server__cnf_table_definition_cache__dependent_var: '{{ moodle__mariadb_server__cnf_table_definition_cache__dependent_var | default(400) }}'
      mariadb_server__databases__dependent_var: '{{ moodle__mariadb_server__databases__dependent_var | default([]) }}'
      mariadb_server__users__dependent_var: '{{ moodle__mariadb_server__users__dependent_var }}'
      when:
        - 'not setup_moodle__skip_mariadb_server | d(false)'


    - role: 'linuxfabrik.lfops.apache_httpd'
      apache_httpd__mods__dependent_var: '{{ moodle__apache_httpd__mods__dependent_var | d([]) }}'
      apache_httpd__vhosts__dependent_var: '{{ moodle__apache_httpd__vhosts__dependent_var | d([]) }}'
      when:
        - 'not setup_moodle__skip_apache_httpd | d(false)'


      # === SELinux
    - role: 'linuxfabrik.lfops.selinux'
      selinux__booleans__dependent_var: '{{ moodle__selinux__booleans__dependent_var }}'
      selinux__fcontexts__dependent_var: '{{ moodle__selinux__fcontexts__dependent_var }}'
      selinux__modules__dependent_var: '{{ php__selinux__modules__dependent_var }}'
      when:
        - 'ansible_facts["os_family"] == "RedHat"'
        - 'not setup_moodle__skip_selinux | default(false)'


      # === Moodle
    - role: 'linuxfabrik.lfops.moodle'


  post_tasks:
    - ansible.builtin.import_role:
        name: 'shared'
        tasks_from: 'log-end.yml'
      tags:
        - 'always'
